name: Generate, filter, judge and finalize

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate, filter, judge and finalize
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat > generate.py <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path

          API_KEY = os.environ["GROQ_API_KEY"]
          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          OUTPUT_DIR = Path("quiet-vault-output")
          OUTPUT_DIR.mkdir(exist_ok=True)


          # ============================================================
          # GROQ REQUEST
          # ============================================================

          def groq_request(
              prompt,
              schema_name,
              schema,
              max_tokens=4000,
              max_attempts=5
          ):

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "temperature": 0.90,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden",
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": schema_name,
                          "strict": True,
                          "schema": schema
                      }
                  }
              }

              data = json.dumps(payload).encode("utf-8")

              for attempt in range(1, max_attempts + 1):

                  request = urllib.request.Request(
                      ENDPOINT,
                      data=data,
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      },
                      method="POST"
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          body = response.read().decode("utf-8")
                          result = json.loads(body)

                      content = result["choices"][0]["message"]["content"]

                      try:
                          return json.loads(content)

                      except json.JSONDecodeError:

                          print("")
                          print("=" * 60)
                          print("INVALID JSON FROM GROQ")
                          print(content)
                          print("=" * 60)
                          print("")

                          raise RuntimeError(
                              "Groq returned invalid JSON"
                          )

                  except urllib.error.HTTPError as e:

                      error_body = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print("")
                      print("=" * 60)
                      print("GROQ ERROR")
                      print(f"HTTP: {e.code}")
                      print(error_body)
                      print("=" * 60)
                      print("")

                      if e.code == 429:

                          if attempt >= max_attempts:
                              raise RuntimeError(
                                  "Groq rate limit persisted."
                              )

                          retry_after = None

                          try:
                              retry_after = e.headers.get(
                                  "retry-after"
                              )
                          except Exception:
                              pass

                          if retry_after:

                              try:
                                  wait_time = float(
                                      retry_after
                                  ) + 2
                              except ValueError:
                                  wait_time = 10

                          else:

                              wait_time = min(
                                  6 * (2 ** (attempt - 1)),
                                  65
                              )

                          print(
                              f"RATE LIMIT. "
                              f"Waiting {wait_time:.1f}s..."
                          )

                          time.sleep(wait_time)
                          continue

                      raise RuntimeError(
                          f"Groq returned HTTP {e.code}"
                      )

                  except Exception as e:

                      print("")
                      print("=" * 60)
                      print("REQUEST ERROR")
                      print(str(e))
                      print("=" * 60)
                      print("")
                      raise


          # ============================================================
          # SCHEMAS
          # ============================================================

          candidate_schema = {
              "type": "object",
              "properties": {
                  "candidates": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id": {
                                  "type": "integer"
                              },
                              "title": {
                                  "type": "string"
                              },
                              "mechanism": {
                                  "type": "string"
                              },
                              "premise": {
                                  "type": "string"
                              },
                              "static_frame_1": {
                                  "type": "string"
                              },
                              "ending": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "id",
                              "title",
                              "mechanism",
                              "premise",
                              "static_frame_1",
                              "ending"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "candidates"
              ],
              "additionalProperties": False
          }


          gate_schema = {
              "type": "object",
              "properties": {
                  "evaluations": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {

                              "id": {
                                  "type": "integer"
                              },

                              "hook_pass": {
                                  "type": "boolean"
                              },

                              "visible_threat_pass": {
                                  "type": "boolean"
                              },

                              "flow_pass": {
                                  "type": "boolean"
                              },

                              "originality_pass": {
                                  "type": "boolean"
                              },

                              "rule_pass": {
                                  "type": "boolean"
                              },

                              "eligible": {
                                  "type": "boolean"
                              },

                              "reason": {
                                  "type": "string"
                              }
                          },

                          "required": [
                              "id",
                              "hook_pass",
                              "visible_threat_pass",
                              "flow_pass",
                              "originality_pass",
                              "rule_pass",
                              "eligible",
                              "reason"
                          ],

                          "additionalProperties": False
                      }
                  }
              },

              "required": [
                  "evaluations"
              ],

              "additionalProperties": False
          }


          final_schema = {
              "type": "object",
              "properties": {

                  "id": {
                      "type": "integer"
                  },

                  "title": {
                      "type": "string"
                  },

                  "short_script": {
                      "type": "string"
                  },

                  "visual_hook": {
                      "type": "string"
                  },

                  "flow_prompt": {
                      "type": "string"
                  },

                  "final_twist": {
                      "type": "string"
                  },

                  "description": {
                      "type": "string"
                  },

                  "keywords": {
                      "type": "string"
                  },

                  "hashtags": {
                      "type": "string"
                  },

                  "thumbnail_frame": {
                      "type": "string"
                  },

                  "thumbnail_text": {
                      "type": "string"
                  }
              },

              "required": [
                  "id",
                  "title",
                  "short_script",
                  "visual_hook",
                  "flow_prompt",
                  "final_twist",
                  "description",
                  "keywords",
                  "hashtags",
                  "thumbnail_frame",
                  "thumbnail_text"
              ],

              "additionalProperties": False
          }


          # ============================================================
          # BANNED TERMS
          # ============================================================

          banned_phrases = [

              # MINORS
              "child",
              "children",
              "baby",
              "infant",
              "kid",
              "kids",
              "minor",
              "teenager",
              "teen",
              "nursery",
              "crib",
              "schoolchild",
              "babysitter",
              "baby monitor",
              "child portrait",

              # LOCATIONS / MECHANISMS
              "elevator",
              "hotel",
              "cctv",
              "security camera",
              "surveillance footage",
              "mirror",
              "reflection",
              "reflective surface",
              "doppelganger",
              "doppelgänger",
              "twin",
              "printer",
              "train",
              "bus",
              "car",
              "vehicle",

              # SHADOW / GENERIC SUPERNATURAL
              "shadow figure",
              "silhouette figure",
              "ghost",
              "demon",
              "zombie",
              "monster",
              "creature",
              "giant creature",

              # OBJECT HORROR
              "floating mug",
              "floating cup",
              "floating object",
              "possessed object",
              "growing face",
              "object grows a face",

              # TRANSFORMATION
              "disappears",
              "disappearing",
              "reappears",
              "reappearing",
              "teleport",
              "teleportation",
              "head spins",
              "head turns 180",
              "head rotates",
              "face melts",
              "face morphs",

              # BODY / GORE
              "body part",
              "severed limb",
              "gore",
              "blood",

              # PHONE-ONLY HORROR
              "video call",
              "facetime",
              "phone screen shows",
              "phone screen reveals",
              "text message"
          ]


          def contains_phrase(
              text,
              phrase
          ):

              text = text.lower()
              phrase = phrase.lower()

              if " " in phrase:
                  return phrase in text

              return re.search(
                  rf"(?<![a-z]){re.escape(phrase)}(?![a-z])",
                  text
              ) is not None


          # ============================================================
          # TARGETED CANDIDATE GENERATION
          # ============================================================

          def generate_candidates(
              count,
              starting_id,
              batch_number
          ):

              mechanism_slots = [
                  "WRONG ACCESS",
                  "IMPOSSIBLE POSSESSION",
                  "WRONG PERSON PERFORMING AN ORDINARY ACTION",
                  "RELATIONSHIP CONTRADICTION",
                  "PHYSICAL DIRECTION CONTRADICTION",
                  "TWO ADULTS WITH CONFLICTING REALITY",
                  "ORDINARY PLACE WITH A CLEARLY WRONG ADULT",
                  "OBJECT OR ACTION THAT DIRECTLY CONTRADICTS WHAT A CHARACTER JUST DID"
              ]

              slots = mechanism_slots[:count]

              if batch_number > 1:
                  slots = list(reversed(mechanism_slots))

              slot_text = "\n".join(
                  f"{i + 1}. {slot}"
                  for i, slot in enumerate(slots)
              )

              prompt = f"""
          You are the concept generator for The Quiet Vault.

          This is concept batch {batch_number}.

          Generate EXACTLY {count} horror Short concepts.

          We are deliberately NOT looking for generic horror ideas.

          Each concept must be based on one of these visual mechanisms:

          {slot_text}

          IMPORTANT:
          Use each mechanism at most once in this batch.

          ================================================================
          THE FIRST FRAME IS THE PRODUCT
          ================================================================

          static_frame_1 describes ONE frozen screenshot.

          Imagine the video has been paused at frame 1.

          There must already be a clearly visible contradiction,
          threat, or impossible human situation.

          The viewer should be able to ask:

          "WHY IS THAT HAPPENING?"

          immediately.

          The first frame must NOT merely show:

          - a scared person
          - a dark room
          - an empty chair
          - an empty room
          - a normal person holding a phone
          - a normal person standing at a door
          - a person looking at something off-camera
          - a creepy atmosphere
          - an ordinary object

          The horror must be visible in the composition.

          ================================================================
          GOOD EXAMPLES
          ================================================================

          Example A:

          "A woman stands outside her apartment holding grocery bags.
          Through the open doorway, an adult man inside is wearing the
          exact same distinctive jacket she is wearing."

          Example B:

          "Two adult brothers stand in a kitchen. One brother is holding
          the house keys while the other is visibly using the same keys
          to unlock the front door from across the room."

          Example C:

          "A woman sits at her office desk while an unfamiliar adult man
          is already seated in the locked manager's chair, holding her
          employee ID badge."

          These are understandable from a frozen frame.

          ================================================================
          STORY RULES
          ================================================================

          - 9–12 seconds
          - realistic cinematic horror
          - photorealistic live action
          - fictional adults only
          - recognizable real-world location
          - simple physical movement
          - visible human-centered threat
          - strong final visual reversal
          - no narration required
          - no sound-only scare
          - practical for Google Flow

          Prefer:
          - adult couples
          - adult siblings
          - coworkers
          - roommates
          - spouses
          - adult family members

          ================================================================
          ABSOLUTELY FORBIDDEN
          ================================================================

          Children
          Babies
          Infants
          Minors
          Teenagers
          Nursery
          Crib
          Babysitter
          Child portrait

          Elevators
          Cars
          Vehicles
          Hotels
          CCTV
          Security cameras
          Surveillance footage
          Mirrors
          Reflections
          Doppelgangers
          Twins
          Shadow figures
          Silhouettes as the main threat
          Hidden person simply standing behind someone
          Printers
          Trains
          Buses
          Ghosts
          Demons
          Monsters
          Creatures
          Gore
          Blood
          Body parts
          Disappearing people
          Reappearing people
          Teleportation
          Face morphing
          Head distortion
          Possessed household objects
          Floating objects
          Objects growing faces
          Phone/video-call-only horror
          Text-message-only horror
          Complicated CGI
          Long dialogue
          Mythology
          Exposition

          Do not use "locked door" as the central mechanism unless the
          first frame contains a SECOND visible contradiction that makes
          the situation immediately unusual.

          Do not repeat the same story structure.

          The ending must visually resolve or reverse the first-frame
          contradiction.

          Return EXACTLY {count} concepts.
          """

              return groq_request(
                  prompt,
                  "quiet_vault_candidates",
                  candidate_schema,
                  max_tokens=4000
              )["candidates"]


          # ============================================================
          # BASIC FILTER
          # ============================================================

          def basic_filter(
              candidates
          ):

              survivors = []

              print("")
              print("=" * 60)
              print("BASIC HARD FILTER")
              print("=" * 60)

              for candidate in candidates:

                  title = candidate.get(
                      "title",
                      ""
                  )

                  mechanism = candidate.get(
                      "mechanism",
                      ""
                  )

                  premise = candidate.get(
                      "premise",
                      ""
                  )

                  frame = candidate.get(
                      "static_frame_1",
                      ""
                  )

                  ending = candidate.get(
                      "ending",
                      ""
                  )

                  combined = " ".join([
                      title,
                      mechanism,
                      premise,
                      frame,
                      ending
                  ])

                  reason = None

                  if not title.strip():

                      reason = "missing title"

                  elif not mechanism.strip():

                      reason = "missing mechanism"

                  elif len(premise.strip()) < 30:

                      reason = "premise too short"

                  elif len(frame.strip()) < 70:

                      reason = "static frame too short"

                  elif len(ending.strip()) < 30:

                      reason = "ending too short"

                  else:

                      for phrase in banned_phrases:

                          if contains_phrase(
                              combined,
                              phrase
                          ):

                              reason = (
                                  f"banned: {phrase}"
                              )

                              break

                  if reason:

                      print(
                          f"REJECTED: "
                          f"{candidate.get('id')} "
                          f"{title} -> {reason}"
                      )

                  else:

                      survivors.append(
                          candidate
                      )

              print("")
              print(
                  f"Basic survivors: "
                  f"{len(survivors)}"
              )

              return survivors


          # ============================================================
          # CREATIVE GATE
          # ============================================================

          def creative_gate(
              candidates
          ):

              if not candidates:
                  return []

              judge_input = json.dumps(
                  candidates,
                  ensure_ascii=False
              )

              prompt = f"""
          You are the ruthless production gatekeeper for The Quiet Vault.

          DO NOT score generously.

          Your task is to determine whether each concept deserves to
          become an actual 9–12 second YouTube Short.

          Every concept must pass ALL FIVE tests.

          ================================================================
          TEST 1 — FIRST FRAME HOOK
          ================================================================

          Look ONLY at static_frame_1.

          Imagine a screenshot.

          PASS only if the screenshot itself contains an immediately
          noticeable contradiction, threat or impossible situation.

          The viewer must be able to understand:

          "Something is wrong here."

          within one second.

          FAIL:
          - normal room
          - scared expression
          - dark lighting
          - empty chair
          - person looking at something
          - phone held by a person
          - ordinary door
          - ordinary object

          ================================================================
          TEST 2 — VISIBLE THREAT
          ================================================================

          The threatening element must be visible.

          FAIL if the horror depends mainly on:

          sound
          narration
          implication
          an unseen presence
          a future reveal
          something happening off-camera

          PASS only if the viewer can SEE the abnormality.

          ================================================================
          TEST 3 — FLOW FEASIBILITY
          ================================================================

          Can Google Flow plausibly create the scene?

          PASS:
          simple human movement
          normal environments
          clear physical actions

          FAIL:
          complicated transformations
          precise text
          tiny details
          complex reflections
          impossible physics
          complicated CGI
          difficult face transformations

          ================================================================
          TEST 4 — ORIGINALITY
          ================================================================

          The central mechanism must feel different from:

          mirrors
          reflections
          doppelgangers
          locked-door variations
          CCTV
          hidden-person scares
          ghosts
          monsters
          shadow figures
          phone-call scares
          possessed objects
          disappearing/reappearing people

          If the concept feels like a minor variation of one of those,
          FAIL it.

          ================================================================
          TEST 5 — RULE COMPLIANCE
          ================================================================

          Fictional adults only.

          No minors.

          No children.

          No babies.

          No mirrors.

          No reflections.

          No doppelgangers.

          No cars.

          No elevators.

          No hotels.

          No CCTV.

          No monsters.

          No ghosts.

          No demons.

          No gore.

          No disappearing/reappearing mechanism.

          ================================================================
          ELIGIBILITY
          ================================================================

          eligible = TRUE only when ALL FIVE tests are TRUE.

          If even one test fails:

          eligible = FALSE.

          Be strict.

          We would rather return fewer ideas than approve weak concepts.

          CONCEPTS:

          {judge_input}

          Return one evaluation for every concept.
          """

              return groq_request(
                  prompt,
                  "quiet_vault_creative_gate",
                  gate_schema,
                  max_tokens=3000
              )["evaluations"]


          # ============================================================
          # FIRST BATCH
          # ============================================================

          print("")
          print("=" * 60)
          print("CANDIDATE GENERATION — BATCH 1")
          print("=" * 60)

          candidates = generate_candidates(
              count=8,
              starting_id=1,
              batch_number=1
          )

          print(
              f"Generated: "
              f"{len(candidates)}"
          )

          survivors = basic_filter(
              candidates
          )

          print("")
          print("=" * 60)
          print("STRICT CREATIVE GATE — BATCH 1")
          print("=" * 60)

          evaluations = creative_gate(
              survivors
          )

          evaluation_map = {
              item["id"]: item
              for item in evaluations
          }

          eligible_candidates = []

          for candidate in survivors:

              cid = candidate["id"]

              if cid not in evaluation_map:
                  continue

              result = evaluation_map[cid]

              eligible = (
                  result["hook_pass"]
                  and result["visible_threat_pass"]
                  and result["flow_pass"]
                  and result["originality_pass"]
                  and result["rule_pass"]
                  and result["eligible"]
              )

              print(
                  f"ID {cid} | "
                  f"Hook={result['hook_pass']} | "
                  f"Threat={result['visible_threat_pass']} | "
                  f"Flow={result['flow_pass']} | "
                  f"Originality={result['originality_pass']} | "
                  f"Rules={result['rule_pass']} | "
                  f"ELIGIBLE={eligible}"
              )

              if eligible:

                  eligible_candidates.append(
                      candidate
                  )

              else:

                  print(
                      f"  REASON: "
                      f"{result['reason']}"
                  )


          # ============================================================
          # SECOND BATCH IF REQUIRED
          # ============================================================

          if len(eligible_candidates) < 3:

              print("")
              print("=" * 60)
              print("BATCH 1 DID NOT PRODUCE 3 APPROVED CONCEPTS")
              print("=" * 60)

              print(
                  f"Approved so far: "
                  f"{len(eligible_candidates)}"
              )

              print(
                  "Generating a deliberately different second batch."
              )

              print(
                  "Waiting 65 seconds for TPM window..."
              )

              time.sleep(65)

              second_batch = generate_candidates(
                  count=8,
                  starting_id=100,
                  batch_number=2
              )

              print(
                  f"Second batch generated: "
                  f"{len(second_batch)}"
              )

              second_survivors = basic_filter(
                  second_batch
              )

              print("")
              print("=" * 60)
              print("STRICT CREATIVE GATE — BATCH 2")
              print("=" * 60)

              second_evaluations = creative_gate(
                  second_survivors
              )

              second_map = {
                  item["id"]: item
                  for item in second_evaluations
              }

              for candidate in second_survivors:

                  cid = candidate["id"]

                  if cid not in second_map:
                      continue

                  result = second_map[cid]

                  eligible = (
                      result["hook_pass"]
                      and result["visible_threat_pass"]
                      and result["flow_pass"]
                      and result["originality_pass"]
                      and result["rule_pass"]
                      and result["eligible"]
                  )

                  print(
                      f"SECOND BATCH ID {cid} | "
                      f"Hook={result['hook_pass']} | "
                      f"Threat={result['visible_threat_pass']} | "
                      f"Flow={result['flow_pass']} | "
                      f"Originality={result['originality_pass']} | "
                      f"Rules={result['rule_pass']} | "
                      f"ELIGIBLE={eligible}"
                  )

                  if eligible:

                      eligible_candidates.append(
                          candidate
                      )

                  else:

                      print(
                          f"  REASON: "
                          f"{result['reason']}"
                      )


          # ============================================================
          # FINAL APPROVAL CHECK
          # ============================================================

          print("")
          print("=" * 60)
          print("FINAL CREATIVE CHECK")
          print("=" * 60)

          print(
              f"Total approved concepts: "
              f"{len(eligible_candidates)}"
          )

          if len(eligible_candidates) < 3:

              raise RuntimeError(
                  "Fewer than 3 concepts passed the strict creative gate "
                  "after two targeted batches. The workflow intentionally "
                  "stopped rather than manufacture weak Shorts."
              )


          # ============================================================
          # SELECT 3
          # ============================================================

          finalists = eligible_candidates[:3]

          print("")
          print("=" * 60)
          print("APPROVED FINALISTS")
          print("=" * 60)

          for index, candidate in enumerate(
              finalists,
              1
          ):

              print(
                  f"{index}. "
                  f"{candidate['title']} "
                  f"[{candidate['mechanism']}]"
              )


          # ============================================================
          # WAIT BEFORE FINALIZATION
          # ============================================================

          print("")
          print(
              "Waiting 65 seconds before finalization..."
          )

          time.sleep(65)


          # ============================================================
          # FINALIZE
          # ============================================================

          def validate_final_package(
              package
          ):

              required = [

                  "id",
                  "title",
                  "short_script",
                  "visual_hook",
                  "flow_prompt",
                  "final_twist",
                  "description",
                  "keywords",
                  "hashtags",
                  "thumbnail_frame",
                  "thumbnail_text"

              ]

              missing = [
                  field
                  for field in required
                  if field not in package
              ]

              if missing:

                  raise RuntimeError(
                      "Missing final fields: "
                      + ", ".join(missing)
                  )

              for field in required:

                  if field == "id":
                      continue

                  if not isinstance(
                      package[field],
                      str
                  ):

                      raise RuntimeError(
                          f"Invalid field type: {field}"
                      )

                  if (
                      not package[field].strip()
                      and field != "thumbnail_text"
                  ):

                      raise RuntimeError(
                          f"Empty field: {field}"
                      )


          final_packages = []

          for index, finalist in enumerate(
              finalists,
              1
          ):

              print("")
              print("=" * 60)
              print(
                  f"FINALIZING SHORT "
                  f"{index}/3"
              )
              print("=" * 60)

              finalist_json = json.dumps(
                  finalist,
                  ensure_ascii=False
              )

              final_prompt = f"""
          You are the final scriptwriter for The Quiet Vault.

          Turn this APPROVED concept into ONE complete 9–12 second
          YouTube Shorts package.

          APPROVED CONCEPT:

          {finalist_json}

          IMPORTANT:

          The concept has already passed a strict creative gate.

          Preserve the central visual mechanism.

          Do NOT replace it with a mirror, reflection, doppelganger,
          shadow figure, phone-call scare, ghost, monster, disappearing
          person, possessed object, or another generic horror mechanism.

          ================================================================
          VIDEO
          ================================================================

          9–12 seconds.

          Vertical 9:16.

          Photorealistic live action.

          Fictional adult characters only.

          Recognizable real-world location.

          The FIRST FRAME must visibly reproduce the disturbing situation
          described in static_frame_1.

          Do not start with a normal establishing shot.

          The viewer must understand the visual hook without narration.

          Keep physical movement simple and realistic.

          The final beat should create a strong visual payoff and a reason
          to replay.

          ================================================================
          FORBIDDEN
          ================================================================

          minors
          children
          babies
          nursery
          crib
          mirrors
          reflections
          doppelgangers
          twins
          elevators
          cars
          hotels
          CCTV
          shadow figures
          silhouettes as the main threat
          ghosts
          demons
          monsters
          gore
          blood
          disappearing people
          reappearing people
          teleportation
          face morphing
          head distortion
          possessed objects
          floating objects
          complicated CGI
          subtitles
          on-screen text
          logos
          celebrity likenesses

          ================================================================
          REQUIRED FIELDS
          ================================================================

          id

          title

          short_script

          visual_hook

          flow_prompt

          final_twist

          description

          keywords

          hashtags

          thumbnail_frame

          thumbnail_text

          ALL 11 FIELDS ARE MANDATORY.

          Never omit any field.

          ================================================================
          SCRIPT
          ================================================================

          short_script:
          Write the complete timed 9–12 second action.

          ================================================================
          VISUAL HOOK
          ================================================================

          Describe the exact frozen first frame.

          ================================================================
          GOOGLE FLOW PROMPT
          ================================================================

          Write ONE complete paste-ready Google Flow prompt.

          Include:

          - vertical 9:16
          - photorealistic live action
          - fictional adults
          - consistent character appearance
          - location
          - exact first-frame composition
          - camera framing
          - lighting
          - realistic movement
          - timed beats
          - final visual beat
          - no text
          - no subtitles
          - no logos
          - no real-person likenesses
          - no minors

          ================================================================
          FINAL TWIST
          ================================================================

          Explain the final visual payoff.

          ================================================================
          METADATA
          ================================================================

          description:
          Natural YouTube Shorts description.

          keywords:
          Useful comma-separated keywords.

          hashtags:
          Useful hashtags.

          thumbnail_frame:
          Strongest frame and approximate timing.

          thumbnail_text:
          Optional 2–5 word text. Empty string is acceptable.

          Return ONLY JSON.
          """

              package = None

              for attempt in range(
                  1,
                  4
              ):

                  try:

                      package = groq_request(
                          final_prompt,
                          "quiet_vault_final_package",
                          final_schema,
                          max_tokens=3000
                      )

                      validate_final_package(
                          package
                      )

                      break

                  except Exception as error:

                      print(
                          f"Finalization attempt "
                          f"{attempt} failed: "
                          f"{error}"
                      )

                      if attempt >= 3:

                          raise RuntimeError(
                              f"Could not finalize "
                              f"Short {index}"
                          )

                      print(
                          "Waiting 10 seconds before retry..."
                      )

                      time.sleep(10)

              final_packages.append(
                  package
              )

              print(
                  f"FINALIZED: "
                  f"{package['title']}"
              )

              if index < len(finalists):

                  print(
                      "Waiting 10 seconds before "
                      "next final package..."
                  )

                  time.sleep(10)


          # ============================================================
          # SAVE BATCH JSON
          # ============================================================

          with open(
              OUTPUT_DIR / "batch.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  {
                      "shorts": final_packages
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # ============================================================
          # SAVE MARKDOWN
          # ============================================================

          for index, package in enumerate(
              final_packages,
              1
          ):

              markdown = f"""# {package['title']}

          ## Script

          {package['short_script']}

          ## Visual Hook

          {package['visual_hook']}

          ## Google Flow Prompt

          {package['flow_prompt']}

          ## Final Twist

