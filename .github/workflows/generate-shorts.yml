name: Quiet Vault AI - V11 Visual Evidence Horror Engine

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate 3 visual-evidence horror shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import re
          import urllib.request
          import urllib.error
          from pathlib import Path

          KEY = os.environ["GROQ_API_KEY"]
          RUN = int(os.environ.get("RUN_NUMBER", "1"))

          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          OUT = Path("quiet-vault-output")
          OUT.mkdir(exist_ok=True)

          # ============================================================
          # V11
          #
          # HORROR = VISIBLE EVIDENCE
          #
          # The viewer should be able to SEE evidence of something
          # impossible/disturbing before the final line explains it.
          # ============================================================

          MECHANISMS = [

              {
                  "id": "future_note",
                  "name": "THE NOTE ABOUT SOMETHING THAT HASN'T HAPPENED",
                  "location": "realistic apartment home office at night",
                  "visual": (
                      "An adult woman enters her home office and sees an "
                      "unfamiliar adult man sitting at her desk writing in "
                      "her private notebook. The open page visibly contains "
                      "her name and tomorrow's date, with a short unfinished "
                      "sentence beneath it. His pen is actively touching the page."
                  ),
                  "evidence": (
                      "The notebook visibly contains the protagonist's name "
                      "and a future date while the stranger is writing it."
                  ),
                  "ending": (
                      "The stranger says she asked him to finish the sentence "
                      "after she came home."
                  )
              },

              {
                  "id": "fresh_photo",
                  "name": "THE PHOTOGRAPH TAKEN MOMENTS AGO",
                  "location": "realistic apartment living room at night",
                  "visual": (
                      "An adult man enters his apartment and finds an unfamiliar "
                      "adult woman holding a printed photograph. The photograph "
                      "clearly shows the same man standing in the doorway he is "
                      "standing in now, apparently photographed from inside the "
                      "apartment moments earlier."
                  ),
                  "evidence": (
                      "The printed photograph visibly shows the protagonist "
                      "in the exact doorway and room where he currently stands."
                  ),
                  "ending": (
                      "The woman calmly says she took it after he opened the door."
                  )
              },

              {
                  "id": "fresh_meal",
                  "name": "THE MEAL PREPARED BEFORE HE ARRIVED",
                  "location": "realistic apartment kitchen at night",
                  "visual": (
                      "An adult man enters his kitchen and finds an unfamiliar "
                      "adult woman placing a freshly prepared meal on the table. "
                      "The food is steaming and a place is already set specifically "
                      "for him, including his distinctive mug."
                  ),
                  "evidence": (
                      "A fresh meal is visibly prepared for the protagonist "
                      "before he has entered the kitchen."
                  ),
                  "ending": (
                      "She calmly says his wife told her exactly when he would arrive."
                  )
              },

              {
                  "id": "freshly_used_item",
                  "name": "THE PERSONAL ITEM THAT WAS JUST USED",
                  "location": "realistic apartment bedroom",
                  "visual": (
                      "An adult woman enters her bedroom and sees an unfamiliar "
                      "adult man placing her late husband's distinctive wristwatch "
                      "back on the bedside table. The watch is visibly running and "
                      "the man has just finished winding it."
                  ),
                  "evidence": (
                      "The late husband's distinctive mechanical watch is visibly "
                      "running immediately after the stranger has handled it."
                  ),
                  "ending": (
                      "He says her husband asked him to keep it running until tonight."
                  )
              },

              {
                  "id": "private_message",
                  "name": "THE PRIVATE MESSAGE ALREADY WRITTEN",
                  "location": "realistic apartment kitchen",
                  "visual": (
                      "An adult woman enters her kitchen and finds an unfamiliar "
                      "adult man standing beside a sheet of paper on the counter. "
                      "The paper visibly contains a private sentence that she has "
                      "never told anyone, followed by the words 'I knew you would come home.'"
                  ),
                  "evidence": (
                      "The paper visibly contains a private fact and predicts "
                      "the protagonist's arrival."
                  ),
                  "ending": (
                      "The stranger says her husband wrote the first part and told him "
                      "to add the second part when she arrived."
                  )
              },

              {
                  "id": "prepared_room",
                  "name": "THE ROOM PREPARED BEFORE ARRIVAL",
                  "location": "realistic apartment bedroom",
                  "visual": (
                      "An adult man enters his bedroom and finds an unfamiliar "
                      "adult woman calmly placing his exact preferred pillow and "
                      "blanket arrangement on the bed. A glass of water is already "
                      "waiting beside the bed."
                  ),
                  "evidence": (
                      "The bedroom has visibly been prepared according to the "
                      "protagonist's private bedtime routine before he arrived."
                  ),
                  "ending": (
                      "She says his wife told her he would want everything exactly this way."
                  )
              },

              {
                  "id": "unfinished_action",
                  "name": "THE STRANGER FINISHING AN ACTION BEFORE THE PROTAGONIST",
                  "location": "realistic apartment entryway",
                  "visual": (
                      "An adult woman enters her apartment and sees an unfamiliar "
                      "adult man calmly placing her keys into the small bowl where "
                      "she always leaves them. He has already removed his shoes and "
                      "placed them neatly beside the door."
                  ),
                  "evidence": (
                      "The stranger is visibly following the protagonist's exact "
                      "private arrival routine despite supposedly never having been there."
                  ),
                  "ending": (
                      "He says she showed him the routine yesterday."
                  )
              },

              {
                  "id": "recent_presence",
                  "name": "VISIBLE EVIDENCE SOMEONE WAS JUST THERE",
                  "location": "realistic apartment dining room",
                  "visual": (
                      "An adult man enters his apartment dining room and finds an "
                      "unfamiliar adult woman standing beside the table. One chair "
                      "is pulled back, a second glass is still visibly wet with "
                      "fresh condensation, and the woman is calmly holding a warm cup."
                  ),
                  "evidence": (
                      "The table visibly shows signs that another person was just "
                      "there moments before the protagonist arrived."
                  ),
                  "ending": (
                      "She says the other person only stepped out when she heard him "
                      "unlock the door."
                  )
              }
          ]

          # ============================================================
          # HARD BANS
          # ============================================================

          BANNED = [
              "child",
              "children",
              "kid",
              "baby",
              "boy",
              "girl",
              "teen",
              "teenager",
              "minor",
              "mirror",
              "reflection",
              "reflect",
              "doppelganger",
              "doppelgäng",
              "double",
              "twin",
              "clone",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "gore",
              "blood",
              "corpse",
              "cctv",
              "surveillance",
              "security camera",
              "elevator",
              "hotel",
              "train",
              "printer",
              "video call",
              "facetime",
              "phone screen",
              "shadow figure",
              "silhouette",
              "disappear",
              "vanish",
              "teleport",
              "body distortion",
              "face distortion",
              "supernatural creature",
              "magic",
              "magical"
          ]

          # ============================================================
          # GROQ
          # ============================================================

          def call_groq(prompt, retries=3):

              payload = {
                  "model": MODEL,
                  "temperature": 0.55,
                  "max_completion_tokens": 700,
                  "reasoning_effort": "low",

                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "quiet_vault_v11",
                          "strict": True,

                          "schema": {
                              "type": "object",

                              "properties": {
                                  "title": {
                                      "type": "string"
                                  },

                                  "script": {
                                      "type": "string"
                                  },

                                  "description": {
                                      "type": "string"
                                  },

                                  "keywords": {
                                      "type": "string"
                                  },

                                  "hashtags": {
                                      "type": "string"
                                  }
                              },

                              "required": [
                                  "title",
                                  "script",
                                  "description",
                                  "keywords",
                                  "hashtags"
                              ],

                              "additionalProperties": False
                          }
                      }
                  },

                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ]
              }

              body = json.dumps(payload).encode("utf-8")

              for attempt in range(retries):

                  request = urllib.request.Request(
                      ENDPOINT,
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": "Bearer " + KEY,
                          "User-Agent": "QuietVaultAI/11.0"
                      },
                      method="POST"
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=90
                      ) as response:

                          data = json.loads(
                              response.read().decode("utf-8")
                          )

                      content = data["choices"][0]["message"]["content"]

                      if not content:
                          raise RuntimeError(
                              "Groq returned empty content"
                          )

                      return json.loads(content)

                  except urllib.error.HTTPError as error:

                      error_text = error.read().decode(
                          errors="ignore"
                      )

                      if error.code == 429:

                          retry_after = (
                              error.headers.get("retry-after")
                              or "20"
                          )

                          try:
                              wait = float(retry_after)
                          except:
                              wait = 20.0

                          print(
                              f"RATE LIMITED - waiting {wait:.1f}s"
                          )

                          time.sleep(wait + 2)

                      else:

                          print(
                              "GROQ ERROR:",
                              error.code,
                              error_text[:1000]
                          )

                          time.sleep(5)

                  except Exception as error:

                      print(
                          "GENERATION ERROR:",
                          repr(error)
                      )

                      time.sleep(5)

              return None

          # ============================================================
          # VALIDATION
          # ============================================================

          def validate(short, mechanism):

              if not short:
                  return False, "Empty response"

              required = [
                  "title",
                  "script",
                  "description",
                  "keywords",
                  "hashtags"
              ]

              for field in required:

                  if not isinstance(
                      short.get(field),
                      str
                  ):

                      return False, (
                          f"Missing {field}"
                      )

                  if not short[field].strip():

                      return False, (
                          f"Empty {field}"
                      )

              script = short["script"].strip()

              words = script.split()

              if len(words) < 28:

                  return False, (
                      f"Too short: {len(words)} words"
                  )

              if len(words) > 65:

                  return False, (
                      f"Too long: {len(words)} words"
                  )

              lower = script.lower()

              for banned in BANNED:

                  if re.search(
                      r"\b" + re.escape(banned) + r"\b",
                      lower
                  ):

                      return False, (
                          "Banned: " + banned
                      )

              # ========================================================
              # MECHANISM CUES
              # ========================================================

              cues = {

                  "future_note": [
                      "note",
                      "notebook",
                      "tomorrow",
                      "date",
                      "write",
                      "writing"
                  ],

                  "fresh_photo": [
                      "photo",
                      "photograph",
                      "picture",
                      "doorway"
                  ],

                  "fresh_meal": [
                      "meal",
                      "food",
                      "dinner",
                      "kitchen",
                      "mug"
                  ],

                  "freshly_used_item": [
                      "watch",
                      "wind",
                      "winding",
                      "husband"
                  ],

                  "private_message": [
                      "paper",
                      "message",
                      "written",
                      "sentence"
                  ],

                  "prepared_room": [
                      "bed",
                      "pillow",
                      "blanket",
                      "bedroom"
                  ],

                  "unfinished_action": [
                      "keys",
                      "key",
                      "bowl",
                      "shoes"
                  ],

                  "recent_presence": [
                      "chair",
                      "glass",
                      "cup",
                      "table"
                  ]
              }

              if not any(
                  cue in lower
                  for cue in cues[mechanism["id"]]
              ):

                  return False, (
                      "Visual mechanism lost"
                  )

              # ========================================================
              # MUST HAVE AN UNFAMILIAR ADULT
              # ========================================================

              stranger_terms = [
                  "stranger",
                  "unfamiliar man",
                  "unfamiliar woman",
                  "unknown man",
                  "unknown woman"
              ]

              if not any(
                  term in lower
                  for term in stranger_terms
              ):

                  return False, (
                      "No unfamiliar adult"
                  )

              # ========================================================
              # MUST HAVE A CONTRADICTION
              # ========================================================

              contradiction_terms = [
                  "said",
                  "told",
                  "yesterday",
                  "husband",
                  "wife",
                  "father",
                  "late",
                  "died",
                  "dead",
                  "before",
                  "after",
                  "already",
                  "tomorrow",
                  "knew"
              ]

              if not any(
                  term in lower
                  for term in contradiction_terms
              ):

                  return False, (
                      "No contradiction"
                  )

              return True, "PASS"

          # ============================================================
          # FLOW PROMPT
          # ============================================================

          def build_flow(
              mechanism,
              script
          ):

              return f"""
          Create a 9–12 second vertical 9:16
          photorealistic live-action psychological horror short.

          FICTIONAL ADULT ACTORS ONLY.

          No children, teenagers, celebrities,
          or resemblance to real people.

          ============================================================
          LOCATION
          ============================================================

          {mechanism["location"]}

          ============================================================
          FIRST FRAME — CRITICAL
          ============================================================

          {mechanism["visual"]}

          The important evidence must be clearly visible
          in the FIRST FRAME.

          The viewer must be able to understand that
          something is wrong without relying on dialogue.

          The disturbing action must ALREADY be happening.

          Do NOT begin with an establishing shot.

          Do NOT hide the important object.

          Do NOT use a close-up that removes the
          protagonist or unfamiliar adult from the scene.

          ============================================================
          VISIBLE EVIDENCE
          ============================================================

          {mechanism["evidence"]}

          The evidence must remain visible for most
          of the video.

          ============================================================
          DIALOGUE
          ============================================================

          Use this exact script:

          {script}

          No additional dialogue.

          ============================================================
          ENDING
          ============================================================

          {mechanism["ending"]}

          End immediately after the final line.

          HARD CUT.

          Do NOT fade to black.

          ============================================================
          CAMERA
          ============================================================

          Medium-wide cinematic shot.

          Keep the protagonist, unfamiliar adult,
          and evidence visible together.

          Minimal natural camera movement.

          Realistic handheld feel.

          ============================================================
          PERFORMANCE
          ============================================================

          Protagonist:
          restrained genuine fear and disbelief.

          Unfamiliar adult:
          completely calm and matter-of-fact.

          ============================================================
          STYLE
          ============================================================

          Photorealistic live-action.

          Realistic adult humans.

          Natural lighting.

          Believable movement.

          Psychological horror.

          No fantasy aesthetic.

          ============================================================
          STRICTLY DO NOT INCLUDE
          ============================================================

          children,
          teenagers,
          mirrors,
          reflections,
          twins,
          doppelgängers,
          clones,
          ghosts,
          demons,
          monsters,
          zombies,
          gore,
          blood,
          corpse,
          body transformation,
          CCTV,
          surveillance,
          phone screens,
          video calls,
          magical effects,
          extra characters,
          subtitles,
          text overlays,
          extra dialogue,
          exaggerated acting.

          Do not add another twist.

          Do not change the evidence.

          Do not replace the unfamiliar adult
          with anything supernatural.

          HARD CUT.
          No fade to black.
          """

          # ============================================================
          # ROTATE MECHANISMS BETWEEN RUNS
          # ============================================================

          start_index = (
              ((RUN - 1) * 3)
              % len(MECHANISMS)
          )

          ordered = (
              MECHANISMS[start_index:]
              +
              MECHANISMS[:start_index]
          )

          approved = []
          attempts = 0

          print("")
          print("==========================================")
          print(" QUIET VAULT V11")
          print(" VISUAL EVIDENCE HORROR ENGINE")
          print("==========================================")
          print("RUN:", RUN)
          print("MODEL:", MODEL)
          print("TARGET: 3")
          print("")

          # ============================================================
          # GENERATE ONE AT A TIME
          # ============================================================

          for mechanism in ordered:

              if len(approved) >= 3:
                  break

              if attempts >= 8:
                  break

              attempts += 1

              print("")
              print("------------------------------------------")
              print(
                  "MECHANISM:",
                  mechanism["name"]
              )
              print("------------------------------------------")

              prompt = f"""
          Write ONE realistic horror YouTube Short
          for The Quiet Vault.

          ============================================================
          CHANNEL DNA
          ============================================================

          - 9–12 seconds
          - realistic psychological horror
          - adult characters only
          - recognizable real-world location
          - visible disturbing evidence
          - minimal dialogue
          - hard cut ending
          - no supernatural creatures

          ============================================================
          FIXED MECHANISM
          ============================================================

          {mechanism["name"]}

          LOCATION:

          {mechanism["location"]}

          ============================================================
          EXACT VISUAL SITUATION
          ============================================================

          {mechanism["visual"]}

          ============================================================
          VISIBLE EVIDENCE
          ============================================================

          {mechanism["evidence"]}

          ============================================================
          ENDING DIRECTION
          ============================================================

          {mechanism["ending"]}

          ============================================================
          WRITING REQUIREMENTS
          ============================================================

          Write 28–65 words.

          Make it sound like a real person,
          NOT a narrator.

          Do NOT write:
          "an adult woman"
          "an adult man"
          "the camera"
          "the viewer"

          Start with the protagonist noticing
          the disturbing situation.

          Do not waste words describing the room.

          The unfamiliar adult must be visibly
          performing the fixed action.

          The protagonist can ask ONE short question.

          The stranger gets ONE short final line.

          The final line must make the VISIBLE EVIDENCE
          more disturbing.

          Do not merely create mystery.

          Do not explain everything.

          Do not add a second twist.

          Do not change the fixed mechanism.

          Do not use:
          children,
          mirrors,
          reflections,
          twins,
          doppelgängers,
          ghosts,
          monsters,
          gore,
          CCTV,
          phones,
          video calls.

          Return JSON only.
          """

              result = call_groq(prompt)

              ok, reason = validate(
                  result,
                  mechanism
              )

              print(
                  "VALIDATION:",
                  reason
              )

              if not ok:
                  continue

              package = {

                  "slot": len(approved) + 1,

                  "mechanism": mechanism["name"],

                  "title": result["title"],

                  "short_script": result["script"],

                  "visual_hook": mechanism["visual"],

                  "visible_evidence": mechanism["evidence"],

                  "flow_prompt": build_flow(
                      mechanism,
                      result["script"]
                  ),

                  "final_twist": mechanism["ending"],

                  "description": result["description"],

                  "keywords": result["keywords"],

                  "hashtags": result["hashtags"],

                  "thumbnail_frame": (
                      "Use approximately 0.5–1.5 seconds. "
                      "Show the protagonist, unfamiliar adult, "
                      "and the visible evidence together."
                  ),

                  "thumbnail_text": "",

                  "sound_design": (
                      "Natural room tone, realistic footsteps "
                      "and object sounds, subtle tension bed, "
                      "clear dialogue. Hard cut after final line."
                  ),

                  "pinned_comment": (
                      "Would you have noticed what was wrong?"
                  )
              }

              approved.append(package)

              print(
                  "APPROVED:",
                  result["title"]
              )

              time.sleep(8)

          # ============================================================
          # SAVE BATCH JSON
          # ============================================================

          batch = {

              "run": RUN,

              "provider": "groq",

              "model": MODEL,

              "engine": (
                  "V11 Visual Evidence Horror Engine"
              ),

              "generated": attempts,

              "approved": len(approved),

              "shorts": approved
          }

          with open(
              OUT / "batch.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  batch,
                  file,
                  indent=2,
                  ensure_ascii=False
              )

          # ============================================================
          # SAVE INDIVIDUAL MARKDOWN FILES
          # ============================================================

          for index, short in enumerate(
              approved,
              start=1
          ):

              markdown = f"""# {short["title"]}

          ## Script

          {short["short_script"]}

          ## Visual Hook

          {short["visual_hook"]}

          ## Visible Evidence

          {short["visible_evidence"]}

          ## Google Flow Prompt

          ```text
          {short["flow_prompt"]}
          ```

          ## Final Twist

          {short["final_twist"]}

          ## Description

          ```text
          {short["description"]}
          ```

          ## Keywords

          ```text
          {short["keywords"]}
          ```

          ## Hashtags

          ```text
          {short["hashtags"]}
          ```

          ## Thumbnail

          {short["thumbnail_frame"]}

          {short["thumbnail_text"]}

          ## Sound Design

          {short["sound_design"]}

          ## Pinned Comment

          {short["pinned_comment"]}
          """

              with open(
                  OUT / f"short_{index:02d}.md",
                  "w",
                  encoding="utf-8"
              ) as file:

                  file.write(markdown)

          print("")
          print("==========================================")
          print("FINAL RESULT")
          print("==========================================")
          print(
              "Approved:",
              len(approved),
              "/ 3"
          )

          if len(approved) < 3:

              print(
                  "No weak filler Shorts were created."
              )

          else:

              print(
                  "SUCCESS - 3 Shorts ready."
              )

          PY

      - name: Upload V11 package
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-v11-shorts
          path: quiet-vault-output/
