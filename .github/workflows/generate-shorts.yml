name: Generate, filter, judge and finalize

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate, filter, judge and finalize
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat > generate.py <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path

          API_KEY = os.environ["GROQ_API_KEY"]
          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          OUTPUT_DIR = Path("quiet-vault-output")
          OUTPUT_DIR.mkdir(exist_ok=True)


          # ============================================================
          # GROQ REQUEST WITH RATE-LIMIT HANDLING
          # ============================================================

          def groq_request(
              prompt,
              schema_name,
              schema,
              max_tokens=5000,
              max_attempts=5
          ):

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "temperature": 0.85,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden",
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": schema_name,
                          "strict": True,
                          "schema": schema
                      }
                  }
              }

              data = json.dumps(payload).encode("utf-8")

              for attempt in range(1, max_attempts + 1):

                  request = urllib.request.Request(
                      ENDPOINT,
                      data=data,
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      },
                      method="POST"
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          body = response.read().decode("utf-8")
                          result = json.loads(body)

                      content = result["choices"][0]["message"]["content"]

                      try:
                          return json.loads(content)

                      except json.JSONDecodeError:

                          print("")
                          print("=" * 60)
                          print("INVALID JSON FROM GROQ")
                          print(content)
                          print("=" * 60)
                          print("")

                          raise RuntimeError(
                              "Groq returned invalid JSON"
                          )

                  except urllib.error.HTTPError as e:

                      error_body = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print("")
                      print("=" * 60)
                      print("GROQ ERROR")
                      print(f"HTTP: {e.code}")
                      print(error_body)
                      print("=" * 60)
                      print("")

                      # ------------------------------------------------
                      # RATE LIMIT
                      # ------------------------------------------------

                      if e.code == 429:

                          if attempt >= max_attempts:
                              raise RuntimeError(
                                  "Groq rate limit persisted after retries."
                              )

                          retry_after = None

                          try:
                              retry_after = e.headers.get(
                                  "retry-after"
                              )
                          except Exception:
                              pass

                          if retry_after:
                              try:
                                  wait_time = float(retry_after) + 2
                              except ValueError:
                                  wait_time = 10
                          else:

                              wait_time = min(
                                  5 * (2 ** (attempt - 1)),
                                  65
                              )

                          print(
                              f"RATE LIMIT HIT. "
                              f"Waiting {wait_time:.1f}s "
                              f"before retry "
                              f"{attempt + 1}/{max_attempts}..."
                          )

                          time.sleep(wait_time)
                          continue

                      raise RuntimeError(
                          f"Groq returned HTTP {e.code}"
                      )

                  except Exception as e:

                      print("")
                      print("=" * 60)
                      print("REQUEST ERROR")
                      print(str(e))
                      print("=" * 60)
                      print("")

                      raise


          # ============================================================
          # STAGE 1 — CANDIDATE GENERATION
          # ============================================================

          print("")
          print("=" * 60)
          print("CANDIDATE GENERATION")
          print("=" * 60)

          candidate_schema = {
              "type": "object",
              "properties": {
                  "candidates": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id": {
                                  "type": "integer"
                              },
                              "title": {
                                  "type": "string"
                              },
                              "premise": {
                                  "type": "string"
                              },
                              "static_frame_1": {
                                  "type": "string"
                              },
                              "ending": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "id",
                              "title",
                              "premise",
                              "static_frame_1",
                              "ending"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "candidates"
              ],
              "additionalProperties": False
          }

          candidate_prompt = """
          You are the concept generator for The Quiet Vault, a YouTube Shorts
          channel focused on realistic cinematic horror.

          Generate EXACTLY 12 different horror Short concepts.

          FORMAT:
          - 9–12 second YouTube Short
          - English
          - realistic live-action horror
          - fictional adult characters
          - recognizable real-world location
          - visible human-centered threat or contradiction
          - disturbing visual present from frame one
          - simple enough for Google Flow/Veo
          - strong final payoff
          - replay-worthy ending

          FIRST-FRAME RULE:

          static_frame_1 must describe ONE frozen screenshot.

          Someone seeing only that screenshot should immediately understand
          that something is wrong.

          GOOD:
          "A woman stands in her bedroom while the locked bedroom door is
          visibly being opened from the hallway by an unfamiliar adult hand."

          BAD:
          "A woman stands in her bedroom."

          BAD:
          "A man becomes scared."

          The first frame must work without narration or explanation.

          Prefer:
          - someone being somewhere they should not be
          - locked/open contradictions
          - ordinary actions happening incorrectly
          - familiar locations containing one clearly wrong human element
          - adult family or relationship situations

          AVOID:
          elevators
          cars
          hotels
          CCTV
          security footage
          mirrors
          reflections
          doppelgangers
          hidden people behind characters
          printers
          trains
          floating objects
          possessed household objects
          objects growing faces
          random body parts
          disappearing/reappearing people
          ghosts
          demons
          monsters
          zombies
          gore
          giant creatures
          impossible anatomy
          head distortion
          complicated CGI
          mythology
          long conversations

          Do not reuse the same mechanism repeatedly.

          Return EXACTLY 12 candidates.
          """

          candidates_data = groq_request(
              candidate_prompt,
              "quiet_vault_candidates",
              candidate_schema,
              max_tokens=4000
          )

          candidates = candidates_data["candidates"]

          print(f"Generated: {len(candidates)}")


          # ============================================================
          # STAGE 2 — HARD FILTER
          # ============================================================

          print("")
          print("=" * 60)
          print("HARD FILTER")
          print("=" * 60)

          banned_phrases = [
              "elevator",
              "hotel",
              "cctv",
              "security camera",
              "surveillance footage",
              "mirror",
              "reflection",
              "doppelganger",
              "doppelgänger",
              "behind him",
              "behind her",
              "behind the man",
              "behind the woman",
              "printer",
              "train",
              "ghost",
              "demon",
              "zombie",
              "monster",
              "giant creature",
              "floating mug",
              "floating cup",
              "possessed object",
              "growing face",
              "body part",
              "disappears",
              "disappearing",
              "reappears",
              "reappearing",
              "head spins",
              "head turns 180",
              "head rotates",
              "gore"
          ]

          def contains_phrase(text, phrase):

              text = text.lower()
              phrase = phrase.lower()

              if " " in phrase:
                  return phrase in text

              return re.search(
                  rf"(?<![a-z]){re.escape(phrase)}(?![a-z])",
                  text
              ) is not None


          survivors = []
          rejected = []

          for candidate in candidates:

              title = candidate.get("title", "")
              premise = candidate.get("premise", "")
              frame = candidate.get("static_frame_1", "")
              ending = candidate.get("ending", "")

              combined = " ".join([
                  title,
                  premise,
                  frame,
                  ending
              ]).lower()

              reason = None

              if not title.strip():
                  reason = "missing title"

              elif len(premise.strip()) < 25:
                  reason = "premise too short"

              elif len(frame.strip()) < 45:
                  reason = "first frame description too short"

              elif len(ending.strip()) < 25:
                  reason = "ending too short"

              else:

                  for phrase in banned_phrases:

                      if contains_phrase(
                          combined,
                          phrase
                      ):

                          reason = f"banned: {phrase}"
                          break

              if reason:

                  rejected.append(candidate)

                  print(
                      f"REJECTED: "
                      f"{candidate.get('id')} "
                      f"{title} -> {reason}"
                  )

              else:

                  survivors.append(candidate)

          print("")
          print(f"Survivors: {len(survivors)}")
          print(f"Rejected: {len(rejected)}")

          if len(survivors) < 3:

              raise RuntimeError(
                  "Fewer than 3 concepts survived the hard filter."
              )


          # ============================================================
          # STAGE 3 — AI CREATIVE JUDGE
          # ============================================================

          print("")
          print("=" * 60)
          print("AI CREATIVE JUDGE")
          print("=" * 60)

          judge_schema = {
              "type": "object",
              "properties": {
                  "evaluations": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id": {
                                  "type": "integer"
                              },
                              "hook": {
                                  "type": "integer"
                              },
                              "clarity": {
                                  "type": "integer"
                              },
                              "ending": {
                                  "type": "integer"
                              },
                              "flow": {
                                  "type": "integer"
                              },
                              "originality": {
                                  "type": "integer"
                              },
                              "rewatch": {
                                  "type": "integer"
                              },
                              "overall": {
                                  "type": "integer"
                              }
                          },
                          "required": [
                              "id",
                              "hook",
                              "clarity",
                              "ending",
                              "flow",
                              "originality",
                              "rewatch",
                              "overall"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "evaluations"
              ],
              "additionalProperties": False
          }

          judge_input = json.dumps(
              survivors,
              ensure_ascii=False
          )

          judge_prompt = f"""
          You are the strict creative director for The Quiet Vault.

          Judge every horror Short concept below.

          Score each from 1 to 10.

          hook:
          How immediately disturbing is the STATIC FIRST FRAME?

          clarity:
          Can the viewer understand what is wrong visually?

          ending:
          How strong and surprising is the payoff?

          flow:
          How reliably can Google Flow create it as realistic live action?

          originality:
          Does it avoid tired horror mechanisms?

          rewatch:
          Does the ending create a reason to replay?

          overall:
          Overall YouTube Shorts potential.

          The STATIC FIRST FRAME is the most important factor.

          Do not reward complexity.
          Prefer simple, immediately understandable visual horror.

          Concepts:

          {judge_input}

          Return one evaluation for every candidate.
          """

          judge_data = groq_request(
              judge_prompt,
              "quiet_vault_judgements",
              judge_schema,
              max_tokens=3000
          )

          evaluations = judge_data["evaluations"]

          evaluation_map = {
              item["id"]: item
              for item in evaluations
          }

          ranked = []

          for candidate in survivors:

              cid = candidate["id"]

              if cid not in evaluation_map:
                  continue

              score = evaluation_map[cid]

              ranked.append(
                  (
                      score["overall"],
                      score["hook"],
                      score["ending"],
                      score["rewatch"],
                      candidate
                  )
              )

          ranked.sort(
              key=lambda x: (
                  x[0],
                  x[1],
                  x[2],
                  x[3]
              ),
              reverse=True
          )

          print("")
          print("JUDGE RESULTS")
          print("-" * 60)

          for item in ranked:

              candidate = item[4]
              score = evaluation_map[candidate["id"]]

              print(
                  f"ID: {candidate['id']} "
                  f"Hook: {score['hook']} "
                  f"Clarity: {score['clarity']} "
                  f"Ending: {score['ending']} "
                  f"Flow: {score['flow']} "
                  f"Originality: {score['originality']} "
                  f"Rewatch: {score['rewatch']} "
                  f"Overall: {score['overall']}"
              )


          # ============================================================
          # STAGE 4 — SELECT TOP 3
          # ============================================================

          finalists = [
              item[4]
              for item in ranked[:3]
          ]

          print("")
          print("=" * 60)
          print("FINALISTS")
          print("=" * 60)

          for index, candidate in enumerate(
              finalists,
              1
          ):

              print(
                  f"{index} "
                  f"{candidate['title']}"
              )


          # ============================================================
          # IMPORTANT RATE-LIMIT PAUSE
          # ============================================================

          print("")
          print("=" * 60)
          print("RATE-LIMIT SAFETY PAUSE")
          print("=" * 60)

          print(
              "Waiting 65 seconds before finalization "
              "to clear the rolling Groq TPM window..."
          )

          time.sleep(65)

          print("Finalization phase starting.")


          # ============================================================
          # STAGE 5 — FINAL PACKAGE
          # ONE REQUEST PER SHORT
          # ============================================================

          final_schema = {
              "type": "object",
              "properties": {

                  "id": {
                      "type": "integer"
                  },

                  "title": {
                      "type": "string"
                  },

                  "short_script": {
                      "type": "string"
                  },

                  "visual_hook": {
                      "type": "string"
                  },

                  "flow_prompt": {
                      "type": "string"
                  },

                  "final_twist": {
                      "type": "string"
                  },

                  "description": {
                      "type": "string"
                  },

                  "keywords": {
                      "type": "string"
                  },

                  "hashtags": {
                      "type": "string"
                  },

                  "thumbnail_frame": {
                      "type": "string"
                  },

                  "thumbnail_text": {
                      "type": "string"
                  }
              },

              "required": [
                  "id",
                  "title",
                  "short_script",
                  "visual_hook",
                  "flow_prompt",
                  "final_twist",
                  "description",
                  "keywords",
                  "hashtags",
                  "thumbnail_frame",
                  "thumbnail_text"
              ],

              "additionalProperties": False
          }


          def validate_final_package(package):

              required_fields = [
                  "id",
                  "title",
                  "short_script",
                  "visual_hook",
                  "flow_prompt",
                  "final_twist",
                  "description",
                  "keywords",
                  "hashtags",
                  "thumbnail_frame",
                  "thumbnail_text"
              ]

              missing = [
                  field
                  for field in required_fields
                  if field not in package
              ]

              if missing:

                  raise RuntimeError(
                      "Final package missing fields: "
                      + ", ".join(missing)
                  )

              for field in required_fields:

                  if field == "id":
                      continue

                  if not isinstance(
                      package[field],
                      str
                  ):

                      raise RuntimeError(
                          f"Final package field is not text: {field}"
                      )

                  if (
                      not package[field].strip()
                      and field != "thumbnail_text"
                  ):

                      raise RuntimeError(
                          f"Final package field is empty: {field}"
                      )


          final_packages = []

          for index, finalist in enumerate(
              finalists,
              1
          ):

              print("")
              print("=" * 60)
              print(
                  f"FINALIZING SHORT {index}/3"
              )
              print("=" * 60)

              finalist_json = json.dumps(
                  finalist,
                  ensure_ascii=False
              )

              final_prompt = f"""
          You are the final scriptwriter for The Quiet Vault.

          Turn this approved horror concept into ONE complete YouTube
          Shorts package.

          APPROVED CONCEPT:

          {finalist_json}

          REQUIREMENTS:

          - 9–12 seconds
          - realistic live-action horror
          - fictional ADULT characters only
          - vertical 9:16
          - photorealistic
          - recognizable location
          - visible threat
          - disturbing first frame
          - no slow establishing shot
          - no narration required to understand the visual hook
          - simple physical action
          - strong final visual payoff
          - replay-worthy ending
          - no minors
          - no celebrities
          - no real-person likenesses
          - no mirrors
          - no reflections
          - no elevators
          - no cars
          - no hotels
          - no CCTV
          - no doppelgangers
          - no monsters
          - no ghosts
          - no demons
          - no gore
          - no complicated CGI
          - no subtitles
          - no logos
          - no on-screen text

          SHORT SCRIPT:
          Write a compact timed 9–12 second script.

          VISUAL HOOK:
          Describe exactly what is visible in frame one.

          FLOW PROMPT:
          Write ONE complete Google Flow prompt ready to paste.

          Include:
          - vertical 9:16
          - photorealistic live action
          - fictional adults
          - consistent character appearance
          - location
          - camera
          - lighting
          - first-frame composition
          - simple movement
          - timing
          - realistic behavior
          - final visual beat
          - no text
          - no subtitles
          - no logos
          - no celebrity likeness
          - no minors

          FINAL TWIST:
          Explain the final visual payoff clearly.

          DESCRIPTION:
          Write a YouTube Shorts description.

          KEYWORDS:
          One comma-separated keyword line.

          HASHTAGS:
          One compact hashtag line.

          THUMBNAIL FRAME:
          Identify the strongest frame to use.

          THUMBNAIL TEXT:
          Give optional 2–5 word text.
          If text would weaken the thumbnail, return an empty string.

          CRITICAL:

          You MUST return ALL 11 fields.

          Required fields:

          id
          title
          short_script
          visual_hook
          flow_prompt
          final_twist
          description
          keywords
          hashtags
          thumbnail_frame
          thumbnail_text

          NEVER omit any field.

          Return ONLY JSON.
          """

              package = None

              for attempt in range(1, 4):

                  try:

                      package = groq_request(
                          final_prompt,
                          "quiet_vault_final_package",
                          final_schema,
                          max_tokens=3000,
                          max_attempts=5
                      )

                      validate_final_package(
                          package
                      )

                      break

                  except Exception as error:

                      print("")
                      print(
                          f"Finalization attempt "
                          f"{attempt} failed: {error}"
                      )

                      if attempt == 3:

                          raise RuntimeError(
                              f"Could not finalize Short {index}"
                          )

                      print(
                          "Waiting 10 seconds before "
                          "retrying finalization..."
                      )

                      time.sleep(10)

              final_packages.append(package)

              print(
                  f"FINALIZED: "
                  f"{package['title']}"
              )


              # Give the TPM window a little breathing room
              # between final package calls.
              if index < len(finalists):

                  print(
                      "Waiting 8 seconds before next "
                      "final package..."
                  )

                  time.sleep(8)


          # ============================================================
          # STAGE 6 — SAVE OUTPUT
          # ============================================================

          batch = {
              "shorts": final_packages
          }

          batch_path = OUTPUT_DIR / "batch.json"

          with open(
              batch_path,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  batch,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          for index, package in enumerate(
              final_packages,
              1
          ):

              markdown = f"""# {package['title']}

          ## Script

          {package['short_script']}

          ## Visual Hook

          {package['visual_hook']}

          ## Google Flow Prompt

          {package['flow_prompt']}

          ## Final Twist

          {package['final_twist']}

          ## Description

          {package['description']}

          ## Keywords

          {package['keywords']}

          ## Hashtags

          {package['hashtags']}

          ## Thumbnail Frame

          {package['thumbnail_frame']}

          ## Thumbnail Text

          {package['thumbnail_text']}
          """

              path = (
                  OUTPUT_DIR
                  / f"short_{index:02d}.md"
              )

              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(markdown)


          print("")
          print("=" * 60)
          print("SUCCESS")
          print("=" * 60)

          print(
              f"Generated "
              f"{len(final_packages)} complete Shorts."
          )

          print(
              f"Output directory: "
              f"{OUTPUT_DIR}"
          )

          PY

          python generate.py

      - name: Upload generated Shorts package
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts
          path: quiet-vault-output/
          if-no-files-found: error
