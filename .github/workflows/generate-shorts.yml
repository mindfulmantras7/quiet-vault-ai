name: Generate 3 Quiet Vault Shorts

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate and quality-filter 3 horror Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          from pathlib import Path

          api_key = os.environ.get("GROQ_API_KEY")

          if not api_key:
              print("ERROR: GROQ_API_KEY secret was not found.")
              raise SystemExit(1)

          # ============================================================
          # QUIET VAULT CREATIVE BRIEF
          # ============================================================

          prompt = r"""
          You are the senior writer and creative director for
          "The Quiet Vault", a realistic cinematic horror YouTube Shorts
          channel.

          Your job is to create EXACTLY 3 original horror Shorts that are
          visually strong, realistic, easy for Google Flow to generate,
          and capable of stopping a viewer from swiping.

          Do NOT create generic AI horror.

          ============================================================
          CORE STYLE
          ============================================================

          Each story should feel like:

          "This could almost happen in real life, except one thing is
          completely wrong."

          Requirements:

          - 9-15 seconds.
          - Fictional ADULT characters only.
          - No children or minors.
          - No celebrities or real-person likenesses.
          - No gore.
          - No monsters.
          - Realistic live-action appearance.
          - Recognizable everyday locations.
          - The disturbing thing must be VISIBLE immediately.
          - The viewer must understand the basic horror without narration.
          - Minimal dialogue.
          - One strong visual idea is better than complicated mythology.
          - One or two characters maximum.
          - One location per story.
          - Prefer one continuous shot or two simple shots.
          - End immediately after the reveal.

          ============================================================
          FRAME-1 RULE
          ============================================================

          The FIRST FRAME must already contain something wrong.

          Bad:
          Person walks into an empty room.
          Something scary happens 8 seconds later.

          Good:
          Person is already standing in a room while something visibly
          impossible is happening behind or beside them.

          The viewer should notice the anomaly within one second.

          ============================================================
          STORY STRUCTURE
          ============================================================

          Every selected story must have:

          1. Immediate visual anomaly.
          2. Simple recognizable situation.
          3. Small escalation.
          4. Visual revelation.
          5. Strong final image.
          6. Hard cut ending.

          The final image should create:

          "Wait... what?"

          and ideally make the viewer want to replay the Short.

          ============================================================
          PREFERRED HORROR
          ============================================================

          Prefer realistic situations involving:

          - apartments
          - offices
          - bathrooms
          - kitchens
          - staircases
          - supermarkets
          - hospitals
          - restaurants
          - parking areas
          - building lobbies
          - workplaces
          - laundromats
          - pharmacies
          - rooftops
          - balconies
          - convenience stores
          - ordinary streets
          - public areas

          Prefer threats involving:

          - a person being somewhere they should not be
          - an ordinary action happening incorrectly
          - a locked/open contradiction
          - something physically impossible but simple
          - a person reacting to something clearly visible
          - an object revealing something disturbing
          - an ordinary environment containing one impossible detail
          - a physical event that changes the meaning of the scene

          ============================================================
          HARD EXCLUSIONS
          ============================================================

          DO NOT USE:

          - elevator horror
          - car horror
          - hotel horror
          - CCTV footage
          - mirror/reflection tricks
          - doppelgängers
          - hidden person behind someone
          - printer horror
          - moving empty chair
          - train horror
          - 180-degree head distortion
          - disappearing/reappearing people
          - floating mugs
          - cereal boxes with faces
          - possessed household objects
          - random body parts appearing
          - objects growing human faces
          - generic ghosts
          - generic demons
          - monsters
          - zombies
          - gore
          - blood-heavy horror
          - complicated transformations
          - impossible anatomy
          - giant creatures
          - complicated CGI
          - long conversations
          - exposition
          - "the character screams" as the entire ending
          - "the object disappears" as the entire ending
          - "it was actually me" unless the visual explanation is extremely clear
          - anything that looks more funny than frightening

          ============================================================
          ORIGINALITY
          ============================================================

          First generate a large internal pool of at least 12 different
          concepts.

          Do NOT return the first three acceptable concepts.

          The concepts must use different:

          - locations
          - mechanisms
          - character situations
          - visual threats
          - endings

          Reject concepts that feel like common AI horror templates.

          ============================================================
          QUALITY FILTER
          ============================================================

          Internally reject any concept if the answer to ANY of these is NO:

          1. Is something clearly wrong in the first frame?

          2. Can the viewer understand the visual problem without sound?

          3. Is the horror believable enough to look like live action?

          4. Can Google Flow create the action without complicated effects?

          5. Does something meaningful happen before the ending?

          6. Does the final image create a genuine "wait... what?" reaction?

          7. Is the concept different from the other selected concepts?

          8. Would this feel like The Quiet Vault rather than a generic
             AI-generated horror video?

          If NO, discard the concept and replace it.

          ============================================================
          FLOW REQUIREMENTS
          ============================================================

          Every Flow prompt must include:

          - 9:16 vertical
          - 9-15 second duration
          - photorealistic live-action
          - fictional adult characters
          - no celebrity likeness
          - realistic environment
          - realistic lighting
          - camera position
          - simple camera movement
          - exact physical action
          - timing
          - final visual reveal
          - hard ending
          - no text
          - no subtitles
          - no logos
          - no watermark
          - no gore
          - no monsters

          Do not ask Flow to create complicated reflections,
          impossible anatomy, crowds, or complicated transformations.

          ============================================================
          FINAL THREE
          ============================================================

          Return exactly 3 selected concepts.

          They must be genuinely different from each other.

          For each one provide:

          TITLE
          SHORT_SCRIPT
          VISUAL_HOOK
          FLOW_PROMPT
          FINAL_TWIST
          DESCRIPTION
          KEYWORDS
          HASHTAGS
          THUMBNAIL_FRAME
          THUMBNAIL_TEXT

          SHORT_SCRIPT:
          - maximum approximately 35 spoken words
          - minimal narration
          - dialogue only when useful

          VISUAL_HOOK:
          - describe exactly what is visible in frame 1

          FINAL_TWIST:
          - explain the final visual revelation

          DESCRIPTION:
          - natural YouTube description
          - no keyword stuffing
          - do not claim the story is real
          - do not mention AI generation

          KEYWORDS:
          - 10-20 relevant comma-separated keywords

          HASHTAGS:
          - 4-8 relevant hashtags

          THUMBNAIL_FRAME:
          - identify the strongest exact moment

          THUMBNAIL_TEXT:
          - maximum 4 words
          - use NONE if text would weaken the thumbnail

          ============================================================
          IMPORTANT
          ============================================================

          The final concepts must be practical to produce.

          Do not sacrifice visual quality just to make the idea more
          supernatural.

          A realistic person in the wrong place is often scarier than
          a monster.

          A simple physical contradiction is often scarier than CGI.

          Return ONLY the requested structured data.
          """

          # ============================================================
          # GROQ REQUEST
          # ============================================================

          url = "https://api.groq.com/openai/v1/chat/completions"

          schema = {
              "type": "object",
              "properties": {
                  "shorts": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id": {
                                  "type": "integer"
                              },
                              "title": {
                                  "type": "string"
                              },
                              "short_script": {
                                  "type": "string"
                              },
                              "visual_hook": {
                                  "type": "string"
                              },
                              "flow_prompt": {
                                  "type": "string"
                              },
                              "final_twist": {
                                  "type": "string"
                              },
                              "description": {
                                  "type": "string"
                              },
                              "keywords": {
                                  "type": "string"
                              },
                              "hashtags": {
                                  "type": "string"
                              },
                              "thumbnail_frame": {
                                  "type": "string"
                              },
                              "thumbnail_text": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "id",
                              "title",
                              "short_script",
                              "visual_hook",
                              "flow_prompt",
                              "final_twist",
                              "description",
                              "keywords",
                              "hashtags",
                              "thumbnail_frame",
                              "thumbnail_text"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "shorts"
              ],
              "additionalProperties": False
          }

          data = {
              "model": "openai/gpt-oss-20b",
              "messages": [
                  {
                      "role": "system",
                      "content": (
                          "You are a senior horror creative director "
                          "for The Quiet Vault. "
                          "Create original realistic horror Shorts "
                          "and follow the requested schema exactly."
                      )
                  },
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "temperature": 0.85,
              "max_completion_tokens": 12000,
              "reasoning_effort": "low",
              "response_format": {
                  "type": "json_schema",
                  "json_schema": {
                      "name": "quiet_vault_shorts",
                      "strict": True,
                      "schema": schema
                  }
              }
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + api_key,
                  "User-Agent": "QuietVaultAI/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  result = json.loads(response.read())

          except urllib.error.HTTPError as e:
              print("")
              print("===== GROQ API ERROR =====")
              print("HTTP STATUS:", e.code)
              print(e.read().decode("utf-8"))
              print("==========================")
              raise

          # ============================================================
          # PARSE RESPONSE
          # ============================================================

          content = result["choices"][0]["message"]["content"]

          try:
              output = json.loads(content)
          except json.JSONDecodeError:
              print("ERROR: Groq returned invalid JSON.")
              print(content)
              raise

          shorts = output.get("shorts", [])

          if len(shorts) != 3:
              print("ERROR: Expected exactly 3 Shorts.")
              print("Received:", len(shorts))
              raise SystemExit(1)

          required_fields = [
              "id",
              "title",
              "short_script",
              "visual_hook",
              "flow_prompt",
              "final_twist",
              "description",
              "keywords",
              "hashtags",
              "thumbnail_frame",
              "thumbnail_text"
          ]

          for short in shorts:
              missing = [
                  field
                  for field in required_fields
                  if field not in short
              ]

              if missing:
                  print(
                      "ERROR: Missing fields in Short",
                      short.get("id")
                  )
                  print("Missing:", missing)
                  raise SystemExit(1)

          # ============================================================
          # SAVE OUTPUT
          # ============================================================

          output_dir = Path("quiet-vault-output")
          output_dir.mkdir(exist_ok=True)

          with open(
              output_dir / "batch.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          for short in shorts:
              i = short["id"]

              markdown = f"""# THE QUIET VAULT — SHORT {i}

          ## TITLE

          {short["title"]}

          ## SHORT SCRIPT

          {short["short_script"]}

          ## VISUAL HOOK

          {short["visual_hook"]}

          ## GOOGLE FLOW PROMPT

          {short["flow_prompt"]}

          ## FINAL TWIST

          {short["final_twist"]}

          ## DESCRIPTION

          {short["description"]}

          ## KEYWORDS

          {short["keywords"]}

          ## HASHTAGS

          {short["hashtags"]}

          ## THUMBNAIL FRAME

          {short["thumbnail_frame"]}

          ## THUMBNAIL TEXT

          {short["thumbnail_text"]}
          """

              with open(
                  output_dir / f"short_{i:02d}.md",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(markdown)

          # ============================================================
          # SUCCESS OUTPUT
          # ============================================================

          print("")
          print("========================================")
          print("   QUIET VAULT — 3 SHORTS GENERATED")
          print("========================================")
          print("")

          for short in shorts:
              print(
                  f'{short["id"]}. {short["title"]}'
              )

          print("")
          print("Files created:")
          print("  short_01.md")
          print("  short_02.md")
          print("  short_03.md")
          print("  batch.json")
          print("")
          print("========================================")

          PY

      - name: Upload generated Shorts package
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts
          path: quiet-vault-output/
          retention-days: 7
