name: Quiet Vault AI - Candidate Judge Finalize

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate, filter, judge and finalize
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat > generate.py <<'PY'
          import os
          import json
          import re
          import urllib.request
          import urllib.error

          API_KEY = os.environ["GROQ_API_KEY"]
          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          def call_groq(messages, schema_name, schema, temperature=0.8, max_tokens=12000):
              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": schema_name,
                          "strict": True,
                          "schema": schema
                      }
                  }
              }

              data = json.dumps(payload).encode("utf-8")

              request = urllib.request.Request(
                  ENDPOINT,
                  data=data,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {API_KEY}",
                      "User-Agent": "QuietVaultAI/1.0"
                  }
              )

              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      body = response.read().decode("utf-8")
                      result = json.loads(body)
                      content = result["choices"][0]["message"]["content"]
                      return json.loads(content)

              except urllib.error.HTTPError as e:
                  error_body = e.read().decode("utf-8", errors="replace")
                  print("Groq HTTP ERROR:", e.code)
                  print(error_body)
                  raise

          # ------------------------------------------------------------
          # STAGE 1: GENERATE CANDIDATES
          # ------------------------------------------------------------

          candidate_schema = {
              "type": "object",
              "properties": {
                  "candidates": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id": {"type": "integer"},
                              "title": {"type": "string"},
                              "premise": {"type": "string"},
                              "static_frame_1": {"type": "string"},
                              "visual_anomaly": {"type": "string"},
                              "escalation": {"type": "string"},
                              "ending": {"type": "string"},
                              "relationship_context": {"type": "string"},
                              "flow_feasibility": {"type": "string"}
                          },
                          "required": [
                              "id",
                              "title",
                              "premise",
                              "static_frame_1",
                              "visual_anomaly",
                              "escalation",
                              "ending",
                              "relationship_context",
                              "flow_feasibility"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": ["candidates"],
              "additionalProperties": False
          }

          generator_system = """
          You are the concept generator for The Quiet Vault, a realistic cinematic horror
          Shorts channel.

          Generate 12 genuinely different horror concepts.

          TARGET FORMAT:
          - 9 to 12 second YouTube Short
          - photorealistic live-action
          - fictional adult characters
          - recognizable everyday locations
          - simple visual storytelling
          - visible human-centered threat or contradiction
          - strong first frame
          - very little dialogue
          - clear ending
          - suitable for Google Flow video generation

          THE MOST IMPORTANT RULE:

          The FIRST FRAME must already contain something visually wrong, threatening,
          impossible or deeply unsettling.

          Imagine pausing the video at frame 1 and showing the screenshot to someone.
          They should be able to point at something in the image and say:
          "That should not be happening."

          GOOD EXAMPLE:
          "A woman is sitting alone in her bedroom while the locked bedroom door
          behind her is visibly being pushed inward by an adult hand."

          BAD EXAMPLE:
          "A woman is sitting in her bedroom and something scary happens later."

          Another good example:
          "A man is washing his hands in a public restroom while another adult man
          is visibly standing inside the locked stall facing the wall."

          The anomaly must be visually obvious.

          PRIORITIZE:
          - family or relationship situations involving adults
          - parent/adult child relationships
          - husband/wife
          - siblings
          - coworkers
          - friends
          - ordinary human behavior that is subtly wrong
          - someone being somewhere they should not be
          - a locked/open contradiction
          - an ordinary action happening incorrectly
          - a person reacting to a visible anomaly
          - emotionally understandable situations

          DO NOT USE:
          - elevators
          - cars
          - hotels
          - CCTV/security-camera concepts
          - mirrors
          - reflections
          - doppelgangers
          - people hiding behind other people
          - printers
          - moving empty chairs
          - trains
          - floating household objects
          - household objects with faces
          - possessed objects
          - random body parts
          - ghosts
          - demons
          - monsters
          - zombies
          - giant creatures
          - gore
          - complicated transformations
          - impossible anatomy
          - disappearing/reappearing people
          - head distortion
          - elaborate supernatural mythology
          - long conversations
          - text on paper/screens as the main horror
          - "it was actually me" twists unless the visual logic is extremely clear

          Do not recycle the same mechanism across concepts.

          Every candidate must be substantially different from the others.

          For STATIC_FRAME_1, describe only what is visibly present in the first
          frame, as if describing a paused photograph to a cinematographer.

          Do not say "something is wrong" without explaining exactly what is visible.

          The final ending should create a second realization, not merely:
          "the character screams."

          All characters must be fictional adults. No children.
          """

          generator_user = """
          Create 12 candidate concepts for The Quiet Vault.

          Make the ideas realistic enough that the viewer could initially believe
          the scene is happening in a real apartment, house, office, hospital,
          bathroom, classroom, hallway, store, parking area, workplace, etc.

          Each candidate must work visually in approximately 9-12 seconds.
          """

          candidates_data = call_groq(
              [
                  {"role": "system", "content": generator_system},
                  {"role": "user", "content": generator_user}
              ],
              "quiet_vault_candidates",
              candidate_schema,
              temperature=0.9,
              max_tokens=10000
          )

          candidates = candidates_data["candidates"]

          print(f"Generated {len(candidates)} candidates.")

          # ------------------------------------------------------------
          # STAGE 2: PYTHON HARD FILTER
          # ------------------------------------------------------------

          banned_terms = [
              "elevator",
              "car",
              "hotel",
              "cctv",
              "security camera",
              "mirror",
              "reflection",
              "doppelganger",
              "double of",
              "behind her",
              "behind him",
              "printer",
              "empty chair",
              "train",
              "floating mug",
              "floating cup",
              "cereal box",
              "object with a face",
              "face on the object",
              "possessed object",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "giant creature",
              "gore",
              "decapitat",
              "head spins",
              "head turns 180",
              "disappears",
              "disappearing",
              "reappears",
              "reappearing",
              "teleport",
              "teleports",
              "limbs grow",
              "body part",
              "random hand",
              "floating",
              "child",
              "children",
              "kid",
              "boy",
              "girl",
              "baby"
          ]

          weak_hook_phrases = [
              "standing in an ordinary",
              "sitting in an ordinary",
              "a normal",
              "normal bedroom",
              "normal kitchen",
              "normal office",
              "ordinary bedroom",
              "ordinary kitchen",
              "ordinary office",
              "nothing seems wrong",
              "at first everything",
              "the scene looks normal",
              "later",
              "eventually something",
              "then something scary",
              "something strange happens"
          ]

          def normalize(text):
              return re.sub(r"\s+", " ", text.lower()).strip()

          def hard_reject(candidate):
              combined = " ".join([
                  candidate.get("title", ""),
                  candidate.get("premise", ""),
                  candidate.get("static_frame_1", ""),
                  candidate.get("visual_anomaly", ""),
                  candidate.get("escalation", ""),
                  candidate.get("ending", "")
              ])

              text = normalize(combined)
              frame = normalize(candidate.get("static_frame_1", ""))

              # Banned mechanisms
              for term in banned_terms:
                  if term in text:
                      return True, f"banned mechanism: {term}"

              # Frame must be concrete
              if len(frame.split()) < 12:
                  return True, "frame-1 description too short"

              # Reject descriptions that explicitly defer the hook
              for phrase in weak_hook_phrases:
                  if phrase in frame:
                      return True, f"weak frame wording: {phrase}"

              # Frame should contain some concrete visual relationship/action.
              visual_words = [
                  "door", "person", "man", "woman", "hand", "room",
                  "standing", "sitting", "opening", "closed", "locked",
                  "window", "bed", "desk", "hallway", "bathroom",
                  "kitchen", "office", "hospital", "stairs", "hall",
                  "floor", "chair", "phone", "bag", "coat", "shower",
                  "sink", "closet", "gate", "store"
              ]

              visual_count = sum(1 for word in visual_words if word in frame)

              if visual_count < 2:
                  return True, "frame lacks concrete visual information"

              return False, "passed"

          survivors = []
          rejected = []

          for candidate in candidates:
              reject, reason = hard_reject(candidate)

              if reject:
                  rejected.append({
                      "id": candidate.get("id"),
                      "title": candidate.get("title"),
                      "reason": reason
                  })
              else:
                  survivors.append(candidate)

          print(f"Hard filter survivors: {len(survivors)}")
          print(f"Hard filter rejected: {len(rejected)}")

          for item in rejected:
              print(f"REJECTED {item['id']}: {item['title']} -> {item['reason']}")

          if len(survivors) < 3:
              raise RuntimeError(
                  f"Only {len(survivors)} candidates survived hard filtering. "
                  "Need at least 3."
              )

          # ------------------------------------------------------------
          # STAGE 3: AI CREATIVE JUDGE
          # ------------------------------------------------------------

          judge_schema = {
              "type": "object",
              "properties": {
                  "ranked_candidates": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id": {"type": "integer"},
                              "frame_hook_score": {"type": "integer"},
                              "visual_clarity_score": {"type": "integer"},
                              "ending_score": {"type": "integer"},
                              "flow_feasibility_score": {"type": "integer"},
                              "originality_score": {"type": "integer"},
                              "rewatch_score": {"type": "integer"},
                              "overall_score": {"type": "integer"},
                              "pass": {"type": "boolean"},
                              "reason": {"type": "string"}
                          },
                          "required": [
                              "id",
                              "frame_hook_score",
                              "visual_clarity_score",
                              "ending_score",
                              "flow_feasibility_score",
                              "originality_score",
                              "rewatch_score",
                              "overall_score",
                              "pass",
                              "reason"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": ["ranked_candidates"],
              "additionalProperties": False
          }

          judge_prompt = """
          You are the strict creative director for The Quiet Vault.

          Judge these horror Short concepts.

          SCORE EACH FROM 1 TO 10:

          1. FRAME HOOK
          Does the FIRST FRAME itself show a compelling anomaly or threat?
          If the first frame could be mistaken for a completely normal scene,
          score it low.

          2. VISUAL CLARITY
          Can the viewer understand what is wrong without reading text or hearing
          a long explanation?

          3. ENDING
          Does the ending create a second realization or disturbing payoff?

          4. FLOW FEASIBILITY
          Could Google Flow realistically generate the scene in a coherent
          9-12 second live-action clip?

          5. ORIGINALITY
          Does it avoid mechanisms already heavily used in short-form horror?

          6. REWATCH
          Would viewers want to replay the clip to understand the visual clue
          or ending?

          OVERALL SCORE:
          Judge the complete concept, but give strong weight to frame hook,
          clarity and ending.

          PASS REQUIREMENTS:
          - frame hook >= 7
          - visual clarity >= 7
          - ending >= 7
          - flow feasibility >= 7
          - originality >= 6
          - rewatch >= 6
          - overall >= 7

          Be harsh.

          Do not pass a concept simply because the premise sounds creepy.
          A good written horror idea with a weak first frame is a failure
          for this channel.

          Return the candidates sorted from strongest to weakest.
          """

          judge_user = json.dumps(
              {"candidates": survivors},
              ensure_ascii=False
          )

          judged_data = call_groq(
              [
                  {"role": "system", "content": judge_prompt},
                  {"role": "user", "content": judge_user}
              ],
              "quiet_vault_judgement",
              judge_schema,
              temperature=0.35,
              max_tokens=10000
          )

          ranked = judged_data["ranked_candidates"]

          passed = [x for x in ranked if x["pass"]]

          print(f"AI judge passed: {len(passed)}")

          if len(passed) < 3:
              # If fewer than 3 explicitly pass, take the strongest 3,
              # but only after the hard filter.
              passed = ranked[:3]
              print("Fewer than 3 explicit passes; using top 3 judge-ranked survivors.")

          top_ids = [x["id"] for x in passed[:5]]

          candidate_map = {
              c["id"]: c
              for c in survivors
          }

          finalists = [
              candidate_map[i]
              for i in top_ids
              if i in candidate_map
          ]

          if len(finalists) < 3:
              raise RuntimeError("Could not construct at least 3 finalists.")

          print("FINALISTS:")
          for f in finalists:
              print(f"- {f['id']}: {f['title']}")

          # ------------------------------------------------------------
          # STAGE 4: FINAL PACKAGE WRITER
          # ------------------------------------------------------------

          final_schema = {
              "type": "object",
              "properties": {
                  "shorts": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id": {"type": "integer"},
                              "title": {"type": "string"},
                              "short_script": {"type": "string"},
                              "visual_hook": {"type": "string"},
                              "flow_prompt": {"type": "string"},
                              "final_twist": {"type": "string"},
                              "description": {"type": "string"},
                              "keywords": {"type": "string"},
                              "hashtags": {"type": "string"},
                              "thumbnail_frame": {"type": "string"},
                              "thumbnail_text": {"type": "string"}
                          },
                          "required": [
                              "id",
                              "title",
                              "short_script",
                              "visual_hook",
                              "flow_prompt",
                              "final_twist",
                              "description",
                              "keywords",
                              "hashtags",
                              "thumbnail_frame",
                              "thumbnail_text"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": ["shorts"],
              "additionalProperties": False
          }

          final_system = """
          You are the final writer for The Quiet Vault.

          Turn the selected concepts into complete YouTube Shorts packages.

          IMPORTANT:
          The first frame is the most important frame.

          The Google Flow prompt MUST describe the exact first frame clearly
          enough that the generated video begins with the visual anomaly.

          Do NOT start with:
          - establishing shots
          - empty rooms
          - characters walking into rooms
          - normal-looking scenes
          - slow camera reveals

          The viewer should see the disturbing visual immediately.

          FORMAT:
          - 9-12 seconds
          - vertical 9:16
          - photorealistic live-action
          - fictional adults only
          - realistic cinematic lighting
          - natural human movement
          - no celebrity likeness
          - no real-person likeness
          - no gore
          - no monsters
          - no ghosts
          - no complicated CGI

          FLOW PROMPT REQUIREMENTS:

          Write ONE complete Google Flow prompt ready to paste.

          Include:
          1. vertical 9:16
          2. photorealistic live-action
          3. fictional adult characters
          4. exact character appearance consistency
          5. exact location
          6. camera framing
          7. exact FIRST FRAME
          8. timed action beats
          9. final reveal
          10. hard cut or loop-friendly ending

          The first frame must match STATIC_FRAME_1 from the selected concept.

          Do not replace the selected concept with another mechanism.

          SCRIPT:
          Keep narration/dialogue extremely short.
          Visual storytelling should carry the Short.

          DESCRIPTION:
          Natural YouTube description. Do not keyword-stuff.

          KEYWORDS:
          Comma-separated relevant search terms.

          HASHTAGS:
          Keep compact and relevant.

          THUMBNAIL:
          Choose the strongest single frame from the video and specify
          approximately when it occurs.

          Thumbnail text should be short or empty.
          """

          final_user = json.dumps(
              {"selected_finalists": finalists},
              ensure_ascii=False
          )

          final_data = call_groq(
              [
                  {"role": "system", "content": final_system},
                  {"role": "user", "content": final_user}
              ],
              "quiet_vault_final_shorts",
              final_schema,
              temperature=0.75,
              max_tokens=14000
          )

          shorts = final_data["shorts"][:3]

          if len(shorts) != 3:
              raise RuntimeError(
                  f"Final writer returned {len(shorts)} Shorts instead of 3."
              )

          # ------------------------------------------------------------
          # SAVE OUTPUT
          # ------------------------------------------------------------

          os.makedirs("quiet-vault-output", exist_ok=True)

          with open(
              "quiet-vault-output/batch.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  {
                      "generated_candidates": candidates,
                      "hard_filter_rejected": rejected,
                      "hard_filter_survivors": survivors,
                      "ai_judgement": ranked,
                      "final_shorts": shorts
                  },
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          for index, short in enumerate(shorts, start=1):

              markdown = f"""# {short['title']}

          ## Script

          {short['short_script']}

          ## Visual Hook

          {short['visual_hook']}

          ## Google Flow Prompt

          {short['flow_prompt']}

          ## Final Twist

          {short['final_twist']}

          ## Description

          {short['description']}

          ## Keywords

          {short['keywords']}

          ## Hashtags

          {short['hashtags']}

          ## Thumbnail

          Frame: {short['thumbnail_frame']}

          Text: {short['thumbnail_text']}
          """

              with open(
                  f"quiet-vault-output/short_{index:02d}.md",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(markdown)

          print("")
          print("==========================================")
          print("QUIET VAULT AI PIPELINE SUCCESS")
          print("==========================================")
          print(f"Candidates generated: {len(candidates)}")
          print(f"Hard-filter survivors: {len(survivors)}")
          print(f"AI finalists: {len(finalists)}")
          print(f"Final Shorts: {len(shorts)}")
          print("==========================================")

          for i, short in enumerate(shorts, start=1):
              print(f"{i}. {short['title']}")

          PY

          python generate.py

      - name: Upload Quiet Vault output
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts
          path: quiet-vault-output/
          retention-days: 7
