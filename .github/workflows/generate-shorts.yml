name: Quiet Vault AI - Evidence Based Generator

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:

      - name: Generate evidence-based Quiet Vault Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |

          cat > generate.py <<'PY'

          import os
          import json
          import re
          import time
          import urllib.request
          import urllib.error


          # ============================================================
          # CONFIG
          # ============================================================

          API_KEY = os.environ["GROQ_API_KEY"]

          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"

          MODEL = "openai/gpt-oss-20b"


          # ============================================================
          # GROQ
          # ============================================================

          def groq_request(
              messages,
              schema_name,
              schema=None,
              temperature=0.7,
              max_tokens=4000,
              strict=False,
              retries=4
          ):

              if strict:

                  response_format = {
                      "type": "json_schema",
                      "json_schema": {
                          "name": schema_name,
                          "strict": True,
                          "schema": schema
                      }
                  }

              else:

                  response_format = {
                      "type": "json_object"
                  }


              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden",
                  "response_format": response_format
              }


              data = json.dumps(payload).encode("utf-8")


              for attempt in range(retries):

                  request = urllib.request.Request(
                      ENDPOINT,
                      data=data,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      }
                  )


                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          body = response.read().decode("utf-8")

                          result = json.loads(body)

                          content = result["choices"][0]["message"]["content"]

                          content = content.strip()


                          if content.startswith("```"):

                              content = re.sub(
                                  r"^```(?:json)?\s*",
                                  "",
                                  content,
                                  flags=re.I
                              )

                              content = re.sub(
                                  r"\s*```$",
                                  "",
                                  content
                              )


                          return json.loads(content)


                  except urllib.error.HTTPError as e:

                      error_body = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )


                      print("")
                      print("==========================================")
                      print("GROQ ERROR")
                      print("HTTP:", e.code)
                      print(error_body)
                      print("==========================================")


                      if e.code == 429 and attempt < retries - 1:

                          retry_seconds = 65


                          match = re.search(
                              r"retry-after[^0-9]*([0-9]+)",
                              error_body,
                              re.I
                          )


                          if match:

                              retry_seconds = max(
                                  65,
                                  int(match.group(1)) + 5
                              )


                          print(
                              f"Rate limited. Waiting {retry_seconds} seconds..."
                          )

                          time.sleep(retry_seconds)

                          continue


                      raise RuntimeError(
                          f"Groq returned HTTP {e.code}"
                      )


                  except json.JSONDecodeError as e:

                      print("")
                      print("==========================================")
                      print("INVALID JSON FROM GROQ")
                      print("==========================================")

                      print(str(e))

                      raise RuntimeError(
                          "Groq returned invalid JSON."
                      )


          # ============================================================
          # QUIET VAULT CREATIVE DNA
          # ============================================================

          CREATIVE_DNA = """

          THE QUIET VAULT

          Create realistic, cinematic horror Shorts.

          Target length: 9-12 seconds.

          Fictional adults only.

          ============================================================
          OUR REAL PERFORMANCE LESSON
          ============================================================

          The biggest weakness identified in our previous Shorts was not
          necessarily replayability.

          Several Shorts achieved strong average percentage viewed,
          meaning people who stayed often watched again.

          The bigger problem was getting people to STOP SCROLLING.

          Therefore:

          THE FIRST VISUAL IS THE MOST IMPORTANT PART.

          The viewer should see something wrong immediately.

          ============================================================
          WINNING STRUCTURE
          ============================================================

          VISIBLE WRONG THING

          +

          SIMPLE CONTRADICTION

          +

          SECOND REALIZATION

          +

          HARD CUT

          ============================================================
          FIRST FRAME
          ============================================================

          Imagine the video is paused on frame 1.

          Remove all:

          audio
          narration
          subtitles
          context

          The image itself must create a question.

          Good examples:

          An unfamiliar adult is already sitting inside someone's bedroom.

          A stranger is visibly holding a dead person's personal object.

          A stranger is already inside a locked/private workplace.

          A stranger is performing an intimate household routine that they
          should not know.

          A stranger is calmly occupying a place they obviously should not be.

          Two adults are visibly confronting a third adult who should not
          exist in that situation.

          ============================================================
          BAD OPENINGS
          ============================================================

          Do NOT use:

          someone walking into the scene

          someone opening a door

          empty room

          dark hallway

          person looking scared

          ordinary dinner

          person looking at a phone

          phone screen

          text message

          mysterious object by itself

          atmospheric shot

          ============================================================
          THE HORROR MUST BE VISIBLE
          ============================================================

          Prefer visible adult human situations.

          A stranger physically present.

          A stranger physically holding something.

          A stranger physically doing something.

          A stranger physically occupying somewhere.

          Do not rely entirely on:

          sounds

          narration

          unseen entities

          text

          phone calls

          ============================================================
          SIMPLE CONTRADICTION
          ============================================================

          The contradiction should be understandable in one sentence.

          GOOD:

          "That key belonged to my husband, who died three years ago."

          "I never gave you a key."

          "You were not here last night."

          BAD:

          complicated mythology

          unexplained time travel

          multiple supernatural rules

          elaborate backstory

          ============================================================
          SECOND REALIZATION
          ============================================================

          The ending should add one more disturbing fact.

          It should NOT merely say:

          "It was a ghost."

          Instead:

          The stranger knows something private.

          The stranger possesses something impossible.

          The stranger reveals they were there earlier.

          The stranger knows something they could only know by being present.

          ============================================================
          RELATIONSHIPS
          ============================================================

          Prefer:

          husband/wife

          adult siblings

          brother/sister

          close friends

          roommates

          colleagues

          neighbors

          ex-partners

          ============================================================
          GOOGLE FLOW
          ============================================================

          Keep it easy to generate.

          2-3 adults.

          One location.

          Simple physical actions.

          Realistic faces.

          Realistic lighting.

          No complicated visual effects.

          ============================================================
          HARD BANS
          ============================================================

          children

          minors

          babies

          teenagers

          mirrors

          reflections

          doppelgängers

          twins

          CCTV

          elevators

          hotels

          trains

          printers

          phone-screen horror

          video-call horror

          empty-chair horror

          disappearing people

          reappearing people

          monsters

          demons

          zombies

          ghosts as the explanation

          gore

          blood

          face distortion

          body transformation

          complicated CGI

          celebrity likeness

          real-person likeness

          ============================================================
          """


          # ============================================================
          # MECHANISM LIBRARY
          # ============================================================

          MECHANISMS = [

              {
                  "id": 1,
                  "name": "WRONG ACCESS",
                  "rule":
                  "An unfamiliar adult is already inside a private or locked "
                  "place using something that should belong to the protagonist."
              },

              {
                  "id": 2,
                  "name": "DEAD PERSON'S OBJECT",
                  "rule":
                  "A stranger visibly possesses an ordinary personal object "
                  "belonging to someone the protagonist knows is dead."
              },

              {
                  "id": 3,
                  "name": "IMPOSSIBLE VISIT",
                  "rule":
                  "A stranger is already inside a familiar location and claims "
                  "they visited earlier when access was impossible."
              },

              {
                  "id": 4,
                  "name": "PRIVATE MEMORY",
                  "rule":
                  "An unfamiliar adult reveals one very specific private event "
                  "that only someone present could know."
              },

              {
                  "id": 5,
                  "name": "WRONG OWNER",
                  "rule":
                  "A stranger confidently claims a deeply personal possession "
                  "and knows a detail proving unusual familiarity."
              },

              {
                  "id": 6,
                  "name": "WRONG ROOM",
                  "rule":
                  "An adult is already inside a private room or workplace where "
                  "they have no legitimate reason to be."
              },

              {
                  "id": 7,
                  "name": "IMPOSSIBLE INSTRUCTION",
                  "rule":
                  "An adult performs a specific ordinary action because someone "
                  "who could not communicate with them supposedly instructed it."
              },

              {
                  "id": 8,
                  "name": "UNWELCOME GUEST",
                  "rule":
                  "A stranger is already comfortably inside a familiar home "
                  "and behaves as though the household expected them."
              },

              {
                  "id": 9,
                  "name": "IMPOSSIBLE RELATIONSHIP",
                  "rule":
                  "A stranger claims a close personal relationship that the "
                  "protagonist knows cannot exist."
              },

              {
                  "id": 10,
                  "name": "CONTRADICTORY CONVERSATION",
                  "rule":
                  "One adult refers to a private conversation that supposedly "
                  "happened while the other adult was physically elsewhere."
              },

              {
                  "id": 11,
                  "name": "IMPOSSIBLE DELIVERY",
                  "rule":
                  "An adult delivers an ordinary item while claiming someone "
                  "ordered it even though that person could not have done so."
              },

              {
                  "id": 12,
                  "name": "WRONG TIME",
                  "rule":
                  "A stranger knows they were physically present at a location "
                  "at a time when access was impossible."
              },

              {
                  "id": 13,
                  "name": "FUTURE WARNING",
                  "rule":
                  "A stranger gives a specific warning about an event that "
                  "has not happened yet."
              },

              {
                  "id": 14,
                  "name": "PRIVATE NAME",
                  "rule":
                  "A stranger addresses the protagonist using an extremely "
                  "private nickname almost nobody knows."
              },

              {
                  "id": 15,
                  "name": "FAMILIAR ROUTINE",
                  "rule":
                  "A stranger performs a highly personal household routine "
                  "belonging to someone close to the protagonist."
              },

              {
                  "id": 16,
                  "name": "OTHER WITNESS",
                  "rule":
                  "A stranger describes an event that supposedly happened while "
                  "the protagonist was alone with another adult."
              },

              {
                  "id": 17,
                  "name": "WRONG DESTINATION",
                  "rule":
                  "A stranger arrives somewhere and says the protagonist "
                  "personally sent them there."
              },

              {
                  "id": 18,
                  "name": "IMPOSSIBLE FAMILIARITY",
                  "rule":
                  "A stranger moves around a home as if they have lived there "
                  "before, knowing where personal things are kept."
              },

              {
                  "id": 19,
                  "name": "PRIVATE PHYSICAL DETAIL",
                  "rule":
                  "A stranger knows a concealed physical detail about the "
                  "home or workplace that nobody should know."
              },

              {
                  "id": 20,
                  "name": "CALM INTRUDER",
                  "rule":
                  "A visibly misplaced adult intruder behaves completely calmly "
                  "and treats the frightened homeowner as though the homeowner "
                  "is the strange one."
              }

          ]


          # ============================================================
          # STAGE 1 SCHEMA
          # ============================================================

          candidate_schema = {

              "type": "object",

              "properties": {

                  "candidates": {

                      "type": "array",

                      "items": {

                          "type": "object",

                          "properties": {

                              "id": {
                                  "type": "integer"
                              },

                              "mechanism_id": {
                                  "type": "integer"
                              },

                              "title": {
                                  "type": "string"
                              },

                              "premise": {
                                  "type": "string"
                              },

                              "static_frame_1": {
                                  "type": "string"
                              },

                              "ending": {
                                  "type": "string"
                              }

                          },

                          "required": [

                              "id",
                              "mechanism_id",
                              "title",
                              "premise",
                              "static_frame_1",
                              "ending"

                          ],

                          "additionalProperties": False
                      }
                  }
              },

              "required": [
                  "candidates"
              ],

              "additionalProperties": False
          }


          # ============================================================
          # STAGE 1 — GENERATE
          # ============================================================

          candidate_prompt = f"""

          You are the concept architect for The Quiet Vault.

          {CREATIVE_DNA}

          Generate EXACTLY 10 concepts.

          Each concept must use a DIFFERENT mechanism.

          MECHANISM LIBRARY:

          {json.dumps(MECHANISMS, indent=2)}

          ============================================================
          IMPORTANT
          ============================================================

          These are NOT finished scripts.

          Think visually.

          Every concept needs:

          1. A strong static first frame.

          2. A visible adult human threat or disturbing adult situation.

          3. One simple contradiction.

          4. A second realization in the ending.

          ============================================================
          STATIC FRAME
          ============================================================

          Describe what the viewer sees in a frozen frame.

          DO NOT describe an action that happens later.

          BAD:

          "A woman opens the door and sees a stranger."

          GOOD:

          "A woman stands in her bedroom doorway while an unfamiliar adult "
          "man is already sitting on her bed holding her house keys."

          ============================================================
          DO NOT CHEAT
          ============================================================

          Do not make the horror depend on:

          tiny text

          dates

          phone screens

          reflections

          narration

          sound

          unseen entities

          complicated supernatural explanations

          ============================================================
          RETURN JSON ONLY
          ============================================================

          {{
            "candidates": [
              {{
                "id": 1,
                "mechanism_id": 1,
                "title": "...",
                "premise": "...",
                "static_frame_1": "...",
                "ending": "..."
              }}
            ]
          }}
          """


          generated = groq_request(

              [

                  {
                      "role": "system",
                      "content":
                      "You are a visual horror concept architect. "
                      "Return valid JSON only."
                  },

                  {
                      "role": "user",
                      "content":
                      candidate_prompt
                  }

              ],

              "quiet_vault_candidates",

              None,

              0.80,

              5000,

              False
          )


          candidates = generated.get(
              "candidates",
              []
          )


          print("")
          print("==========================================")
          print("CANDIDATE GENERATION")
          print("==========================================")
          print(
              "Candidates returned:",
              len(candidates)
          )


          if len(candidates) < 8:

              raise RuntimeError(
                  f"Only {len(candidates)} candidates returned."
              )


          candidates = candidates[:10]


          # ============================================================
          # SIMPLE STRUCTURAL VALIDATION
          # ============================================================

          required_fields = [

              "id",
              "mechanism_id",
              "title",
              "premise",
              "static_frame_1",
              "ending"

          ]


          valid_candidates = []


          for candidate in candidates:

              if not isinstance(
                  candidate,
                  dict
              ):

                  continue


              if all(
                  field in candidate
                  for field in required_fields
              ):

                  valid_candidates.append(
                      candidate
                  )


          candidates = valid_candidates


          if len(candidates) < 8:

              raise RuntimeError(
                  "Too few structurally valid candidates."
              )


          # ============================================================
          # HARD BAN FILTER
          #
          # IMPORTANT:
          # No subjective quality decisions happen here.
          # ============================================================

          banned_terms = [

              "mirror",
              "reflection",
              "doppelganger",
              "doppelgänger",
              "twin",
              "cctv",
              "elevator",
              "hotel",
              "train",
              "printer",
              "empty chair",
              "video call",
              "video-call",
              "phone screen",
              "phone-screen",
              "ghost",
              "demon",
              "zombie",
              "monster",
              "gore",
              "blood",
              "face distortion",
              "body transformation",
              "disappear",
              "disappears",
              "reappears",
              "child",
              "children",
              "kid",
              "baby",
              "teenager",
              "teen",
              "minor"
          ]


          def find_banned(candidate):

              text = " ".join([

                  str(candidate.get("title", "")),
                  str(candidate.get("premise", "")),
                  str(candidate.get("static_frame_1", "")),
                  str(candidate.get("ending", ""))

              ]).lower()


              for term in banned_terms:

                  if re.search(
                      r"\b" +
                      re.escape(term) +
                      r"\b",
                      text
                  ):

                      return term


              return None


          survivors = []

          rejected = []


          for candidate in candidates:

              banned = find_banned(
                  candidate
              )


              if banned:

                  rejected.append({

                      "id":
                      candidate["id"],

                      "title":
                      candidate["title"],

                      "reason":
                      "banned mechanism: " + banned

                  })

                  continue


              survivors.append(
                  candidate
              )


          print("")
          print("==========================================")
          print("SIMPLE HARD FILTER")
          print("==========================================")

          print(
              "Survivors:",
              len(survivors)
          )

          print(
              "Rejected:",
              len(rejected)
          )


          for item in rejected:

              print(

                  "REJECTED:",
                  item["id"],
                  item["title"],
                  "->",
                  item["reason"]

              )


          if len(survivors) < 5:

              raise RuntimeError(
                  "Fewer than 5 concepts survived banned-mechanism filter."
              )


          # ============================================================
          # WAIT FOR GROQ
          # ============================================================

          print("")
          print(
              "Waiting 65 seconds before creative judging..."
          )

          time.sleep(65)


          # ============================================================
          # STAGE 2 — CREATIVE JUDGE
          # ============================================================

          judge_schema = {

              "type": "object",

              "properties": {

                  "judgements": {

                      "type": "array",

                      "items": {

                          "type": "object",

                          "properties": {

                              "id": {
                                  "type": "integer"
                              },

                              "hook": {
                                  "type": "integer"
                              },

                              "visible_horror": {
                                  "type": "integer"
                              },

                              "clarity": {
                                  "type": "integer"
                              },

                              "ending": {
                                  "type": "integer"
                              },

                              "flow": {
                                  "type": "integer"
                              },

                              "rewatch": {
                                  "type": "integer"
                              },

                              "originality": {
                                  "type": "integer"
                              },

                              "pass": {
                                  "type": "boolean"
                              },

                              "reason": {
                                  "type": "string"
                              }

                          },

                          "required": [

                              "id",
                              "hook",
                              "visible_horror",
                              "clarity",
                              "ending",
                              "flow",
                              "rewatch",
                              "originality",
                              "pass",
                              "reason"

                          ],

                          "additionalProperties": False
                      }
                  }
              },

              "required": [
                  "judgements"
              ],

              "additionalProperties": False
          }


          judge_prompt = f"""

          You are the STRICT CREATIVE DIRECTOR for The Quiet Vault.

          {CREATIVE_DNA}

          Judge every concept below.

          Do NOT judge the wording of individual fields.

          Judge the ACTUAL VIDEO IDEA.

          ============================================================
          1. HOOK
          ============================================================

          Look at static_frame_1.

          Imagine it frozen with no sound.

          Score:

          10 = immediately disturbing

          9 = extremely clear visual problem

          8 = clearly wrong and scroll-stopping

          7 = interesting but needs context

          6 or below = weak

          Minimum PASS: 8.

          ============================================================
          2. VISIBLE HORROR
          ============================================================

          Is there an actual disturbing adult situation visible?

          Good:

          stranger already inside

          adult holding impossible personal object

          adult occupying forbidden/private location

          adult performing impossible familiar behavior

          Bad:

          empty room

          mysterious object alone

          person looking scared

          unseen presence

          sound-only horror

          Minimum PASS: 8.

          ============================================================
          3. CLARITY
          ============================================================

          Can a viewer understand the basic problem almost immediately?

          Minimum PASS: 8.

          ============================================================
          4. ENDING
          ============================================================

          Does the ending create a SECOND realization?

          It must add information.

          It must not simply explain:

          "It was a ghost."

          Minimum PASS: 8.

          ============================================================
          5. GOOGLE FLOW
          ============================================================

          Can this realistically be generated?

          Prefer:

          2-3 adults

          one location

          simple movements

          realistic faces

          realistic lighting

          Minimum PASS: 8.

          ============================================================
          6. REWATCH
          ============================================================

          Does replay potentially reveal another clue?

          Minimum PASS: 7.

          ============================================================
          7. ORIGINALITY
          ============================================================

          Does it avoid the recent failed Quiet Vault mechanisms?

          Avoid:

          reflections

          mirrors

          empty chairs

          phone calls

          CCTV

          diary puzzles

          office paperwork puzzles

          generic mysterious objects

          generic date/timestamp puzzles

          doppelgängers

          Minimum PASS: 7.

          ============================================================
          FINAL PASS
          ============================================================

          PASS ONLY IF ALL minimums are met.

          Do not pass a concept because the premise sounds clever.

          A visually weak concept MUST FAIL.

          Return ONLY JSON.

          CANDIDATES:

          {json.dumps(
              survivors,
              indent=2,
              ensure_ascii=False
          )}
          """


          judged = groq_request(

              [

                  {
                      "role": "system",
                      "content":
                      "You are a ruthless horror Shorts creative director."
                  },

                  {
                      "role": "user",
                      "content":
                      judge_prompt
                  }

              ],

              "quiet_vault_creative_judge",

              judge_schema,

              0.20,

              5000,

              True
          )


          judgements = judged.get(
              "judgements",
              []
          )


          judgement_map = {

              item["id"]:
              item

              for item in judgements

          }


          finalists = []


          for candidate in survivors:

              judgment = judgement_map.get(
                  candidate["id"]
              )


              if judgment and judgment["pass"]:

                  finalists.append(
                      candidate
                  )


          # ============================================================
          # RANK
          # ============================================================

          def score(candidate):

              j = judgement_map[
                  candidate["id"]
              ]


              return (

                  j["hook"] * 4

                  + j["visible_horror"] * 4

                  + j["clarity"] * 2

                  + j["ending"] * 3

                  + j["flow"]

                  + j["rewatch"] * 2

                  + j["originality"]

              )


          finalists.sort(
              key=score,
              reverse=True
          )


          print("")
          print("==========================================")
          print("CREATIVE JUDGE RESULTS")
          print("==========================================")


          for item in judgements:

              print(

                  "ID:",
                  item["id"],

                  "| PASS:",
                  item["pass"],

                  "| Hook:",
                  item["hook"],

                  "| Horror:",
                  item["visible_horror"],

                  "| Clarity:",
                  item["clarity"],

                  "| Ending:",
                  item["ending"],

                  "| Rewatch:",
                  item["rewatch"],

                  "| Originality:",
                  item["originality"],

                  "|",
                  item["reason"]

              )


          if len(finalists) < 3:

              raise RuntimeError(

                  "Fewer than 3 concepts passed the creative gate. "
                  "Workflow stopped intentionally."

              )


          finalists = finalists[:3]


          print("")
          print("==========================================")
          print("APPROVED FINALISTS")
          print("==========================================")


          for candidate in finalists:

              print(
                  candidate["id"],
                  candidate["title"]
              )


          # ============================================================
          # WAIT
          # ============================================================

          print("")
          print(
              "Waiting 65 seconds before final writing..."
          )

          time.sleep(65)


          # ============================================================
          # FINAL SCHEMA
          # ============================================================

          final_schema = {

              "type": "object",

              "properties": {

                  "id": {
                      "type": "integer"
                  },

                  "title": {
                      "type": "string"
                  },

                  "short_script": {
                      "type": "string"
                  },

                  "visual_hook": {
                      "type": "string"
                  },

                  "flow_prompt": {
                      "type": "string"
                  },

                  "final_twist": {
                      "type": "string"
                  },

                  "description": {
                      "type": "string"
                  },

                  "keywords": {
                      "type": "string"
                  },

                  "hashtags": {
                      "type": "string"
                  },

                  "thumbnail_frame": {
                      "type": "string"
                  },

                  "thumbnail_text": {
                      "type": "string"
                  },

                  "sound_design": {
                      "type": "string"
                  },

                  "pinned_comment": {
                      "type": "string"
                  }

              },

              "required": [

                  "id",
                  "title",
                  "short_script",
                  "visual_hook",
                  "flow_prompt",
                  "final_twist",
                  "description",
                  "keywords",
                  "hashtags",
                  "thumbnail_frame",
                  "thumbnail_text",
