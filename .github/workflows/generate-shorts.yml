name: Quiet Vault AI - Candidate Judge Finalize

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate, filter, judge and finalize
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat > generate.py <<'PY'
          import os
          import json
          import re
          import urllib.request
          import urllib.error
          import time

          API_KEY = os.environ["GROQ_API_KEY"]
          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          # ============================================================
          # GROQ API HELPER
          # ============================================================

          def call_groq(messages, schema_name, schema, temperature=0.7, max_tokens=8000):

              base_payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden"
              }

              # --------------------------------------------------------
              # ATTEMPT 1: STRICT JSON SCHEMA
              # --------------------------------------------------------

              strict_payload = dict(base_payload)

              strict_payload["response_format"] = {
                  "type": "json_schema",
                  "json_schema": {
                      "name": schema_name,
                      "strict": True,
                      "schema": schema
                  }
              }

              try:
                  print("")
                  print("Trying Groq strict JSON Schema...")
                  print("")

                  data = json.dumps(strict_payload).encode("utf-8")

                  request = urllib.request.Request(
                      ENDPOINT,
                      data=data,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      }
                  )

                  with urllib.request.urlopen(request, timeout=180) as response:
                      body = response.read().decode("utf-8")
                      result = json.loads(body)
                      content = result["choices"][0]["message"]["content"]

                      print("Strict JSON Schema succeeded.")

                      return json.loads(content)

              except urllib.error.HTTPError as e:

                  error_body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("")
                  print("STRICT JSON SCHEMA FAILED")
                  print("HTTP STATUS:", e.code)
                  print("GROQ RESPONSE:")
                  print(error_body)
                  print("")

                  # Continue to JSON Object Mode below.

              except Exception as e:

                  print("")
                  print("STRICT JSON SCHEMA ERROR:")
                  print(str(e))
                  print("")

              # --------------------------------------------------------
              # ATTEMPT 2: JSON OBJECT MODE FALLBACK
              # --------------------------------------------------------

              print("Trying Groq JSON Object Mode fallback...")

              fallback_payload = dict(base_payload)

              fallback_payload["response_format"] = {
                  "type": "json_object"
              }

              fallback_data = json.dumps(
                  fallback_payload
              ).encode("utf-8")

              fallback_request = urllib.request.Request(
                  ENDPOINT,
                  data=fallback_data,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {API_KEY}",
                      "User-Agent": "QuietVaultAI/1.0"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      fallback_request,
                      timeout=180
                  ) as response:

                      body = response.read().decode("utf-8")
                      result = json.loads(body)
                      content = result["choices"][0]["message"]["content"]

                      parsed = json.loads(content)

                      print("JSON Object Mode succeeded.")

                      return parsed

              except urllib.error.HTTPError as e:

                  error_body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("")
                  print("JSON OBJECT MODE ALSO FAILED")
                  print("HTTP STATUS:", e.code)
                  print("GROQ RESPONSE:")
                  print(error_body)
                  print("")

                  raise RuntimeError(
                      "Both Groq Structured Output and JSON Object Mode failed."
                  )

              except Exception as e:

                  print("")
                  print("JSON OBJECT MODE ERROR:")
                  print(str(e))
                  print("")

                  raise


          # ============================================================
          # STAGE 1 - GENERATE 12 CANDIDATES
          # ============================================================

          candidate_schema = {
              "type": "object",
              "properties": {
                  "candidates": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id": {"type": "integer"},
                              "title": {"type": "string"},
                              "premise": {"type": "string"},
                              "static_frame_1": {"type": "string"},
                              "visual_anomaly": {"type": "string"},
                              "escalation": {"type": "string"},
                              "ending": {"type": "string"},
                              "relationship_context": {"type": "string"},
                              "flow_feasibility": {"type": "string"}
                          },
                          "required": [
                              "id",
                              "title",
                              "premise",
                              "static_frame_1",
                              "visual_anomaly",
                              "escalation",
                              "ending",
                              "relationship_context",
                              "flow_feasibility"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": ["candidates"],
              "additionalProperties": False
          }

          generator_prompt = """
          You are the horror concept generator for The Quiet Vault.

          Return ONLY valid JSON matching the requested structure.

          Generate exactly 12 DIFFERENT horror concepts.

          Every concept must work as a 9-12 second vertical YouTube Short.

          STYLE:
          - photorealistic live-action
          - realistic human situations
          - fictional adults only
          - recognizable everyday locations
          - cinematic but believable
          - minimal dialogue
          - visible threat or contradiction

          MOST IMPORTANT RULE:

          THE FIRST FRAME MUST ALREADY LOOK WRONG.

          Imagine pausing the video at frame 1.

          The viewer must immediately see something disturbing.

          GOOD:

          "A woman sits on her bed while the locked bedroom door behind her
          is visibly being pushed inward by an adult hand."

          BAD:

          "A woman sits in her bedroom and something strange happens later."

          The static_frame_1 field must describe exactly what is visible
          in the paused first frame.

          DO NOT USE:

          elevators
          cars
          hotels
          CCTV
          security cameras
          mirrors
          reflections
          doppelgangers
          people hiding behind other people
          printers
          trains
          floating objects
          objects with faces
          possessed objects
          ghosts
          demons
          monsters
          zombies
          giant creatures
          gore
          disappearing people
          reappearing people
          teleportation
          impossible anatomy
          head distortion
          random body parts
          children
          babies
          minors
          complicated mythology
          long dialogue

          Prefer:

          - husband and wife
          - adult siblings
          - coworkers
          - friends
          - adult parent and adult child
          - ordinary homes
          - offices
          - bathrooms
          - hospitals
          - schools with adult staff
          - shops
          - apartment hallways
          - stairwells
          - workplaces

          Do not repeat the same horror mechanism.

          The ending should create a second realization.

          "Character screams" is NOT an ending.

          All characters are fictional adults.
          No celebrities.
          No real-person likenesses.
          """

          generator_user = """
          Generate exactly 12 candidate concepts now.

          Make every concept visually understandable without narration.

          Each candidate needs:
          id
          title
          premise
          static_frame_1
          visual_anomaly
          escalation
          ending
          relationship_context
          flow_feasibility
          """

          candidates_data = call_groq(
              [
                  {
                      "role": "user",
                      "content": generator_prompt
                      + "\n\n"
                      + generator_user
                  }
              ],
              "quiet_vault_candidates",
              candidate_schema,
              temperature=0.8,
              max_tokens=9000
          )

          candidates = candidates_data.get("candidates", [])

          if not isinstance(candidates, list):
              raise RuntimeError(
                  "Groq did not return a candidates array."
              )

          print("")
          print("==========================================")
          print("CANDIDATE GENERATION")
          print("==========================================")
          print("Generated:", len(candidates))

          if len(candidates) < 8:
              raise RuntimeError(
                  f"Only {len(candidates)} candidates generated."
              )


          # ============================================================
          # STAGE 2 - PYTHON HARD FILTER
          # ============================================================

          banned_terms = [
              "elevator",
              "car",
              "hotel",
              "cctv",
              "security camera",
              "mirror",
              "reflection",
              "doppelganger",
              "doppelgänger",
              "double of",
              "behind her",
              "behind him",
              "behind the woman",
              "behind the man",
              "printer",
              "empty chair",
              "train",
              "floating mug",
              "floating cup",
              "cereal box",
              "object with a face",
              "face on the object",
              "possessed object",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "giant creature",
              "gore",
              "decapitat",
              "head spins",
              "head turns 180",
              "disappears",
              "disappearing",
              "reappears",
              "reappearing",
              "teleport",
              "teleports",
              "random hand",
              "random body part",
              "floating hand",
              "child",
              "children",
              "kid",
              "baby",
              "minor"
          ]

          weak_hook_phrases = [
              "everything looks normal",
              "nothing seems wrong",
              "at first everything",
              "at first the scene",
              "the scene looks normal",
              "ordinary scene",
              "normal scene",
              "later something",
              "eventually something",
              "then something strange",
              "something strange happens",
              "something scary happens"
          ]

          def normalize(text):
              return re.sub(
                  r"\s+",
                  " ",
                  str(text).lower()
              ).strip()


          def hard_reject(candidate):

              frame = normalize(
                  candidate.get("static_frame_1", "")
              )

              combined = normalize(
                  " ".join(
                      str(candidate.get(field, ""))
                      for field in [
                          "title",
                          "premise",
                          "static_frame_1",
                          "visual_anomaly",
                          "escalation",
                          "ending"
                      ]
                  )
              )

              # Banned mechanisms
              for term in banned_terms:

                  if term in combined:
                      return True, "banned: " + term

              # Frame must be detailed enough
              if len(frame.split()) < 15:
                  return True, "frame too short"

              # Frame cannot defer the hook
              for phrase in weak_hook_phrases:

                  if phrase in frame:
                      return True, "weak first frame"

              # Frame needs concrete visual nouns
              visual_words = [
                  "door",
                  "person",
                  "man",
                  "woman",
                  "hand",
                  "room",
                  "bed",
                  "desk",
                  "hallway",
                  "bathroom",
                  "kitchen",
                  "office",
                  "hospital",
                  "stairs",
                  "hall",
                  "floor",
                  "window",
                  "chair",
                  "phone",
                  "bag",
                  "coat",
                  "shower",
                  "sink",
                  "closet",
                  "gate",
                  "store",
                  "counter",
                  "wall",
                  "entrance"
              ]

              visual_count = sum(
                  1
                  for word in visual_words
                  if word in frame
              )

              if visual_count < 2:
                  return True, "frame lacks visual specificity"

              return False, "passed"


          survivors = []
          rejected = []

          for candidate in candidates:

              reject, reason = hard_reject(candidate)

              if reject:

                  rejected.append(
                      {
                          "id": candidate.get("id"),
                          "title": candidate.get("title"),
                          "reason": reason
                      }
                  )

              else:

                  survivors.append(candidate)


          print("")
          print("==========================================")
          print("HARD FILTER")
          print("==========================================")
          print("Survivors:", len(survivors))
          print("Rejected:", len(rejected))

          for item in rejected:
              print(
                  "REJECTED:",
                  item["id"],
                  item["title"],
                  "->",
                  item["reason"]
              )

          if len(survivors) < 3:
              raise RuntimeError(
                  "Fewer than 3 concepts survived the hard filter."
              )


          # ============================================================
          # STAGE 3 - AI CREATIVE JUDGE
          # ============================================================

          judge_schema = {
              "type": "object",
              "properties": {
                  "ranked_candidates": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id": {"type": "integer"},
                              "frame_hook_score": {"type": "integer"},
                              "visual_clarity_score": {"type": "integer"},
                              "ending_score": {"type": "integer"},
                              "flow_feasibility_score": {"type": "integer"},
                              "originality_score": {"type": "integer"},
                              "rewatch_score": {"type": "integer"},
                              "overall_score": {"type": "integer"},
                              "pass": {"type": "boolean"},
                              "reason": {"type": "string"}
                          },
                          "required": [
                              "id",
                              "frame_hook_score",
                              "visual_clarity_score",
                              "ending_score",
                              "flow_feasibility_score",
                              "originality_score",
                              "rewatch_score",
                              "overall_score",
                              "pass",
                              "reason"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": ["ranked_candidates"],
              "additionalProperties": False
          }

          judge_prompt = """
          You are the STRICT creative director for The Quiet Vault.

          Return ONLY valid JSON.

          Judge each supplied horror concept.

          Score every concept from 1 to 10.

          FRAME HOOK:
          Does frame 1 itself show a disturbing visual?

          VISUAL CLARITY:
          Can the viewer understand the problem without explanation?

          ENDING:
          Does the ending create a second realization?

          FLOW FEASIBILITY:
          Can Google Flow realistically generate it?

          ORIGINALITY:
          Does it avoid common short-form horror mechanisms?

          REWATCH:
          Does the viewer have a reason to replay?

          PASS ONLY IF:

          frame_hook >= 7
          visual_clarity >= 7
          ending >= 7
          flow_feasibility >= 7
          originality >= 6
          rewatch >= 6
          overall >= 7

          Be harsh.

          A creepy written premise with a weak first frame must fail.

          Sort strongest to weakest.

          Return:
          id
          all six scores
          overall_score
          pass
          reason
          """

          judge_user = (
              judge_prompt
              + "\n\nCANDIDATES:\n"
              + json.dumps(
                  survivors,
                  ensure_ascii=False
              )
          )

          judged_data = call_groq(
              [
                  {
                      "role": "user",
                      "content": judge_user
                  }
              ],
              "quiet_vault_judgement",
              judge_schema,
              temperature=0.3,
              max_tokens=7000
          )

          ranked = judged_data.get(
              "ranked_candidates",
              []
          )

          if not ranked:
              raise RuntimeError(
                  "AI judge returned no candidates."
              )

          ranked = sorted(
              ranked,
              key=lambda x: x.get(
                  "overall_score",
                  0
              ),
              reverse=True
          )

          passed = [
              item
              for item in ranked
              if item.get("pass") is True
          ]

          if len(passed) < 3:

              print(
                  "Fewer than 3 explicit passes."
              )

              passed = ranked[:3]


          top_ids = [
              item["id"]
              for item in passed[:5]
          ]

          candidate_map = {
              candidate["id"]: candidate
              for candidate in survivors
          }

          finalists = [
              candidate_map[item_id]
              for item_id in top_ids
              if item_id in candidate_map
          ]

          if len(finalists) < 3:
              raise RuntimeError(
                  "Could not construct 3 finalists."
              )

          print("")
          print("==========================================")
          print("AI JUDGE")
          print("==========================================")

          for item in ranked:

              print(
                  "ID:",
                  item["id"],
                  "| Overall:",
                  item["overall_score"],
                  "| Pass:",
                  item["pass"]
              )

          print("")
          print("FINALISTS:")

          for finalist in finalists:
              print(
                  finalist["id"],
                  finalist["title"]
              )


          # ============================================================
          # STAGE 4 - FINAL SHORT PACKAGE
          # ============================================================

          final_schema = {
              "type": "object",
              "properties": {
                  "shorts": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id": {"type": "integer"},
                              "title": {"type": "string"},
                              "short_script": {"type": "string"},
                              "visual_hook": {"type": "string"},
                              "flow_prompt": {"type": "string"},
                              "final_twist": {"type": "string"},
                              "description": {"type": "string"},
                              "keywords": {"type": "string"},
                              "hashtags": {"type": "string"},
                              "thumbnail_frame": {"type": "string"},
                              "thumbnail_text": {"type": "string"}
                          },
                          "required": [
                              "id",
                              "title",
                              "short_script",
                              "visual_hook",
                              "flow_prompt",
                              "final_twist",
                              "description",
                              "keywords",
                              "hashtags",
                              "thumbnail_frame",
                              "thumbnail_text"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": ["shorts"],
              "additionalProperties": False
          }

          final_prompt = """
          You are the final writer for The Quiet Vault.

          Return ONLY valid JSON.

          Turn the selected concepts into exactly 3 complete YouTube Shorts packages.

          DO NOT invent a different concept.

          Each Short:

          - 9-12 seconds
          - vertical 9:16
          - photorealistic live action
          - fictional adults
          - realistic cinematic lighting
          - natural movement
          - no celebrity likeness
          - no real-person likeness
          - no children
          - no gore
          - no monsters
          - no ghosts
          - no mirrors
          - no reflections
          - no doppelgangers

          FIRST FRAME:

          The first frame must immediately contain the visual anomaly
          described in the selected candidate.

          Do not begin with:

          - establishing shots
          - empty rooms
          - normal scenes
          - characters entering the location
          - slow reveals

          GOOGLE FLOW PROMPT:

          Write ONE complete prompt ready to paste into Google Flow.

          Include:

          - vertical 9:16
          - photorealistic live action
          - fictional adult characters
          - character appearance consistency
          - location
          - camera framing
          - EXACT first frame
          - 0-3 second action
          - 3-6 second escalation
          - 6-9/12 second reveal
          - hard cut or loop-friendly ending
          - no text overlays
          - no subtitles unless dialogue is absolutely necessary

          SCRIPT:

          Keep dialogue extremely short.

          The visual should carry the story.

          DESCRIPTION:

          Natural YouTube description.

          KEYWORDS:

          Comma-separated.

          HASHTAGS:

          Compact and relevant.

          THUMBNAIL:

          Pick the strongest visual frame.
          """

          final_user = (
              final_prompt
              + "\n\nSELECTED FINALISTS:\n"
              + json.dumps(
                  finalists[:5],
                  ensure_ascii=False
              )
          )

          final_data = call_groq(
              [
                  {
                      "role": "user",
                      "content": final_user
                  }
              ],
              "quiet_vault_final_shorts",
              final_schema,
              temperature=0.65,
              max_tokens=12000
          )

          shorts = final_data.get(
              "shorts",
              []
          )

          if len(shorts) < 3:
              raise RuntimeError(
                  f"Final writer returned only {len(shorts)} Shorts."
              )

          shorts = shorts[:3]


          # ============================================================
          # SAVE OUTPUT
          # ============================================================

          os.makedirs(
              "quiet-vault-output",
              exist_ok=True
          )

          complete_output = {
              "generated_candidates": candidates,
              "hard_filter_rejected": rejected,
              "hard_filter_survivors": survivors,
              "ai_judgement": ranked,
              "final_shorts": shorts
          }

          with open(
              "quiet-vault-output/batch.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  complete_output,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          for index, short in enumerate(
              shorts,
              start=1
          ):

              markdown = f"""# {short['title']}

          ## Script

          {short['short_script']}

          ## Visual Hook

          {short['visual_hook']}

          ## Google Flow Prompt

          {short['flow_prompt']}

          ## Final Twist

          {short['final_twist']}

          ## Description

          {short['description']}

          ## Keywords

          {short['keywords']}

          ## Hashtags

          {short['hashtags']}

          ## Thumbnail

          Frame: {short['thumbnail_frame']}

          Text: {short['thumbnail_text']}
          """

              with open(
                  f"quiet-vault-output/short_{index:02d}.md",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(markdown)


          # ============================================================
          # SUCCESS
          # ============================================================

          print("")
          print("==========================================")
          print("QUIET VAULT AI PIPELINE SUCCESS")
          print("==========================================")
          print(
              "Candidates generated:",
              len(candidates)
          )
          print(
              "Hard-filter survivors:",
              len(survivors)
          )
          print(
              "Final Shorts:",
              len(shorts)
          )
          print("==========================================")

          for index, short in enumerate(
              shorts,
              start=1
          ):

              print(
                  str(index)
                  + ". "
                  + short["title"]
              )

          PY

          python generate.py

      - name: Upload Quiet Vault output
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts
          path: quiet-vault-output/
          retention-days: 7
