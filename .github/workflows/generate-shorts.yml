name: Quiet Vault AI - Generate Shorts

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error

          API_KEY = os.environ["GROQ_API_KEY"]

          URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          # ============================================================
          # FIXED VISUAL SEEDS
          # ============================================================

          SEEDS = [
              {
                  "id": 1,
                  "location": "apartment bedroom",
                  "frame": (
                      "Vertical photorealistic live-action frame. "
                      "A fictional adult woman stands in her bedroom doorway. "
                      "An unfamiliar adult man is already sitting openly on her bed, "
                      "holding her house keys in one hand and a kitchen knife in the other. "
                      "Both adults are fully visible. "
                      "The woman has just discovered him."
                  ),
                  "story_goal": (
                      "The stranger knows something about the woman or her home "
                      "that he should not know."
                  )
              },

              {
                  "id": 2,
                  "location": "private office",
                  "frame": (
                      "Vertical photorealistic live-action frame. "
                      "A fictional adult man stands inside his private office. "
                      "An unfamiliar adult woman is already seated in his desk chair, "
                      "holding his access badge in one hand and large office scissors "
                      "in the other. Both adults are clearly visible."
                  ),
                  "story_goal": (
                      "The stranger has knowledge about the office or its access "
                      "that should be impossible."
                  )
              },

              {
                  "id": 3,
                  "location": "apartment kitchen",
                  "frame": (
                      "Vertical photorealistic live-action frame. "
                      "A fictional adult couple stand together in their kitchen. "
                      "An unfamiliar adult man is openly seated at their kitchen table, "
                      "holding their apartment key and staring directly at them. "
                      "All three adults are visible."
                  ),
                  "story_goal": (
                      "The stranger possesses knowledge or access connected to the couple "
                      "that creates a disturbing contradiction."
                  )
              },

              {
                  "id": 4,
                  "location": "hospital room",
                  "frame": (
                      "Vertical photorealistic live-action frame. "
                      "A fictional adult man enters a private hospital room. "
                      "An unfamiliar adult man is already sitting beside the visitor chair, "
                      "holding the patient's phone and staring directly at him. "
                      "Both adults are clearly visible."
                  ),
                  "story_goal": (
                      "The stranger knows something about the patient that he could only "
                      "know from being inside the room earlier."
                  )
              },

              {
                  "id": 5,
                  "location": "apartment hallway",
                  "frame": (
                      "Vertical photorealistic live-action frame. "
                      "A fictional adult woman has just opened her apartment door. "
                      "An unfamiliar adult woman is visibly standing inside the apartment, "
                      "holding the homeowner's spare key and wearing a coat belonging "
                      "to the homeowner's husband. Both adults are fully visible."
                  ),
                  "story_goal": (
                      "The stranger's possession of the key and coat has a disturbing "
                      "but grounded explanation."
                  )
              },

              {
                  "id": 6,
                  "location": "restaurant private dining room",
                  "frame": (
                      "Vertical photorealistic live-action frame. "
                      "A fictional adult woman enters a private dining room where her husband "
                      "is seated. An unfamiliar adult man is already sitting opposite the husband, "
                      "holding the husband's wedding ring in his open palm. "
                      "All three adults are clearly visible."
                  ),
                  "story_goal": (
                      "The stranger knows exactly where the wedding ring came from "
                      "and the husband has not told his wife."
                  )
              }
          ]

          # ============================================================
          # GROQ API
          # ============================================================

          def groq_call(messages, schema, max_tokens=2500, retries=5):

              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": 0.75,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": schema["name"],
                          "strict": True,
                          "schema": schema["schema"]
                      }
                  }
              }

              data = json.dumps(payload).encode("utf-8")

              for attempt in range(retries):

                  request = urllib.request.Request(
                      URL,
                      data=data,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      }
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=120
                      ) as response:

                          raw = response.read().decode("utf-8")
                          result = json.loads(raw)

                          content = result["choices"][0]["message"]["content"]

                          return json.loads(content)

                  except urllib.error.HTTPError as e:

                      body = e.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

                      print(
                          f"GROQ HTTP ERROR {e.code}: {body}"
                      )

                      if e.code == 429 and attempt < retries - 1:

                          retry_after = e.headers.get(
                              "retry-after"
                          )

                          try:
                              wait = max(
                                  65,
                                  int(float(retry_after)) + 2
                              )
                          except:
                              wait = 65

                          print(
                              f"Rate limit detected. "
                              f"Waiting {wait} seconds..."
                          )

                          time.sleep(wait)
                          continue

                      raise

                  except Exception as e:

                      print(
                          f"GROQ ERROR: {e}"
                      )

                      if attempt < retries - 1:

                          time.sleep(10)
                          continue

                      raise

          # ============================================================
          # STAGE 1 — GENERATE STORIES AROUND FIXED VISUALS
          # ============================================================

          seed_text = ""

          for seed in SEEDS:

              seed_text += f"""
          SEED {seed['id']}

          LOCATION:
          {seed['location']}

          EXACT FIRST FRAME:
          {seed['frame']}

          STORY GOAL:
          {seed['story_goal']}

          ----------------------------------------
          """

          generator_schema = {
              "name": "quiet_vault_concepts",
              "schema": {
                  "type": "object",
                  "properties": {
                      "concepts": {
                          "type": "array",
                          "items": {
                              "type": "object",
                              "properties": {
                                  "id": {
                                      "type": "integer"
                                  },
                                  "title": {
                                      "type": "string"
                                  },
                                  "premise": {
                                      "type": "string"
                                  },
                                  "ending": {
                                      "type": "string"
                                  }
                              },
                              "required": [
                                  "id",
                                  "title",
                                  "premise",
                                  "ending"
                              ],
                              "additionalProperties": False
                          }
                      }
                  },
                  "required": [
                      "concepts"
                  ],
                  "additionalProperties": False
              }
          }

          generator_prompt = f"""
          You write realistic cinematic horror Shorts.

          Create EXACTLY ONE concept for each of the six fixed seeds below.

          IMPORTANT:

          The FIRST FRAME is already designed.

          Do NOT change it.

          Do NOT invent a different visual hook.

          Do NOT remove the visible adult stranger.

          Do NOT introduce:

          - children
          - babies
          - minors
          - mirrors
          - reflections
          - twins
          - doppelgangers
          - CCTV
          - surveillance footage
          - elevators
          - cars
          - hotels
          - trains
          - ghosts
          - demons
          - monsters
          - zombies
          - gore
          - blood
          - supernatural mythology
          - disappearing people

          Every story must be:

          - realistic
          - adult-only
          - cinematic
          - easy to understand
          - 9–12 seconds
          - based on the visible human threat
          - built around ONE disturbing contradiction
          - capable of working without a long explanation

          IMPORTANT CREATIVE RULE:

          Do NOT simply write:

          "A stranger broke into the house."

          The stranger must have one specific disturbing reason
          for possessing the object shown in the seed.

          The ending should make the viewer rethink the first frame.

          Keep the ending short.

          Seeds:

          {seed_text}
          """

          print("")
          print("==============================================")
          print("GENERATING FIXED-SEED CONCEPTS")
          print("==============================================")

          generated = groq_call(
              [
                  {
                      "role": "system",
                      "content": (
                          "You are a realistic cinematic horror writer. "
                          "Follow the supplied visual seeds exactly."
                      )
                  },
                  {
                      "role": "user",
                      "content": generator_prompt
                  }
              ],
              generator_schema,
              max_tokens=2500
          )

          raw_concepts = generated["concepts"]

          print(
              f"Groq returned {len(raw_concepts)} concepts."
          )

          # ============================================================
          # REATTACH FIXED FIRST FRAME
          # ============================================================

          seed_map = {
              seed["id"]: seed
              for seed in SEEDS
          }

          candidates = []

          for concept in raw_concepts:

              sid = concept.get("id")

              if sid not in seed_map:
                  continue

              candidates.append({
                  "id": sid,
                  "title": concept["title"].strip(),
                  "premise": concept["premise"].strip(),
                  "ending": concept["ending"].strip(),

                  # Python controls this.
                  "static_frame_1": seed_map[sid]["frame"],

                  "location": seed_map[sid]["location"]
              })

          # ============================================================
          # OBJECTIVE FILTER
          # ============================================================

          banned_terms = [
              "child",
              "children",
              "kid",
              "baby",
              "boy",
              "girl",
              "minor",
              "nursery",
              "babysitter",
              "mirror",
              "reflection",
              "reflected",
              "twin",
              "doppelganger",
              "cctv",
              "surveillance",
              "security camera",
              "elevator",
              "car",
              "vehicle",
              "hotel",
              "train",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "gore",
              "blood",
              "supernatural",
              "teleport",
              "teleports",
              "teleported"
          ]

          def contains_banned(text):

              text = text.lower()

              for term in banned_terms:

                  pattern = (
                      r"(?<![a-z])"
                      + re.escape(term)
                      + r"(?![a-z])"
                  )

                  if re.search(pattern, text):
                      return True

              return False

          clean = []

          for candidate in candidates:

              combined = " ".join([
                  candidate["title"],
                  candidate["premise"],
                  candidate["ending"]
              ])

              if contains_banned(combined):

                  print(
                      f"OBJECTIVE REJECT "
                      f"{candidate['id']}: "
                      f"banned element"
                  )

                  continue

              if len(candidate["premise"]) < 25:

                  print(
                      f"OBJECTIVE REJECT "
                      f"{candidate['id']}: "
                      f"premise too short"
                  )

                  continue

              if len(candidate["ending"]) < 20:

                  print(
                      f"OBJECTIVE REJECT "
                      f"{candidate['id']}: "
                      f"ending too short"
                  )

                  continue

              clean.append(candidate)

          print("")
          print(
              f"After objective filtering: "
              f"{len(clean)}"
          )

          if len(clean) < 3:

              raise RuntimeError(
                  "Fewer than 3 usable concepts were generated. "
                  "No subjective AI quality gate was used."
              )

          # ============================================================
          # SELECT THREE
          #
          # No AI ranking.
          # We simply take the first three valid concepts.
          # ============================================================

          selected = clean[:3]

          print("")
          print("SELECTED:")
          for item in selected:
              print(
                  f"  {item['id']} - "
                  f"{item['title']}"
              )

          # ============================================================
          # RATE LIMIT BUFFER
          # ============================================================

          print("")
          print(
              "Waiting 65 seconds before finalization..."
          )

          time.sleep(65)

          # ============================================================
          # FINAL PACKAGE SCHEMA
          # ============================================================

          final_schema = {
              "name": "quiet_vault_final_short",
              "schema": {
                  "type": "object",
                  "properties": {

                      "id": {
                          "type": "integer"
                      },

                      "title": {
                          "type": "string"
                      },

                      "short_script": {
                          "type": "string"
                      },

                      "flow_prompt": {
                          "type": "string"
                      },

                      "final_twist": {
                          "type": "string"
                      },

                      "description": {
                          "type": "string"
                      },

                      "keywords": {
                          "type": "string"
                      },

                      "hashtags": {
                          "type": "string"
                      },

                      "thumbnail_frame": {
                          "type": "string"
                      },

                      "thumbnail_text": {
                          "type": "string"
                      },

                      "sound_design": {
                          "type": "string"
                      },

                      "pinned_comment": {
                          "type": "string"
                      }
                  },

                  "required": [
                      "id",
                      "title",
                      "short_script",
                      "flow_prompt",
                      "final_twist",
                      "description",
                      "keywords",
                      "hashtags",
                      "thumbnail_frame",
                      "thumbnail_text",
                      "sound_design",
                      "pinned_comment"
                  ],

                  "additionalProperties": False
              }
          }

          # ============================================================
          # FINALIZE THREE SHORTS
          # ============================================================

          final_outputs = []

          for index, candidate in enumerate(selected):

              print("")
              print(
                  f"FINALIZING "
                  f"{index + 1}/3: "
                  f"{candidate['title']}"
              )

              final_prompt = f"""
          Create the final YouTube Short package for The Quiet Vault.

          APPROVED CONCEPT:

          {json.dumps(candidate, indent=2)}

          ============================================================
          SCRIPT
          ============================================================

          Write a 9–12 second spoken horror Short.

          Requirements:

          - hook immediately
          - no long introduction
          - no exposition dump
          - visible threat immediately
          - simple escalation
          - disturbing final reveal
          - hard cut ending
          - natural human wording
          - realistic horror
          - no cheesy dialogue

          ============================================================
          GOOGLE FLOW PROMPT
          ============================================================

          Create ONE production-ready Google Flow prompt.

          Requirements:

          - vertical 9:16
          - photorealistic live action
          - fictional adults only
          - no real-person likeness
          - no celebrities
          - preserve the exact first-frame situation
          - realistic human faces
          - realistic movement
          - realistic lighting
          - cinematic camera
          - no monsters
          - no ghosts
          - no gore
          - no children
          - no mirrors
          - no reflections
          - no CCTV

          The first frame MUST show:

          {candidate['static_frame_1']}

          Do not replace this visual.

          ============================================================
          FINAL TWIST
          ============================================================

          State the actual final reveal in one or two sentences.

          ============================================================
          THUMBNAIL
          ============================================================

          Give:

          1. strongest frame/time
          2. optional 2–4 word thumbnail text

          Do not reveal the twist.

          ============================================================
          DESCRIPTION
          ============================================================

          Natural YouTube description.

          ============================================================
          KEYWORDS
          ============================================================

          Comma-separated.

          ============================================================
          HASHTAGS
          ============================================================

          Compact.

          ============================================================
          SOUND
          ============================================================

          Give simple sound design cues.

          ============================================================
          PINNED COMMENT
          ============================================================

          Ask a question that encourages viewers to comment
          without revealing the ending.
          """

              final = groq_call(
                  [
                      {
                          "role": "system",
                          "content": (
                              "You are the final production editor "
                              "for a realistic cinematic horror Shorts channel."
                          )
                      },
                      {
                          "role": "user",
                          "content": final_prompt
                      }
                  ],
                  final_schema,
                  max_tokens=1700
              )

              final_outputs.append(final)

              if index < len(selected) - 1:

                  print(
                      "Waiting 12 seconds..."
                  )

                  time.sleep(12)

          # ============================================================
          # SAVE OUTPUT
          # ============================================================

          os.makedirs(
              "output",
              exist_ok=True
          )

          with open(
              "output/quiet-vault-shorts.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  {
                      "generated_at": time.strftime(
                          "%Y-%m-%d %H:%M:%S UTC"
                      ),
                      "shorts": final_outputs
                  },
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # HUMAN-READABLE FILE
          # ============================================================

          with open(
              "output/quiet-vault-shorts.txt",
              "w",
              encoding="utf-8"
          ) as file:

              for number, short in enumerate(
                  final_outputs,
                  1
              ):

                  file.write(
                      "=" * 70
                      + "\n"
                  )

                  file.write(
                      f"SHORT {number}\n"
                  )

                  file.write(
                      "=" * 70
                      + "\n\n"
                  )

                  file.write(
                      "TITLE:\n"
                      + short["title"]
                      + "\n\n"
                  )

                  file.write(
                      "SCRIPT:\n"
                      + short["short_script"]
                      + "\n\n"
                  )

                  file.write(
                      "GOOGLE FLOW PROMPT:\n"
                      + short["flow_prompt"]
                      + "\n\n"
                  )

                  file.write(
                      "FINAL TWIST:\n"
                      + short["final_twist"]
                      + "\n\n"
                  )

                  file.write(
                      "DESCRIPTION:\n"
                      + short["description"]
                      + "\n\n"
                  )

                  file.write(
                      "KEYWORDS:\n"
                      + short["keywords"]
                      + "\n\n"
                  )

                  file.write(
                      "HASHTAGS:\n"
                      + short["hashtags"]
                      + "\n\n"
                  )

                  file.write(
                      "THUMBNAIL FRAME:\n"
                      + short["thumbnail_frame"]
                      + "\n\n"
                  )

                  file.write(
                      "THUMBNAIL TEXT:\n"
                      + short["thumbnail_text"]
                      + "\n\n"
                  )

                  file.write(
                      "SOUND DESIGN:\n"
                      + short["sound_design"]
                      + "\n\n"
                  )

                  file.write(
                      "PINNED COMMENT:\n"
                      + short["pinned_comment"]
                      + "\n\n"
                  )

          print("")
          print(
              "=============================================="
          )
          print(
              "QUIET VAULT AI GENERATION SUCCESS"
          )
          print(
              "=============================================="
          )
          print(
              f"Generated {len(final_outputs)} Shorts."
          )
          print(
              "Artifacts ready."
          )
          print(
              "=============================================="
          )
          PY

      - name: Upload generated Shorts package
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts
          path: output/
          if-no-files-found: error
