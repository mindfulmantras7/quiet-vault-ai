name: Quiet Vault AI - Evidence Based Generator

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:

      - name: Generate evidence-based Quiet Vault Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |

          cat > generate.py <<'PY'

          import os
          import json
          import re
          import time
          import urllib.request
          import urllib.error


          # ============================================================
          # CONFIG
          # ============================================================

          API_KEY = os.environ["GROQ_API_KEY"]

          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"

          MODEL = "openai/gpt-oss-20b"


          # ============================================================
          # GROQ REQUEST
          #
          # IMPORTANT:
          # No json_schema is used anywhere.
          # This avoids the repeated Groq 400 schema failures.
          # ============================================================

          def groq_request(
              messages,
              temperature=0.7,
              max_tokens=5000,
              retries=4
          ):

              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden",
                  "response_format": {
                      "type": "json_object"
                  }
              }


              data = json.dumps(payload).encode("utf-8")


              for attempt in range(retries):

                  request = urllib.request.Request(
                      ENDPOINT,
                      data=data,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      }
                  )


                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          body = response.read().decode("utf-8")

                          result = json.loads(body)

                          content = result["choices"][0]["message"]["content"]

                          content = content.strip()


                          # Remove accidental markdown fences.
                          if content.startswith("```"):

                              content = re.sub(
                                  r"^```(?:json)?\s*",
                                  "",
                                  content,
                                  flags=re.I
                              )

                              content = re.sub(
                                  r"\s*```$",
                                  "",
                                  content
                              )


                          return json.loads(content)


                  except urllib.error.HTTPError as e:

                      error_body = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )


                      print("")
                      print("==========================================")
                      print("GROQ ERROR")
                      print("HTTP:", e.code)
                      print(error_body)
                      print("==========================================")


                      if e.code == 429 and attempt < retries - 1:

                          retry_seconds = 65


                          match = re.search(
                              r"retry-after[^0-9]*([0-9]+)",
                              error_body,
                              re.I
                          )


                          if match:

                              retry_seconds = max(
                                  65,
                                  int(match.group(1)) + 5
                              )


                          print(
                              f"Rate limited. Waiting {retry_seconds} seconds..."
                          )

                          time.sleep(retry_seconds)

                          continue


                      raise RuntimeError(
                          f"Groq returned HTTP {e.code}"
                      )


                  except json.JSONDecodeError as e:

                      print("")
                      print("==========================================")
                      print("INVALID JSON FROM GROQ")
                      print("==========================================")
                      print(str(e))
                      print("==========================================")

                      if attempt < retries - 1:

                          print(
                              "Retrying with a simpler request..."
                          )

                          time.sleep(10)

                          continue

                      raise RuntimeError(
                          "Groq returned invalid JSON."
                      )


          # ============================================================
          # CREATIVE DNA
          # ============================================================

          CREATIVE_DNA = """

          THE QUIET VAULT

          The channel creates short, realistic, cinematic horror.

          Target length:
          9-12 seconds.

          Audience:
          Adults.

          Characters:
          Fictional adults only.

          ============================================================
          WHAT OUR ACTUAL CHANNEL DATA TAUGHT US
          ============================================================

          Several previous Shorts showed strong replay behavior.

          Some had average percentage viewed above 120% and even around
          140%.

          That means viewers who chose to watch often watched again.

          The larger weakness was the initial scroll decision.

          Therefore:

          THE FIRST FRAME IS THE PRIMARY PRIORITY.

          We need a video that makes someone stop scrolling BEFORE they
          understand the complete story.

          ============================================================
          STRONG HISTORICAL PATTERN
          ============================================================

          The strongest concepts combined:

          recognizable location

          visible human situation

          relationship context

          simple contradiction

          short dialogue

          second realization

          hard cut

          ============================================================
          FIRST FRAME RULE
          ============================================================

          Imagine frame 1 is shown as a completely silent photograph.

          No narration.

          No captions.

          No sound.

          No title.

          No explanation.

          The photograph itself must make the viewer think:

          "Why is that person there?"

          or

          "Why is he/she holding that?"

          or

          "How is that possible?"

          ============================================================
          GOOD FIRST FRAME
          ============================================================

          An unfamiliar adult is already sitting inside a private bedroom.

          A stranger is already inside a locked workplace.

          An unfamiliar adult is holding a dead person's personal object.

          A stranger is visibly performing a private household routine.

          A stranger is calmly occupying a place they should not be.

          An adult is confronting another adult who knows something impossible.

          ============================================================
          BAD FIRST FRAME
          ============================================================

          Person walking.

          Person entering.

          Person opening a door.

          Person looking scared.

          Empty room.

          Dark hallway.

          Normal dinner.

          Person looking at phone.

          Phone screen.

          Mysterious object sitting by itself.

          Atmospheric establishing shot.

          ============================================================
          HORROR MUST BE PHYSICAL
          ============================================================

          Prefer something physically visible:

          stranger

          possession

          location

          action

          relationship

          confrontation

          The viewer should not need narration to discover that something
          is wrong.

          ============================================================
          CONTRADICTION
          ============================================================

          Keep it extremely simple.

          GOOD:

          "That watch belonged to my husband."

          "I know."

          "He died three years ago."

          "He gave it to me yesterday."

          BAD:

          complicated mythology

          multiple timelines

          elaborate supernatural rules

          long explanation

          ============================================================
          SECOND REALIZATION
          ============================================================

          The ending must add a NEW disturbing fact.

          Not simply:

          "It was a ghost."

          Better:

          The stranger knows a private detail.

          The stranger reveals they were there earlier.

          The stranger possesses something impossible.

          The stranger knows something only a missing/dead/private person
          should know.

          ============================================================
          FLOW FEASIBILITY
          ============================================================

          One recognizable location.

          2-3 adults maximum.

          Simple physical movement.

          Realistic human faces.

          Realistic lighting.

          No complicated VFX.

          ============================================================
          HARD BANS
          ============================================================

          children

          minors

          babies

          teenagers

          mirrors

          reflections

          doppelgängers

          twins

          CCTV

          elevators

          hotels

          trains

          printers

          phone-screen horror

          video-call horror

          empty-chair horror

          disappearing people

          reappearing people

          monsters

          demons

          zombies

          ghosts as the explanation

          gore

          blood

          face distortion

          body transformation

          complicated CGI

          celebrity likeness

          real-person likeness

          ============================================================
          """


          # ============================================================
          # MECHANISM LIBRARY
          # ============================================================

          MECHANISMS = [

              {
                  "id": 1,
                  "name": "WRONG ACCESS",
                  "rule":
                  "An unfamiliar adult is already inside a private or locked "
                  "place using something that should belong to the protagonist."
              },

              {
                  "id": 2,
                  "name": "DEAD PERSON'S OBJECT",
                  "rule":
                  "A stranger visibly possesses an ordinary personal object "
                  "belonging to someone the protagonist knows is dead."
              },

              {
                  "id": 3,
                  "name": "IMPOSSIBLE VISIT",
                  "rule":
                  "A stranger is already inside a familiar location and claims "
                  "they visited earlier when access was impossible."
              },

              {
                  "id": 4,
                  "name": "PRIVATE MEMORY",
                  "rule":
                  "An unfamiliar adult reveals one extremely specific private "
                  "event that only someone present could know."
              },

              {
                  "id": 5,
                  "name": "WRONG OWNER",
                  "rule":
                  "A stranger confidently claims a deeply personal possession "
                  "and knows a detail proving unusual familiarity."
              },

              {
                  "id": 6,
                  "name": "WRONG ROOM",
                  "rule":
                  "An adult is already inside a private room or workplace where "
                  "they have no legitimate reason to be."
              },

              {
                  "id": 7,
                  "name": "IMPOSSIBLE INSTRUCTION",
                  "rule":
                  "An adult performs a specific ordinary action because someone "
                  "who could not communicate with them supposedly instructed it."
              },

              {
                  "id": 8,
                  "name": "UNWELCOME GUEST",
                  "rule":
                  "A stranger is already comfortably inside a familiar home "
                  "and behaves as though the household expected them."
              },

              {
                  "id": 9,
                  "name": "IMPOSSIBLE RELATIONSHIP",
                  "rule":
                  "A stranger claims a close personal relationship that the "
                  "protagonist knows cannot exist."
              },

              {
                  "id": 10,
                  "name": "CONTRADICTORY CONVERSATION",
                  "rule":
                  "One adult refers to a private conversation that supposedly "
                  "happened while the other adult was physically elsewhere."
              },

              {
                  "id": 11,
                  "name": "IMPOSSIBLE DELIVERY",
                  "rule":
                  "An adult delivers an ordinary item while claiming someone "
                  "ordered it even though that person could not have done so."
              },

              {
                  "id": 12,
                  "name": "WRONG TIME",
                  "rule":
                  "A stranger knows they were physically present at a location "
                  "at a time when access was impossible."
              },

              {
                  "id": 13,
                  "name": "FUTURE WARNING",
                  "rule":
                  "A stranger gives a specific warning about an event that "
                  "has not happened yet."
              },

              {
                  "id": 14,
                  "name": "PRIVATE NAME",
                  "rule":
                  "A stranger addresses the protagonist using an extremely "
                  "private nickname almost nobody knows."
              },

              {
                  "id": 15,
                  "name": "FAMILIAR ROUTINE",
                  "rule":
                  "A stranger performs a highly personal household routine "
                  "belonging to someone close to the protagonist."
              },

              {
                  "id": 16,
                  "name": "OTHER WITNESS",
                  "rule":
                  "A stranger describes an event that supposedly happened while "
                  "the protagonist was alone with another adult."
              },

              {
                  "id": 17,
                  "name": "WRONG DESTINATION",
                  "rule":
                  "A stranger arrives somewhere and says the protagonist "
                  "personally sent them there."
              },

              {
                  "id": 18,
                  "name": "IMPOSSIBLE FAMILIARITY",
                  "rule":
                  "A stranger moves around a home as if they have lived there "
                  "before, knowing where personal things are kept."
              },

              {
                  "id": 19,
                  "name": "PRIVATE PHYSICAL DETAIL",
                  "rule":
                  "A stranger knows a concealed physical detail about the "
                  "home or workplace that nobody should know."
              },

              {
                  "id": 20,
                  "name": "CALM INTRUDER",
                  "rule":
                  "A visibly misplaced adult intruder behaves completely calmly "
                  "and treats the frightened homeowner as though the homeowner "
                  "is the strange one."
              }

          ]


          # ============================================================
          # STAGE 1
          # ============================================================

          candidate_prompt = f"""

          You are the concept architect for The Quiet Vault.

          {CREATIVE_DNA}

          Generate EXACTLY 10 horror concepts.

          Each must use a different mechanism.

          MECHANISM LIBRARY:

          {json.dumps(MECHANISMS, indent=2)}

          ============================================================
          CONCEPT REQUIREMENTS
          ============================================================

          Every concept must contain:

          - a recognizable location
          - 2-3 fictional adults
          - an immediately visible disturbing situation
          - one simple contradiction
          - a second realization at the end

          ============================================================
          STATIC FRAME 1
          ============================================================

          Describe the actual frozen first video frame.

          Do NOT describe something that happens later.

          BAD:

          "A woman opens the door and discovers a stranger."

          GOOD:

          "A woman stands in her bedroom doorway while an unfamiliar adult "
          "man is already sitting on her bed holding her house keys."

          ============================================================
          DO NOT RELY ON
          ============================================================

          tiny text

          dates

          phone screens

          narration

          sound

          reflections

          unseen entities

          complicated supernatural explanations

          ============================================================
          RETURN ONLY JSON

          {{
            "candidates": [
              {{
                "id": 1,
                "mechanism_id": 1,
                "title": "...",
                "premise": "...",
                "static_frame_1": "...",
                "ending": "..."
              }}
            ]
          }}

          """


          generated = groq_request(

              [
                  {
                      "role": "system",
                      "content":
                      "You are a visual horror concept architect. "
                      "Return valid JSON only."
                  },

                  {
                      "role": "user",
                      "content":
                      candidate_prompt
                  }
              ],

              temperature=0.80,
              max_tokens=5000
          )


          candidates = generated.get(
              "candidates",
              []
          )


          print("")
          print("==========================================")
          print("CANDIDATE GENERATION")
          print("==========================================")

          print(
              "Candidates returned:",
              len(candidates)
          )


          # ============================================================
          # STRUCTURAL VALIDATION
          # ============================================================

          required_candidate_fields = [

              "id",
              "mechanism_id",
              "title",
              "premise",
              "static_frame_1",
              "ending"

          ]


          valid_candidates = []


          for candidate in candidates:

              if not isinstance(
                  candidate,
                  dict
              ):

                  continue


              if all(
                  field in candidate
                  for field in required_candidate_fields
              ):

                  valid_candidates.append(
                      candidate
                  )


          candidates = valid_candidates[:10]


          if len(candidates) < 8:

              raise RuntimeError(
                  "Fewer than 8 structurally valid candidates."
              )


          # ============================================================
          # HARD BANS ONLY
          #
          # NO subjective quality filter here.
          # ============================================================

          banned_terms = [

              "mirror",
              "reflection",
              "doppelganger",
              "doppelgänger",
              "twin",
              "cctv",
              "elevator",
              "hotel",
              "train",
              "printer",
              "empty chair",
              "video call",
              "video-call",
              "phone screen",
              "phone-screen",
              "ghost",
              "demon",
              "zombie",
              "monster",
              "gore",
              "blood",
              "face distortion",
              "body transformation",
              "disappear",
              "disappears",
              "reappears",
              "child",
              "children",
              "kid",
              "baby",
              "teenager",
              "teen",
              "minor"
          ]


          def find_banned(candidate):

              text = " ".join([

                  str(candidate.get("title", "")),
                  str(candidate.get("premise", "")),
                  str(candidate.get("static_frame_1", "")),
                  str(candidate.get("ending", ""))

              ]).lower()


              for term in banned_terms:

                  if re.search(
                      r"\b" +
                      re.escape(term) +
                      r"\b",
                      text
                  ):

                      return term


              return None


          survivors = []

          rejected = []


          for candidate in candidates:

              banned = find_banned(
                  candidate
              )


              if banned:

                  rejected.append({

                      "id":
                      candidate["id"],

                      "title":
                      candidate["title"],

                      "reason":
                      "banned mechanism: " + banned

                  })

                  continue


              survivors.append(
                  candidate
              )


          print("")
          print("==========================================")
          print("HARD BAN FILTER")
          print("==========================================")

          print(
              "Survivors:",
              len(survivors)
          )

          print(
              "Rejected:",
              len(rejected)
          )


          for item in rejected:

              print(
                  "REJECTED:",
                  item["id"],
                  item["title"],
                  "->",
                  item["reason"]
              )


          if len(survivors) < 5:

              raise RuntimeError(
                  "Fewer than 5 candidates survived hard bans."
              )


          # ============================================================
          # WAIT
          # ============================================================

          print("")
          print(
              "Waiting 65 seconds before creative judge..."
          )

          time.sleep(65)


          # ============================================================
          # STAGE 2 — CREATIVE JUDGE
          # ============================================================

          judge_prompt = f"""

          You are the ruthless creative director for The Quiet Vault.

          {CREATIVE_DNA}

          Judge EVERY candidate below.

          Do not judge the wording.

          Judge whether the ACTUAL VIDEO would work.

          ============================================================
          HOOK
          ============================================================

          Look only at static_frame_1.

          Imagine it is a silent photograph.

          Score:

          10 = immediately disturbing and scroll-stopping

          9 = extremely clear visual problem

          8 = clearly wrong and compelling

          7 = interesting but requires context

          6 or below = weak

          ============================================================
          VISIBLE HORROR
          ============================================================

          Is something disturbing physically visible?

          10 = unmistakable

          8 = clearly visible

          7 or below = weak

          Reject:

          empty rooms

          mysterious objects alone

          people merely looking scared

          sound-only horror

          narration-only horror

          ============================================================
          CLARITY
          ============================================================

          Can an average viewer understand the basic problem quickly?

          ============================================================
          ENDING
          ============================================================

          Does the ending create a second realization?

          ============================================================
          FLOW
          ============================================================

          Can Google Flow realistically make this in 9-12 seconds?

          ============================================================
          REWATCH
          ============================================================

          Does replay potentially reveal another clue?

          ============================================================
          ORIGINALITY
          ============================================================

          Avoid concepts that feel like:

          generic ghost stories

          generic mystery puzzles

          date/timestamp tricks

          paperwork puzzles

          phone tricks

          reflection tricks

          doppelgänger stories

          ============================================================
          PASS
          ============================================================

          A concept should pass only if:

          hook >= 8

          visible_horror >= 8

          clarity >= 8

          ending >= 8

          flow >= 8

          rewatch >= 7

          originality >= 7

          ============================================================
          IMPORTANT
          ============================================================

          Be selective.

          Do not give every concept an 8.

          We need genuine discrimination.

          Return JSON:

          {{
            "judgements": [
              {{
                "id": 1,
                "hook": 8,
                "visible_horror": 8,
                "clarity": 8,
                "ending": 8,
                "flow": 8,
                "rewatch": 7,
                "originality": 7,
                "pass": true,
                "reason": "Short explanation."
              }}
            ]
          }}

          CANDIDATES:

          {json.dumps(
              survivors,
              indent=2,
              ensure_ascii=False
          )}

          """


          judged = groq_request(

              [
                  {
                      "role": "system",
                      "content":
                      "You are a ruthless horror Shorts creative director. "
                      "Return valid JSON only."
                  },

                  {
                      "role": "user",
                      "content":
                      judge_prompt
                  }
              ],

              temperature=0.20,
              max_tokens=4500
          )


          judgements = judged.get(
              "judgements",
              []
          )


          print("")
          print("==========================================")
          print("CREATIVE JUDGE")
          print("==========================================")


          judgement_map = {}


          for judgment in judgements:

              if not isinstance(
                  judgment,
                  dict
              ):

                  continue


              try:

                  jid = int(
                      judgment["id"]
                  )

                  judgement_map[jid] = judgment

              except Exception:

                  continue


              print(

                  "ID:",
                  judgment.get("id"),

                  "| PASS:",
                  judgment.get("pass"),

                  "| Hook:",
                  judgment.get("hook"),

                  "| Horror:",
                  judgment.get("visible_horror"),

                  "| Clarity:",
                  judgment.get("clarity"),

                  "| Ending:",
                  judgment.get("ending"),

                  "| Flow:",
                  judgment.get("flow"),

                  "| Rewatch:",
                  judgment.get("rewatch"),

                  "| Originality:",
                  judgment.get("originality"),

                  "|",
                  judgment.get("reason")

              )


          # ============================================================
          # PYTHON DECISION
          #
          # We do NOT blindly trust the model's "pass" field.
          # We calculate pass from its scores.
          # ============================================================

          finalists = []


          for candidate in survivors:

              judgment = judgement_map.get(
                  int(candidate["id"])
              )


              if not judgment:

                  continue


              try:

                  hook = int(
                      judgment.get("hook", 0)
                  )

                  visible_horror = int(
                      judgment.get("visible_horror", 0)
                  )

                  clarity = int(
                      judgment.get("clarity", 0)
                  )

                  ending = int(
                      judgment.get("ending", 0)
                  )

                  flow = int(
                      judgment.get("flow", 0)
                  )

                  rewatch = int(
                      judgment.get("rewatch", 0)
                  )

                  originality = int(
                      judgment.get("originality", 0)
                  )

              except Exception:

                  continue


              if (

                  hook >= 8

                  and visible_horror >= 8

                  and clarity >= 8

                  and ending >= 8

                  and flow >= 8

                  and rewatch >= 7

                  and originality >= 7

              ):

                  finalists.append(
                      candidate
                  )


          # ============================================================
          # RANK
          # ============================================================

          def candidate_score(candidate):

              j = judgement_map[
                  int(candidate["id"])
              ]


              return (

                  int(j.get("hook", 0)) * 4

                  + int(j.get("visible_horror", 0)) * 4

                  + int(j.get("clarity", 0)) * 2

                  + int(j.get("ending", 0)) * 3

                  + int(j.get("flow", 0))

                  + int(j.get("rewatch", 0)) * 2

                  + int(j.get("originality", 0))

              )


          finalists.sort(
              key=candidate_score,
              reverse=True
          )


          print("")
          print("==========================================")
          print("APPROVED FINALISTS")
          print("==========================================")


          if len(finalists) < 3:

              raise RuntimeError(

                  "Fewer than 3 concepts passed the creative gate. "
                  "The workflow stopped rather than filling slots with weak ideas."

              )


          finalists = finalists[:3]


          for candidate in finalists:

              j = judgement_map[
                  int(candidate["id"])
              ]


              print(

                  candidate["id"],
                  candidate["title"],

                  "| score:",
                  candidate_score(candidate)

              )


          # ============================================================
          # WAIT
          # ============================================================

          print("")
          print(
              "Waiting 65 seconds before final production..."
          )

          time.sleep(65)


          # ============================================================
          # STAGE 3 — FINAL PRODUCTION
          #
          # ONE CALL FOR ALL THREE SHORTS.
          # ============================================================

          final_prompt = f"""

          You are the senior production writer for The Quiet Vault.

          Turn the three approved concepts below into three complete
          YouTube Shorts.

          DO NOT replace their underlying mechanisms.

          ============================================================
          APPROVED CONCEPTS
          ============================================================

          {json.dumps(
              finalists,
              indent=2,
              ensure_ascii=False
          )}

          ============================================================
          EACH SHORT
          ============================================================

          Length:

          9-12 seconds.

          Format:

          vertical 9:16.

          Style:

          photorealistic live action.

          Characters:

          fictional adults only.

          Maximum:

          3 adults.

          Location:

          one recognizable location.

          ============================================================
          FIRST FRAME
          ============================================================

          The disturbing situation must already be visible in frame 1.

          Do NOT begin with:

          walking

          entering

          opening a door

          establishing shot

          empty room

          normal conversation

          ============================================================
          STORY
          ============================================================

          Keep dialogue extremely short.

          Approximately 35 spoken words maximum.

          Prefer 2-4 short lines.

          The visual should carry most of the story.

          ============================================================
          TIMING
          ============================================================

          0-3 seconds:

          Show the disturbing situation immediately.

          3-6 seconds:

          Reveal the contradiction.

          6-9/12 seconds:

          Reveal the second disturbing fact.

          Final frame:

          hard cut.

          ============================================================
          GOOGLE FLOW PROMPT
          ============================================================

          Write ONE complete Google Flow prompt for each Short.

          It must explicitly describe:

          vertical 9:16

          photorealistic live action

          fictional adult characters

          consistent character appearance

          recognizable location

          exact first frame

          camera framing

          realistic lighting

          natural human movement

          0-3 seconds

          3-6 seconds

          6-9/12 seconds

          final reveal

          hard cut

          no subtitles

          no text overlays

          ============================================================
          HARD BANS
          ============================================================

          No children.

          No minors.

          No babies.

          No teenagers.

          No mirrors.

          No reflections.

          No doppelgängers.

          No twins.

          No CCTV.

          No elevators.

          No hotels.

          No trains.

          No printers.

          No phone-screen horror.

          No video-call horror.

          No empty-chair horror.

          No monsters.

          No demons.

          No zombies.

          No ghosts as the explanation.

          No gore.

          No blood.

          No face distortion.

          No body transformation.

          No complicated CGI.

          No celebrity likeness.

          No real-person likeness.

          No text rendered inside the generated video.

          ============================================================
          TITLE
          ============================================================

          Make the title curiosity-driven.

          Prefer an unresolved contradiction.

          ============================================================
          DESCRIPTION
          ============================================================

          Short and natural.

          ============================================================
          KEYWORDS
          ============================================================

          Comma-separated.

          ============================================================
          HASHTAGS
          ============================================================

          Compact and relevant.

          ============================================================
          THUMBNAIL
          ============================================================

          Choose the strongest frame.

          Give approximate timing.

          Thumbnail text:

          maximum 3 words or NONE.

          ============================================================
          SOUND
          ============================================================

          Realistic subtle sound design.

          ============================================================
          PINNED COMMENT
          ============================================================

          One short curiosity question.

          ============================================================
          RETURN ONLY JSON
          ============================================================

          {{
            "shorts": [
              {{
                "id": 1,
                "title": "...",
                "short_script": "...",
                "visual_hook": "...",
                "flow_prompt": "...",
                "final_twist": "...",
                "description": "...",
                "keywords": "...",
                "hashtags": "...",
                "thumbnail_frame": "...",
                "thumbnail_text": "...",
                "sound_design": "...",
                "pinned_comment": "..."
              }},
              {{
                "id": 2,
                "...": "..."
              }},
              {{
                "id": 3,
                "...": "..."
              }}
            ]
          }}

          """


          final_result = groq_request(

              [
                  {
                      "role": "system",
                      "content":
                      "You are the senior production writer for "
                      "The Quiet Vault. Return valid JSON only."
                  },

                  {
                      "role": "user",
                      "content":
                      final_prompt
                  }

              ],

              temperature=0.55,
              max_tokens=7500
          )


          final_shorts = final_result.get(
              "shorts",
              []
          )


          print("")
          print("==========================================")
          print("FINAL PRODUCTION")
          print("==========================================")

          print(
              "Shorts returned:",
              len(final_shorts)
          )


          # ============================================================
          # NORMALIZE FINAL OUTPUT
          # ============================================================

          aliases = {

              "flow":
              "flow_prompt",

              "google_flow":
              "flow_prompt",

              "google_flow_prompt":
              "flow_prompt",

              "script":
              "short_script",

              "description_text":
              "description",

              "thumb_frame":
              "thumbnail_frame",

              "thumb_text":
              "thumbnail_text",

              "sound":
              "sound_design",

              "comment":
              "pinned_comment"

          }


          normalized_shorts = []


          for short in final_shorts:

              if not isinstance(
                  short,
                  dict
              ):

                  continue


              # Normalize harmless field-name variations.

              for old_key, new_key in aliases.items():

                  if (

                      old_key in short

                      and new_key not in short

                  ):

                      short[new_key] = short[
                          old_key
                      ]


              required_final_fields = [

                  "id",
                  "title",
                  "short_script",
                  "visual_hook",
                  "flow_prompt",
                  "final_twist",
                  "description",
                  "keywords",
                  "hashtags",
                  "thumbnail_frame",
                  "thumbnail_text",
                  "sound_design",
                  "pinned_comment"

              ]


              missing = [

                  field

                  for field in required_final_fields

                  if field not in short

              ]


              if missing:

                  print(

                      "FINAL SHORT REJECTED:",
                      short.get("id"),
                      "missing:",
                      missing

                  )

                  continue


              normalized_shorts.append(
                  short
              )


          final_shorts = normalized_shorts[:3]


          if len(final_shorts) < 3:

              raise RuntimeError(

                  "Final production returned fewer than 3 valid Shorts."

              )


          # ============================================================
          # SAVE OUTPUT
          # ============================================================

          os.makedirs(
              "quiet-vault-output",
              exist_ok=True
          )


          output = {

              "creative_dna":
              "Evidence-based Quiet Vault formula",

              "generated_candidates":
              candidates,

              "hard_filter_rejected":
              rejected,

              "hard_filter_survivors":
              survivors,

              "ai_judgements":
              judgements,

              "approved_finalists":
              finalists,

              "final_shorts":
              final_shorts

          }


          with open(
              "quiet-vault-output/batch.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          # ============================================================
          # HUMAN-READABLE FILES
          # ============================================================

          for index, short in enumerate(
              final_shorts,
              start=1
          ):

              markdown = f"""# THE QUIET VAULT — SHORT {index}

          ## TITLE

          {short["title"]}

          ## SCRIPT

          {short["short_script"]}

          ## VISUAL HOOK

          {short["visual_hook"]}

          ## GOOGLE FLOW PROMPT

          {short["flow_prompt"]}

          ## FINAL TWIST

          {short["final_twist"]}

          ## DESCRIPTION

          {short["description"]}

          ## KEYWORDS

          {short["keywords"]}

          ## HASHTAGS

          {short["hashtags"]}

          ## THUMBNAIL FRAME

          {short["thumbnail_frame"]}

          ## THUMBNAIL TEXT

          {short["thumbnail_text"]}

          ## SOUND DESIGN

          {short["sound_design"]}

          ## PINNED COMMENT

          {short["pinned_comment"]}
          """


              with open(
                  f"quiet-vault-output/short_{index:02d}.md",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(markdown)


          # ============================================================
          # FINAL LOG
          # ============================================================

          print("")
          print("==========================================")
          print("QUIET VAULT AI PIPELINE COMPLETE")
          print("==========================================")

          print(
              "Candidates generated:",
              len(candidates)
          )

          print(
              "Hard-ban survivors:",
              len(survivors)
          )

          print(
              "Creative finalists:",
              len(finalists)
          )

          print(
              "Final Shorts:",
              len(final_shorts)
          )

          print("")

          for index, short in enumerate(
              final_shorts,
              start=1
          ):

              print(
                  f"{index}. {short['title']}"
              )

          print("")
          print("==========================================")


          PY


          python generate.py


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload Quiet Vault Shorts
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts
          path: quiet-vault-output/
          retention-days: 7
