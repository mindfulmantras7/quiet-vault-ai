name: Quiet Vault AI - Evidence Based Generator

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:

      - name: Generate evidence-based Quiet Vault Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |

          cat > generate.py <<'PY'

          import os
          import json
          import re
          import time
          import urllib.request
          import urllib.error


          API_KEY = os.environ["GROQ_API_KEY"]

          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"

          MODEL = "openai/gpt-oss-20b"


          # ============================================================
          # GROQ
          # ============================================================

          def groq_request(
              messages,
              temperature=0.7,
              max_tokens=5000,
              retries=4
          ):

              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden",
                  "response_format": {
                      "type": "json_object"
                  }
              }


              data = json.dumps(payload).encode("utf-8")


              for attempt in range(retries):

                  request = urllib.request.Request(
                      ENDPOINT,
                      data=data,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      }
                  )


                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          body = response.read().decode("utf-8")

                          result = json.loads(body)

                          content = result["choices"][0]["message"]["content"]

                          content = content.strip()


                          if content.startswith("```"):

                              content = re.sub(
                                  r"^```(?:json)?\s*",
                                  "",
                                  content,
                                  flags=re.I
                              )

                              content = re.sub(
                                  r"\s*```$",
                                  "",
                                  content
                              )


                          return json.loads(content)


                  except urllib.error.HTTPError as e:

                      error_body = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )


                      print("")
                      print("==========================================")
                      print("GROQ ERROR")
                      print("HTTP:", e.code)
                      print(error_body)
                      print("==========================================")


                      if e.code == 429 and attempt < retries - 1:

                          retry_seconds = 65


                          match = re.search(
                              r"retry-after[^0-9]*([0-9]+)",
                              error_body,
                              re.I
                          )


                          if match:

                              retry_seconds = max(
                                  65,
                                  int(match.group(1)) + 5
                              )


                          print(
                              f"Rate limited. Waiting {retry_seconds} seconds..."
                          )

                          time.sleep(retry_seconds)

                          continue


                      raise RuntimeError(
                          f"Groq returned HTTP {e.code}"
                      )


                  except json.JSONDecodeError:

                      if attempt < retries - 1:

                          print(
                              "Invalid JSON. Retrying..."
                          )

                          time.sleep(10)

                          continue

                      raise RuntimeError(
                          "Groq returned invalid JSON."
                      )


          # ============================================================
          # CREATIVE DNA
          # ============================================================

          DNA = """

          THE QUIET VAULT

          Create realistic cinematic horror Shorts for adults.

          Length: 9-12 seconds.

          Fictional adults only.

          The channel's strongest performance pattern has been:

          immediate visual hook
          +
          visible human threat
          +
          simple contradiction
          +
          second disturbing realization
          +
          hard cut

          The biggest historical weakness has been poor initial
          scroll-stopping power.

          Therefore FRAME 1 is critical.

          ============================================================
          FRAME 1
          ============================================================

          The viewer must see the wrong thing immediately.

          Good:

          unfamiliar adult already inside a private room

          stranger holding a deeply personal object

          stranger occupying a locked/private location

          stranger performing an intimate household action

          adult intruder behaving as though everything is normal

          Bad:

          person walking

          person entering

          door opening

          empty room

          dark hallway

          person looking frightened

          phone screen

          mysterious object alone

          atmospheric establishing shot

          ============================================================
          ENDING
          ============================================================

          THIS IS EXTREMELY IMPORTANT.

          The final beat must make the situation WORSE.

          It must introduce NEW INFORMATION.

          The ending must NOT merely explain the original contradiction.

          Weak:

          "I found your husband's watch."

          Strong:

          "Your husband gave me this yesterday."

          Weak:

          "I was here last night."

          Strong:

          "I was here last night. Your wife let me in."

          Weak:

          "I know your private nickname."

          Strong:

          "I know your private nickname. He taught it to me."

          The ending should make the viewer mentally reinterpret
          the first frame.

          ============================================================
          RELATIONSHIPS
          ============================================================

          husband/wife

          adult siblings

          close friends

          roommates

          neighbors

          colleagues

          ex-partners

          ============================================================
          FLOW
          ============================================================

          One recognizable location.

          2-3 adults.

          Simple movement.

          Realistic faces.

          Realistic lighting.

          No complicated effects.

          ============================================================
          HARD BANS
          ============================================================

          children

          minors

          babies

          teenagers

          mirrors

          reflections

          doppelgängers

          twins

          CCTV

          elevators

          hotels

          trains

          printers

          phone-screen horror

          video-call horror

          empty-chair horror

          disappearing people

          reappearing people

          monsters

          demons

          zombies

          ghosts

          gore

          blood

          face distortion

          body transformation

          complicated CGI

          celebrity likeness

          real-person likeness

          text appearing inside the video

          """


          # ============================================================
          # MECHANISMS
          # ============================================================

          MECHANISMS = [

              "Wrong Access: unfamiliar adult already inside a locked/private place",

              "Dead Person's Object: stranger visibly possesses an object belonging to someone known to be dead",

              "Impossible Visit: stranger claims they were previously inside when access was impossible",

              "Private Memory: stranger knows an extremely specific private event",

              "Wrong Owner: stranger claims a deeply personal possession belongs to them",

              "Wrong Room: stranger is already inside a private bedroom, office or restricted room",

              "Impossible Instruction: adult performs a specific action because someone who could not communicate supposedly instructed it",

              "Unwelcome Guest: stranger is comfortably inside a familiar home as though invited",

              "Impossible Relationship: stranger claims a relationship that cannot exist",

              "Contradictory Conversation: adult knows a conversation that supposedly happened while the other person was elsewhere",

              "Impossible Delivery: delivery person brings something ordered by someone who could not order it",

              "Wrong Time: stranger knows they were physically present at an impossible time",

              "Future Warning: stranger knows a specific private event before it happens",

              "Private Name: stranger knows an extremely private nickname",

              "Familiar Routine: stranger performs a personal routine belonging to someone close",

              "Other Witness: stranger describes an event that supposedly happened while protagonist was alone with someone",

              "Wrong Destination: stranger arrives claiming protagonist sent them",

              "Impossible Familiarity: stranger knows exactly where private things are kept",

              "Private Physical Detail: stranger knows a concealed detail about the location",

              "Calm Intruder: intruder behaves as though the homeowner is the strange one"

          ]


          # ============================================================
          # CANDIDATE GENERATION
          # ============================================================

          candidate_prompt = f"""

          You are the horror concept architect for The Quiet Vault.

          {DNA}

          Generate EXACTLY 10 concepts.

          Use a DIFFERENT mechanism for every concept.

          Mechanisms:

          {json.dumps(MECHANISMS, indent=2)}

          ============================================================
          MOST IMPORTANT REQUIREMENT
          ============================================================

          Build the ending FIRST.

          Before writing the premise, imagine the final line.

          Ask:

          "What new fact could make the opening visual much worse?"

          The ending must materially change what the viewer thinks
          is happening.

          ============================================================
          STATIC FIRST FRAME
          ============================================================

          Describe an actual frozen frame.

          The disturbing adult situation must already be visible.

          Do not describe something that happens later.

          ============================================================
          OUTPUT
          ============================================================

          Return:

          {{
            "candidates": [
              {{
                "id": 1,
                "mechanism_id": 1,
                "title": "...",
                "premise": "...",
                "static_frame_1": "...",
                "ending": "..."
              }}
            ]
          }}

          Return JSON only.

          """


          generated = groq_request(

              [
                  {
                      "role": "system",
                      "content":
                      "You create visual horror concepts. "
                      "Return JSON only."
                  },

                  {
                      "role": "user",
                      "content":
                      candidate_prompt
                  }
              ],

              temperature=0.85,
              max_tokens=5500
          )


          candidates = generated.get(
              "candidates",
              []
          )


          print("")
          print("==========================================")
          print("CANDIDATE GENERATION")
          print("==========================================")

          print(
              "Candidates returned:",
              len(candidates)
          )


          if len(candidates) < 8:

              raise RuntimeError(
                  "Fewer than 8 candidates returned."
              )


          candidates = candidates[:10]


          # ============================================================
          # HARD BANS
          # ============================================================

          banned_terms = [

              "mirror",
              "reflection",
              "doppelganger",
              "doppelgänger",
              "twin",
              "cctv",
              "elevator",
              "hotel",
              "train",
              "printer",
              "empty chair",
              "video call",
              "video-call",
              "phone screen",
              "phone-screen",
              "ghost",
              "demon",
              "zombie",
              "monster",
              "gore",
              "blood",
              "face distortion",
              "body transformation",
              "disappear",
              "disappears",
              "reappears",
              "child",
              "children",
              "kid",
              "baby",
              "teenager",
              "teen",
              "minor"
          ]


          def banned(candidate):

              text = " ".join([

                  str(candidate.get("title", "")),
                  str(candidate.get("premise", "")),
                  str(candidate.get("static_frame_1", "")),
                  str(candidate.get("ending", ""))

              ]).lower()


              for term in banned_terms:

                  if re.search(
                      r"\b" + re.escape(term) + r"\b",
                      text
                  ):

                      return term

              return None


          survivors = []


          for candidate in candidates:

              if not isinstance(
                  candidate,
                  dict
              ):

                  continue


              required = [

                  "id",
                  "mechanism_id",
                  "title",
                  "premise",
                  "static_frame_1",
                  "ending"

              ]


              if not all(
                  field in candidate
                  for field in required
              ):

                  continue


              bad = banned(
                  candidate
              )


              if bad:

                  print(
                      "REJECTED:",
                      candidate["id"],
                      candidate["title"],
                      "->",
                      bad
                  )

                  continue


              survivors.append(
                  candidate
              )


          print(
              "Hard-ban survivors:",
              len(survivors)
          )


          if len(survivors) < 5:

              raise RuntimeError(
                  "Fewer than 5 candidates survived hard bans."
              )


          # ============================================================
          # WAIT
          # ============================================================

          print(
              "Waiting 65 seconds before judging..."
          )

          time.sleep(65)


          # ============================================================
          # JUDGE
          # ============================================================

          def judge_candidates(
              concepts,
              label
          ):

              prompt = f"""

              You are the ruthless creative director for The Quiet Vault.

              {DNA}

              Judge EVERY concept below.

              {json.dumps(concepts, indent=2, ensure_ascii=False)}

              ============================================================
              SCORE EACH
              ============================================================

              hook:
              Is frame 1 immediately disturbing?

              visible_horror:
              Is the disturbing human situation physically visible?

              clarity:
              Is the basic problem immediately understandable?

              ending:
              Does the final beat introduce NEW disturbing information?

              flow:
              Can Google Flow realistically generate it?

              rewatch:
              Does replay reveal another clue or make the first frame
              more disturbing?

              originality:
              Does it avoid our repeated mechanisms?

              ============================================================
              CRITICAL ENDING TEST
              ============================================================

              Ask:

              "If I remove the ending, does the viewer lose a genuinely
              new disturbing fact?"

              If NO:

              ending MUST be 6 or below.

              Do not give 8 just because the ending sounds creepy.

              ============================================================
              PASS
              ============================================================

              hook >= 8

              visible_horror >= 8

              clarity >= 8

              ending >= 8

              flow >= 8

              rewatch >= 7

              originality >= 7

              ============================================================
              BE SELECTIVE
              ============================================================

              Do NOT give everything 8.

              A normal situation with creepy dialogue is not enough.

              A mysterious object is not enough.

              A person merely looking frightened is not enough.

              Return JSON only:

              {{
                "judgements": [
                  {{
                    "id": 1,
                    "hook": 8,
                    "visible_horror": 8,
                    "clarity": 8,
                    "ending": 8,
                    "flow": 8,
                    "rewatch": 7,
                    "originality": 7,
                    "pass": true,
                    "reason": "..."
                  }}
                ]
              }}

              """


              result = groq_request(

                  [
                      {
                          "role": "system",
                          "content":
                          "You are a ruthless horror Shorts editor. "
                          "Return JSON only."
                      },

                      {
                          "role": "user",
                          "content":
                          prompt
                      }
                  ],

                  temperature=0.15,
                  max_tokens=5000
              )


              return result.get(
                  "judgements",
                  []
              )


          judgements = judge_candidates(
              survivors,
              "initial"
          )


          # ============================================================
          # FIND PASSES
          # ============================================================

          judgement_map = {

              int(j["id"]):
              j

              for j in judgements
              if isinstance(j, dict)
              and "id" in j

          }


          def passed(j):

              try:

                  return (

                      int(j.get("hook", 0)) >= 8

                      and int(j.get("visible_horror", 0)) >= 8

                      and int(j.get("clarity", 0)) >= 8

                      and int(j.get("ending", 0)) >= 8

                      and int(j.get("flow", 0)) >= 8

                      and int(j.get("rewatch", 0)) >= 7

                      and int(j.get("originality", 0)) >= 7

                  )

              except Exception:

                  return False


          finalists = [

              c

              for c in survivors

              if int(c["id"]) in judgement_map
              and passed(
                  judgement_map[int(c["id"])]
              )

          ]


          print("")
          print("==========================================")
          print("INITIAL JUDGE")
          print("==========================================")


          for j in judgements:

              print(

                  "ID:",
                  j.get("id"),

                  "| Hook:",
                  j.get("hook"),

                  "| Horror:",
                  j.get("visible_horror"),

                  "| Clarity:",
                  j.get("clarity"),

                  "| Ending:",
                  j.get("ending"),

                  "| Flow:",
                  j.get("flow"),

                  "| Rewatch:",
                  j.get("rewatch"),

                  "| Originality:",
                  j.get("originality"),

                  "| PASS:",
                  passed(j),

                  "|",
                  j.get("reason")

              )


          # ============================================================
          # REPAIR IF FEWER THAN 3
          # ============================================================

          if len(finalists) < 3:

              print("")
              print("==========================================")
              print("REPAIR STAGE")
              print("==========================================")


              rejected_for_repair = [

                  c

                  for c in survivors

                  if int(c["id"]) in judgement_map
                  and not passed(
                      judgement_map[int(c["id"])]
                  )

              ]


              # Sort rejected concepts by overall potential.
              # We want to repair concepts that were close to passing.

              def repair_score(c):

                  j = judgement_map[
                      int(c["id"])
                  ]


                  return (

                      int(j.get("hook", 0)) * 3

                      + int(j.get("visible_horror", 0)) * 3

                      + int(j.get("clarity", 0)) * 2

                      + int(j.get("ending", 0)) * 4

                      + int(j.get("flow", 0))

                      + int(j.get("rewatch", 0))

                      + int(j.get("originality", 0))

                  )


              rejected_for_repair.sort(
                  key=repair_score,
                  reverse=True
              )


              repair_pool = rejected_for_repair[:5]


              print(
                  "Concepts selected for repair:",
                  len(repair_pool)
              )


              repair_prompt = f"""

              You are repairing horror Shorts for The Quiet Vault.

              {DNA}

              The following concepts were close to passing but failed
              the creative gate.

              REJECTED CONCEPTS:

              {json.dumps(
                  repair_pool,
                  indent=2,
                  ensure_ascii=False
              )}

              THEIR JUDGEMENTS:

              {json.dumps(
                  [
                      judgement_map[int(c["id"])]
                      for c in repair_pool
                  ],
                  indent=2,
                  ensure_ascii=False
              )}

              ============================================================
              YOUR TASK
              ============================================================

              Repair each concept.

              DO NOT completely replace the concept.

              Keep:

              location

              main visible situation

              basic mechanism

              relationship

              But fix the weakness.

              ============================================================
              MOST IMPORTANT
              ============================================================

              The ending must be substantially stronger.

              It must introduce a new disturbing fact.

              It must make the viewer reinterpret the first frame.

              Do NOT simply explain what already happened.

              ============================================================
              FIRST FRAME
              ============================================================

              If hook was below 8, make the first frame more visually
              disturbing.

              The threat must already be visible.

              ============================================================
              OUTPUT

              Return exactly:

              {{
                "repaired": [
                  {{
                    "id": 1,
                    "mechanism_id": 1,
                    "title": "...",
                    "premise": "...",
                    "static_frame_1": "...",
                    "ending": "..."
                  }}
                ]
              }}

              Return JSON only.

              """


              repaired_result = groq_request(

                  [
                      {
                          "role": "system",
                          "content":
                          "You repair weak horror concepts. "
                          "Return JSON only."
                      },

                      {
                          "role": "user",
                          "content":
                          repair_prompt
                      }
                  ],

                  temperature=0.75,
                  max_tokens=4500
              )


              repaired = repaired_result.get(
                  "repaired",
                  []
              )


              print(
                  "Repaired concepts:",
                  len(repaired)
              )


              if repaired:

                  print(
                      "Waiting 65 seconds before repair judging..."
                  )

                  time.sleep(65)


                  repaired_judgements = judge_candidates(
                      repaired,
                      "repair"
                  )


                  repaired_map = {

                      int(j["id"]):
                      j

                      for j in repaired_judgements
                      if isinstance(j, dict)
                      and "id" in j

                  }


                  print("")
                  print("==========================================")
                  print("REPAIR JUDGE")
                  print("==========================================")


                  for j in repaired_judgements:

                      print(

                          "ID:",
                          j.get("id"),

                          "| Hook:",
                          j.get("hook"),

                          "| Horror:",
                          j.get("visible_horror"),

                          "| Clarity:",
                          j.get("clarity"),

                          "| Ending:",
                          j.get("ending"),

                          "| Flow:",
                          j.get("flow"),

                          "| Rewatch:",
                          j.get("rewatch"),

                          "| Originality:",
                          j.get("originality"),

                          "| PASS:",
                          passed(j),

                          "|",
                          j.get("reason")

                      )


                  for candidate in repaired:

                      cid = int(
                          candidate["id"]
                      )


                      if (

                          cid in repaired_map

                          and passed(
                              repaired_map[cid]
                          )

                      ):

                          finalists.append(
                              candidate
                          )


          # ============================================================
          # FINAL RANKING
          # ============================================================

          def total_score(c):

              cid = int(
                  c["id"]
              )


              j = judgement_map.get(
                  cid
              )


              if not j:

                  # repaired candidate
                  # may use the repair map

                  j = locals().get(
                      "repaired_map",
                      {}
                  ).get(
                      cid,
                      {}
                  )


              return (

                  int(j.get("hook", 0)) * 4

                  + int(j.get("visible_horror", 0)) * 4

                  + int(j.get("clarity", 0)) * 2

                  + int(j.get("ending", 0)) * 5

                  + int(j.get("flow", 0))

                  + int(j.get("rewatch", 0)) * 2

                  + int(j.get("originality", 0))

              )


          # Remove duplicate IDs.

          unique = {}

          for candidate in finalists:

              unique[
                  int(candidate["id"])
              ] = candidate


          finalists = list(
              unique.values()
          )


          finalists.sort(
              key=total_score,
              reverse=True
          )


          print("")
          print("==========================================")
          print("FINALIST SELECTION")
          print("==========================================")


          if len(finalists) < 3:

              raise RuntimeError(

                  "Still fewer than 3 concepts passed after repair. "
                  "Workflow stopped rather than manufacturing a weak Short."

              )


          finalists = finalists[:3]


          for candidate in finalists:

              print(
                  candidate["id"],
                  candidate["title"],
                  "| score:",
                  total_score(candidate)
              )


          # ============================================================
          # WAIT
          # ============================================================

          print("")
          print(
              "Waiting 65 seconds before final production..."
          )

          time.sleep(65)


          # ============================================================
          # FINAL PRODUCTION
          # ============================================================

          final_prompt = f"""

          You are the senior production writer for The Quiet Vault.

          Turn these three approved concepts into three complete
          9-12 second YouTube Shorts.

          APPROVED CONCEPTS:

          {json.dumps(
              finalists,
              indent=2,
              ensure_ascii=False
          )}

          ============================================================
          RULES
          ============================================================

          Preserve each concept's mechanism.

          Do not replace the story.

          The first frame must already show the disturbing situation.

          One recognizable location.

          2-3 fictional adults.

          Photorealistic live action.

          Vertical 9:16.

          Natural movement.

          Realistic lighting.

          Maximum approximately 35 spoken words.

          ============================================================
          TIMING
          ============================================================

          0-3 seconds:

          disturbing situation already visible.

          3-6 seconds:

          contradiction becomes clear.

          6-9/12 seconds:

          NEW disturbing fact.

          Final moment:

          hard cut.

          ============================================================
          ENDING
          ============================================================

          The final line must NOT merely explain the first line.

          It must make the situation worse.

          ============================================================
          GOOGLE FLOW
          ============================================================

          Provide one complete ready-to-paste Google Flow prompt.

          Include:

          vertical 9:16

          photorealistic live action

          fictional adult characters

          consistent appearance

          exact first frame

          camera framing

          location

          lighting

          0-3 second beat

          3-6 second beat

          6-9/12 second beat

          final reveal

          hard cut

          no subtitles

          no text overlays

          ============================================================
          THUMBNAIL
          ============================================================

          Select the strongest frame.

          Give approximate timestamp.

          Maximum 3 words of thumbnail text or NONE.

          ============================================================
          OUTPUT
          ============================================================

          Return:

          {{
            "shorts": [
              {{
                "id": 1,
                "title": "...",
                "short_script": "...",
                "visual_hook": "...",
                "flow_prompt": "...",
                "final_twist": "...",
                "description": "...",
                "keywords": "...",
                "hashtags": "...",
                "thumbnail_frame": "...",
                "thumbnail_text": "...",
                "sound_design": "...",
                "pinned_comment": "..."
              }},
              {{
                "id": 2,
                "title": "...",
                "short_script": "...",
                "visual_hook": "...",
                "flow_prompt": "...",
                "final_twist": "...",
                "description": "...",
                "keywords": "...",
                "hashtags": "...",
                "thumbnail_frame": "...",
                "thumbnail_text": "...",
                "sound_design": "...",
                "pinned_comment": "..."
              }},
              {{
                "id": 3,
                "title": "...",
                "short_script": "...",
                "visual_hook": "...",
                "flow_prompt": "...",
                "final_twist": "...",
                "description": "...",
                "keywords": "...",
                "hashtags": "...",
                "thumbnail_frame": "...",
                "thumbnail_text": "...",
                "sound_design": "...",
                "pinned_comment": "..."
              }}
            ]
          }}

          Return JSON only.

          """


          final_result = groq_request(

              [
                  {
                      "role": "system",
                      "content":
                      "You are the senior production writer for "
                      "The Quiet Vault. Return JSON only."
                  },

                  {
                      "role": "user",
                      "content":
                      final_prompt
                  }
              ],

              temperature=0.55,
              max_tokens=7500
          )


          final_shorts = final_result.get(
              "shorts",
              []
          )


          # ============================================================
          # NORMALIZE
          # ============================================================

          aliases = {

              "flow":
              "flow_prompt",

              "google_flow":
              "flow_prompt",

              "google_flow_prompt":
              "flow_prompt",

              "script":
              "short_script",

              "thumb_frame":
              "thumbnail_frame",

              "thumb_text":
              "thumbnail_text",

              "sound":
              "sound_design",

              "comment":
              "pinned_comment"

          }


          normalized = []


          required_final = [

              "id",
              "title",
              "short_script",
              "visual_hook",
              "flow_prompt",
              "final_twist",
              "description",
              "keywords",
              "hashtags",
              "thumbnail_frame",
              "thumbnail_text",
              "sound_design",
              "pinned_comment"

          ]


          for short in final_shorts:

              if not isinstance(
                  short,
                  dict
              ):

                  continue


              for old, new in aliases.items():

                  if (

                      old in short

                      and new not in short

                  ):

                      short[new] = short[old]


              if all(
                  field in short
                  for field in required_final
              ):

                  normalized.append(
                      short
                  )


          final_shorts = normalized[:3]


          if len(final_shorts) < 3:

              raise RuntimeError(
                  "Final writer returned fewer than 3 complete Shorts."
              )


          # ============================================================
          # SAVE
          # ============================================================

          os.makedirs(
              "quiet-vault-output",
              exist_ok=True
          )


          output = {

              "generated_candidates":
              candidates,

              "hard_filter_rejected":
              rejected,

              "hard_filter_survivors":
              survivors,

              "initial_judgements":
              judgements,

              "approved_initial":
              [
                  c
                  for c in survivors
                  if int(c["id"]) in judgement_map
                  and passed(
                      judgement_map[int(c["id"])]
                  )
              ],

              "finalists":
              finalists,

              "final_shorts":
              final_shorts

          }


          with open(
              "quiet-vault-output/batch.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          # ============================================================
          # MARKDOWN OUTPUT
          # ============================================================

          for index, short in enumerate(
              final_shorts,
              start=1
          ):

              text = f"""# THE QUIET VAULT — SHORT {index}

          ## TITLE

          {short["title"]}

          ## SCRIPT

          {short["short_script"]}

          ## VISUAL HOOK

          {short["visual_hook"]}

          ## GOOGLE FLOW PROMPT

          {short["flow_prompt"]}

          ## FINAL TWIST

          {short["final_twist"]}

          ## DESCRIPTION

          {short["description"]}

          ## KEYWORDS

          {short["keywords"]}

          ## HASHTAGS

          {short["hashtags"]}

          ## THUMBNAIL FRAME

          {short["thumbnail_frame"]}

          ## THUMBNAIL TEXT

          {short["thumbnail_text"]}

          ## SOUND DESIGN

          {short["sound_design"]}

          ## PINNED COMMENT

          {short["pinned_comment"]}
          """


              with open(
                  f"quiet-vault-output/short_{index:02d}.md",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(text)


          print("")
          print("==========================================")
          print("QUIET VAULT PIPELINE COMPLETE")
          print("==========================================")

          print(
              "Candidates:",
              len(candidates)
          )

          print(
              "Hard-ban survivors:",
              len(survivors)
          )

          print(
              "Initial passes:",
              len([
                  c
                  for c in survivors
                  if int(c["id"]) in judgement_map
                  and passed(
                      judgement_map[int(c["id"])]
                  )
              ])
          )

          print(
              "Finalists:",
              len(finalists)
          )

          print(
              "Final Shorts:",
              len(final_shorts)
          )

          for short in final_shorts:

              print(
                  "-",
                  short["title"]
              )

          print("")


          PY


          python generate.py


      - name: Upload Quiet Vault Shorts
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts
          path: quiet-vault-output/
          retention-days: 7
