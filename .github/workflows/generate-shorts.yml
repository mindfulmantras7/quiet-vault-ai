name: Quiet Vault AI - Candidate Judge Finalize

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate, filter, judge and finalize
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat > generate.py <<'PY'
          import os
          import json
          import re
          import urllib.request
          import urllib.error

          API_KEY = os.environ["GROQ_API_KEY"]
          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"


          # ============================================================
          # GROQ
          # ============================================================

          def groq_request(messages, schema_name, schema, temperature, max_tokens):

              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden",
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": schema_name,
                          "strict": True,
                          "schema": schema
                      }
                  }
              }

              data = json.dumps(payload).encode("utf-8")

              request = urllib.request.Request(
                  ENDPOINT,
                  data=data,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {API_KEY}",
                      "User-Agent": "QuietVaultAI/1.0"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=180
                  ) as response:

                      body = response.read().decode("utf-8")
                      result = json.loads(body)

                      content = result["choices"][0]["message"]["content"]

                      return json.loads(content)

              except urllib.error.HTTPError as e:

                  error_body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("")
                  print("==========================================")
                  print("GROQ ERROR")
                  print("HTTP:", e.code)
                  print(error_body)
                  print("==========================================")
                  print("")

                  raise RuntimeError(
                      f"Groq returned HTTP {e.code}"
                  )


          # ============================================================
          # STAGE 1
          # CANDIDATE GENERATION
          #
          # DELIBERATELY SIMPLE SCHEMA
          # ============================================================

          candidate_schema = {
              "type": "object",
              "properties": {
                  "candidates": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id": {
                                  "type": "integer"
                              },
                              "title": {
                                  "type": "string"
                              },
                              "premise": {
                                  "type": "string"
                              },
                              "static_frame_1": {
                                  "type": "string"
                              },
                              "ending": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "id",
                              "title",
                              "premise",
                              "static_frame_1",
                              "ending"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "candidates"
              ],
              "additionalProperties": False
          }


          generator_prompt = """
          You create horror concepts for The Quiet Vault.

          Return ONLY JSON matching the supplied schema.

          Generate EXACTLY 12 different concepts.

          Each concept must work as a 9-12 second photorealistic
          YouTube Short.

          FICTIONAL ADULT CHARACTERS ONLY.

          The horror must be realistic and human-centered.

          The FIRST FRAME is extremely important.

          Imagine pausing the video at the very first frame.

          The viewer must immediately see something visibly wrong,
          threatening or impossible.

          GOOD FIRST FRAME:

          A woman sits on her bed while the locked bedroom door
          beside her is visibly being pushed inward by an adult hand.

          BAD FIRST FRAME:

          A woman sits on her bed and something scary happens later.

          The first frame must contain the actual visual anomaly.

          PREFER:

          - apartments
          - houses
          - bedrooms
          - kitchens
          - bathrooms
          - offices
          - hospitals
          - workplaces
          - hallways
          - stairwells
          - shops
          - public buildings

          PREFER RELATIONSHIPS:

          - husband and wife
          - adult siblings
          - adult parent and adult child
          - coworkers
          - friends
          - roommates

          AVOID:

          elevators
          cars
          hotels
          CCTV
          security cameras
          mirrors
          reflections
          doppelgangers
          clones
          hidden people behind characters
          printers
          trains
          ghosts
          demons
          monsters
          zombies
          giant creatures
          gore
          floating objects
          objects with faces
          possessed objects
          disappearing people
          teleportation
          impossible anatomy
          head distortion
          children
          babies
          minors

          Do not repeat the same mechanism.

          The ending must create a second realization.

          "The character screams" is not a sufficient ending.

          STATIC_FRAME_1 must describe a concrete paused photograph.

          Do not write vague phrases like:
          "something creepy happens"
          "something feels wrong"
          "the scene is scary"

          All characters must be fictional adults.
          """


          candidates_data = groq_request(
              [
                  {
                      "role": "user",
                      "content": generator_prompt
                  }
              ],
              "quiet_vault_candidates",
              candidate_schema,
              0.8,
              7000
          )


          candidates = candidates_data["candidates"]


          print("")
          print("==========================================")
          print("CANDIDATE GENERATION")
          print("==========================================")
          print("Generated:", len(candidates))


          if len(candidates) != 12:

              raise RuntimeError(
                  f"Expected 12 candidates, got {len(candidates)}"
              )


          # ============================================================
          # STAGE 2
          # PYTHON HARD FILTER
          # ============================================================

          banned_phrases = [

              "elevator",
              "elevators",

              "cctv",
              "security camera",
              "security-camera",

              "hotel room",
              "hotel hallway",

              "mirror",
              "mirrors",
              "reflection",
              "reflections",

              "doppelganger",
              "doppelgänger",
              "doppelgangers",
              "doppelgängers",
              "clone",
              "clones",

              "hiding behind her",
              "hiding behind him",
              "hidden behind her",
              "hidden behind him",

              "printer",
              "empty chair",
              "train carriage",

              "floating mug",
              "floating cup",
              "object with a face",
              "face on the object",
              "possessed object",

              "ghost",
              "ghosts",
              "demon",
              "demons",
              "monster",
              "monsters",
              "zombie",
              "zombies",

              "giant creature",

              "teleport",
              "teleportation",
              "teleports",

              "disappears and reappears",
              "disappear and reappear",

              "head spins",
              "head turns 180",
              "180-degree head",

              "random body part",
              "floating hand",
              "floating head",

              "gore",
              "decapitation",
              "decapitated",

              "child",
              "children",
              "kid",
              "kids",
              "baby",
              "babies",
              "minor",
              "minors",
              "teenager",
              "teenagers"
          ]


          weak_phrases = [

              "everything looks normal",
              "nothing seems wrong",
              "nothing looks wrong",
              "the scene looks normal",
              "normal scene",
              "ordinary scene",
              "later something happens",
              "something scary happens later",
              "something strange happens later"
          ]


          def normalize(text):

              return re.sub(
                  r"\s+",
                  " ",
                  str(text).lower()
              ).strip()


          def contains_phrase(text, phrase):

              pattern = (
                  r"(?<![a-z0-9])"
                  + re.escape(phrase)
                  + r"(?![a-z0-9])"
              )

              return re.search(
                  pattern,
                  text
              ) is not None


          def hard_reject(candidate):

              title = normalize(
                  candidate["title"]
              )

              premise = normalize(
                  candidate["premise"]
              )

              frame = normalize(
                  candidate["static_frame_1"]
              )

              ending = normalize(
                  candidate["ending"]
              )

              combined = " ".join(
                  [
                      title,
                      premise,
                      frame,
                      ending
                  ]
              )


              # Banned mechanisms
              for phrase in banned_phrases:

                  if contains_phrase(
                      combined,
                      phrase
                  ):

                      return True, (
                          "banned: "
                          + phrase
                      )


              # Weak frame
              for phrase in weak_phrases:

                  if contains_phrase(
                      frame,
                      phrase
                  ):

                      return True, (
                          "weak first frame"
                      )


              # Minimum frame detail
              if len(frame.split()) < 12:

                  return True, (
                      "first frame too short"
                  )


              # Ending must contain something beyond screaming
              if len(ending.split()) < 8:

                  return True, (
                      "ending too short"
                  )


              return False, "passed"


          survivors = []
          rejected = []


          for candidate in candidates:

              reject, reason = hard_reject(
                  candidate
              )

              if reject:

                  rejected.append(
                      {
                          "id": candidate["id"],
                          "title": candidate["title"],
                          "reason": reason
                      }
                  )

              else:

                  survivors.append(
                      candidate
                  )


          print("")
          print("==========================================")
          print("HARD FILTER")
          print("==========================================")
          print("Survivors:", len(survivors))
          print("Rejected:", len(rejected))


          for item in rejected:

              print(
                  "REJECTED:",
                  item["id"],
                  item["title"],
                  "->",
                  item["reason"]
              )


          if len(survivors) < 3:

              raise RuntimeError(
                  "Fewer than 3 candidates survived."
              )


          # ============================================================
          # STAGE 3
          # AI JUDGE
          # ============================================================

          judge_schema = {
              "type": "object",
              "properties": {
                  "ranked": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id": {
                                  "type": "integer"
                              },
                              "hook": {
                                  "type": "integer"
                              },
                              "clarity": {
                                  "type": "integer"
                              },
                              "ending": {
                                  "type": "integer"
                              },
                              "flow": {
                                  "type": "integer"
                              },
                              "originality": {
                                  "type": "integer"
                              },
                              "rewatch": {
                                  "type": "integer"
                              },
                              "overall": {
                                  "type": "integer"
                              },
                              "reason": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "id",
                              "hook",
                              "clarity",
                              "ending",
                              "flow",
                              "originality",
                              "rewatch",
                              "overall",
                              "reason"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "ranked"
              ],
              "additionalProperties": False
          }


          judge_prompt = """

          You are the strict creative director for The Quiet Vault.

          Return ONLY JSON matching the supplied schema.

          Judge every candidate.

          Score each from 1 to 10.

          HOOK:
          Does frame 1 itself show something disturbing?

          CLARITY:
          Can viewers understand the visual problem immediately?

          ENDING:
          Does the ending create a second realization?

          FLOW:
          Can Google Flow realistically create this in 9-12 seconds?

          ORIGINALITY:
          Does it avoid overused horror mechanisms?

          REWATCH:
          Would viewers replay to understand the clue or ending?

          OVERALL:
          Your overall assessment.

          Be harsh.

          A good written premise with a weak first frame is not good enough.

          Rank the candidates strongest to weakest.
          """


          judge_data = groq_request(
              [
                  {
                      "role": "user",
                      "content":
                          judge_prompt
                          + "\n\nCANDIDATES:\n"
                          + json.dumps(
                              survivors,
                              ensure_ascii=False
                          )
                  }
              ],
              "quiet_vault_judge",
              judge_schema,
              0.3,
              7000
          )


          ranked = judge_data["ranked"]


          ranked = sorted(
              ranked,
              key=lambda item:
                  item["overall"],
              reverse=True
          )


          print("")
          print("==========================================")
          print("AI JUDGE")
          print("==========================================")


          for item in ranked:

              print(
                  "ID:",
                  item["id"],
                  "Hook:",
                  item["hook"],
                  "Clarity:",
                  item["clarity"],
                  "Ending:",
                  item["ending"],
                  "Flow:",
                  item["flow"],
                  "Originality:",
                  item["originality"],
                  "Rewatch:",
                  item["rewatch"],
                  "Overall:",
                  item["overall"]
              )


          top_ids = [
              item["id"]
              for item in ranked[:3]
          ]


          candidate_map = {
              item["id"]: item
              for item in survivors
          }


          finalists = [
              candidate_map[item_id]
              for item_id in top_ids
              if item_id in candidate_map
          ]


          if len(finalists) != 3:

              raise RuntimeError(
                  "Could not create exactly 3 finalists."
              )


          print("")
          print("==========================================")
          print("FINALISTS")
          print("==========================================")


          for finalist in finalists:

              print(
                  finalist["id"],
                  finalist["title"]
              )


          # ============================================================
          # STAGE 4
          # FINAL WRITER
          # ============================================================

          final_schema = {
              "type": "object",
              "properties": {
                  "shorts": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id": {
                                  "type": "integer"
                              },
                              "title": {
                                  "type": "string"
                              },
                              "short_script": {
                                  "type": "string"
                              },
                              "visual_hook": {
                                  "type": "string"
                              },
                              "flow_prompt": {
                                  "type": "string"
                              },
                              "final_twist": {
                                  "type": "string"
                              },
                              "description": {
                                  "type": "string"
                              },
                              "keywords": {
                                  "type": "string"
                              },
                              "hashtags": {
                                  "type": "string"
                              },
                              "thumbnail_frame": {
                                  "type": "string"
                              },
                              "thumbnail_text": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "id",
                              "title",
                              "short_script",
                              "visual_hook",
                              "flow_prompt",
                              "final_twist",
                              "description",
                              "keywords",
                              "hashtags",
                              "thumbnail_frame",
                              "thumbnail_text"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "shorts"
              ],
              "additionalProperties": False
          }


          final_prompt = """

          You are the final writer for The Quiet Vault.

          Return ONLY JSON matching the supplied schema.

          Turn the three selected horror concepts into exactly three
          complete YouTube Shorts packages.

          Do NOT change their underlying concepts.

          Each Short must be:

          - 9-12 seconds
          - vertical 9:16
          - photorealistic live action
          - fictional adults
          - cinematic realistic lighting
          - natural human movement
          - no children
          - no gore
          - no monsters
          - no ghosts
          - no mirrors
          - no reflections
          - no doppelgangers
          - no celebrity likeness
          - no real-person likeness

          ============================================================
          FIRST FRAME
          ============================================================

          The FIRST FRAME must immediately show the visual anomaly.

          No:

          - establishing shot
          - empty room
          - normal opening
          - character walking into the scene
          - slow reveal

          ============================================================
          GOOGLE FLOW PROMPT
          ============================================================

          Give one complete ready-to-paste Google Flow prompt.

          Include:

          - vertical 9:16
          - photorealistic live action
          - fictional adults
          - consistent character appearance
          - location
          - camera framing
          - EXACT first frame
          - 0-3 seconds
          - 3-6 seconds
          - 6-9/12 seconds
          - final reveal
          - hard cut or loop-friendly ending
          - no subtitles
          - no text overlays

          ============================================================
          SCRIPT
          ============================================================

          Very little dialogue.

          The visual should carry the story.

          ============================================================
          THUMBNAIL
          ============================================================

          Choose the strongest visual frame.

          Specify approximate timing.

          Thumbnail text should be short or empty.

          DESCRIPTION:
          Natural YouTube description.

          KEYWORDS:
          Comma-separated.

          HASHTAGS:
          Compact and relevant.
          """


          final_data = groq_request(
              [
                  {
                      "role": "user",
                      "content":
                          final_prompt
                          + "\n\nFINALISTS:\n"
                          + json.dumps(
                              finalists,
                              ensure_ascii=False
                          )
                  }
              ],
              "quiet_vault_final",
              final_schema,
              0.65,
              12000
          )


          shorts = final_data["shorts"]


          if len(shorts) != 3:

              raise RuntimeError(
                  f"Expected 3 final Shorts, got {len(shorts)}"
              )


          # ============================================================
          # SAVE OUTPUT
          # ============================================================

          os.makedirs(
              "quiet-vault-output",
              exist_ok=True
          )


          output = {
              "generated_candidates": candidates,
              "hard_filter_rejected": rejected,
              "hard_filter_survivors": survivors,
              "ai_judgement": ranked,
              "final_shorts": shorts
          }


          with open(
              "quiet-vault-output/batch.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          for index, short in enumerate(
              shorts,
              start=1
          ):

              markdown = f"""# {short['title']}

          ## Script

          {short['short_script']}

          ## Visual Hook

          {short['visual_hook']}

          ## Google Flow Prompt

          {short['flow_prompt']}

          ## Final Twist

          {short['final_twist']}

          ## Description

          {short['description']}

          ## Keywords

          {short['keywords']}

          ## Hashtags

          {short['hashtags']}

          ## Thumbnail

          Frame: {short['thumbnail_frame']}

          Text: {short['thumbnail_text']}
          """

              with open(
                  f"quiet-vault-output/short_{index:02d}.md",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(markdown)


          print("")
          print("==========================================")
          print("QUIET VAULT AI PIPELINE SUCCESS")
          print("==========================================")
          print("Candidates:", len(candidates))
          print("Survivors:", len(survivors))
          print("Final Shorts:", len(shorts))
          print("==========================================")

          for index, short in enumerate(
              shorts,
              start=1
          ):

              print(
                  f"{index}. {short['title']}"
              )

          PY

          python generate.py


      - name: Upload Quiet Vault output
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts
          path: quiet-vault-output/
          retention-days: 7
