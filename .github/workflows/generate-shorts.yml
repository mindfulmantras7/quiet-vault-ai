name: Quiet Vault AI - V9 Visual Horror Engine

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate 3 horror shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import re
          import urllib.request
          import urllib.error
          from pathlib import Path

          API_KEY = os.environ["GROQ_API_KEY"]
          RUN_NUMBER = int(os.environ.get("RUN_NUMBER", "1"))

          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          OUT = Path("quiet-vault-output")
          OUT.mkdir(exist_ok=True)

          # ============================================================
          # QUIET VAULT CREATIVE DNA
          # ============================================================

          DNA = """
          CHANNEL: The Quiet Vault

          FORMAT:
          - YouTube Shorts
          - 9-12 seconds
          - photorealistic live action
          - psychological / realistic horror
          - adult characters only

          CORE RULE:
          The horror must be understandable visually BEFORE the dialogue explains it.

          REQUIRED:
          - recognizable real-world location
          - visible adult human threat or disturbing contradiction
          - simple premise
          - very little dialogue
          - escalating final line
          - hard cut ending
          - no complicated mythology

          AVOID:
          - slow establishing shots
          - generic "someone is watching me"
          - vague shadows
          - empty rooms as the entire premise
          - objects moving by themselves
          - supernatural exposition
          - complicated backstories
          - multiple twists
          """

          # ============================================================
          # FIXED VISUAL MECHANISMS
          #
          # These are deliberately concrete and Flow-friendly.
          # Groq DOES NOT invent the mechanism.
          # ============================================================

          MECHANISMS = [

            {
              "id": "personal_object",
              "name": "STRANGER USING A PERSONAL OBJECT",
              "location": "modern apartment bedroom",
              "visual": (
                "An adult woman enters her bedroom and immediately sees an "
                "unfamiliar adult man calmly wearing her husband's distinctive "
                "wristwatch. The watch must be clearly visible."
              ),
              "contradiction": (
                "The stranger is visibly wearing a highly personal object "
                "belonging to someone who is absent."
              ),
              "ending_direction": (
                "The stranger casually claims the absent person gave it to him."
              )
            },

            {
              "id": "photo_from_inside",
              "name": "PHOTOGRAPH TAKEN FROM INSIDE",
              "location": "modern apartment hallway",
              "visual": (
                "An adult woman enters her apartment and finds an unfamiliar "
                "adult man standing inside holding a printed photograph. "
                "The photograph visibly shows the woman standing in the same "
                "doorway from the man's current position."
              ),
              "contradiction": (
                "The photograph could only have been taken from inside the "
                "apartment while the woman was entering."
              ),
              "ending_direction": (
                "The stranger calmly says she gave him the photograph."
              )
            },

            {
              "id": "bed_position",
              "name": "STRANGER IN THE BED",
              "location": "realistic apartment bedroom at night",
              "visual": (
                "An adult woman opens her bedroom door and finds an unfamiliar "
                "adult man calmly lying on her husband's exact side of the bed, "
                "wearing ordinary clothes and looking completely comfortable."
              ),
              "contradiction": (
                "The stranger behaves as though the bedroom and bed belong to him."
              ),
              "ending_direction": (
                "He calmly says her husband told him to wait there."
              )
            },

            {
              "id": "wrong_clothes",
              "name": "STRANGER WEARING ABSENT PERSON'S CLOTHES",
              "location": "modern apartment living room",
              "visual": (
                "An adult man enters his apartment and finds an unfamiliar "
                "adult woman calmly sitting on the sofa wearing his wife's "
                "distinctive cardigan. The cardigan is clearly recognizable."
              ),
              "contradiction": (
                "A stranger is visibly wearing clothing belonging to the "
                "absent wife."
              ),
              "ending_direction": (
                "The stranger says the wife told her she could borrow it."
              )
            },

            {
              "id": "reserved_seat",
              "name": "STRANGER IN THE RESERVED SEAT",
              "location": "realistic apartment dining room",
              "visual": (
                "An adult woman enters her dining room and sees an unfamiliar "
                "adult man calmly sitting in the exact chair where her late "
                "husband always sat. A normal dinner setting is directly in "
                "front of him."
              ),
              "contradiction": (
                "The stranger behaves as though he has been invited to occupy "
                "the dead husband's usual place."
              ),
              "ending_direction": (
                "He casually says the husband told him she would be home soon."
              )
            },

            {
              "id": "wrong_room",
              "name": "STRANGER KNOWS THE PRIVATE ROOM",
              "location": "modern apartment",
              "visual": (
                "An adult woman enters her locked apartment and finds an "
                "unfamiliar adult man standing directly outside her private "
                "bedroom. He is holding the bedroom key."
              ),
              "contradiction": (
                "The stranger has the key to a private room inside her home."
              ),
              "ending_direction": (
                "He calmly says the person who lives with her gave him the key."
              )
            },

            {
              "id": "family_photo",
              "name": "STRANGER HOLDING A FAMILY PHOTOGRAPH",
              "location": "apartment living room",
              "visual": (
                "An adult man walks into his apartment and finds an unfamiliar "
                "adult woman sitting at his table holding a framed family "
                "photograph that includes him."
              ),
              "contradiction": (
                "A complete stranger is calmly holding a private family photo."
              ),
              "ending_direction": (
                "She casually identifies herself as someone the family knows."
              )
            },

            {
              "id": "wrong_person_action",
              "name": "STRANGER DOING A PRIVATE ROUTINE",
              "location": "modern apartment kitchen",
              "visual": (
                "An adult woman walks into her kitchen and finds an unfamiliar "
                "adult man calmly preparing a very specific breakfast routine "
                "normally prepared by her husband."
              ),
              "contradiction": (
                "A stranger is performing a deeply familiar private routine "
                "inside the home as though he has done it many times."
              ),
              "ending_direction": (
                "He casually says her husband taught him how to make it."
              )
            },

            {
              "id": "wrong_address",
              "name": "STRANGER WHO HAS THE HOME ADDRESS",
              "location": "apartment entryway",
              "visual": (
                "An adult woman opens her apartment door and finds an unfamiliar "
                "adult man already inside holding a handwritten card containing "
                "her exact home address."
              ),
              "contradiction": (
                "The stranger has her exact private address and is already inside."
              ),
              "ending_direction": (
                "He says someone inside the apartment gave it to him."
              )
            },

            {
              "id": "locked_room_guest",
              "name": "STRANGER INSIDE A LOCKED ROOM",
              "location": "modern apartment study",
              "visual": (
                "An adult man unlocks his private study and finds an unfamiliar "
                "adult woman calmly sitting at his desk. The locked study door "
                "is visibly behind him."
              ),
              "contradiction": (
                "The room was locked, but a stranger is visibly inside it."
              ),
              "ending_direction": (
                "She calmly says she has been waiting for him."
              )
            },

            {
              "id": "wrong_belonging",
              "name": "STRANGER WITH A PRIVATE BELONGING",
              "location": "modern apartment",
              "visual": (
                "An adult woman enters her apartment and finds an unfamiliar "
                "adult man holding a small sentimental object belonging to "
                "her deceased father. The object is clearly visible."
              ),
              "contradiction": (
                "A complete stranger possesses a private sentimental belonging "
                "that should not be in his possession."
              ),
              "ending_direction": (
                "He says her father gave it to him recently."
              )
            },

            {
              "id": "wrong_door",
              "name": "STRANGER BEHIND THE PRIVATE DOOR",
              "location": "apartment hallway",
              "visual": (
                "An adult woman opens the door to a private bedroom and finds "
                "an unfamiliar adult man already standing inside, holding the "
                "door from the inside."
              ),
              "contradiction": (
                "The stranger is inside a private bedroom and behaves as though "
                "he belongs there."
              ),
              "ending_direction": (
                "He says he was told to wait until she came home."
              )
            },

            {
              "id": "wrong_dinner",
              "name": "DINNER PREPARED FOR SOMEONE ABSENT",
              "location": "modern apartment dining room",
              "visual": (
                "An adult man enters his apartment and finds an unfamiliar "
                "adult woman sitting at a table where dinner has been prepared "
                "for two. The second place setting is directly opposite her."
              ),
              "contradiction": (
                "The stranger is clearly waiting for another adult who should "
                "not be expected."
              ),
              "ending_direction": (
                "She calmly says she is waiting for his wife."
              )
            },

            {
              "id": "wrong_bedside",
              "name": "STRANGER KNOWS THE BEDROOM ROUTINE",
              "location": "apartment bedroom",
              "visual": (
                "An adult woman enters her bedroom and finds an unfamiliar "
                "adult man sitting on the edge of the bed holding the bedside "
                "lamp switch, as though he knows exactly where it is."
              ),
              "contradiction": (
                "A stranger is completely comfortable with the private layout "
                "of the bedroom."
              ),
              "ending_direction": (
                "He casually says someone in the home showed him where everything is."
              )
            },

            {
              "id": "wrong_desk",
              "name": "STRANGER AT THE PRIVATE DESK",
              "location": "home office",
              "visual": (
                "An adult man opens his locked home office and finds an "
                "unfamiliar adult woman sitting at his desk with his personal "
                "notebook open in front of her."
              ),
              "contradiction": (
                "A stranger has entered a locked private office and is reading "
                "a personal notebook."
              ),
              "ending_direction": (
                "She says she was told he would want the notebook back."
              )
            }

          ]

          # ============================================================
          # GROQ CALL
          # ============================================================

          def groq_call(prompt, retries=3):
              payload = {
                  "model": MODEL,
                  "temperature": 0.55,
                  "max_completion_tokens": 700,
                  "reasoning_effort": "low",
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "quiet_vault_short",
                          "strict": True,
                          "schema": {
                              "type": "object",
                              "properties": {
                                  "title": {"type": "string"},
                                  "script": {"type": "string"},
                                  "final_line": {"type": "string"},
                                  "description": {"type": "string"},
                                  "keywords": {"type": "string"},
                                  "hashtags": {"type": "string"}
                              },
                              "required": [
                                  "title",
                                  "script",
                                  "final_line",
                                  "description",
                                  "keywords",
                                  "hashtags"
                              ],
                              "additionalProperties": False
                          }
                      }
                  },
                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ]
              }

              data = json.dumps(payload).encode("utf-8")

              for attempt in range(retries):
                  req = urllib.request.Request(
                      ENDPOINT,
                      data=data,
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": "Bearer " + API_KEY,
                          "User-Agent": "QuietVaultAI/9.0"
                      },
                      method="POST"
                  )

                  try:
                      with urllib.request.urlopen(req, timeout=90) as r:
                          response = json.loads(r.read().decode("utf-8"))

                      content = response["choices"][0]["message"]["content"]

                      if not content:
                          raise RuntimeError("Groq returned empty content")

                      return json.loads(content)

                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", errors="ignore")

                      if e.code == 429:
                          retry_after = e.headers.get("retry-after")
                          wait = float(retry_after) if retry_after else 20.0
                          print(f"RATE LIMITED. Waiting {wait:.1f}s...")
                          time.sleep(wait + 2)
                          continue

                      print("GROQ ERROR:", e.code, body)
                      if attempt == retries - 1:
                          return None
                      time.sleep(5)

                  except Exception as e:
                      print("GENERATION ERROR:", repr(e))
                      if attempt == retries - 1:
                          return None
                      time.sleep(5)

              return None

          # ============================================================
          # HARD VALIDATION
          # ============================================================

          BANNED = [
              "child", "children", "kid", "baby", "boy", "girl",
              "teen", "teenager", "minor",
              "mirror", "reflection", "reflect",
              "doppelganger", "double", "twin", "clone",
              "ghost", "demon", "monster", "zombie",
              "gore", "blood", "corpse",
              "cctv", "surveillance", "security camera",
              "elevator", "hotel", "train",
              "printer", "video call", "facetime",
              "phone screen",
              "shadow figure", "silhouette",
              "disappear", "vanish", "teleport",
              "face distorted", "body distorted"
          ]

          def validate(short, mechanism):
              if not short:
                  return False, "No response"

              required = [
                  "title", "script", "final_line",
                  "description", "keywords", "hashtags"
              ]

              for field in required:
                  if not isinstance(short.get(field), str):
                      return False, f"Missing {field}"

              script = short["script"].strip()

              words = script.split()

              if len(words) < 18:
                  return False, "Script too short"

              if len(words) > 75:
                  return False, "Script too long"

              lower = script.lower()

              for banned in BANNED:
                  pattern = r"\b" + re.escape(banned) + r"\b"
                  if re.search(pattern, lower):
                      return False, f"Banned term: {banned}"

              # Must retain the mechanism's central visual idea.
              visual_terms = {
                  "personal_object": ["watch"],
                  "photo_from_inside": ["photograph", "photo"],
                  "bed_position": ["bed"],
                  "wrong_clothes": ["cardigan"],
                  "reserved_seat": ["chair", "seat"],
                  "wrong_room": ["key"],
                  "family_photo": ["photograph", "photo"],
                  "wrong_person_action": ["breakfast"],
                  "wrong_address": ["address"],
                  "locked_room_guest": ["study", "desk"],
                  "wrong_belonging": ["father"],
                  "wrong_door": ["bedroom"],
                  "wrong_dinner": ["dinner", "wife"],
                  "wrong_bedside": ["bed", "lamp"],
                  "wrong_desk": ["desk", "notebook"]
              }

              expected = visual_terms.get(mechanism["id"], [])

              if expected and not any(x in lower for x in expected):
                  return False, "Mechanism disappeared from script"

              # Should contain an adult stranger / unfamiliar person concept.
              stranger_terms = [
                  "stranger", "unfamiliar man", "unfamiliar woman",
                  "unknown man", "unknown woman"
              ]

              if not any(x in lower for x in stranger_terms):
                  return False, "No clear unfamiliar adult"

              return True, "PASS"

          # ============================================================
          # FLOW PROMPT BUILDER
          # ============================================================

          def build_flow(mechanism, short):
              script = short["script"].replace('"', '\\"')

              return f"""
          Create a 9–12 second vertical 9:16 photorealistic live-action
          psychological horror short.

          FICTIONAL ADULT ACTORS ONLY.
          No children, teenagers, celebrities, or resemblance to real people.

          LOCATION:
          {mechanism["location"]}.

          FIRST FRAME — CRITICAL:
          {mechanism["visual"]}

          The first frame must clearly show the visual contradiction.
          Do not begin with an establishing shot.
          Do not hide the important object or person.

          CENTRAL HORROR:
          {mechanism["contradiction"]}

          ACTION:
          Start immediately with the visual situation.
          The protagonist notices what is wrong.
          The unfamiliar adult remains calm.
          Use natural restrained acting.

          DIALOGUE:
          Use this exact short script:

          {script}

          ENDING:
          {mechanism["ending_direction"]}

          End immediately after the final disturbing line.
          HARD CUT. No fade to black.

          CAMERA:
          Medium-wide cinematic composition.
          Keep the protagonist, unfamiliar adult, and important visual
          object/location visible whenever possible.
          Natural handheld realism.
          No unnecessary camera movement.

          STYLE:
          Photorealistic live-action.
          Realistic adult human movement.
          Natural facial expressions.
          Realistic apartment lighting.
          Psychological horror, not fantasy.

          STRICTLY DO NOT INCLUDE:
          children, teenagers, mirrors, reflections, twins, doppelgängers,
          clones, ghosts, demons, monsters, zombies, gore, blood,
          body transformation, disappearing people, teleportation,
          CCTV, surveillance footage, phone screens, video calls,
          extra characters, extra dialogue, subtitles, text overlays,
          magical effects, exaggerated facial expressions.

          Do not add another twist.
          Do not change the central visual mechanism.
          Do not replace the unfamiliar adult with a supernatural creature.
          """

          # ============================================================
          # SELECT MECHANISMS
          #
          # Rotate through the library between GitHub runs.
          # ============================================================

          start = ((RUN_NUMBER - 1) * 3) % len(MECHANISMS)

          ordered = (
              MECHANISMS[start:] +
              MECHANISMS[:start]
          )

          approved = []
          attempts = 0

          print("")
          print("==============================================")
          print(" QUIET VAULT V9 - VISUAL HORROR ENGINE")
          print("==============================================")
          print(f"RUN: {RUN_NUMBER}")
          print(f"MODEL: {MODEL}")
          print("TARGET: 3 APPROVED SHORTS")
          print("")

          # ============================================================
          # GENERATE UNTIL 3 PASS
          # ============================================================

          for mechanism in ordered:

              if len(approved) >= 3:
                  break

              if attempts >= 7:
                  break

              attempts += 1

              print("----------------------------------------------")
              print(f"MECHANISM: {mechanism['name']}")
              print("----------------------------------------------")

              prompt = f"""
          {DNA}

          You are writing ONE short for the fixed visual mechanism below.

          IMPORTANT:
          You are NOT allowed to invent a different horror mechanism.
          You are NOT writing a list.
          Write exactly ONE short.

          FIXED MECHANISM:
          {mechanism['name']}

          LOCATION:
          {mechanism['location']}

          VISUAL THAT MUST EXIST:
          {mechanism['visual']}

          CENTRAL CONTRADICTION:
          {mechanism['contradiction']}

          ENDING DIRECTION:
          {mechanism['ending_direction']}

          WRITING RULES:
          - 9–12 second spoken script
          - approximately 35–60 words
          - first sentence should establish the visual situation immediately
          - protagonist asks at most one question
          - unfamiliar adult gets one short final line
          - final line must make the existing visual situation more disturbing
          - no exposition
          - no supernatural terminology
          - no complicated explanation
          - no extra characters
          - no second twist
          - do not mention children
          - do not use mirrors, reflections, twins or doppelgängers
          - keep everything realistic

          The final line MUST connect directly to the fixed mechanism.

          Return JSON only.
          """

              short = groq_call(prompt)

              ok, reason = validate(short, mechanism)

              print("VALIDATION:", reason)

              if not ok:
                  continue

              flow = build_flow(mechanism, short)

              package = {
                  "slot": len(approved) + 1,
                  "mechanism": mechanism["name"],
                  "title": short["title"],
                  "short_script": short["script"],
                  "visual_hook": mechanism["visual"],
                  "flow_prompt": flow,
                  "final_twist": short["final_line"],
                  "description": short["description"],
                  "keywords": short["keywords"],
                  "hashtags": short["hashtags"],
                  "thumbnail_frame": "Use approximately 0.5–1.5 seconds, showing the protagonist and unfamiliar adult together with the central visual contradiction clearly visible.",
                  "thumbnail_text": "",
                  "sound_design": "Low realistic room tone, subtle tension bed, natural footsteps/door sound, dialogue clearly audible. Hard cut immediately after final line.",
                  "pinned_comment": "Would you have stayed in the room?"
              }

              approved.append(package)

              print("APPROVED:", short["title"])

              # Small spacing between successful requests.
              time.sleep(8)

          # ============================================================
          # SAVE RESULTS
          # ============================================================

          if len(approved) < 3:
              print("")
              print("WARNING: Fewer than 3 Shorts passed validation.")
              print(f"Approved: {len(approved)}")
              print("No weak filler Shorts will be created.")
          else:
              print("")
              print("SUCCESS: 3 Shorts approved.")

          result = {
              "run": RUN_NUMBER,
              "provider": "groq",
              "model": MODEL,
              "engine": "V9 Visual Horror Mechanism Engine",
              "generated": attempts,
              "approved": len(approved),
              "shorts": approved
          }

          with open(OUT / "batch.json", "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2, ensure_ascii=False)

          for i, short in enumerate(approved, 1):
              path = OUT / f"short_{i:02d}.md"

              with open(path, "w", encoding="utf-8") as f:
                  f.write(f"# {short['title']}\n\n")
                  f.write("## Script\n\n")
                  f.write(short["short_script"] + "\n\n")
                  f.write("## Visual Hook\n\n")
                  f.write(short["visual_hook"] + "\n\n")
                  f.write("## Google Flow Prompt\n\n")
                  f.write("```text\n")
                  f.write(short["flow_prompt"])
                  f.write("\n```\n\n")
                  f.write("## Final Twist\n\n")
                  f.write(short["final_twist"] + "\n\n")
                  f.write("## Description\n\n")
                  f.write("```text\n")
                  f.write(short["description"])
                  f.write("\n```\n\n")
                  f.write("## Keywords\n\n")
                  f.write("```text\n")
                  f.write(short["keywords"])
                  f.write("\n```\n\n")
                  f.write("## Hashtags\n\n")
                  f.write("```text\n")
                  f.write(short["hashtags"])
                  f.write("\n```\n\n")
                  f.write("## Thumbnail\n\n")
                  f.write(short["thumbnail_frame"] + "\n")
                  f.write(short["thumbnail_text"] + "\n\n")
                  f.write("## Sound Design\n\n")
                  f.write(short["sound_design"] + "\n\n")
                  f.write("## Pinned Comment\n\n")
                  f.write(short["pinned_comment"] + "\n")

          print("")
          print("==============================================")
          print("OUTPUT FILES CREATED")
          print("==============================================")
          print(f"Approved Shorts: {len(approved)}")

          PY

      - name: Upload generated Shorts package
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-v9-shorts
          path: quiet-vault-output/
