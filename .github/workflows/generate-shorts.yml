name: Quiet Vault AI - Generate Shorts

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error

          API_KEY = os.environ["GROQ_API_KEY"]
          URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          # ============================================================
          # 20-MECHANISM HORROR LIBRARY
          # ============================================================

          SEEDS = [
              {
                  "id": 1,
                  "location": "apartment bedroom",
                  "visual": (
                      "A fictional adult woman stands in her bedroom doorway. "
                      "An unfamiliar adult man is sitting openly on her bed, holding her house keys "
                      "in one hand and a kitchen knife in the other. Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "The man calmly says her late husband invited him into the apartment."
                  ),
                  "payoff": (
                      "She says her husband died three years ago. The man answers that he knows, "
                      "because the husband gave him the key the night before he died."
                  )
              },
              {
                  "id": 2,
                  "location": "apartment kitchen",
                  "visual": (
                      "A fictional adult couple stand together in their kitchen. "
                      "An unfamiliar adult man is seated openly at their table, holding their apartment key. "
                      "All three adults are clearly visible."
                  ),
                  "mechanism": (
                      "The stranger repeats one private sentence from an argument the couple had alone."
                  ),
                  "payoff": (
                      "He then gives the exact time of the argument and asks why they stopped "
                      "when someone knocked on the door."
                  )
              },
              {
                  "id": 3,
                  "location": "private office",
                  "visual": (
                      "A fictional adult man stands inside his private office. "
                      "An unfamiliar adult woman sits in his desk chair, holding his access badge "
                      "and a pair of office scissors. Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "She says she was sent to collect an object hidden in his locked desk."
                  ),
                  "payoff": (
                      "She names the exact drawer and exact object inside it before he opens the drawer."
                  )
              },
              {
                  "id": 4,
                  "location": "hospital room",
                  "visual": (
                      "A fictional adult man enters a private hospital room. "
                      "An unfamiliar adult man is already sitting beside the visitor chair, holding the patient's phone. "
                      "Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "The stranger says the patient asked him to deliver a message before the visitor arrived."
                  ),
                  "payoff": (
                      "The message contains a private sentence the visitor only said to the patient that morning."
                  )
              },
              {
                  "id": 5,
                  "location": "restaurant private dining room",
                  "visual": (
                      "A fictional adult woman enters a private dining room. "
                      "An unfamiliar adult man is seated opposite her husband, holding the husband's wedding ring. "
                      "All three adults are clearly visible."
                  ),
                  "mechanism": (
                      "The stranger says her husband left the ring with him during a meeting."
                  ),
                  "payoff": (
                      "Her husband denies meeting him, and the stranger names the exact restaurant "
                      "where the husband claimed he was that night."
                  )
              },
              {
                  "id": 6,
                  "location": "apartment hallway",
                  "visual": (
                      "A fictional adult woman has opened her apartment door. "
                      "An unfamiliar adult man is already standing inside, holding a spare apartment key "
                      "and a framed family photograph. Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "The stranger says he found the photograph inside the apartment before she moved in."
                  ),
                  "payoff": (
                      "He points to a person in the photograph and gives a detail about that person's life "
                      "that contradicts what she was told."
                  )
              },
              {
                  "id": 7,
                  "location": "apartment study",
                  "visual": (
                      "A fictional adult man stands in his study. "
                      "An unfamiliar adult woman is seated at the desk, holding a locked metal key box "
                      "and looking directly at him. Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "She says he asked her to open the box and gives him the combination."
                  ),
                  "payoff": (
                      "He never gave anyone the combination, yet it is the same private number he uses "
                      "for an important personal date."
                  )
              },
              {
                  "id": 8,
                  "location": "office conference room",
                  "visual": (
                      "A fictional adult woman enters an office conference room. "
                      "An unfamiliar adult man is already seated at the table, holding a handwritten note "
                      "with her name on it. Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "The man says the note was written by her and asks why she changed the last sentence."
                  ),
                  "payoff": (
                      "She recognizes the handwriting, but she has not written the note yet."
                  )
              },
              {
                  "id": 9,
                  "location": "apartment living room",
                  "visual": (
                      "A fictional adult man enters his living room. "
                      "An unfamiliar adult woman is openly sitting in his chair, holding his wallet and a house key. "
                      "Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "She says she was waiting for him because he called her from the apartment."
                  ),
                  "payoff": (
                      "He checks his phone and sees a call from his own number while his phone is in his hand."
                  )
              },
              {
                  "id": 10,
                  "location": "hospital waiting room",
                  "visual": (
                      "A fictional adult woman sits in a hospital waiting room. "
                      "An unfamiliar adult man sits directly opposite her, holding her purse and a small knife. "
                      "Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "He says she left the purse with him when she came through the hospital doors."
                  ),
                  "payoff": (
                      "She has been holding the same purse the entire time and realizes the stranger has another one."
                  )
              },
              {
                  "id": 11,
                  "location": "apartment dining room",
                  "visual": (
                      "A fictional adult couple stand beside their dining table. "
                      "An unfamiliar adult woman is seated in their empty chair, holding a sealed envelope addressed to both of them. "
                      "All three adults are clearly visible."
                  ),
                  "mechanism": (
                      "The woman says the envelope was meant to be opened after their anniversary."
                  ),
                  "payoff": (
                      "Their anniversary is six months away, but the envelope is dated tomorrow."
                  )
              },
              {
                  "id": 12,
                  "location": "private office",
                  "visual": (
                      "A fictional adult man stands at his office doorway. "
                      "An unfamiliar adult man is inside holding a personal photograph and a box cutter. "
                      "Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "The stranger claims the photograph was taken inside the man's office."
                  ),
                  "payoff": (
                      "The photograph shows the man asleep at his desk from inside the locked room."
                  )
              },
              {
                  "id": 13,
                  "location": "apartment kitchen",
                  "visual": (
                      "A fictional adult woman stands in her kitchen. "
                      "An unfamiliar adult man is openly standing beside the counter, holding a house key "
                      "and a folded coat. Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "He says the coat belongs to her brother and that her brother asked him to return it."
                  ),
                  "payoff": (
                      "She says her brother never owned that coat. The stranger then gives her the brother's private nickname."
                  )
              },
              {
                  "id": 14,
                  "location": "restaurant corridor",
                  "visual": (
                      "A fictional adult man stands in a restaurant corridor. "
                      "An unfamiliar adult woman is openly standing at a private-room door, holding a reservation card "
                      "and a kitchen knife. Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "She says he reserved the room for the two of them."
                  ),
                  "payoff": (
                      "He never made the reservation, but the card contains his handwriting and tomorrow's date."
                  )
              },
              {
                  "id": 15,
                  "location": "apartment study",
                  "visual": (
                      "A fictional adult woman enters her study. "
                      "An unfamiliar adult man is seated at her desk, holding an old cassette recorder and a key. "
                      "Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "He says he brought back a recording she asked him to make."
                  ),
                  "payoff": (
                      "The recording contains her voice describing the exact room she is standing in, "
                      "but the recording is dated next week."
                  )
              },
              {
                  "id": 16,
                  "location": "hospital corridor",
                  "visual": (
                      "A fictional adult man stands outside a hospital room. "
                      "An unfamiliar adult woman is already standing beside the door, holding his missing wristwatch. "
                      "Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "She says he gave her the watch earlier that evening."
                  ),
                  "payoff": (
                      "He checks his wrist and realizes he is still wearing the same watch."
                  )
              },
              {
                  "id": 17,
                  "location": "apartment entryway",
                  "visual": (
                      "A fictional adult woman stands inside her apartment entryway. "
                      "An unfamiliar adult man is openly sitting on a bench, holding a handwritten note and a key. "
                      "Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "He says the note tells him exactly when she will come home."
                  ),
                  "payoff": (
                      "The note contains the exact time she entered the apartment and describes the clothes she is wearing now."
                  )
              },
              {
                  "id": 18,
                  "location": "office break room",
                  "visual": (
                      "A fictional adult man enters an office break room. "
                      "An unfamiliar adult woman is already seated at the table, holding his employee badge "
                      "and a sealed lunch box. Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "She says he asked her to keep the lunch for him."
                  ),
                  "payoff": (
                      "He opens it and finds a meal he ordered for tomorrow, including a note written in his own handwriting."
                  )
              },
              {
                  "id": 19,
                  "location": "apartment bedroom",
                  "visual": (
                      "A fictional adult couple stand in their bedroom. "
                      "An unfamiliar adult woman is openly seated on the edge of their bed, holding a framed photograph of the couple. "
                      "All three adults are clearly visible."
                  ),
                  "mechanism": (
                      "She says the photograph was taken during their first night in the apartment."
                  ),
                  "payoff": (
                      "The couple has never seen the photograph, and the stranger identifies the exact date they moved in."
                  )
              },
              {
                  "id": 20,
                  "location": "private office",
                  "visual": (
                      "A fictional adult woman enters her private office. "
                      "An unfamiliar adult man is openly standing beside her desk, holding her office key and a sealed envelope. "
                      "Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "He says she asked him to deliver the envelope after she finished reading another letter."
                  ),
                  "payoff": (
                      "She has never met him, but the envelope contains the letter she is currently holding."
                  )
              }
          ]

          # ============================================================
          # GROQ API
          # ============================================================

          def groq_call(messages, schema, max_tokens=2200, retries=5):

              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": 0.65,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": schema["name"],
                          "strict": True,
                          "schema": schema["schema"]
                      }
                  }
              }

              data = json.dumps(payload).encode("utf-8")

              for attempt in range(retries):

                  request = urllib.request.Request(
                      URL,
                      data=data,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      }
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=120
                      ) as response:

                          result = json.loads(
                              response.read().decode("utf-8")
                          )

                          content = (
                              result["choices"][0]["message"]["content"]
                          )

                          return json.loads(content)

                  except urllib.error.HTTPError as error:

                      body = error.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

                      print(
                          f"GROQ HTTP ERROR {error.code}: {body}"
                      )

                      if (
                          error.code == 429
                          and attempt < retries - 1
                      ):

                          retry_after = error.headers.get(
                              "retry-after"
                          )

                          try:
                              wait_seconds = max(
                                  65,
                                  int(float(retry_after)) + 2
                              )
                          except Exception:
                              wait_seconds = 65

                          print(
                              f"Rate limit detected. "
                              f"Waiting {wait_seconds} seconds..."
                          )

                          time.sleep(wait_seconds)
                          continue

                      raise

                  except Exception as error:

                      print(
                          f"GROQ ERROR: {error}"
                      )

                      if attempt < retries - 1:

                          print(
                              "Retrying in 10 seconds..."
                          )

                          time.sleep(10)
                          continue

                      raise

          # ============================================================
          # ROTATE THROUGH THE 20-MECHANISM LIBRARY
          # ============================================================

          run_number = int(
              os.environ.get(
                  "GITHUB_RUN_NUMBER",
                  "1"
              )
          )

          start_index = (
              ((run_number - 1) * 6)
              % len(SEEDS)
          )

          selected_seeds = [
              SEEDS[
                  (start_index + offset)
                  % len(SEEDS)
              ]
              for offset in range(6)
          ]

          print("")
          print("==============================================")
          print("QUIET VAULT - MECHANISM LIBRARY")
          print("==============================================")

          for seed in selected_seeds:

              print(
                  f"Seed {seed['id']}: "
                  f"{seed['location']}"
              )

          seed_text = "\n\n".join(
              f"""
          SEED {seed['id']}

          LOCATION:
          {seed['location']}

          FIXED VISUAL:
          {seed['visual']}

          FIXED MECHANISM:
          {seed['mechanism']}

          FIXED PAYOFF:
          {seed['payoff']}
          """
              for seed in selected_seeds
          )

          # ============================================================
          # STORY BLUEPRINT SCHEMA
          # ============================================================

          blueprint_schema = {
              "name": "quiet_vault_blueprints",
              "schema": {
                  "type": "object",
                  "properties": {
                      "stories": {
                          "type": "array",
                          "items": {
                              "type": "object",
                              "properties": {
                                  "id": {
                                      "type": "integer"
                                  },
                                  "title": {
                                      "type": "string"
                                  },
                                  "hook_line": {
                                      "type": "string"
                                  },
                                  "middle_line": {
                                      "type": "string"
                                  },
                                  "ending_line": {
                                      "type": "string"
                                  }
                              },
                              "required": [
                                  "id",
                                  "title",
                                  "hook_line",
                                  "middle_line",
                                  "ending_line"
                              ],
                              "additionalProperties": False
                          }
                      }
                  },
                  "required": [
                      "stories"
                  ],
                  "additionalProperties": False
              }
          }

          # ============================================================
          # GENERATE STORIES
          # ============================================================

          generator_prompt = f"""
          Write six ultra-short realistic cinematic horror Shorts.

          There is ONE story for each supplied seed.

          The visual, mechanism and payoff are FIXED.

          Do not replace them.

          Do not invent a different horror mechanism.

          Do not remove the visible adult threat.

          Do not introduce:
          children, babies, minors, ghosts, demons, monsters,
          mirrors, reflections, twins, doppelgangers, CCTV,
          surveillance, elevators, cars, hotels, trains, gore,
          blood, or supernatural mythology.

          Each story has exactly three spoken lines:

          HOOK:
          Immediately identify what is wrong.

          MIDDLE:
          Develop the supplied contradiction.

          ENDING:
          Deliver the supplied payoff.

          Total spoken words must be between 25 and 45 words.

          Do not add characters.

          Do not explain the entire backstory.

          Do not use:
          "little did she know"
          "what happened next"
          "you won't believe"
          "everything changed"

          The final line should be the disturbing realization.

          Keep the stories realistic.

          SEEDS:

          {seed_text}
          """

          print("")
          print("==============================================")
          print("STAGE 1: GENERATING STORIES")
          print("==============================================")

          generated = groq_call(
              [
                  {
                      "role": "system",
                      "content": (
                          "You are a concise realistic horror writer. "
                          "Follow the fixed mechanism exactly."
                      )
                  },
                  {
                      "role": "user",
                      "content": generator_prompt
                  }
              ],
              blueprint_schema,
              max_tokens=2200
          )

          stories = generated["stories"]

          print(
              f"Groq returned {len(stories)} stories."
          )

          seed_map = {
              seed["id"]: seed
              for seed in selected_seeds
          }

          candidates = []

          for story in stories:

              story_id = story.get("id")

              if story_id not in seed_map:
                  continue

              seed = seed_map[story_id]

              candidates.append({
                  "id": story_id,
                  "title": story["title"].strip(),
                  "hook_line": story["hook_line"].strip(),
                  "middle_line": story["middle_line"].strip(),
                  "ending_line": story["ending_line"].strip(),
                  "location": seed["location"],
                  "static_frame_1": seed["visual"],
                  "fixed_mechanism": seed["mechanism"],
                  "fixed_payoff": seed["payoff"]
              })

          # ============================================================
          # OBJECTIVE FILTER
          # ============================================================

          banned_terms = [
              "child",
              "children",
              "kid",
              "baby",
              "boy",
              "girl",
              "minor",
              "nursery",
              "babysitter",
              "mirror",
              "reflection",
              "reflected",
              "twin",
              "doppelganger",
              "cctv",
              "surveillance",
              "security camera",
              "elevator",
              "car",
              "vehicle",
              "hotel",
              "train",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "gore",
              "blood",
              "supernatural"
          ]

          def contains_banned(text):

              lowered = text.lower()

              for term in banned_terms:

                  pattern = (
                      r"(?<![a-z])"
                      + re.escape(term)
                      + r"(?![a-z])"
                  )

                  if re.search(
                      pattern,
                      lowered
                  ):
                      return True

              return False

          clean_candidates = []

          for candidate in candidates:

              spoken = " ".join([
                  candidate["hook_line"],
                  candidate["middle_line"],
                  candidate["ending_line"]
              ])

              if contains_banned(spoken):

                  print(
                      f"OBJECTIVE REJECT "
                      f"{candidate['id']}: banned content"
                  )

                  continue

              word_count = len(
                  spoken.split()
              )

              if word_count < 20:

                  print(
                      f"OBJECTIVE REJECT "
                      f"{candidate['id']}: "
                      f"only {word_count} words"
                  )

                  continue

              if word_count > 50:

                  print(
                      f"OBJECTIVE REJECT "
                      f"{candidate['id']}: "
                      f"{word_count} words"
                  )

                  continue

              clean_candidates.append(
                  candidate
              )

          print("")
          print(
              f"Usable concepts: "
              f"{len(clean_candidates)}"
          )

          if len(clean_candidates) < 3:

              raise RuntimeError(
                  "Fewer than 3 usable concepts were generated."
              )

          # ============================================================
          # SELECT THREE
          # ============================================================

          selected = clean_candidates[:3]

          print("")
          print("SELECTED:")

          for candidate in selected:

              print(
                  f"  {candidate['id']} - "
                  f"{candidate['title']}"
              )

          # ============================================================
          # RATE LIMIT BUFFER
          # ============================================================

          print("")
          print(
              "Waiting 65 seconds before finalization..."
          )

          time.sleep(65)

          # ============================================================
          # FINAL PACKAGE SCHEMA
          # ============================================================

          final_schema = {
              "name": "quiet_vault_final_short",
              "schema": {
                  "type": "object",
                  "properties": {
                      "id": {
                          "type": "integer"
                      },
                      "title": {
                          "type": "string"
                      },
                      "short_script": {
                          "type": "string"
                      },
                      "flow_prompt": {
                          "type": "string"
                      },
                      "final_twist": {
                          "type": "string"
                      },
                      "description": {
                          "type": "string"
                      },
                      "keywords": {
                          "type": "string"
                      },
                      "hashtags": {
                          "type": "string"
                      },
                      "thumbnail_frame": {
                          "type": "string"
                      },
                      "thumbnail_text": {
                          "type": "string"
                      },
                      "sound_design": {
                          "type": "string"
                      },
                      "pinned_comment": {
                          "type": "string"
                      }
                  },
                  "required": [
                      "id",
                      "title",
                      "short_script",
                      "flow_prompt",
                      "final_twist",
                      "description",
                      "keywords",
                      "hashtags",
                      "thumbnail_frame",
                      "thumbnail_text",
                      "sound_design",
                      "pinned_comment"
                  ],
                  "additionalProperties": False
              }
          }

          # ============================================================
          # FINALIZE THREE SHORTS
          # ============================================================

          final_outputs = []

          for index, candidate in enumerate(
              selected
          ):

              print("")
              print(
                  f"STAGE 2: FINALIZING "
                  f"{index + 1}/3 - "
                  f"{candidate['title']}"
              )

              final_prompt = f"""
          Create the final production package for this realistic
          9–12 second horror YouTube Short.

          FIXED STORY:

          TITLE:
          {candidate['title']}

          HOOK:
          {candidate['hook_line']}

          MIDDLE:
          {candidate['middle_line']}

          ENDING:
          {candidate['ending_line']}

          FIXED FIRST FRAME:
          {candidate['static_frame_1']}

          FIXED MECHANISM:
          {candidate['fixed_mechanism']}

          FIXED PAYOFF:
          {candidate['fixed_payoff']}

          ============================================================
          SCRIPT
          ============================================================

          Write the final spoken script.

          Maximum 45 words.

          Keep the supplied three-part story.

          Do not add characters.

          Do not add plot points.

          Do not explain the backstory.

          The first sentence must immediately establish the problem.

          The final sentence must be the disturbing payoff.

          Cut immediately after the payoff.

          ============================================================
          GOOGLE FLOW PROMPT
          ============================================================

          Create ONE Google Flow-ready prompt.

          Requirements:

          - vertical 9:16
          - photorealistic live action
          - fictional adults only
          - no celebrity likeness
          - no real-person likeness
          - realistic faces
          - realistic movement
          - realistic lighting
          - believable cinematic camera
          - consistent characters
          - preserve the exact first frame
          - no children
          - no mirrors
          - no reflections
          - no CCTV
          - no ghosts
          - no monsters
          - no gore
          - no supernatural effects

          EXACT FIRST FRAME:

          {candidate['static_frame_1']}

          Do not replace this visual.

          The rest of the clip should simply act out
          the three supplied spoken lines.

          ============================================================
          FINAL TWIST
          ============================================================

          State the actual final reveal in one or two sentences.

          ============================================================
          DESCRIPTION
          ============================================================

          Write a short natural YouTube description.

          ============================================================
          KEYWORDS
          ============================================================

          Give comma-separated relevant keywords.

          ============================================================
          HASHTAGS
          ============================================================

          Give 4–6 relevant hashtags.

          ============================================================
          THUMBNAIL
          ============================================================

          Choose the strongest frame.

          Give:
          - exact moment
          - optional thumbnail text

          Thumbnail text must be 2–4 words maximum.

          Do not reveal the twist.

          ============================================================
          SOUND DESIGN
          ============================================================

          Give simple realistic sound cues.

          ============================================================
          PINNED COMMENT
          ============================================================

          Ask a question that encourages comments
          without revealing the ending.
          """

              final_result = groq_call(
                  [
                      {
                          "role": "system",
                          "content": (
                              "You are the final production editor "
                              "for The Quiet Vault. Preserve the "
                              "supplied story and visual."
                          )
                      },
                      {
                          "role": "user",
                          "content": final_prompt
                      }
                  ],
                  final_schema,
                  max_tokens=1700
              )

              final_outputs.append(
                  final_result
              )

              if index < len(selected) - 1:

                  print(
                      "Waiting 12 seconds..."
                  )

                  time.sleep(12)

          # ============================================================
          # SAVE OUTPUT
          # ============================================================

          os.makedirs(
              "output",
              exist_ok=True
          )

          with open(
              "output/quiet-vault-shorts.json",
              "w",
              encoding="utf-8"
          ) as output_file:

              json.dump(
                  {
                      "generated_at": time.strftime(
                          "%Y-%m-%d %H:%M:%S UTC"
                      ),
                      "shorts": final_outputs
                  },
                  output_file,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              "output/quiet-vault-shorts.txt",
              "w",
              encoding="utf-8"
          ) as output_file:

              for number, short in enumerate(
                  final_outputs,
                  1
              ):

                  output_file.write(
                      "=" * 70 + "\n"
                  )

                  output_file.write(
                      f"SHORT {number}\n"
                  )

                  output_file.write(
                      "=" * 70 + "\n\n"
                  )

                  output_file.write(
                      "TITLE:\n"
                      + short["title"]
                      + "\n\n"
                  )

                  output_file.write(
                      "SCRIPT:\n"
                      + short["short_script"]
                      + "\n\n"
                  )

                  output_file.write(
                      "GOOGLE FLOW PROMPT:\n"
                      + short["flow_prompt"]
                      + "\n\n"
                  )

                  output_file.write(
                      "FINAL TWIST:\n"
                      + short["final_twist"]
                      + "\n\n"
                  )

                  output_file.write(
                      "DESCRIPTION:\n"
                      + short["description"]
                      + "\n\n"
                  )

                  output_file.write(
                      "KEYWORDS:\n"
                      + short["keywords"]
                      + "\n\n"
                  )

                  output_file.write(
                      "HASHTAGS:\n"
                      + short["hashtags"]
                      + "\n\n"
                  )

                  output_file.write(
                      "THUMBNAIL FRAME:\n"
                      + short["thumbnail_frame"]
                      + "\n\n"
                  )

                  output_file.write(
                      "THUMBNAIL TEXT:\n"
                      + short["thumbnail_text"]
                      + "\n\n"
                  )

                  output_file.write(
                      "SOUND DESIGN:\n"
                      + short["sound_design"]
                      + "\n\n"
                  )

                  output_file.write(
                      "PINNED COMMENT:\n"
                      + short["pinned_comment"]
                      + "\n\n"
                  )

          print("")
          print("==============================================")
          print("QUIET VAULT AI GENERATION SUCCESS")
          print("==============================================")
          print(
              f"Generated {len(final_outputs)} Shorts."
          )
          print("==============================================")
          PY

      - name: Upload generated Shorts package
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts
          path: output/
          if-no-files-found: error
