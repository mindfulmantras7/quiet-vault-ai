          ## Description

          {package['description']}

          ## Keywords

          {package['keywords']}

          ## Hashtags

          {package['hashtags']}

          ## Thumbnail Frame

          {package['thumbnail_frame']}

          ## Thumbnail Text

          {package['thumbnail_text']}
          """

              with open(
                  OUTPUT_DIR
                  / f"short_{index:02d}.md",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(markdown)


          # ============================================================
          # SUCCESS
          # ============================================================

          print("")
          print("=" * 60)
          print("SUCCESS")
          print("=" * 60)

          print(
              f"Generated "
              f"{len(final_packages)} "
              f"approved Shorts."
          )

          print(
              "All three passed the strict creative gate."
          )

          print(
              f"Output: "
              f"{OUTPUT_DIR}"
          )

          PY

          python generate.py

