name: Quiet Vault AI - Evidence Based Generator

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # GENERATE, FILTER, JUDGE AND FINALIZE
      # ============================================================

      - name: Generate evidence-based Quiet Vault Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |

          cat > generate.py <<'PY'

          import os
          import json
          import re
          import time
          import urllib.request
          import urllib.error


          # ============================================================
          # CONFIG
          # ============================================================

          API_KEY = os.environ["GROQ_API_KEY"]

          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"

          MODEL = "openai/gpt-oss-20b"


          # ============================================================
          # GROQ REQUEST
          # ============================================================

          def groq_request(
              messages,
              schema_name,
              schema,
              temperature,
              max_tokens,
              retries=4
          ):

              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden",
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": schema_name,
                          "strict": True,
                          "schema": schema
                      }
                  }
              }

              data = json.dumps(payload).encode("utf-8")

              for attempt in range(retries):

                  request = urllib.request.Request(
                      ENDPOINT,
                      data=data,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      }
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          body = response.read().decode("utf-8")
                          result = json.loads(body)

                          content = result["choices"][0]["message"]["content"]

                          return json.loads(content)

                  except urllib.error.HTTPError as e:

                      error_body = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print("")
                      print("==========================================")
                      print("GROQ ERROR")
                      print("HTTP:", e.code)
                      print(error_body)
                      print("==========================================")

                      if e.code == 429 and attempt < retries - 1:

                          retry_seconds = 65

                          match = re.search(
                              r"retry-after[^0-9]*([0-9]+)",
                              error_body,
                              re.I
                          )

                          if match:
                              retry_seconds = max(
                                  65,
                                  int(match.group(1)) + 5
                              )

                          print(
                              f"Rate limited. Waiting {retry_seconds} seconds..."
                          )

                          time.sleep(retry_seconds)

                          continue

                      raise RuntimeError(
                          f"Groq returned HTTP {e.code}"
                      )


          # ============================================================
          # HISTORICAL CREATIVE DNA
          # ============================================================

          CREATIVE_DNA = """

          THE QUIET VAULT — HISTORICAL CREATIVE DNA

          The channel's strongest observed Shorts demonstrated:

          1. IMMEDIATE VISUAL PROBLEM

          The viewer should see something wrong before they need to
          understand the entire story.

          The first frame must contain a person, object, action or situation
          that is obviously out of place.

          Do not begin with:
          - someone walking into a room
          - empty room
          - normal establishing shot
          - person simply looking worried
          - ordinary conversation
          - atmospheric darkness

          The first screenshot should already make the viewer ask:

          "Why is THAT person there?"

          or:

          "How is THAT possible?"

          or:

          "Why is THAT happening?"



          2. VISIBLE THREAT

          Horror should be physically visible.

          A strange adult standing somewhere they should not be.

          A stranger holding something that belongs to the protagonist.

          An adult doing something that proves they know impossible/private
          information.

          An adult occupying a place that should be inaccessible.

          The viewer should not need narration to discover that something
          is wrong.



          3. SIMPLE CONTRADICTION

          The strongest structure is:

          NORMAL REALITY
          +
          ONE IMPOSSIBLE CONTRADICTION
          +
          SECOND REALIZATION

          Do not build mythology.

          Do not explain ghosts.

          Do not explain supernatural rules.

          Do not create elaborate backstory.

          One contradiction is enough.



          4. RELATIONSHIP OR PERSONAL STAKES

          Family/relationship context has been useful.

          Preferred adult relationships:

          husband / wife
          brother / sister
          adult siblings
          close friends
          roommates
          colleagues
          neighbors
          ex-partners

          Adults only.

          Never use children or minors.



          5. REWATCH VALUE

          The viewer should be able to notice a clue on replay.

          Good:

          "He said he came yesterday."

          while the protagonist knows he was not there.

          Bad:

          "The ancient demon of the house appears because..."

          The viewer should understand the premise immediately and discover
          one additional implication after thinking about it.



          6. GOOGLE FLOW FEASIBILITY

          Prefer:

          - 2 or 3 adults maximum
          - one recognizable location
          - one camera angle
          - simple walking / turning / holding / opening actions
          - normal human faces
          - realistic lighting

          Avoid complicated transformations.

          Avoid tiny text that must be read.

          Avoid phone screens as the primary horror mechanism.

          Avoid reflections.

          Avoid visual effects.



          7. IMPORTANT PERFORMANCE LESSON

          High APV alone is not enough.

          A clever story that people swipe away from is still a weak Short.

          Therefore:

          FIRST FRAME > STORY COMPLEXITY

          The first frame must sell the horror.

          """



          # ============================================================
          # MECHANISM LIBRARY
          #
          # These are NOT stories.
          #
          # They are controlled horror structures.
          # ============================================================

          MECHANISMS = [

              {
                  "id": 1,
                  "name": "WRONG ACCESS",
                  "rule":
                  "An unfamiliar adult is visibly inside a private locked space "
                  "using something that should only belong to the protagonist."
              },

              {
                  "id": 2,
                  "name": "DEAD PERSON'S OBJECT",
                  "rule":
                  "A stranger is visibly holding or returning an ordinary object "
                  "that belongs to someone the protagonist knows is dead."
              },

              {
                  "id": 3,
                  "name": "IMPOSSIBLE VISIT",
                  "rule":
                  "A stranger calmly claims they visited the protagonist recently "
                  "when the protagonist knows the place was inaccessible."
              },

              {
                  "id": 4,
                  "name": "PRIVATE MEMORY",
                  "rule":
                  "An unfamiliar adult reveals one extremely specific private event "
                  "that only someone present could know."
              },

              {
                  "id": 5,
                  "name": "WRONG OWNER",
                  "rule":
                  "A stranger confidently identifies a private possession as theirs "
                  "and gives a detail proving unusual familiarity."
              },

              {
                  "id": 6,
                  "name": "WRONG ROOM",
                  "rule":
                  "An adult is visibly occupying a room or workplace they should "
                  "have no reason or permission to enter."
              },

              {
                  "id": 7,
                  "name": "WRONG INSTRUCTION",
                  "rule":
                  "A stranger performs an ordinary action exactly as instructed by "
                  "someone who could not have communicated with them."
              },

              {
                  "id": 8,
                  "name": "UNEXPECTED VISITOR",
                  "rule":
                  "A stranger is already comfortably inside a familiar home and "
                  "speaks as though their presence was expected."
              },

              {
                  "id": 9,
                  "name": "RELATIONSHIP CONTRADICTION",
                  "rule":
                  "A stranger claims a personal relationship with one protagonist "
                  "that the other protagonist knows is impossible."
              },

              {
                  "id": 10,
                  "name": "WRONG CONVERSATION",
                  "rule":
                  "Two adults are visibly speaking while one refers to a private "
                  "conversation that supposedly happened when they were apart."
              },

              {
                  "id": 11,
                  "name": "IMPOSSIBLE DELIVERY",
                  "rule":
                  "An adult delivers an ordinary item while claiming it was ordered "
                  "or requested by someone who could not have done so."
              },

              {
                  "id": 12,
                  "name": "WRONG TIME",
                  "rule":
                  "An adult appears with knowledge or evidence that places them "
                  "inside the location at a time they could not have been there."
              },

              {
                  "id": 13,
                  "name": "PERSONAL WARNING",
                  "rule":
                  "A stranger warns the protagonist about a very specific private "
                  "event that has not happened yet."
              },

              {
                  "id": 14,
                  "name": "WRONG NAME",
                  "rule":
                  "A stranger addresses the protagonist using a private name or "
                  "nickname that almost nobody knows."
              },

              {
                  "id": 15,
                  "name": "IMPOSSIBLE FAMILIARITY",
                  "rule":
                  "A stranger behaves inside the home like someone who has lived "
                  "there before."
              },

              {
                  "id": 16,
                  "name": "THE OTHER WITNESS",
                  "rule":
                  "A stranger describes an event witnessed by someone who was "
                  "supposedly alone with the protagonist."
              },

              {
                  "id": 17,
                  "name": "WRONG DESTINATION",
                  "rule":
                  "A stranger arrives at an ordinary location and confidently says "
                  "the protagonist personally sent them there."
              },

              {
                  "id": 18,
                  "name": "FAMILIAR ROUTINE",
                  "rule":
                  "A stranger performs one highly personal household routine "
                  "belonging to someone close to the protagonist."
              },

              {
                  "id": 19,
                  "name": "IMPOSSIBLE KNOWLEDGE",
                  "rule":
                  "A stranger knows a private physical detail about the location "
                  "that the protagonist has never told anyone."
              },

              {
                  "id": 20,
                  "name": "THE WRONG PERSON IS CALM",
                  "rule":
                  "A visible adult threat is already present, but the stranger "
                  "calmly behaves as though the protagonist is the unusual one."
              }

          ]


          # ============================================================
          # CANDIDATE SCHEMA
          # ============================================================

          candidate_schema = {
              "type": "object",
              "properties": {
                  "candidates": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id": {
                                  "type": "integer"
                              },
                              "mechanism_id": {
                                  "type": "integer"
                              },
                              "title": {
                                  "type": "string"
                              },
                              "premise": {
                                  "type": "string"
                              },
                              "static_frame_1": {
                                  "type": "string"
                              },
                              "visible_threat": {
                                  "type": "string"
                              },
                              "contradiction": {
                                  "type": "string"
                              },
                              "ending": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "id",
                              "mechanism_id",
                              "title",
                              "premise",
                              "static_frame_1",
                              "visible_threat",
                              "contradiction",
                              "ending"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "candidates"
              ],
              "additionalProperties": False
          }


          # ============================================================
          # STAGE 1 — GENERATE 12 CONTROLLED CONCEPTS
          # ============================================================

          selected_mechanisms = MECHANISMS.copy()

          generator_prompt = f"""

          You are the horror concept architect for The Quiet Vault.

          {CREATIVE_DNA}

          You are NOT allowed to invent a random horror mechanism.

          You must use the supplied mechanism library.

          Generate EXACTLY 12 candidates.

          Each candidate must use a DIFFERENT mechanism.

          MECHANISM LIBRARY:

          {json.dumps(selected_mechanisms, indent=2)}

          ============================================================
          CRITICAL FIRST-FRAME RULE
          ============================================================

          The first frame is treated like a thumbnail.

          If the viewer pauses on frame 1 with NO AUDIO,
          they must see something clearly wrong.

          GOOD:

          - unfamiliar adult already inside private home
          - stranger holding a personal object
          - two adults confronting a visibly misplaced third adult
          - adult standing inside a locked/private area
          - stranger performing an obviously intimate/familiar action

          BAD:

          - person looking scared
          - dark hallway
          - empty room
          - ordinary dinner
          - person walking into a room
          - phone call
          - text message
          - reflection
          - mysterious object by itself

          ============================================================
          THREAT RULE
          ============================================================

          Every concept needs a visible adult human threat or visibly
          disturbing adult situation.

          "Something is watching."

          is NOT enough.

          "A stranger is sitting at the protagonist's kitchen table."

          IS enough.

          ============================================================
          CONTRADICTION RULE
          ============================================================

          The contradiction must be explainable in ONE sentence.

          Example:

          "The stranger says the dead man's key was given to him yesterday."

          Do NOT require mythology or a paragraph of explanation.

          ============================================================
          ENDING RULE
          ============================================================

          The final beat must add a SECOND piece of information.

          It should not merely reveal:

          "It was a ghost."

          Prefer:

          "The stranger knows the exact private detail."

          or:

          "The supposedly dead person's object is still warm."

          or:

          "The stranger says something that proves he was there before."

          ============================================================
          ADULT ONLY

          All characters are fictional adults.

          No children.
          No minors.
          No babies.
          No teenagers.

          ============================================================
          HARD BANS

          Do not use:

          mirrors
          reflections
          doppelgängers
          twins
          CCTV
          elevators
          cars as the central mechanism
          hotels
          trains
          printers
          empty-chair horror
          video-call horror
          phone-screen horror
          disappearing people
          reappearing people
          monsters
          demons
          zombies
          ghosts as the explanation
          face distortion
          body transformation
          gore
          blood
          elaborate supernatural mythology

          ============================================================
          OUTPUT QUALITY

          The premise should work even if the viewer never hears the dialogue.

          Do not write the final script yet.

          Think VISUAL first.

          Return ONLY JSON.
          """


          generated = groq_request(
              [
                  {
                      "role": "system",
                      "content":
                      "You are a strict visual horror concept architect."
                  },
                  {
                      "role": "user",
                      "content":
                      generator_prompt
                  }
              ],
              "quiet_vault_candidates",
              candidate_schema,
              0.85,
              7000
          )


          candidates = generated["candidates"]


          # ============================================================
          # HARD FILTER
          # ============================================================

          banned_terms = [

              "mirror",
              "reflection",
              "doppelganger",
              "doppelgänger",
              "twin",
              "cctv",
              "elevator",
              "hotel",
              "train",
              "printer",
              "empty chair",
              "video call",
              "video-call",
              "phone screen",
              "ghost",
              "demon",
              "zombie",
              "monster",
              "gore",
              "blood",
              "face distortion",
              "head spins",
              "disappear",
              "disappears",
              "reappears",
              "child",
              "children",
              "kid",
              "baby",
              "teenager",
              "teen",
              "minor"
          ]


          def normalize(text):
              return re.sub(
                  r"\s+",
                  " ",
                  text.lower()
              ).strip()


          def hard_filter(candidate):

              combined = normalize(
                  " ".join([
                      candidate["title"],
                      candidate["premise"],
                      candidate["static_frame_1"],
                      candidate["visible_threat"],
                      candidate["contradiction"],
                      candidate["ending"]
                  ])
              )

              for term in banned_terms:

                  if re.search(
                      r"\b" + re.escape(term) + r"\b",
                      combined
                  ):

                      return False, (
                          "banned mechanism: "
                          + term
                      )


              frame = normalize(
                  candidate["static_frame_1"]
              )


              weak_frame_terms = [
                  "walks into",
                  "enters the room",
                  "opens the door",
                  "looks around",
                  "stands alone",
                  "empty room",
                  "dimly lit room",
                  "dark room",
                  "ordinary room",
                  "camera shows"
              ]


              for term in weak_frame_terms:

                  if term in frame:

                      return False, (
                          "weak first frame: "
                          + term
                      )


              if len(frame.split()) < 16:

                  return False, "first frame lacks visual detail"


              threat = normalize(
                  candidate["visible_threat"]
              )


              if len(threat.split()) < 8:

                  return False, "visible threat too vague"


              ending = normalize(
                  candidate["ending"]
              )


              if len(ending.split()) < 10:

                  return False, "ending too weak"


              return True, "passed"


          survivors = []
          rejected = []


          for candidate in candidates:

              passed, reason = hard_filter(
                  candidate
              )

              if passed:

                  survivors.append(
                      candidate
                  )

              else:

                  rejected.append(
                      {
                          "id":
                          candidate["id"],

                          "title":
                          candidate["title"],

                          "reason":
                          reason
                      }
                  )


          print("")
          print("==========================================")
          print("HARD FILTER")
          print("==========================================")
          print("Generated:", len(candidates))
          print("Survived:", len(survivors))
          print("Rejected:", len(rejected))


          for item in rejected:

              print(
                  "REJECTED:",
                  item["id"],
                  item["title"],
                  "->",
                  item["reason"]
              )


          if len(survivors) < 6:

              raise RuntimeError(
                  "Too few strong visual concepts survived. "
                  "This run is intentionally rejected rather than "
                  "filling the batch with weak stories."
              )


          # ============================================================
          # STAGE 2 — STRICT CREATIVE JUDGE
          # ============================================================

          judge_schema = {
              "type": "object",
              "properties": {
                  "judgements": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {

                              "id": {
                                  "type": "integer"
                              },

                              "hook": {
                                  "type": "integer"
                              },

                              "visible_threat": {
                                  "type": "integer"
                              },

                              "clarity": {
                                  "type": "integer"
                              },

                              "contradiction": {
                                  "type": "integer"
                              },

                              "ending": {
                                  "type": "integer"
                              },

                              "flow": {
                                  "type": "integer"
                              },

                              "rewatch": {
                                  "type": "integer"
                              },

                              "originality": {
                                  "type": "integer"
                              },

                              "pass": {
                                  "type": "boolean"
                              },

                              "reason": {
                                  "type": "string"
                              }

                          },

                          "required": [
                              "id",
                              "hook",
                              "visible_threat",
                              "clarity",
                              "contradiction",
                              "ending",
                              "flow",
                              "rewatch",
                              "originality",
                              "pass",
                              "reason"
                          ],

                          "additionalProperties": False
                      }
                  }
              },

              "required": [
                  "judgements"
              ],

              "additionalProperties": False
          }


          judge_prompt = f"""

          You are the FINAL CREATIVE GATE for The Quiet Vault.

          {CREATIVE_DNA}

          Judge every candidate harshly.

          This is NOT a writing contest.

          A clever premise with a weak opening FAILS.

          ============================================================
          SCORE EACH 1-10
          ============================================================

          HOOK

          Look ONLY at static_frame_1.

          Would a viewer scrolling Shorts immediately see something wrong?

          9-10 = instantly disturbing visual

          7-8 = clearly unusual

          5-6 = needs narration

          1-4 = normal frame

          Anything below 8 FAILS.



          VISIBLE THREAT

          Is an adult human threat or disturbing adult situation physically
          visible?

          Anything below 8 FAILS.



          CLARITY

          Can the viewer understand the basic problem immediately?

          Anything below 8 FAILS.



          CONTRADICTION

          Is there ONE simple impossible contradiction?

          Anything below 8 FAILS.



          ENDING

          Does the ending create a second realization?

          Anything below 8 FAILS.



          FLOW

          Could Google Flow realistically create this with:

          2-3 adults
          one location
          simple movements
          realistic faces
          minimal visual effects

          Anything below 8 FAILS.



          REWATCH

          Does replay reveal another clue?

          Anything below 7 FAILS.



          ORIGINALITY

          Does this feel different from our recent failed outputs?

          Anything below 7 FAILS.



          ============================================================
          PASS RULE
          ============================================================

          A candidate passes ONLY when:

          hook >= 8
          visible_threat >= 8
          clarity >= 8
          contradiction >= 8
          ending >= 8
          flow >= 8
          rewatch >= 7
          originality >= 7

          AND

          the concept is genuinely scary rather than merely mysterious.

          Return ONLY JSON.

          CANDIDATES:

          {json.dumps(survivors, ensure_ascii=False)}
          """


          judged = groq_request(
              [
                  {
                      "role": "system",
                      "content":
                      "You are a ruthless horror Shorts editor."
                  },
                  {
                      "role": "user",
                      "content":
                      judge_prompt
                  }
              ],
              "quiet_vault_judgement",
              judge_schema,
              0.25,
              6500
          )


          judgements = judged["judgements"]


          passed_ids = [
              item["id"]
              for item in judgements
              if item["pass"]
          ]


          judgement_map = {
              item["id"]: item
              for item in judgements
          }


          finalists = [
              candidate
              for candidate in survivors
              if candidate["id"] in passed_ids
          ]


          # Sort by weighted score

          def weighted_score(candidate):

              j = judgement_map[candidate["id"]]

              return (
                  j["hook"] * 4
                  + j["visible_threat"] * 3
                  + j["clarity"] * 2
                  + j["contradiction"] * 2
                  + j["ending"] * 3
                  + j["flow"]
                  + j["rewatch"] * 2
                  + j["originality"]
              )


          finalists = sorted(
              finalists,
              key=weighted_score,
              reverse=True
          )


          print("")
          print("==========================================")
          print("CREATIVE GATE")
          print("==========================================")


          for item in judgements:

              print(
                  "ID:",
                  item["id"],
                  "PASS:",
                  item["pass"],
                  "Hook:",
                  item["hook"],
                  "Threat:",
                  item["visible_threat"],
                  "Clarity:",
                  item["clarity"],
                  "Ending:",
                  item["ending"],
                  "Rewatch:",
                  item["rewatch"]
              )


          if len(finalists) < 3:

              raise RuntimeError(
                  "Fewer than 3 concepts passed the strict "
                  "Quiet Vault creative gate."
              )


          finalists = finalists[:3]


          print("")
          print("==========================================")
          print("FINALISTS")
          print("==========================================")


          for item in finalists:

              print(
                  item["id"],
                  item["title"]
              )


          # ============================================================
          # WAIT BEFORE FINALIZATION
          # ============================================================

          print("")
          print("Waiting before finalization to protect Groq TPM limits...")

          time.sleep(65)


          # ============================================================
          # FINAL PACKAGE SCHEMA
          # ============================================================

          final_schema = {
              "type": "object",
              "properties": {

                  "id": {
                      "type": "integer"
                  },

                  "title": {
                      "type": "string"
                  },

                  "short_script": {
                      "type": "string"
                  },

                  "visual_hook": {
                      "type": "string"
                  },

                  "flow_prompt": {
                      "type": "string"
                  },

                  "final_twist": {
                      "type": "string"
                  },

                  "description": {
                      "type": "string"
                  },

                  "keywords": {
                      "type": "string"
                  },

                  "hashtags": {
                      "type": "string"
                  },

                  "thumbnail_frame": {
                      "type": "string"
                  },

                  "thumbnail_text": {
                      "type": "string"
                  },

                  "sound_design": {
                      "type": "string"
                  },

                  "pinned_comment": {
                      "type": "string"
                  }

              },

              "required": [
                  "id",
                  "title",
                  "short_script",
                  "visual_hook",
                  "flow_prompt",
                  "final_twist",
                  "description",
                  "keywords",
                  "hashtags",
                  "thumbnail_frame",
                  "thumbnail_text",
                  "sound_design",
                  "pinned_comment"
              ],

              "additionalProperties": False
          }


          # ============================================================
          # FINALIZE EACH SHORT SEPARATELY
          # ============================================================

          final_shorts = []


          for index, finalist in enumerate(
              finalists,
              start=1
          ):

              print("")
              print(
                  f"Finalizing Short {index}/3..."
              )


              final_prompt = f"""

              You are the senior writer for The Quiet Vault.

              Turn this APPROVED horror mechanism into ONE complete
              YouTube Short.

              DO NOT change the underlying mechanism.

              APPROVED CONCEPT:

              {json.dumps(finalist, ensure_ascii=False, indent=2)}

              ============================================================
              HISTORICAL PERFORMANCE RULES
              ============================================================

              The channel performs best when the viewer understands the
              visual problem immediately and then receives a second
              realization.

              The first frame matters more than elaborate storytelling.

              ============================================================
              VIDEO

              9-12 seconds.

              Vertical 9:16.

              Photorealistic live action.

              Fictional adults only.

              One recognizable location.

              Maximum 3 adults.

              Natural human movement.

              Realistic lighting.

              ============================================================
              FIRST FRAME

              The first frame MUST already contain the disturbing situation.

              Do NOT start with:

              someone entering
              someone walking
              an empty room
              establishing shot
              normal conversation
              slow reveal

              The first frame must be strong enough to work as a thumbnail.

              ============================================================
              SCRIPT

              Maximum approximately 35 spoken words.

              Prefer 2-4 short spoken lines.

              Do not explain the horror.

              Let the visual contradiction do the work.

              ============================================================
              STRUCTURE

              0-3 seconds:
              Show the impossible situation immediately.

              3-6 seconds:
              One character identifies or questions the contradiction.

              6-9/12 seconds:
              The other character reveals one additional piece of information.

              Final moment:
              hard cut or loop-friendly visual.

              ============================================================
              GOOGLE FLOW PROMPT

              Give ONE complete copy/paste prompt.

              It must specify:

              - 9:16 vertical
              - photorealistic live action
              - fictional adults
              - consistent character appearance
              - recognizable location
              - exact first frame
              - camera framing
              - 0-3 second action
              - 3-6 second action
              - 6-9/12 second action
              - final reveal
              - hard cut
              - realistic lighting
              - natural movement
              - no subtitles
              - no text overlays
              - no celebrity likeness
              - no real-person likeness

              ============================================================
              HARD BANS

              No children.
              No minors.
              No mirrors.
              No reflections.
              No doppelgängers.
              No twins.
              No CCTV.
              No elevators.
              No hotels.
              No trains.
              No phone-screen horror.
              No video-call horror.
              No printers.
              No empty-chair horror.
              No monsters.
              No demons.
              No zombies.
              No ghosts as the explanation.
              No gore.
              No blood.
              No face distortion.
              No body transformation.
              No complicated CGI.

              ============================================================
              THUMBNAIL

              Choose a frame that visually explains the horror.

              Give approximate timing.

              Thumbnail text:
              maximum 3 words
              or NONE.

              ============================================================
              DESCRIPTION

              Natural and short.

              Do not write generic AI marketing language.

              ============================================================
              KEYWORDS

              Comma-separated.

              ============================================================
              HASHTAGS

              Compact.

              Return ONLY JSON.
              """


              final_data = groq_request(
                  [
                      {
                          "role": "system",
                          "content":
                          "You are the final production writer for a realistic horror Shorts channel."
                      },
                      {
                          "role": "user",
                          "content":
                          final_prompt
                      }
                  ],
                  f"quiet_vault_final_{index}",
                  final_schema,
                  0.65,
                  3000
              )


              final_shorts.append(
                  final_data
              )


              if index < len(finalists):

                  print(
                      "Waiting 15 seconds before next final call..."
                  )

                  time.sleep(15)


          # ============================================================
          # FINAL OUTPUT
          # ============================================================

          os.makedirs(
              "quiet-vault-output",
              exist_ok=True
          )


          output = {

