name: Quiet Vault AI - Generate Shorts

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error

          API_KEY = os.environ["GROQ_API_KEY"]
          URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          # ============================================================
          # FIXED HORROR LIBRARY
          #
          # Groq cannot invent the visual mechanism.
          # It can only turn these into a short story.
          # ============================================================

          SEEDS = [

              {
                  "id": 1,
                  "location": "apartment bedroom",
                  "visual": (
                      "A fictional adult woman stands in her bedroom doorway. "
                      "An unfamiliar adult man is already sitting openly on her bed, "
                      "holding her house keys in one hand and a kitchen knife in the other. "
                      "Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "The stranger claims someone inside the apartment invited him "
                      "and insists this is not his first visit."
                  ),
                  "payoff": (
                      "The woman realizes the stranger knows about a previous visit "
                      "that she genuinely cannot remember."
                  )
              },

              {
                  "id": 2,
                  "location": "private office",
                  "visual": (
                      "A fictional adult man stands inside his private office. "
                      "An unfamiliar adult woman is seated in his desk chair, "
                      "holding his access badge in one hand and large office scissors "
                      "in the other. Both adults are fully visible."
                  ),
                  "mechanism": (
                      "The woman calmly claims she was sent to collect something "
                      "the man has supposedly already handed over."
                  ),
                  "payoff": (
                      "She names a private object and exact location that only the man "
                      "should know about."
                  )
              },

              {
                  "id": 3,
                  "location": "apartment kitchen",
                  "visual": (
                      "A fictional adult couple stand together in their kitchen. "
                      "An unfamiliar adult man is openly seated at their kitchen table, "
                      "holding their apartment key and staring directly at them. "
                      "All three adults are visible."
                  ),
                  "mechanism": (
                      "The stranger says one of the couple gave him the key earlier."
                  ),
                  "payoff": (
                      "Both partners deny ever meeting him, but the stranger reveals "
                      "one private detail about their relationship that proves he has "
                      "been inside their home before."
                  )
              },

              {
                  "id": 4,
                  "location": "hospital room",
                  "visual": (
                      "A fictional adult man enters a private hospital room. "
                      "An unfamiliar adult man is already sitting beside the visitor chair, "
                      "holding the patient's phone and staring directly at him. "
                      "Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "The stranger says the patient asked him to deliver a message "
                      "before the visitor arrived."
                  ),
                  "payoff": (
                      "The message contains a private sentence that the visitor "
                      "has never told anyone."
                  )
              },

              {
                  "id": 5,
                  "location": "restaurant private dining room",
                  "visual": (
                      "A fictional adult woman enters a private dining room where her husband "
                      "is seated. An unfamiliar adult man is already sitting opposite the husband, "
                      "holding the husband's wedding ring in his open palm. "
                      "All three adults are clearly visible."
                  ),
                  "mechanism": (
                      "The stranger claims the husband left the ring with him "
                      "during an earlier meeting."
                  ),
                  "payoff": (
                      "The husband denies meeting him, and the stranger casually states "
                      "where the husband was that night instead."
                  )
              },

              {
                  "id": 6,
                  "location": "apartment laundry room",
                  "visual": (
                      "A fictional adult man opens the laundry room door. "
                      "An unfamiliar adult man is already inside, holding the first man's wallet "
                      "and standing near the only exit. Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "The stranger says he found the wallet upstairs and has been waiting "
                      specifically for its owner."
                  ),
                  "payoff": (
                      "The stranger says the man's full name before the man introduces himself, "
                      "then reveals something that was inside the wallet."
                  )
              }
          ]

          # ============================================================
          # GROQ API
          # ============================================================

          def groq_call(messages, schema, max_tokens=2200, retries=5):

              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": 0.65,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": schema["name"],
                          "strict": True,
                          "schema": schema["schema"]
                      }
                  }
              }

              data = json.dumps(payload).encode("utf-8")

              for attempt in range(retries):

                  request = urllib.request.Request(
                      URL,
                      data=data,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      }
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=120
                      ) as response:

                          raw = response.read().decode("utf-8")
                          result = json.loads(raw)

                          content = result["choices"][0]["message"]["content"]

                          return json.loads(content)

                  except urllib.error.HTTPError as e:

                      body = e.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

                      print(f"GROQ HTTP {e.code}: {body}")

                      if e.code == 429 and attempt < retries - 1:

                          retry_after = e.headers.get("retry-after")

                          try:
                              wait = max(
                                  65,
                                  int(float(retry_after)) + 2
                              )
                          except:
                              wait = 65

                          print(
                              f"Rate limit. Waiting {wait} seconds..."
                          )

                          time.sleep(wait)
                          continue

                      raise

                  except Exception as e:

                      print(f"GROQ ERROR: {e}")

                      if attempt < retries - 1:

                          time.sleep(10)
                          continue

                      raise

          # ============================================================
          # STAGE 1 — CREATE STORY BLUEPRINTS
          # ============================================================

          seed_text = ""

          for seed in SEEDS:

              seed_text += f"""
          SEED {seed['id']}

          LOCATION:
          {seed['location']}

          FIXED VISUAL:
          {seed['visual']}

          FIXED HORROR MECHANISM:
          {seed['mechanism']}

          FIXED PAYOFF DIRECTION:
          {seed['payoff']}

          ----------------------------------------
          """

          blueprint_schema = {
              "name": "quiet_vault_blueprints",
              "schema": {
                  "type": "object",
                  "properties": {
                      "stories": {
                          "type": "array",
                          "items": {
                              "type": "object",
                              "properties": {
                                  "id": {
                                      "type": "integer"
                                  },
                                  "title": {
                                      "type": "string"
                                  },
                                  "hook_line": {
                                      "type": "string"
                                  },
                                  "middle_line": {
                                      "type": "string"
                                  },
                                  "ending_line": {
                                      "type": "string"
                                  }
                              },
                              "required": [
                                  "id",
                                  "title",
                                  "hook_line",
                                  "middle_line",
                                  "ending_line"
                              ],
                              "additionalProperties": False
                          }
                      }
                  },
                  "required": [
                      "stories"
                  ],
                  "additionalProperties": False
              }
          }

          generator_prompt = f"""
          You write ultra-short realistic horror stories for YouTube Shorts.

          IMPORTANT:

          The visual and horror mechanism are FIXED.

          DO NOT invent a different horror mechanism.

          DO NOT replace the stranger.

          DO NOT add another major character.

          DO NOT add:
          - children
          - babies
          - minors
          - ghosts
          - demons
          - monsters
          - mirrors
          - reflections
          - twins
          - doppelgangers
          - CCTV
          - surveillance
          - elevators
          - cars
          - hotels
          - trains
          - gore
          - blood
          - supernatural mythology

          Write each story as exactly THREE spoken lines:

          HOOK:
          Immediately tells the viewer what is wrong.

          MIDDLE:
          Introduces the fixed contradiction.

          ENDING:
          Delivers the disturbing payoff.

          Total spoken content should be short enough for approximately
          9–12 seconds.

          Do not explain the entire backstory.

          Do not use phrases like:
          "little did she know"
          "what happened next"
          "you won't believe"
          "everything changed"

          The horror must remain grounded.

          MOST IMPORTANT:
          Preserve the supplied mechanism and payoff direction.

          SEEDS:

          {seed_text}
          """

          print("")
          print("==============================================")
          print("STAGE 1: STORY BLUEPRINTS")
          print("==============================================")

          generated = groq_call(
              [
                  {
                      "role": "system",
                      "content": (
                          "You are a concise cinematic horror writer. "
                          "You follow fixed story mechanisms."
                      )
                  },
                  {
                      "role": "user",
                      "content": generator_prompt
                  }
              ],
              blueprint_schema,
              max_tokens=2200
          )

          stories = generated["stories"]

          print(
              f"Generated {len(stories)} story blueprints."
          )

          # ============================================================
          # RECONNECT EACH STORY TO ITS FIXED SEED
          # ============================================================

          seed_map = {
              seed["id"]: seed
              for seed in SEEDS
          }

          candidates = []

          for story in stories:

              sid = story.get("id")

              if sid not in seed_map:
                  continue

              seed = seed_map[sid]

              candidates.append({
                  "id": sid,
                  "title": story["title"].strip(),
                  "hook_line": story["hook_line"].strip(),
                  "middle_line": story["middle_line"].strip(),
                  "ending_line": story["ending_line"].strip(),

                  # These NEVER come from Groq.
                  "location": seed["location"],
                  "static_frame_1": seed["visual"],
                  "fixed_mechanism": seed["mechanism"],
                  "fixed_payoff": seed["payoff"]
              })

          # ============================================================
          # OBJECTIVE FILTER ONLY
          # ============================================================

          banned_terms = [
              "child",
              "children",
              "kid",
              "baby",
              "boy",
              "girl",
              "minor",
              "nursery",
              "babysitter",
              "mirror",
              "reflection",
              "reflected",
              "twin",
              "doppelganger",
              "cctv",
              "surveillance",
              "security camera",
              "elevator",
              "car",
              "vehicle",
              "hotel",
              "train",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "gore",
              "blood",
              "supernatural"
          ]

          def contains_banned(text):

              text = text.lower()

              for term in banned_terms:

                  pattern = (
                      r"(?<![a-z])"
                      + re.escape(term)
                      + r"(?![a-z])"
                  )

                  if re.search(pattern, text):
                      return True

              return False

          clean = []

          for candidate in candidates:

              combined = " ".join([
                  candidate["title"],
                  candidate["hook_line"],
                  candidate["middle_line"],
                  candidate["ending_line"]
              ])

              if contains_banned(combined):

                  print(
                      f"REJECT {candidate['id']}: "
                      f"prohibited term"
                  )

                  continue

              spoken = " ".join([
                  candidate["hook_line"],
                  candidate["middle_line"],
                  candidate["ending_line"]
              ])

              word_count = len(
                  spoken.split()
              )

              if word_count > 55:

                  print(
                      f"REJECT {candidate['id']}: "
                      f"too many words ({word_count})"
                  )

                  continue

              if word_count < 15:

                  print(
                      f"REJECT {candidate['id']}: "
                      f"too few words ({word_count})"
                  )

                  continue

              clean.append(candidate)

          print("")
          print(
              f"After objective filtering: "
              f"{len(clean)}"
          )

          if len(clean) < 3:

              raise RuntimeError(
                  "Fewer than 3 usable story blueprints remained."
              )

          # ============================================================
          # SELECT FIRST THREE VALID STORIES
          #
          # No AI ranking.
          # No AI quality score.
          # No subjective gate.
          # ============================================================

          selected = clean[:3]

          print("")
          print("SELECTED STORIES:")

          for item in selected:

              print(
                  f"{item['id']} - "
                  f"{item['title']}"
              )

          # ============================================================
          # RATE LIMIT BUFFER
          # ============================================================

          print("")
          print(
              "Waiting 65 seconds before finalization..."
          )

          time.sleep(65)

          # ============================================================
          # FINAL PACKAGE
          # ============================================================

          final_schema = {
              "name": "quiet_vault_final_short",
              "schema": {
                  "type": "object",
                  "properties": {

                      "id": {
                          "type": "integer"
                      },

                      "title": {
                          "type": "string"
                      },

                      "short_script": {
                          "type": "string"
                      },

                      "flow_prompt": {
                          "type": "string"
                      },

                      "final_twist": {
                          "type": "string"
                      },

                      "description": {
                          "type": "string"
                      },

                      "keywords": {
                          "type": "string"
                      },

                      "hashtags": {
                          "type": "string"
                      },

                      "thumbnail_frame": {
                          "type": "string"
                      },

                      "thumbnail_text": {
                          "type": "string"
                      },

                      "sound_design": {
                          "type": "string"
                      },

                      "pinned_comment": {
                          "type": "string"
                      }
                  },

                  "required": [
                      "id",
                      "title",
                      "short_script",
                      "flow_prompt",
                      "final_twist",
                      "description",
                      "keywords",
                      "hashtags",
                      "thumbnail_frame",
                      "thumbnail_text",
                      "sound_design",
                      "pinned_comment"
                  ],

                  "additionalProperties": False
              }
          }

          final_outputs = []

          for index, candidate in enumerate(selected):

              print("")
              print(
                  f"STAGE 2: FINALIZING "
                  f"{index + 1}/3"
              )

              final_prompt = f"""
          Create the final production package for one realistic
          horror YouTube Short.

          ============================================================
          FIXED STORY
          ============================================================

          TITLE:
          {candidate['title']}

          HOOK:
          {candidate['hook_line']}

          MIDDLE:
          {candidate['middle_line']}

          ENDING:
          {candidate['ending_line']}

          ============================================================
          FIXED VISUAL
          ============================================================

          {candidate['static_frame_1']}

          ============================================================
          FIXED MECHANISM
          ============================================================

          {candidate['fixed_mechanism']}

          ============================================================
          FIXED PAYOFF
          ============================================================

          {candidate['fixed_payoff']}

          ============================================================
          SCRIPT REQUIREMENTS
          ============================================================

          Write a natural spoken script lasting approximately
          9–12 seconds.

          Keep it extremely concise.

          Do not add new plot points.

          Do not add another character.

          Do not add mythology.

          Do not explain the backstory.

          The first spoken sentence must immediately establish
          what is wrong.

          The final sentence must deliver the payoff.

          ============================================================
          GOOGLE FLOW
          ============================================================

          Create ONE Google Flow-ready prompt.

          It must:

          - be vertical 9:16
          - be photorealistic live action
          - use fictional adults only
          - use no celebrity or real-person likeness
          - preserve the exact first-frame composition
          - show both adults clearly
          - use realistic human movement
          - use realistic lighting
          - use cinematic but believable camera movement
          - maintain character consistency
          - contain no children
          - contain no mirrors
          - contain no reflections
          - contain no CCTV
          - contain no monsters
          - contain no ghosts
          - contain no gore

          EXACT FIRST FRAME:

          {candidate['static_frame_1']}

          Do not replace this first frame.

          The visual progression should simply act out the
          three spoken lines.

          ============================================================
          THUMBNAIL
          ============================================================

          Choose the strongest frame.

          Thumbnail text:
          maximum 4 words.

          Do not reveal the ending.

          ============================================================
          DESCRIPTION
          ============================================================

          Short natural YouTube description.

          ============================================================
          KEYWORDS
          ============================================================

          Comma-separated.

          ============================================================
          HASHTAGS
          ============================================================

          4–6 relevant hashtags.

          ============================================================
          SOUND
          ============================================================

          Give simple cinematic sound cues.

          ============================================================
          PINNED COMMENT
          ============================================================

          Ask a question that encourages comments without revealing
          the ending.
          """

              final = groq_call(
                  [
                      {
                          "role": "system",
                          "content": (
                              "You are the final production editor "
                              "for The Quiet Vault. "
                              "Do not change the supplied story."
                          )
                      },
                      {
                          "role": "user",
                          "content": final_prompt
                      }
                  ],
                  final_schema,
                  max_tokens=1700
              )

              final_outputs.append(final)

              if index < len(selected) - 1:

                  print(
                      "Waiting 12 seconds..."
                  )

                  time.sleep(12)

          # ============================================================
          # SAVE JSON
          # ============================================================

          os.makedirs(
              "output",
              exist_ok=True
          )

          with open(
              "output/quiet-vault-shorts.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  {
                      "generated_at": time.strftime(
                          "%Y-%m-%d %H:%M:%S UTC"
                      ),
                      "shorts": final_outputs
                  },
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # SAVE HUMAN-READABLE FILE
          # ============================================================

          with open(
              "output/quiet-vault-shorts.txt",
              "w",
              encoding="utf-8"
          ) as file:

              for number, short in enumerate(
                  final_outputs,
                  1
              ):

                  file.write("=" * 70 + "\n")
                  file.write(f"SHORT {number}\n")
                  file.write("=" * 70 + "\n\n")

                  file.write(
                      "TITLE:\n"
                      + short["title"]
                      + "\n\n"
                  )

                  file.write(
                      "SCRIPT:\n"
                      + short["short_script"]
                      + "\n\n"
                  )

                  file.write(
                      "GOOGLE FLOW PROMPT:\n"
                      + short["flow_prompt"]
                      + "\n\n"
                  )

                  file.write(
                      "FINAL TWIST:\n"
                      + short["final_twist"]
                      + "\n\n"
                  )

                  file.write(
                      "DESCRIPTION:\n"
                      + short["description"]
                      + "\n\n"
                  )

                  file.write(
                      "KEYWORDS:\n"
                      + short["keywords"]
                      + "\n\n"
                  )

                  file.write(
                      "HASHTAGS:\n"
                      + short["hashtags"]
                      + "\n\n"
                  )

                  file.write(
                      "THUMBNAIL FRAME:\n"
                      + short["thumbnail_frame"]
                      + "\n\n"
                  )

                  file.write(
                      "THUMBNAIL TEXT:\n"
                      + short["thumbnail_text"]
                      + "\n\n"
                  )

                  file.write(
                      "SOUND DESIGN:\n"
                      + short["sound_design"]
                      + "\n\n"
                  )

                  file.write(
                      "PINNED COMMENT:\n"
                      + short["pinned_comment"]
                      + "\n\n"

          print("")
          print("==============================================")
          print("QUIET VAULT AI GENERATION SUCCESS")
          print("==============================================")
          print(f"Generated {len(final_outputs)} Shorts.")
          print("==============================================")
          PY

      - name: Upload generated Shorts package
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts
          path: output/
          if-no-files-found: error
