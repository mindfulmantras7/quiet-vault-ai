name: Quiet Vault AI - Generate Shorts

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error

          API_KEY = os.environ["GROQ_API_KEY"]
          URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          # ============================================================
          # FIXED HORROR STORY LIBRARY
          # ============================================================

          SEEDS = [
              {
                  "id": 1,
                  "location": "apartment bedroom",
                  "visual": (
                      "A fictional adult woman stands in her bedroom doorway. "
                      "An unfamiliar adult man is already sitting openly on her bed, "
                      "holding her house keys in one hand and a kitchen knife in the other. "
                      "Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "The stranger claims someone inside the apartment invited him "
                      "and insists this is not his first visit."
                  ),
                  "payoff": (
                      "The woman realizes the stranger knows about a previous visit "
                      "that she genuinely cannot remember."
                  )
              },
              {
                  "id": 2,
                  "location": "private office",
                  "visual": (
                      "A fictional adult man stands inside his private office. "
                      "An unfamiliar adult woman is seated in his desk chair, "
                      "holding his access badge in one hand and large office scissors "
                      "in the other. Both adults are fully visible."
                  ),
                  "mechanism": (
                      "The woman calmly claims she was sent to collect something "
                      "the man has supposedly already handed over."
                  ),
                  "payoff": (
                      "She names a private object and exact location that only the man "
                      "should know about."
                  )
              },
              {
                  "id": 3,
                  "location": "apartment kitchen",
                  "visual": (
                      "A fictional adult couple stand together in their kitchen. "
                      "An unfamiliar adult man is openly seated at their kitchen table, "
                      "holding their apartment key and staring directly at them. "
                      "All three adults are visible."
                  ),
                  "mechanism": (
                      "The stranger says one of the couple gave him the key earlier."
                  ),
                  "payoff": (
                      "Both partners deny ever meeting him, but the stranger reveals "
                      "one private detail about their relationship that proves he has "
                      "been inside their home before."
                  )
              },
              {
                  "id": 4,
                  "location": "hospital room",
                  "visual": (
                      "A fictional adult man enters a private hospital room. "
                      "An unfamiliar adult man is already sitting beside the visitor chair, "
                      "holding the patient's phone and staring directly at him. "
                      "Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "The stranger says the patient asked him to deliver a message "
                      "before the visitor arrived."
                  ),
                  "payoff": (
                      "The message contains a private sentence that the visitor "
                      "has never told anyone."
                  )
              },
              {
                  "id": 5,
                  "location": "restaurant private dining room",
                  "visual": (
                      "A fictional adult woman enters a private dining room where her husband "
                      "is seated. An unfamiliar adult man is already sitting opposite the husband, "
                      "holding the husband's wedding ring in his open palm. "
                      "All three adults are clearly visible."
                  ),
                  "mechanism": (
                      "The stranger claims the husband left the ring with him "
                      "during an earlier meeting."
                  ),
                  "payoff": (
                      "The husband denies meeting him, and the stranger casually states "
                      "where the husband was that night instead."
                  )
              },
              {
                  "id": 6,
                  "location": "apartment laundry room",
                  "visual": (
                      "A fictional adult man opens the laundry room door. "
                      "An unfamiliar adult man is already inside, holding the first man's wallet "
                      "and standing near the only exit. Both adults are clearly visible."
                  ),
                  "mechanism": (
                      "The stranger says he found the wallet upstairs and has been waiting "
                      "specifically for its owner."
                  ),
                  "payoff": (
                      "The stranger says the man's full name before the man introduces himself, "
                      "then reveals something that was inside the wallet."
                  )
              }
          ]

          # ============================================================
          # GROQ API FUNCTION
          # ============================================================

          def groq_call(messages, schema, max_tokens=2200, retries=5):

              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": 0.65,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": schema["name"],
                          "strict": True,
                          "schema": schema["schema"]
                      }
                  }
              }

              data = json.dumps(payload).encode("utf-8")

              for attempt in range(retries):

                  request = urllib.request.Request(
                      URL,
                      data=data,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      }
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=120
                      ) as response:

                          raw = response.read().decode("utf-8")
                          result = json.loads(raw)

                          content = result["choices"][0]["message"]["content"]

                          return json.loads(content)

                  except urllib.error.HTTPError as error:

                      body = error.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

                      print(
                          f"GROQ HTTP ERROR {error.code}: {body}"
                      )

                      if error.code == 429 and attempt < retries - 1:

                          retry_after = error.headers.get(
                              "retry-after"
                          )

                          try:
                              wait_seconds = max(
                                  65,
                                  int(float(retry_after)) + 2
                              )
                          except Exception:
                              wait_seconds = 65

                          print(
                              f"Rate limit detected. "
                              f"Waiting {wait_seconds} seconds..."
                          )

                          time.sleep(wait_seconds)
                          continue

                      raise

                  except Exception as error:

                      print(
                          f"GROQ ERROR: {error}"
                      )

                      if attempt < retries - 1:

                          print("Retrying in 10 seconds...")
                          time.sleep(10)
                          continue

                      raise

          # ============================================================
          # STAGE 1 - GENERATE STORY BLUEPRINTS
          # ============================================================

          seed_text_parts = []

          for seed in SEEDS:

              seed_text_parts.append(
                  f"""
          SEED {seed['id']}

          LOCATION:
          {seed['location']}

          FIXED VISUAL:
          {seed['visual']}

          FIXED HORROR MECHANISM:
          {seed['mechanism']}

          FIXED PAYOFF:
          {seed['payoff']}
          """
              )

          seed_text = "\n".join(seed_text_parts)

          blueprint_schema = {
              "name": "quiet_vault_blueprints",
              "schema": {
                  "type": "object",
                  "properties": {
                      "stories": {
                          "type": "array",
                          "items": {
                              "type": "object",
                              "properties": {
                                  "id": {
                                      "type": "integer"
                                  },
                                  "title": {
                                      "type": "string"
                                  },
                                  "hook_line": {
                                      "type": "string"
                                  },
                                  "middle_line": {
                                      "type": "string"
                                  },
                                  "ending_line": {
                                      "type": "string"
                                  }
                              },
                              "required": [
                                  "id",
                                  "title",
                                  "hook_line",
                                  "middle_line",
                                  "ending_line"
                              ],
                              "additionalProperties": False
                          }
                      }
                  },
                  "required": [
                      "stories"
                  ],
                  "additionalProperties": False
              }
          }

          generator_prompt = f"""
          You write ultra-short realistic cinematic horror stories
          for YouTube Shorts.

          Create EXACTLY ONE story for each supplied seed.

          The visual, mechanism and payoff are already designed.

          DO NOT change the supplied mechanism.

          DO NOT invent a different horror concept.

          DO NOT remove the visible adult threat.

          DO NOT introduce:

          - children
          - babies
          - minors
          - ghosts
          - demons
          - monsters
          - mirrors
          - reflections
          - twins
          - doppelgangers
          - CCTV
          - surveillance
          - elevators
          - cars
          - hotels
          - trains
          - gore
          - blood
          - supernatural mythology

          Each story must have exactly THREE short spoken lines:

          HOOK:
          Immediately establish what is wrong.

          MIDDLE:
          Develop the fixed contradiction.

          ENDING:
          Deliver the fixed disturbing payoff.

          Keep the complete spoken story approximately 25-50 words.

          Do not explain the backstory.

          Do not add unnecessary characters.

          Do not use:
          "little did she know"
          "what happened next"
          "you won't believe"
          "everything changed"

          Make the dialogue sound like a real person speaking.

          The final line should make the viewer rethink the
          situation shown in the first frame.

          FIXED SEEDS:

          {seed_text}
          """

          print("")
          print("==============================================")
          print("STAGE 1: GENERATING STORY BLUEPRINTS")
          print("==============================================")

          generated = groq_call(
              [
                  {
                      "role": "system",
                      "content": (
                          "You are a concise realistic horror writer. "
                          "Follow fixed story mechanisms exactly."
                      )
                  },
                  {
                      "role": "user",
                      "content": generator_prompt
                  }
              ],
              blueprint_schema,
              max_tokens=2200
          )

          stories = generated["stories"]

          print(
              f"Groq returned {len(stories)} story blueprints."
          )

          # ============================================================
          # CONNECT STORIES TO FIXED SEEDS
          # ============================================================

          seed_map = {
              seed["id"]: seed
              for seed in SEEDS
          }

          candidates = []

          for story in stories:

              story_id = story.get("id")

              if story_id not in seed_map:
                  continue

              seed = seed_map[story_id]

              candidates.append({
                  "id": story_id,
                  "title": story["title"].strip(),
                  "hook_line": story["hook_line"].strip(),
                  "middle_line": story["middle_line"].strip(),
                  "ending_line": story["ending_line"].strip(),

                  "location": seed["location"],

                  # Python owns the visual.
                  "static_frame_1": seed["visual"],

                  "fixed_mechanism": seed["mechanism"],

                  "fixed_payoff": seed["payoff"]
              })

          # ============================================================
          # OBJECTIVE FILTER
          # ============================================================

          banned_terms = [
              "child",
              "children",
              "kid",
              "baby",
              "boy",
              "girl",
              "minor",
              "nursery",
              "babysitter",
              "mirror",
              "reflection",
              "reflected",
              "twin",
              "doppelganger",
              "cctv",
              "surveillance",
              "security camera",
              "elevator",
              "car",
              "vehicle",
              "hotel",
              "train",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "gore",
              "blood",
              "supernatural",
              "teleport",
              "teleports",
              "teleported"
          ]

          def contains_banned(text):

              lowered = text.lower()

              for term in banned_terms:

                  pattern = (
                      r"(?<![a-z])"
                      + re.escape(term)
                      + r"(?![a-z])"
                  )

                  if re.search(pattern, lowered):
                      return True

              return False

          clean_candidates = []

          for candidate in candidates:

              spoken_text = " ".join([
                  candidate["hook_line"],
                  candidate["middle_line"],
                  candidate["ending_line"]
              ])

              if contains_banned(spoken_text):

                  print(
                      f"OBJECTIVE REJECT "
                      f"{candidate['id']}: banned element"
                  )

                  continue

              word_count = len(
                  spoken_text.split()
              )

              if word_count > 50:

                  print(
                      f"OBJECTIVE REJECT "
                      f"{candidate['id']}: "
                      f"{word_count} words"
                  )

                  continue

              if word_count < 20:

                  print(
                      f"OBJECTIVE REJECT "
                      f"{candidate['id']}: "
                      f"only {word_count} words"
                  )

                  continue

              clean_candidates.append(candidate)

          print("")
          print(
              f"After objective filtering: "
              f"{len(clean_candidates)}"
          )

          if len(clean_candidates) < 3:

              raise RuntimeError(
                  "Fewer than 3 usable story blueprints were generated."
              )

          # ============================================================
          # SELECT THREE
          # ============================================================

          selected = clean_candidates[:3]

          print("")
          print("SELECTED STORIES:")

          for candidate in selected:

              print(
                  f"  {candidate['id']} - "
                  f"{candidate['title']}"
              )

          # ============================================================
          # RATE LIMIT BUFFER
          # ============================================================

          print("")
          print(
              "Waiting 65 seconds before finalization..."
          )

          time.sleep(65)

          # ============================================================
          # FINAL PACKAGE SCHEMA
          # ============================================================

          final_schema = {
              "name": "quiet_vault_final_short",
              "schema": {
                  "type": "object",
                  "properties": {

                      "id": {
                          "type": "integer"
                      },

                      "title": {
                          "type": "string"
                      },

                      "short_script": {
                          "type": "string"
                      },

                      "flow_prompt": {
                          "type": "string"
                      },

                      "final_twist": {
                          "type": "string"
                      },

                      "description": {
                          "type": "string"
                      },

                      "keywords": {
                          "type": "string"
                      },

                      "hashtags": {
                          "type": "string"
                      },

                      "thumbnail_frame": {
                          "type": "string"
                      },

                      "thumbnail_text": {
                          "type": "string"
                      },

                      "sound_design": {
                          "type": "string"
                      },

                      "pinned_comment": {
                          "type": "string"
                      }
                  },

                  "required": [
                      "id",
                      "title",
                      "short_script",
                      "flow_prompt",
                      "final_twist",
                      "description",
                      "keywords",
                      "hashtags",
                      "thumbnail_frame",
                      "thumbnail_text",
                      "sound_design",
                      "pinned_comment"
                  ],

                  "additionalProperties": False
              }
          }

          # ============================================================
          # FINALIZE THREE SHORTS
          # ============================================================

          final_outputs = []

          for index, candidate in enumerate(selected):

              print("")
              print(
                  f"STAGE 2: FINALIZING "
                  f"{index + 1}/3 - "
                  f"{candidate['title']}"
              )

              final_prompt = f"""
          Create the final production package for this
          realistic horror YouTube Short.

          ============================================================
          STORY
          ============================================================

          TITLE:
          {candidate['title']}

          HOOK:
          {candidate['hook_line']}

          MIDDLE:
          {candidate['middle_line']}

          ENDING:
          {candidate['ending_line']}

          ============================================================
          FIXED FIRST FRAME
          ============================================================

          {candidate['static_frame_1']}

          ============================================================
          FIXED MECHANISM
          ============================================================

          {candidate['fixed_mechanism']}

          ============================================================
          FIXED PAYOFF
          ============================================================

          {candidate['fixed_payoff']}

          ============================================================
          SCRIPT
          ============================================================

          Write the final spoken script.

          Requirements:

          - approximately 9–12 seconds
          - maximum 50 words
          - natural spoken English
          - immediate hook
          - no exposition dump
          - no unnecessary dialogue
          - no new characters
          - no new plot mechanism
          - final sentence is the disturbing payoff
          - hard cut immediately after the payoff

          ============================================================
          GOOGLE FLOW PROMPT
          ============================================================

          Create ONE Google Flow-ready production prompt.

          Requirements:

          - vertical 9:16
          - photorealistic live action
          - fictional adults only
          - no celebrity likeness
          - no real-person likeness
          - realistic human faces
          - realistic movement
          - realistic lighting
          - cinematic but believable
          - consistent characters
          - preserve the exact first-frame situation
          - no children
          - no mirrors
          - no reflections
          - no CCTV
          - no ghosts
          - no monsters
          - no gore
          - no supernatural effects

          The FIRST FRAME MUST BE:

          {candidate['static_frame_1']}

          Do not replace the first frame.

          The remaining movement should simply act out
          the supplied three-line story.

          ============================================================
          FINAL TWIST
          ============================================================

          State the actual final reveal in one or two sentences.

          ============================================================
          DESCRIPTION
          ============================================================

          Write a short natural YouTube description.

          ============================================================
          KEYWORDS
          ============================================================

          Give comma-separated search keywords.

          ============================================================
          HASHTAGS
          ============================================================

          Give 4-6 relevant hashtags.

          ============================================================
          THUMBNAIL
          ============================================================

          Select the strongest frame from the sequence.

          Give:

          - exact moment/frame
          - optional thumbnail text

          Thumbnail text must be 2-4 words maximum.

          Do NOT reveal the twist.

          ============================================================
          SOUND DESIGN
          ============================================================

          Give simple sound effects and music cues.

          ============================================================
          PINNED COMMENT
          ============================================================

          Ask a question that encourages comments
          without revealing the ending.
          """

              final_result = groq_call(
                  [
                      {
                          "role": "system",
                          "content": (
                              "You are the final production editor "
                              "for The Quiet Vault. "
                              "Preserve the supplied story and visual."
                          )
                      },
                      {
                          "role": "user",
                          "content": final_prompt
                      }
                  ],
                  final_schema,
                  max_tokens=1700
              )

              final_outputs.append(final_result)

              if index < len(selected) - 1:

                  print(
                      "Waiting 12 seconds before next package..."
                  )

                  time.sleep(12)

          # ============================================================
          # SAVE JSON
          # ============================================================

          os.makedirs(
              "output",
              exist_ok=True
          )

          with open(
              "output/quiet-vault-shorts.json",
              "w",
              encoding="utf-8"
          ) as output_file:

              json.dump(
                  {
                      "generated_at": time.strftime(
                          "%Y-%m-%d %H:%M:%S UTC"
                      ),
                      "shorts": final_outputs
                  },
                  output_file,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # SAVE HUMAN-READABLE TEXT
          # ============================================================

          with open(
              "output/quiet-vault-shorts.txt",
              "w",
              encoding="utf-8"
          ) as output_file:

              for number, short in enumerate(
                  final_outputs,
                  1
              ):

                  output_file.write(
                      "=" * 70 + "\n"
                  )

                  output_file.write(
                      f"SHORT {number}\n"
                  )

                  output_file.write(
                      "=" * 70 + "\n\n"
                  )

                  output_file.write(
                      "TITLE:\n"
                      + short["title"]
                      + "\n\n"
                  )

                  output_file.write(
                      "SCRIPT:\n"
                      + short["short_script"]
                      + "\n\n"
                  )

                  output_file.write(
                      "GOOGLE FLOW PROMPT:\n"
                      + short["flow_prompt"]
                      + "\n\n"
                  )

                  output_file.write(
                      "FINAL TWIST:\n"
                      + short["final_twist"]
                      + "\n\n"
                  )

                  output_file.write(
                      "DESCRIPTION:\n"
                      + short["description"]
                      + "\n\n"
                  )

                  output_file.write(
                      "KEYWORDS:\n"
                      + short["keywords"]
                      + "\n\n"
                  )

                  output_file.write(
                      "HASHTAGS:\n"
                      + short["hashtags"]
                      + "\n\n"
                  )

                  output_file.write(
                      "THUMBNAIL FRAME:\n"
                      + short["thumbnail_frame"]
                      + "\n\n"
                  )

                  output_file.write(
                      "THUMBNAIL TEXT:\n"
                      + short["thumbnail_text"]
                      + "\n\n"
                  )

                  output_file.write(
                      "SOUND DESIGN:\n"
                      + short["sound_design"]
                      + "\n\n"
                  )

                  output_file.write(
                      "PINNED COMMENT:\n"
                      + short["pinned_comment"]
                      + "\n\n"
                  )

          print("")
          print("==============================================")
          print("QUIET VAULT AI GENERATION SUCCESS")
          print("==============================================")
          print(
              f"Generated {len(final_outputs)} Shorts."
          )
          print(
              "Artifacts are ready."
          )
          print("==============================================")
          PY

      - name: Upload generated Shorts package
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts
          path: output/
          if-no-files-found: error
