name: Quiet Vault AI V7.1 - Groq

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          from pathlib import Path

          API_KEY = os.environ["GROQ_API_KEY"]
          RUN_NUMBER = int(os.environ.get("RUN_NUMBER", "1"))

          URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          mechanisms = [
              "STRANGER ON THE BED",
              "DEAD PARTNER'S PERSONAL ITEM",
              "WRONG PERSON AT THE DINNER TABLE",
              "STRANGER USING THE KITCHEN",
              "STRANGER LEAVING THE BEDROOM",
              "STRANGER WITH THE HOUSE KEY",
              "WRONG PERSON AT THE OFFICE DESK",
              "UNINVITED HOUSEGUEST",
              "STRANGER USING THE BATHROOM",
              "STRANGER HOLDING A FAMILY PHOTO",
              "WRONG PERSON IN THE GARAGE",
              "UNEXPECTED SIBLING VISITOR"
          ]

          start = ((RUN_NUMBER - 1) * 5) % len(mechanisms)
          selected = [
              mechanisms[(start + i) % len(mechanisms)]
              for i in range(5)
          ]

          print("================================")
          print("QUIET VAULT AI V7.1")
          print("================================")
          print("Run:", RUN_NUMBER)
          print("")
          print("Mechanisms:")
          for i, item in enumerate(selected, 1):
              print(f"{i}. {item}")
          print("")

          prompt = f"""
          You write ultra-short realistic horror Shorts for The Quiet Vault.

          Create EXACTLY 5 different stories.

          Each story must use one of these mechanisms:

          {chr(10).join(f"- {x}" for x in selected)}

          RULES:

          - 9-12 second Short.
          - About 25-38 spoken words.
          - Fictional adults only.
          - Realistic live-action horror.
          - Recognizable real location.
          - Something disturbing must already be visibly happening
            in the FIRST FRAME.
          - A visible adult human threat is required.
          - No slow establishing shot.
          - No supernatural creatures.
          - No ghosts.
          - No demons.
          - No monsters.
          - No children or minors.
          - No mirrors.
          - No reflections.
          - No twins.
          - No doppelgangers.
          - No cloning.
          - No CCTV.
          - No phone-screen horror.
          - No video calls.
          - No elevators.
          - No hotels.
          - No trains.
          - No printers.
          - No gore.
          - No blood.
          - No distorted faces.
          - No disappearing people.
          - No shadow figures.
          - No complicated mythology.
          - No dates or timestamps as the main twist.
          - No long explanation.
          - No object-only horror.

          STRUCTURE:

          First sentence:
          Describe the disturbing visual that is already visible.

          Middle:
          One simple reaction or realization.

          Final line:
          A short disturbing contradiction.

          CUT immediately.

          Make each story substantially different.

          Return ONLY valid JSON in this exact structure:

          {{
            "stories": [
              {{
                "id": 1,
                "title": "short curiosity-driven title",
                "script": "complete spoken script",
                "visual_hook": "what is visibly wrong in frame one",
                "ending": "final disturbing line"
              }},
              {{
                "id": 2,
                "title": "...",
                "script": "...",
                "visual_hook": "...",
                "ending": "..."
              }},
              {{
                "id": 3,
                "title": "...",
                "script": "...",
                "visual_hook": "...",
                "ending": "..."
              }},
              {{
                "id": 4,
                "title": "...",
                "script": "...",
                "visual_hook": "...",
                "ending": "..."
              }},
              {{
                "id": 5,
                "title": "...",
                "script": "...",
                "visual_hook": "...",
                "ending": "..."
              }}
            ]
          }}
          """

          payload = {
              "model": MODEL,
              "messages": [
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "temperature": 0.6,
              "max_completion_tokens": 2200,
              "reasoning_effort": "low",
              "reasoning_format": "hidden",
              "response_format": {
                  "type": "json_object"
              }
          }

          request = urllib.request.Request(
              URL,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {API_KEY}",
                  "User-Agent": "QuietVaultAI/7.1"
              },
              method="POST"
          )

          print("Calling Groq once...")
          print("")

          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  data = json.loads(response.read().decode("utf-8"))

          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8")
              print("GROQ HTTP ERROR:", error.code)
              print(body)
              raise SystemExit(1)

          content = data["choices"][0]["message"]["content"]

          if not content:
              print("Groq returned empty content.")
              raise SystemExit(1)

          try:
              result = json.loads(content)
          except json.JSONDecodeError:
              print("Groq returned invalid JSON:")
              print(content)
              raise SystemExit(1)

          stories = result.get("stories", [])

          print("Groq returned", len(stories), "stories.")
          print("")

          banned = [
              "child",
              "children",
              "kid",
              "minor",
              "baby",
              "mirror",
              "reflection",
              "doppelganger",
              "twin",
              "cloning",
              "clone",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "cctv",
              "surveillance",
              "elevator",
              "hotel",
              "train",
              "printer",
              "video call",
              "facetime",
              "blood",
              "gore",
              "shadow figure",
              "silhouette",
              "disappear",
              "vanished",
              "distorted face"
          ]

          def valid(story):
              required = [
                  "title",
                  "script",
                  "visual_hook",
                  "ending"
              ]

              for field in required:
                  if not story.get(field):
                      return False, f"missing {field}"

              text = " ".join(
                  str(story.get(x, ""))
                  for x in required
              ).lower()

              for word in banned:
                  if word in text:
                      return False, f"banned: {word}"

              words = story["script"].split()

              if len(words) < 18 or len(words) > 55:
                  return False, f"script length {len(words)} words"

              if len(story["visual_hook"].split()) < 5:
                  return False, "weak visual hook"

              if len(story["ending"].split()) < 3:
                  return False, "weak ending"

              return True, "approved"

          approved = []

          print("QUALITY CHECK")
          print("--------------------------------")

          for story in stories:
              ok, reason = valid(story)

              print(
                  story.get("id"),
                  story.get("title"),
                  "->",
                  reason
              )

              if ok:
                  approved.append(story)

          approved = approved[:3]

          output = Path("quiet-vault-output")
          output.mkdir(exist_ok=True)

          packages = []

          def flow_prompt(story):
              return f"""
          Create a 9-12 second vertical 9:16 photorealistic live-action
          horror video.

          Fictional adult characters only.
          No children.
          No celebrity or real-person likeness.

          The opening frame must immediately show the disturbing situation.

          Visual hook:
          {story["visual_hook"]}

          Story:
          {story["script"]}

          Ending:
          {story["ending"]}

          Use realistic adult actors, natural movement, believable lighting,
          realistic location and restrained cinematic camera movement.

          Keep the human threat physically visible.

          No monsters, ghosts, demons, mirrors, reflections, twins,
          doppelgangers, CCTV, phone-screen horror, gore, blood,
          distorted faces or disappearing people.

          End immediately after the disturbing realization.
          """

          keywords = (
              "horror, horror shorts, scary stories, scary shorts, "
              "horror stories, psychological horror, realistic horror, "
              "creepy stories, suspense horror, short horror stories, "
              "horror storytelling, The Quiet Vault"
          )

          hashtags = (
              "#horror #horrorshorts #scarystories "
              "#psychologicalhorror #creepy #shorts"
          )

          for number, story in enumerate(approved, 1):

              package = {
                  "title": story["title"],
                  "script": story["script"],
                  "visual_hook": story["visual_hook"],
                  "flow_prompt": flow_prompt(story),
                  "final_twist": story["ending"],
                  "description": (
                      f"A short realistic horror story about "
                      f"{story['title']}. Watch until the final second."
                  ),
                  "keywords": keywords,
                  "hashtags": hashtags,
                  "thumbnail_frame": (
                      "Use the opening frame as the thumbnail. "
                      "Optional text: " + story["title"]
                  ),
                  "sound_design": (
                      "Low realistic ambience, subtle tension, "
                      "one sharp sound on the final reveal, "
                      "then hard cut to silence."
                  ),
                  "pinned_comment": (
                      "Would you have noticed what was wrong in the first frame?"
                  )
              }

              packages.append(package)

              markdown = f"""# {story["title"]}

          ## Script

          {story["script"]}

          ## Google Flow Prompt

          {package["flow_prompt"]}

          ## Final Twist

          {story["ending"]}

          ## Description

          {package["description"]}

          ## Keywords

          {keywords}

          ## Hashtags

          {hashtags}

          ## Thumbnail

          {package["thumbnail_frame"]}

          ## Sound Design

          {package["sound_design"]}

          ## Pinned Comment

          {package["pinned_comment"]}
          """

              (output / f"short_{number:02d}.md").write_text(
                  markdown.strip(),
                  encoding="utf-8"
              )

          batch = {
              "run_number": RUN_NUMBER,
              "provider": "groq",
              "model": MODEL,
              "generated": len(stories),
              "approved": len(packages),
              "shorts": packages
          }

          (output / "batch.json").write_text(
              json.dumps(
                  batch,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print("")
          print("================================")
          print("V7.1 COMPLETE")
          print("================================")
          print("Generated:", len(stories))
          print("Approved:", len(packages))
          print("")

          for i, item in enumerate(packages, 1):
              print(f"{i}. {item['title']}")

          if len(packages) == 3:
              print("")
              print("SUCCESS: 3 Shorts ready.")
          else:
              print("")
              print("WARNING: Fewer than 3 passed the filter.")
              print("No weak stories were manufactured.")

          PY

      - name: Upload Shorts
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-v71-shorts
          path: quiet-vault-output/
