name: Quiet Vault AI - V13 Contradiction Horror Engine

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate V13 Horror Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path

          API_KEY = os.environ["GROQ_API_KEY"]
          RUN_NUMBER = int(os.environ.get("RUN_NUMBER", "1"))

          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          OUT = Path("quiet-vault-output")
          OUT.mkdir(exist_ok=True)

          # ============================================================
          # QUIET VAULT V13
          # ============================================================
          #
          # Core formula:
          #
          # recognizable location
          # + visible adult threat/violation
          # + personal evidence
          # + impossible contradiction
          # + final line that changes the meaning of frame 1
          #
          # Groq DOES NOT invent the horror mechanism.
          # Python owns the mechanism and reveal.
          # ============================================================

          MECHANISMS = [

              {
                  "name": "DEAD WIFE ROUTINE",
                  "title": "My Dead Wife Taught Her This",
                  "location": "realistic apartment bedroom at night",
                  "hook": "An unfamiliar adult woman is already making the man's bed exactly the way his dead wife used to.",
                  "evidence": "The woman is arranging the pillow, blanket and bedside glass in the dead wife's very specific bedtime arrangement.",
                  "contradiction": "The man's wife died two years ago.",
                  "reveal": "The stranger calmly says the wife showed her the routine yesterday.",
                  "final_line": "She showed me yesterday.",
                  "visual_action": "The stranger calmly finishes the bed while the man stands frozen in the doorway.",
              },

              {
                  "name": "PRIVATE NICKNAME",
                  "title": "Only My Sister Called Me That",
                  "location": "realistic apartment kitchen at night",
                  "hook": "An unfamiliar adult man is calmly preparing coffee in the protagonist's kitchen.",
                  "evidence": "He uses the protagonist's exact private coffee routine and casually calls him by a childhood nickname.",
                  "contradiction": "That nickname was used only by the protagonist's deceased sister.",
                  "reveal": "The stranger says the sister told him to use it.",
                  "visual_action": "The stranger calmly prepares the coffee while using the private nickname.",
                  "final_line": "Your sister told me you'd answer to it.",
              },

              {
                  "name": "DISCARDED OBJECT",
                  "title": "I Threw That Away Yesterday",
                  "location": "realistic apartment living room at night",
                  "hook": "An unfamiliar adult woman is sitting on the sofa holding a personal object the protagonist threw away yesterday.",
                  "evidence": "The object is unmistakably the protagonist's old watch, with its distinctive cracked strap.",
                  "contradiction": "The protagonist personally threw the broken watch into a sealed outside garbage bin the previous night.",
                  "reveal": "The woman says she found it on his bedside table this morning.",
                  "visual_action": "The stranger calmly holds the damaged watch in plain sight.",
                  "final_line": "You left it beside your bed this morning.",
              },

              {
                  "name": "FUTURE NOTE",
                  "title": "That Date Is Tomorrow",
                  "location": "realistic apartment dining table at night",
                  "hook": "An unfamiliar adult man is calmly writing a note at the protagonist's dining table.",
                  "evidence": "The note visibly contains the protagonist's name, tomorrow's date and the exact time he is standing there.",
                  "contradiction": "The event described on the note has not happened yet.",
                  "reveal": "The stranger says he is only finishing the note before the event happens.",
                  "visual_action": "The stranger writes while the protagonist can clearly see the future date and time.",
                  "final_line": "I'm just finishing it before you arrive tomorrow.",
              },

              {
                  "name": "WRONG INVITATION",
                  "title": "I Never Invited Him",
                  "location": "realistic apartment dining room at night",
                  "hook": "An unfamiliar adult man is already seated at the protagonist's dinner table, eating from a freshly prepared plate.",
                  "evidence": "There are two plates, and the stranger has prepared the protagonist's exact favorite meal.",
                  "contradiction": "The protagonist lives alone and never invited anyone.",
                  "reveal": "The stranger says the protagonist invited him the previous night.",
                  "visual_action": "The stranger calmly eats while a second untouched plate sits opposite him.",
                  "final_line": "You invited me last night.",
              },

              {
                  "name": "PRIVATE DRAWER",
                  "title": "He Knew Where I Hid It",
                  "location": "realistic apartment bedroom",
                  "hook": "An unfamiliar adult man is already reaching into the protagonist's locked bedside drawer.",
                  "evidence": "He is removing a sentimental item from a hidden compartment that nobody should know exists.",
                  "contradiction": "The protagonist has never told anyone about the compartment.",
                  "reveal": "The stranger says the protagonist himself showed him the hiding place yesterday.",
                  "visual_action": "The stranger holds the hidden item up while the open drawer remains clearly visible.",
                  "final_line": "You showed me the hiding place yesterday.",
              },

              {
                  "name": "FRESH PHOTOGRAPH",
                  "title": "That Photo Was Taken Tonight",
                  "location": "realistic apartment hallway at night",
                  "hook": "An unfamiliar adult woman stands inside the protagonist's apartment holding a photograph of him standing in the same doorway.",
                  "evidence": "The photograph shows the protagonist wearing exactly what he is wearing now.",
                  "contradiction": "The photograph appears to have been taken only moments earlier, from inside the locked apartment.",
                  "reveal": "The stranger says she took it before he arrived.",
                  "visual_action": "The photograph is held visibly toward camera while the protagonist stands in the exact position shown.",
                  "final_line": "I took it before you came home.",
              },

              {
                  "name": "LOCKED APARTMENT ROUTINE",
                  "title": "You Showed Me Yesterday",
                  "location": "realistic apartment entryway at night",
                  "hook": "An unfamiliar adult woman is already inside the locked apartment, barefoot, with the protagonist's keys placed in their exact bowl.",
                  "evidence": "She has completed his private arrival routine exactly.",
                  "contradiction": "The protagonist was away all day yesterday and never showed anyone the routine.",
                  "reveal": "She calmly says he showed her yesterday.",
                  "visual_action": "The stranger finishes placing the keys into the private bowl as the protagonist enters.",
                  "final_line": "You showed me yesterday.",
              },

              {
                  "name": "DEAD PERSON'S WATCH",
                  "title": "That Watch Stopped Two Years Ago",
                  "location": "realistic apartment hallway at night",
                  "hook": "An unfamiliar adult man is wearing the protagonist's deceased father's old watch.",
                  "evidence": "The watch is unmistakably the father's and has been locked away since his death.",
                  "contradiction": "The protagonist has never given the watch to anyone.",
                  "reveal": "The stranger says the father gave it to him yesterday.",
                  "visual_action": "The stranger casually checks the old watch while standing inside the apartment.",
                  "final_line": "Your father gave it to me yesterday.",
              },

              {
                  "name": "UNFINISHED TASK",
                  "title": "He Finished What I Hadn't Started",
                  "location": "realistic apartment kitchen at night",
                  "hook": "An unfamiliar adult woman is already cleaning a stain from the kitchen counter.",
                  "evidence": "The stain is exactly where the protagonist planned to clean something that happened only minutes earlier.",
                  "contradiction": "The protagonist has not told anyone about the spill.",
                  "reveal": "The stranger says she was told to clean it before he arrived.",
                  "visual_action": "The stranger actively wipes the fresh stain while the protagonist watches.",
                  "final_line": "He told me to clean it before you came home.",
              },

              {
                  "name": "PRIVATE BEDROOM KNOWLEDGE",
                  "title": "She Knew Which Side Was Mine",
                  "location": "realistic apartment bedroom at night",
                  "hook": "An unfamiliar adult woman is sitting on the exact side of the protagonist's bed, wearing the room slippers reserved for that side.",
                  "evidence": "She has placed the protagonist's personal items exactly where he leaves them every night.",
                  "contradiction": "Nobody else knows the routine because the protagonist lives alone.",
                  "reveal": "She says he showed her yesterday.",
                  "visual_action": "The stranger calmly follows the private bedtime routine.",
                  "final_line": "You showed me where everything goes yesterday.",
              }
          ]

          # Rotate mechanisms between workflow runs.
          start = ((RUN_NUMBER - 1) * 3) % len(MECHANISMS)

          ordered = []
          for i in range(len(MECHANISMS)):
              ordered.append(MECHANISMS[(start + i) % len(MECHANISMS)])

          # ============================================================
          # GROQ REQUEST
          # ============================================================

          def call_groq(prompt, max_tokens=900):

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "temperature": 0.55,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "quiet_vault_short",
                          "strict": True,
                          "schema": {
                              "type": "object",
                              "properties": {
                                  "title": {"type": "string"},
                                  "script": {"type": "string"},
                                  "description": {"type": "string"},
                                  "keywords": {"type": "string"},
                                  "hashtags": {"type": "string"}
                              },
                              "required": [
                                  "title",
                                  "script",
                                  "description",
                                  "keywords",
                                  "hashtags"
                              ],
                              "additionalProperties": False
                          }
                      }
                  }
              }

              data = json.dumps(payload).encode("utf-8")

              req = urllib.request.Request(
                  ENDPOINT,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {API_KEY}",
                      "User-Agent": "QuietVaultAI/1.0"
                  },
                  method="POST"
              )

              for attempt in range(5):

                  try:
                      with urllib.request.urlopen(req, timeout=90) as response:
                          raw = response.read().decode("utf-8")
                          result = json.loads(raw)

                      content = result["choices"][0]["message"]["content"]

                      if not content:
                          raise RuntimeError("Groq returned empty content")

                      return json.loads(content)

                  except urllib.error.HTTPError as e:

                      body = e.read().decode("utf-8", errors="ignore")

                      if e.code == 429:
                          retry = e.headers.get("retry-after")

                          try:
                              wait = max(65, float(retry or 65))
                          except:
                              wait = 65

                          print(f"RATE LIMITED. Waiting {wait:.1f}s...")
                          time.sleep(wait)
                          continue

                      print("GROQ HTTP ERROR:", e.code)
                      print(body)
                      raise

                  except Exception as e:

                      if attempt < 4:
                          print("Groq request failed:", repr(e))
                          time.sleep(5)
                          continue

                      raise

          # ============================================================
          # GENERATION PROMPT
          # ============================================================

          def make_prompt(m):

              return f"""
          You are writing one 9–12 second horror Short for The Quiet Vault.

          IMPORTANT:
          The horror mechanism is ALREADY FIXED.
          Do NOT invent another mechanism.
          Do NOT change the contradiction.
          Do NOT add mythology.
          Do NOT add a monster.
          Do NOT add a second twist.

          FIXED MECHANISM:
          {m['name']}

          LOCATION:
          {m['location']}

          FIRST-FRAME VISUAL:
          {m['hook']}

          VISIBLE EVIDENCE:
          {m['evidence']}

          FIXED CONTRADICTION:
          {m['contradiction']}

          FIXED VISUAL ACTION:
          {m['visual_action']}

          FIXED FINAL REVEAL:
          {m['reveal']}

          FIXED FINAL LINE:
          {m['final_line']}

          TITLE SEED:
          {m['title']}

          WRITE A VERY SHORT SCRIPT.

          Requirements:

          - 22–55 spoken words maximum.
          - Start directly inside the disturbing situation.
          - No "one night", "it was a normal day", "I never expected".
          - No exposition.
          - No narrator explaining the horror.
          - Use short natural adult dialogue.
          - The stranger must remain calm.
          - The protagonist must react naturally.
          - The final line must be the fixed final line or an extremely natural
            grammatical equivalent.
          - The final line must reveal the contradiction.
          - The first visual frame and final line must connect.
          - No children or teenagers.
          - Fictional adults only.
          - No mirrors, reflections, twins or doppelgängers.
          - No ghosts, demons, monsters or supernatural creatures.
          - No gore, blood or corpses.
          - No CCTV or surveillance.
          - No phone/video-call horror.
          - No celebrity or real-person likeness.
          - No extra characters.

          The script should feel like something that could happen in a real
          apartment, house, office or other recognizable location.

          Do not make the ending vague.

          BAD:
          "Someone told me."
          "You'll understand soon."
          "He knows."
          "It's complicated."

          GOOD:
          A specific contradiction that immediately makes the viewer rethink
          what they saw in frame one.

          Return JSON only.
          """

          # ============================================================
          # VALIDATION
          # ============================================================

          BANNED = [
              "child",
              "children",
              "kid",
              "kids",
              "teenager",
              "teen",
              "minor",
              "mirror",
              "reflection",
              "doppelganger",
              "doppelgänger",
              "twin",
              "clone",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "cctv",
              "surveillance",
              "video call",
              "blood",
              "gore",
              "corpse",
              "celebrity"
          ]

          def validate(short):

              required = [
                  "title",
                  "script",
                  "description",
                  "keywords",
                  "hashtags"
              ]

              for field in required:
                  if not short.get(field):
                      return False, f"missing {field}"

              script = short["script"].strip()

              words = script.split()

              if len(words) < 18:
                  return False, "script too short"

              if len(words) > 65:
                  return False, "script too long"

              low = script.lower()

              for word in BANNED:
                  if word in low:
                      return False, f"banned content: {word}"

              # Reject generic endings.
              weak_endings = [
                  "someone told me",
                  "you'll understand",
                  "you will understand",
                  "it's complicated",
                  "he knows",
                  "she knows",
                  "you'll see",
                  "you will see",
                  "that's why",
                  "i know"
              ]

              ending = low[-90:]

              for phrase in weak_endings:
                  if phrase in ending:
                      return False, f"weak ending: {phrase}"

              return True, "ok"

          # ============================================================
          # LOCAL FLOW PACKAGE
          # ============================================================

          def build_flow(m, script):

              return f"""
          Create a 9–12 second vertical 9:16 photorealistic live-action
          psychological horror short.

          FICTIONAL ADULT ACTORS ONLY.
          No children, teenagers, celebrities or resemblance to real people.

          LOCATION:
          {m['location']}

          FIRST FRAME — CRITICAL:
          {m['hook']}

          The disturbing action must already be happening in frame one.

          VISIBLE EVIDENCE:
          {m['evidence']}

          Keep the evidence clearly visible.

          FIXED ACTION:
          {m['visual_action']}

          The unfamiliar adult remains calm and matter-of-fact.

          The protagonist reacts with restrained, believable fear.

          DIALOGUE:
          Use exactly this dialogue:

          {script}

          FINAL REVEAL:
          {m['reveal']}

          End immediately after the final line.

          HARD CUT.
          NO fade to black.

          CAMERA:
          Medium-wide cinematic framing.
          Keep the protagonist, unfamiliar adult and evidence visible together.
          Minimal natural camera movement.
          Realistic handheld feel.

          STYLE:
          Photorealistic live action.
          Realistic adult humans.
          Natural lighting.
          Natural skin texture.
          Realistic movement.
          Grounded psychological horror.
          No fantasy aesthetic.

          STRICTLY DO NOT INCLUDE:
          children,
          teenagers,
          minors,
          mirrors,
          reflections,
          twins,
          doppelgängers,
          clones,
          ghosts,
          demons,
          monsters,
          zombies,
          gore,
          blood,
          corpses,
          CCTV,
          surveillance footage,
          phone screens,
          video calls,
          magical effects,
          extra characters,
          subtitles,
          text overlays,
          extra dialogue,
          exaggerated acting,
          face distortion,
          body distortion.

          Do not change the visual evidence.
          Do not change the action.
          Do not add another twist.
          Do not make the unfamiliar adult supernatural.
          HARD CUT.
          """

          # ============================================================
          # GENERATE
          # ============================================================

          approved = []

          print("============================================================")
          print("QUIET VAULT V13 CONTRADICTION HORROR ENGINE")
          print("============================================================")
          print(f"RUN: {RUN_NUMBER}")
          print(f"MODEL: {MODEL}")
          print("TARGET: 3 publishable Shorts")
          print("")

          for index, mechanism in enumerate(ordered):

              if len(approved) >= 3:
                  break

              print(f"MECHANISM {index + 1}: {mechanism['name']}")
              print(f"TITLE SEED: {mechanism['title']}")
              print("Generating...")

              try:
                  short = call_groq(make_prompt(mechanism), 750)

                  ok, reason = validate(short)

                  if not ok:
                      print("REJECTED:", reason)
                      print("")
                      continue

                  # Force deterministic title seed if Groq returns nonsense.
                  title = short.get("title", "").strip()

                  if (
                      not title
                      or title.lower() == "the quiet vault"
                      or len(title.split()) < 2
                  ):
                      title = mechanism["title"]

                  package = {
                      "slot": len(approved) + 1,
                      "mechanism": mechanism["name"],
                      "title": title,
                      "short_script": short["script"].strip(),
                      "visual_hook": mechanism["hook"],
                      "visible_evidence": mechanism["evidence"],
                      "flow_prompt": build_flow(
                          mechanism,
                          short["script"].strip()
                      ),
                      "final_twist": mechanism["reveal"],
                      "description": short["description"].strip(),
                      "keywords": short["keywords"].strip(),
                      "hashtags": short["hashtags"].strip(),
                      "thumbnail_frame": (
                          "Use approximately 0.5–1.5 seconds. "
                          "Choose the frame where the unfamiliar adult, "
                          "protagonist and disturbing evidence are all "
                          "clearly visible together."
                      ),
                      "thumbnail_text": "",
                      "sound_design": (
                          "Natural location room tone, realistic footsteps "
                          "and object sounds, restrained tension bed, "
                          "clear adult dialogue. Hard cut immediately "
                          "after the final line."
                      ),
                      "pinned_comment": "What would you do if you saw this?"
                  }

                  approved.append(package)

                  print("APPROVED:", title)
                  print("")

              except Exception as e:
                  print("MECHANISM FAILED:", repr(e))
                  print("Moving to next mechanism...")
                  print("")

          # ============================================================
          # OUTPUT
          # ============================================================

          batch = {
              "run": RUN_NUMBER,
              "provider": "groq",
              "model": MODEL,
              "engine": "V13 Contradiction Horror Engine",
              "generated": len(ordered),
              "approved": len(approved),
              "shorts": approved
          }

          (OUT / "batch.json").write_text(
              json.dumps(batch, indent=2),
              encoding="utf-8"
          )

          for i, short in enumerate(approved, 1):

              text = f"""# {short['title']}

          ## Mechanism

          {short['mechanism']}

          ## Script

          {short['short_script']}

          ## Visual Hook

          {short['visual_hook']}

          ## Visible Evidence

          {short['visible_evidence']}

          ## Google Flow Prompt

          ```text
          {short['flow_prompt']}
          ```

          ## Final Twist

          {short['final_twist']}

          ## Description

          ```text
          {short['description']}
          ```

          ## Keywords

          ```text
          {short['keywords']}
          ```

          ## Hashtags

          ```text
          {short['hashtags']}
          ```

          ## Thumbnail

          {short['thumbnail_frame']}

          Thumbnail text:
          {short['thumbnail_text']}

          ## Sound Design

          {short['sound_design']}

          ## Pinned Comment

          {short['pinned_comment']}
          """

              (OUT / f"short_{i:02d}.md").write_text(
                  text,
                  encoding="utf-8"
              )

          print("============================================================")
          print(f"GENERATED: {len(ordered)}")
          print(f"APPROVED:  {len(approved)}")
          print("============================================================")

          if len(approved) < 3:
              raise RuntimeError(
                  f"Only {len(approved)} Shorts approved. "
                  "No weak filler was added."
              )

          PY

      - name: Upload generated Shorts
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-v13-shorts
          path: quiet-vault-output/
