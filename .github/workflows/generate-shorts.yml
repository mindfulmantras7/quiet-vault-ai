name: Quiet Vault AI - Evidence Based Generator

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:

      - name: Generate Quiet Vault Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |

          cat > generate.py <<'PY'

          import os
          import json
          import re
          import time
          import urllib.request
          import urllib.error
          import random


          # ============================================================
          # CONFIG
          # ============================================================

          API_KEY = os.environ["GROQ_API_KEY"]

          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"

          MODEL = "openai/gpt-oss-20b"

          RUN_NUMBER = int(
              os.environ.get("RUN_NUMBER", "1")
          )


          # ============================================================
          # GROQ
          #
          # JSON OBJECT MODE ONLY.
          # No JSON schema.
          # ============================================================

          def groq_request(
              prompt,
              temperature=0.55,
              max_tokens=4000,
              retries=4
          ):

              payload = {
                  "model": MODEL,

                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],

                  "temperature": temperature,

                  "max_completion_tokens":
                      max_tokens,

                  "reasoning_effort":
                      "low",

                  "reasoning_format":
                      "hidden",

                  "response_format": {
                      "type": "json_object"
                  }
              }


              data = json.dumps(
                  payload
              ).encode("utf-8")


              for attempt in range(retries):

                  request = urllib.request.Request(

                      ENDPOINT,

                      data=data,

                      method="POST",

                      headers={
                          "Content-Type":
                              "application/json",

                          "Authorization":
                              f"Bearer {API_KEY}",

                          "User-Agent":
                              "QuietVaultAI/1.0"
                      }

                  )


                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          body = response.read().decode(
                              "utf-8"
                          )

                          result = json.loads(
                              body
                          )

                          content = (
                              result["choices"][0]
                              ["message"]["content"]
                          )

                          content = content.strip()


                          # Remove accidental markdown fences.

                          if content.startswith("```"):

                              content = re.sub(
                                  r"^```(?:json)?\s*",
                                  "",
                                  content,
                                  flags=re.I
                              )

                              content = re.sub(
                                  r"\s*```$",
                                  "",
                                  content
                              )


                          return json.loads(
                              content
                          )


                  except urllib.error.HTTPError as e:

                      body = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print("")
                      print(
                          "GROQ HTTP ERROR:",
                          e.code
                      )

                      print(body)


                      # Automatic rate-limit recovery.

                      if (
                          e.code == 429
                          and attempt < retries - 1
                      ):

                          wait_seconds = 65

                          match = re.search(
                              r"retry-after[^0-9]*([0-9]+)",
                              body,
                              re.I
                          )

                          if match:

                              wait_seconds = max(
                                  65,
                                  int(match.group(1)) + 5
                              )

                          print(
                              f"Rate limited. "
                              f"Waiting {wait_seconds}s..."
                          )

                          time.sleep(
                              wait_seconds
                          )

                          continue


                      raise


                  except json.JSONDecodeError:

                      if attempt < retries - 1:

                          print(
                              "Invalid JSON. "
                              "Retrying in 10 seconds..."
                          )

                          time.sleep(10)

                          continue

                      raise


          # ============================================================
          # THE QUIET VAULT CREATIVE DNA
          # ============================================================

          DNA = """

          THE QUIET VAULT

          Create realistic, cinematic psychological horror Shorts.

          TARGET:

          9-12 seconds.

          Adult audience.

          Fictional adults only.

          Photorealistic live action.

          Vertical 9:16.

          One recognizable location.

          2-3 adults maximum.

          ============================================================
          WHAT OUR ACTUAL CHANNEL DATA SHOWED
          ============================================================

          The strongest previous Shorts demonstrated:

          1. Immediate visual contradiction.
          2. Recognizable human relationship.
          3. Simple premise.
          4. Very short dialogue.
          5. A second disturbing realization.
          6. Strong replay potential.

          Some previous Shorts produced:

          roughly 120%+ average percentage viewed

          and one reached roughly 140%.

          This means replay is possible when the viewer understands
          the situation quickly.

          The larger weakness was the initial swipe decision.

          Therefore:

          THE FIRST FRAME MATTERS MORE THAN EXPLANATION.

          ============================================================
          FIRST FRAME
          ============================================================

          The viewer must be able to freeze frame 1 and immediately
          notice something that should not be happening.

          Good:

          stranger already sitting inside a private bedroom

          stranger holding a dead person's personal object

          stranger already inside a locked office

          stranger calmly eating inside someone else's home

          stranger performing a private household routine

          adult intruder visibly occupying a forbidden location

          Bad:

          person walking

          person entering

          door opening

          empty room

          dark hallway

          person looking scared

          mysterious object alone

          phone screen

          surveillance footage

          atmospheric establishing shot

          ============================================================
          SECOND REALIZATION
          ============================================================

          The ending must make the FIRST FRAME more disturbing.

          It must introduce a NEW fact.

          It must NOT simply explain the original situation.

          Weak:

          "I found your husband's watch."

          Strong:

          "Your husband gave me this yesterday."

          Weak:

          "I was here last night."

          Strong:

          "I was here last night.
          Your wife let me in."

          Weak:

          "I know your nickname."

          Strong:

          "I know your nickname.
          He taught it to me."

          ============================================================
          STYLE
          ============================================================

          Realistic.

          Quiet.

          Uncomfortable.

          No generic monster horror.

          No mythology.

          No complicated supernatural explanation.

          The horror should feel like something that could almost
          happen in real life.

          ============================================================
          """


          # ============================================================
          # FIXED VISUAL MECHANISMS
          #
          # These are NOT vague writing prompts.
          # They are actual opening compositions.
          # ============================================================

          SEEDS = [

              {
                  "id": 1,

                  "name":
                  "STRANGER ON THE BED",

                  "visual":
                  """
                  Frame 1:
                  A woman stands frozen in the doorway of her bedroom.
                  An unfamiliar adult man is already sitting on her bed.
                  He is holding her house keys in his hand.
                  He looks completely calm.
                  The bedroom is clearly lived-in and private.
                  """,

                  "relationship":
                  "married couple",

                  "mechanism":
                  "wrong access",

                  "ending_direction":
                  "The stranger reveals that the woman's husband personally gave him access even though the husband is dead or physically impossible to have done so."
              },


              {
                  "id": 2,

                  "name":
                  "THE DEAD HUSBAND'S WATCH",

                  "visual":
                  """
                  Frame 1:
                  A woman sits at her dining table.
                  An unfamiliar adult man sits opposite her.
                  He is visibly wearing an old silver watch that the woman
                  immediately recognizes as belonging to her dead husband.
                  """,

                  "relationship":
                  "widow",

                  "mechanism":
                  "dead person's object",

                  "ending_direction":
                  "The stranger says the dead husband gave him the watch yesterday."
              },


              {
                  "id": 3,

                  "name":
                  "LOCKED OFFICE INTRUDER",

                  "visual":
                  """
                  Frame 1:
                  An adult man stands inside his locked office.
                  An unfamiliar adult man is already sitting behind his desk.
                  The office door is visibly closed behind them.
                  The stranger is holding the man's personal desk key.
                  """,

                  "relationship":
                  "coworkers",

                  "mechanism":
                  "wrong access",

                  "ending_direction":
                  "The stranger reveals he was inside the office before the protagonist arrived and describes a private action the protagonist performed alone."
              },


              {
                  "id": 4,

                  "name":
                  "THE DINNER GUEST",

                  "visual":
                  """
                  Frame 1:
                  A woman enters her kitchen.
                  An unfamiliar adult man is already sitting at the family
                  dining table eating dinner.
                  Her husband is standing nearby looking equally confused.
                  The stranger behaves as if he belongs there.
                  """,

                  "relationship":
                  "husband and wife",

                  "mechanism":
                  "unwelcome guest",

                  "ending_direction":
                  "The stranger calmly says the husband invited him earlier, then reveals something the husband only did while alone."
              },


              {
                  "id": 5,

                  "name":
                  "THE PRIVATE BEDROOM ROUTINE",

                  "visual":
                  """
                  Frame 1:
                  An adult woman stands in her bedroom doorway.
                  An unfamiliar adult man is already inside calmly folding
                  her husband's clothes in the exact way her husband does.
                  """,

                  "relationship":
                  "married couple",

                  "mechanism":
                  "familiar routine",

                  "ending_direction":
                  "The stranger reveals a private household habit that only the woman's husband could have taught him."
              },


              {
                  "id": 6,

                  "name":
                  "THE BROKEN GLASS",

                  "visual":
                  """
                  Frame 1:
                  A husband stands in his kitchen.
                  An unfamiliar adult woman is already inside holding a
                  broken drinking glass.
                  His wife is visible behind him and looks confused.
                  """,

                  "relationship":
                  "husband and wife",

                  "mechanism":
                  "private memory",

                  "ending_direction":
                  "The stranger describes exactly how the glass was broken during a private argument that supposedly happened while only the married couple were present."
              },


              {
                  "id": 7,

                  "name":
                  "THE NEIGHBOR'S KEY",

                  "visual":
                  """
                  Frame 1:
                  A man arrives at his apartment.
                  An unfamiliar adult male neighbor is already standing
                  inside his locked apartment holding the spare key.
                  """,

                  "relationship":
                  "neighbors",

                  "mechanism":
                  "wrong access",

                  "ending_direction":
                  "The neighbor says the protagonist gave him the key that morning, then reveals a private conversation the protagonist had elsewhere."
              },


              {
                  "id": 8,

                  "name":
                  "THE PRIVATE NICKNAME",

                  "visual":
                  """
                  Frame 1:
                  A woman opens her apartment door.
                  An unfamiliar adult man is already inside the living room.
                  He is holding a cup from her kitchen as if he has used
                  the apartment before.
                  """,

                  "relationship":
                  "adult woman",

                  "mechanism":
                  "impossible familiarity",

                  "ending_direction":
                  "The stranger calls her by a private childhood nickname and says the dead person closest to her taught him the name."
              },


              {
                  "id": 9,

                  "name":
                  "THE DELIVERY",

                  "visual":
                  """
                  Frame 1:
                  An adult woman stands in her apartment.
                  A delivery man is already holding a sealed package toward her.
                  The label clearly identifies her husband as the sender.
                  """,

                  "relationship":
                  "married couple",

                  "mechanism":
                  "impossible delivery",

                  "ending_direction":
                  "The delivery man says the husband personally handed him the package earlier that day, although the husband could not have left his location."
              },


              {
                  "id": 10,

                  "name":
                  "THE BATHROOM VISITOR",

                  "visual":
                  """
                  Frame 1:
                  An adult man stands frozen outside his apartment bathroom.
                  An unfamiliar adult man is already standing inside the
                  bathroom with the door closed behind him.
                  """,

                  "relationship":
                  "roommates",

                  "mechanism":
                  "wrong room",

                  "ending_direction":
                  "The stranger calmly says he was told to wait there by the roommate, then reveals the roommate is not actually home."
              },


              {
                  "id": 11,

                  "name":
                  "THE FAMILY PHOTOGRAPH",

                  "visual":
                  """
                  Frame 1:
                  A woman is standing in her living room.
                  An unfamiliar adult man is holding an old framed family
                  photograph belonging to her.
                  He is pointing to himself in the photograph.
                  """,

                  "relationship":
                  "adult siblings",

                  "mechanism":
                  "impossible relationship",

                  "ending_direction":
                  "He claims to be the woman's brother, but reveals a private family fact that makes his claim impossible."
              },


              {
                  "id": 12,

                  "name":
                  "THE LOCKED BEDROOM",

                  "visual":
                  """
                  Frame 1:
                  A married couple stands in their bedroom.
                  An unfamiliar adult man is already sitting in a chair
                  inside the locked bedroom.
                  He is holding the wife's personal handbag.
                  """,

                  "relationship":
                  "husband and wife",

                  "mechanism":
                  "wrong access",

                  "ending_direction":
                  "The stranger says the wife gave him the handbag earlier, then reveals a private detail about something inside it."
              }

          ]


          # ============================================================
          # HARD BANS
          # ============================================================

          BANNED = [

              "child",
              "children",
              "kid",
              "baby",
              "teen",
              "teenager",
              "minor",

              "mirror",
              "reflection",
              "reflective",

              "doppelganger",
              "doppelgänger",
              "twin",

              "cctv",
              "surveillance",

              "elevator",
              "hotel",
              "train",
              "printer",

              "phone screen",
              "phone-screen",
              "video call",
              "video-call",

              "empty chair",

              "ghost",
              "demon",
              "monster",
              "zombie",

              "gore",
              "blood",

              "disappear",
              "disappears",
              "disappeared",
              "reappear",
              "reappears",

              "face distortion",
              "body transformation",

              "celebrity",
              "real person"
          ]


          def banned_term(text):

              text = text.lower()

              for term in BANNED:

                  if re.search(
                      r"\b" +
                      re.escape(term) +
                      r"\b",
                      text
                  ):

                      return term

              return None


          # ============================================================
          # GENERATE ONE SHORT
          # ============================================================

          def generate_short(
              seed,
              repair_reason=None,
              previous=None
          ):

              repair_instruction = ""


              if repair_reason:

                  repair_instruction = f"""

                  THIS IS A REPAIR.

                  The previous version failed because:

                  {repair_reason}

                  Previous version:

                  {json.dumps(
                      previous,
                      indent=2,
                      ensure_ascii=False
                  )}

                  Keep the SAME visual mechanism.

                  Do not replace the story with another mechanism.

                  Fix the specific weakness.

                  Most importantly, make the ending introduce a NEW
                  disturbing fact that makes the first frame worse.

                  """


              prompt = f"""

              You are the senior horror writer for The Quiet Vault.

              {DNA}

              ============================================================
              FIXED VISUAL SEED
              ============================================================

              Name:

              {seed["name"]}

              First-frame composition:

              {seed["visual"]}

              Relationship:

              {seed["relationship"]}

              Mechanism:

              {seed["mechanism"]}

              Required ending direction:

              {seed["ending_direction"]}

              {repair_instruction}

              ============================================================
              WRITE ONE SHORT
              ============================================================

              Do NOT invent a different visual mechanism.

              The first frame must closely follow the supplied
              composition.

              The threat must be visible immediately.

              Keep dialogue short.

              Maximum approximately 35 spoken words.

              The story should fit naturally into 9-12 seconds.

              ============================================================
              TIMING
              ============================================================

              0-3 seconds:

              The impossible visual situation is already visible.

              3-6 seconds:

              One short line establishes the contradiction.

              6-9/12 seconds:

              One short line reveals a NEW disturbing fact.

              Hard cut.

              ============================================================
              IMPORTANT ENDING TEST
              ============================================================

              The final line must NOT simply say:

              "I was there."

              "I know."

              "I found it."

              "I was invited."

              unless it adds another specific disturbing fact.

              The ending should make the viewer rethink the opening frame.

              ============================================================
              GOOGLE FLOW
              ============================================================

              Write one complete Google Flow prompt.

              It must specify:

              vertical 9:16

              photorealistic live action

              fictional adults only

              consistent characters

              exact first-frame composition

              camera framing

              realistic lighting

              natural facial expressions

              realistic human movement

              0-3 second action

              3-6 second action

              6-9/12 second reveal

              hard cut

              no subtitles

              no text overlays

              no mirrors

              no reflections

              no children

              no monsters

              no gore

              no celebrity likeness

              ============================================================
              TITLE
              ============================================================

              Curiosity-driven.

              Do not explain the twist.

              ============================================================
              DESCRIPTION
              ============================================================

              Short and natural.

              ============================================================
              KEYWORDS
              ============================================================

              Comma-separated.

              ============================================================
              HASHTAGS
              ============================================================

              Compact.

              ============================================================
              THUMBNAIL
              ============================================================

              Choose the strongest frame.

              Give approximate timestamp.

              Maximum 3 words of thumbnail text or NONE.

              ============================================================
              SOUND
              ============================================================

              Subtle realistic sound design.

              ============================================================
              PINNED COMMENT
              ============================================================

              One short question designed to encourage comments.

              ============================================================
              RETURN ONLY JSON
              ============================================================

              {{
                "short": {{
                  "title": "...",
                  "short_script": "...",
                  "visual_hook": "...",
                  "flow_prompt": "...",
                  "final_twist": "...",
                  "description": "...",
                  "keywords": "...",
                  "hashtags": "...",
                  "thumbnail_frame": "...",
                  "thumbnail_text": "...",
                  "sound_design": "...",
                  "pinned_comment": "..."
                }}
              }}

              """


              return groq_request(
                  prompt,
                  temperature=0.65,
                  max_tokens=3500
              )


          # ============================================================
          # JUDGE ONE SHORT
          # ============================================================

          def judge_short(short, seed):

              prompt = f"""

              You are the ruthless creative director for The Quiet Vault.

              {DNA}

              Evaluate this ONE proposed Short.

              FIXED SEED:

              {seed["name"]}

              ORIGINAL VISUAL:

              {seed["visual"]}

              PROPOSED SHORT:

              {json.dumps(
                  short,
                  indent=2,
                  ensure_ascii=False
              )}

              ============================================================
              SCORE
              ============================================================

              Give each score from 1-10.

              HOOK:

              Does frame 1 make someone stop scrolling?

              VISIBLE_HORROR:

              Is the disturbing human situation physically visible?

              CLARITY:

              Can the viewer understand the basic problem immediately?

              ENDING:

              Does the ending introduce genuinely NEW disturbing
              information?

              FLOW:

              Can Google Flow realistically generate it?

              REWATCH:

              Would replay make the first frame more interesting?

              ORIGINALITY:

              Does it avoid the tired mirror/doppelganger/ghost style?

              ============================================================
              CRITICAL RULE
              ============================================================

              A creepy sentence is NOT automatically a good ending.

              The ending must materially change what the viewer thinks
              is happening.

              ============================================================
              PASS REQUIREMENTS
              ============================================================

              hook >= 8

              visible_horror >= 8

              clarity >= 8

              ending >= 8

              flow >= 8

              rewatch >= 7

              originality >= 7

              ============================================================
              RETURN JSON
              ============================================================

              {{
                "pass": true,
                "hook": 8,
                "visible_horror": 8,
                "clarity": 8,
                "ending": 8,
                "flow": 8,
                "rewatch": 7,
                "originality": 7,
                "reason": "Short explanation."
              }}

              """


              return groq_request(
                  prompt,
                  temperature=0.15,
                  max_tokens=1800
              )


          # ============================================================
          # SELECT SEEDS
          #
          # Run number rotates through the library.
          # No repeated batch every time.
          # ============================================================

          start_index = (
              (RUN_NUMBER - 1) * 3
          ) % len(SEEDS)


          ordered_seeds = []

          for i in range(
              len(SEEDS)
          ):

              ordered_seeds.append(
                  SEEDS[
                      (start_index + i)
                      % len(SEEDS)
                  ]
              )


          # ============================================================
          # GENERATION LOOP
          # ============================================================

          approved = []

          attempt_log = []


          print("")
          print("==========================================")
          print("QUIET VAULT DETERMINISTIC ENGINE")
          print("==========================================")

          print(
              "GitHub run:",
              RUN_NUMBER
          )

          print(
              "Starting seed:",
              ordered_seeds[0]["name"]
          )


          for seed in ordered_seeds:

              if len(approved) >= 3:

                  break


              print("")
              print("==========================================")
              print(
                  "TRYING SEED:",
                  seed["name"]
              )
              print("==========================================")


              current = None

              repair_reason = None

              success = False


              # --------------------------------------------------------
              # Maximum 2 creative attempts per seed.
              # --------------------------------------------------------

              for attempt in range(1, 3):

                  print(
                      f"Generation attempt {attempt}"
                  )


                  try:

                      result = generate_short(
                          seed,
                          repair_reason,
                          current
                      )


                      current = result.get(
                          "short"
                      )


                  except Exception as e:

                      print(
                          "Generation error:",
                          str(e)
                      )

                      break


                  # ----------------------------------------------------
                  # Basic structural check.
                  # ----------------------------------------------------

                  required = [

                      "title",
                      "short_script",
                      "visual_hook",
                      "flow_prompt",
                      "final_twist",
                      "description",
                      "keywords",
                      "hashtags",
                      "thumbnail_frame",
                      "thumbnail_text",
                      "sound_design",
                      "pinned_comment"

                  ]


                  if not isinstance(
                      current,
                      dict
                  ):

                      print(
                          "Rejected: no short object."
                      )

                      break


                  missing = [

                      field

                      for field in required

                      if field not in current

                  ]


                  if missing:

                      print(
                          "Rejected: missing fields:",
                          missing
                      )

                      break


                  # ----------------------------------------------------
                  # HARD BAN CHECK.
                  # ----------------------------------------------------

                  all_text = " ".join(

                      str(current.get(field, ""))

                      for field in required

                  )


                  bad = banned_term(
                      all_text
                  )


                  if bad:

                      repair_reason = (
                          f"The output contains the banned mechanism "
                          f"or term: {bad}"
                      )

                      print(
                          "REJECTED:",
                          repair_reason
                      )

                      continue


                  # ----------------------------------------------------
                  # Judge.
                  # ----------------------------------------------------

                  print(
                      "Judging..."
                  )


                  try:

                      judgment = judge_short(
                          current,
                          seed
                      )


                  except Exception as e:

                      print(
                          "Judge error:",
                          str(e)
                      )

                      break


                  print("")
                  print(
                      "HOOK:",
                      judgment.get("hook")
                  )

                  print(
                      "VISIBLE HORROR:",
                      judgment.get(
                          "visible_horror"
                      )
                  )

                  print(
                      "CLARITY:",
                      judgment.get("clarity")
                  )

                  print(
                      "ENDING:",
                      judgment.get("ending")
                  )

                  print(
                      "FLOW:",
                      judgment.get("flow")
                  )

                  print(
                      "REWATCH:",
                      judgment.get("rewatch")
                  )

                  print(
                      "ORIGINALITY:",
                      judgment.get(
                          "originality"
                      )
                  )

                  print(
                      "REASON:",
                      judgment.get("reason")
                  )


                  # ----------------------------------------------------
                  # Python makes the final decision.
                  # ----------------------------------------------------

                  try:

                      passed = (

                          int(
                              judgment.get(
                                  "hook",
                                  0
                              )
                          ) >= 8

                          and int(
                              judgment.get(
                                  "visible_horror",
                                  0
                              )
                          ) >= 8

                          and int(
                              judgment.get(
                                  "clarity",
                                  0
                              )
                          ) >= 8

                          and int(
                              judgment.get(
                                  "ending",
                                  0
                              )
                          ) >= 8

                          and int(
                              judgment.get(
                                  "flow",
                                  0
                              )
                          ) >= 8

                          and int(
                              judgment.get(
                                  "rewatch",
                                  0
                              )
                          ) >= 7

                          and int(
                              judgment.get(
                                  "originality",
                                  0
                              )
                          ) >= 7

                      )

                  except Exception:

                      passed = False


                  if passed:

                      print("")
                      print(
                          "APPROVED:",
                          seed["name"]
                      )

                      current["_seed"] = seed["name"]

                      current["_judgment"] = judgment

                      approved.append(
                          current
                      )

                      attempt_log.append({

                          "seed":
                              seed["name"],

                          "status":
                              "approved",

                          "judgment":
                              judgment

                      })


                      success = True

                      break


                  else:

                      repair_reason = (
                          judgment.get(
                              "reason",
                              "The concept failed the creative gate."
                          )
                      )


                      print("")
                      print(
                          "FAILED CREATIVE GATE."
                      )

                      if attempt == 1:

                          print(
                              "Will repair the SAME story."
                          )

                      else:

                          print(
                              "Seed exhausted. "
                              "Moving to next seed."
                          )


              if not success:

                  attempt_log.append({

                      "seed":
                          seed["name"],

                      "status":
                          "discarded"

                  })


          # ============================================================
          # FINAL RESULT
          # ============================================================

          print("")
          print("==========================================")
          print("FINAL RESULT")
          print("==========================================")


          print(
              "Approved Shorts:",
              len(approved)
          )


          # We intentionally keep searching until three pass.

          if len(approved) < 3:

              raise RuntimeError(

                  "The engine could not produce 3 "
                  "creative-gate-passing Shorts. "
                  "No weak filler was created."

              )


          # ============================================================
          # REMOVE INTERNAL FIELDS FROM OUTPUT
          # ============================================================

          final_shorts = []


          for index, short in enumerate(
              approved[:3],
              start=1
          ):

              clean = dict(
                  short
              )

              clean.pop(
                  "_seed",
                  None
              )

              clean.pop(
                  "_judgment",
                  None
              )

              clean["id"] = index

              final_shorts.append(
                  clean
              )


          # ============================================================
          # SAVE
          # ============================================================

          os.makedirs(
              "quiet-vault-output",
              exist_ok=True
          )


          batch = {

              "run_number":
                  RUN_NUMBER,

              "engine":
                  "deterministic visual seed engine",

              "attempt_log":
                  attempt_log,

              "final_shorts":
                  final_shorts

          }


          with open(
              "quiet-vault-output/batch.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  batch,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          # ============================================================
          # MARKDOWN FILES
          # ============================================================

          for index, short in enumerate(
              final_shorts,
              start=1
          ):

              markdown = f"""# THE QUIET VAULT — SHORT {index}

          ## TITLE

          {short["title"]}

          ## SCRIPT

          {short["short_script"]}

          ## VISUAL HOOK

          {short["visual_hook"]}

          ## GOOGLE FLOW PROMPT

          {short["flow_prompt"]}

          ## FINAL TWIST

          {short["final_twist"]}

          ## DESCRIPTION

          {short["description"]}

          ## KEYWORDS

          {short["keywords"]}

          ## HASHTAGS

          {short["hashtags"]}

          ## THUMBNAIL FRAME

          {short["thumbnail_frame"]}

          ## THUMBNAIL TEXT

          {short["thumbnail_text"]}

          ## SOUND DESIGN

          {short["sound_design"]}

          ## PINNED COMMENT

          {short["pinned_comment"]}
          """


              with open(
                  f"quiet-vault-output/short_{index:02d}.md",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(markdown)


          print("")
          print("==========================================")
          print("QUIET VAULT GENERATION COMPLETE")
          print("==========================================")


          for index, short in enumerate(
              final_shorts,
              start=1
          ):

              print(
                  f"{index}. {short['title']}"
              )


          print("")
          print(
              "Artifact files created successfully."
          )

          PY


          python generate.py


      - name: Upload Quiet Vault Shorts
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts
          path: quiet-vault-output/
          retention-days: 7
