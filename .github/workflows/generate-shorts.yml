name: Quiet Vault AI - Generate Shorts

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error

          API_KEY = os.environ["GROQ_API_KEY"]
          URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          # ------------------------------------------------------------
          # FIXED VISUAL SEEDS
          #
          # Groq is NOT allowed to invent or replace these first frames.
          # These are deliberately adult-only, realistic and immediately
          # visual.
          # ------------------------------------------------------------

          SEEDS = [
              {
                  "id": 1,
                  "location": "apartment bedroom",
                  "frame": (
                      "Vertical photorealistic live-action frame. "
                      "A fictional adult woman stands in her bedroom doorway. "
                      "An unfamiliar adult man is already sitting openly on her bed, "
                      "holding her house keys in one hand and a kitchen knife in the other. "
                      "Both adults are fully visible. The woman has just discovered him."
                  ),
                  "ending_goal": (
                      "The final reveal must explain why the stranger had access "
                      "without relying on a mirror, reflection, duplicate person, "
                      "ghost, child or CCTV."
                  )
              },
              {
                  "id": 2,
                  "location": "private office",
                  "frame": (
                      "Vertical photorealistic live-action frame. "
                      "A fictional adult man stands just inside his private office. "
                      "An unfamiliar adult woman is already seated in his desk chair, "
                      "holding his access badge in one hand and a large pair of office scissors "
                      "in the other. Both adults are clearly visible and looking at each other."
                  ),
                  "ending_goal": (
                      "The ending must create a physical contradiction involving the access badge "
                      "or office access, without using surveillance footage, reflections or duplicates."
                  )
              },
              {
                  "id": 3,
                  "location": "apartment kitchen",
                  "frame": (
                      "Vertical photorealistic live-action frame. "
                      "A fictional adult couple are standing together in their kitchen. "
                      "An unfamiliar adult man is openly seated at their kitchen table between them, "
                      "holding their apartment key in one hand and calmly staring at the couple. "
                      "All three adults are visible in the same frame."
                  ),
                  "ending_goal": (
                      "The ending must reveal a disturbing reason the stranger has their key "
                      "and knows something about the couple, without supernatural duplicates."
                  )
              },
              {
                  "id": 4,
                  "location": "hospital room",
                  "frame": (
                      "Vertical photorealistic live-action frame. "
                      "A fictional adult man enters a private hospital room. "
                      "An unfamiliar adult man is already sitting beside the empty visitor chair, "
                      "holding the patient's phone and staring directly at him. "
                      "Both adults are clearly visible."
                  ),
                  "ending_goal": (
                      "The ending must reveal that the stranger knows something he could only know "
                      "if he had been inside the room earlier. Keep everything grounded and realistic."
                  )
              },
              {
                  "id": 5,
                  "location": "apartment hallway",
                  "frame": (
                      "Vertical photorealistic live-action frame. "
                      "A fictional adult woman has just opened her apartment door. "
                      "An unfamiliar adult woman is visibly standing inside the apartment, "
                      "holding the homeowner's spare key and wearing a coat belonging to the homeowner's husband. "
                      "Both adults are fully visible."
                  ),
                  "ending_goal": (
                      "The ending must reveal why the stranger has the spare key and the husband's coat. "
                      "Do not use a twin, mirror, reflection or supernatural explanation."
                  )
              },
              {
                  "id": 6,
                  "location": "laundry room",
                  "frame": (
                      "Vertical photorealistic live-action frame. "
                      "A fictional adult man opens the door to his apartment building laundry room. "
                      "An unfamiliar adult man is already inside, openly holding the man's wallet "
                      "and standing beside the only exit. Both adults are clearly visible."
                  ),
                  "ending_goal": (
                      "The ending must reveal how the stranger obtained the wallet before the man "
                      "ever entered the laundry room."
                  )
              },
              {
                  "id": 7,
                  "location": "restaurant private dining room",
                  "frame": (
                      "Vertical photorealistic live-action frame. "
                      "A fictional adult woman enters a private dining room where her husband is seated. "
                      "An unfamiliar adult man is already sitting directly opposite the husband, "
                      "holding the husband's wedding ring in his open palm. "
                      "All three adults are clearly visible."
                  ),
                  "ending_goal": (
                      "The ending must reveal how the stranger obtained the ring "
                      "and why the husband did not realize it was missing."
                  )
              },
              {
                  "id": 8,
                  "location": "apartment bathroom",
                  "frame": (
                      "Vertical photorealistic live-action frame. "
                      "A fictional adult woman stands in the bathroom doorway. "
                      "An unfamiliar adult man is openly standing inside the bathroom, "
                      "holding her house keys and a wet towel. "
                      "Both adults are fully visible."
                  ),
                  "ending_goal": (
                      "The ending must reveal a grounded reason the stranger was inside "
                      "and knew which keys belonged to the apartment."
                  )
              }
          ]

          # ------------------------------------------------------------
          # GROQ CALL
          # ------------------------------------------------------------

          def groq_call(messages, schema, max_tokens=3000, retries=5):
              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": 0.75,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": schema["name"],
                          "strict": True,
                          "schema": schema["schema"]
                      }
                  }
              }

              data = json.dumps(payload).encode("utf-8")

              for attempt in range(retries):
                  req = urllib.request.Request(
                      URL,
                      data=data,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      }
                  )

                  try:
                      with urllib.request.urlopen(req, timeout=120) as response:
                          raw = response.read().decode("utf-8")
                          result = json.loads(raw)
                          content = result["choices"][0]["message"]["content"]
                          return json.loads(content)

                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", errors="ignore")
                      print(f"GROQ HTTP {e.code}: {body}")

                      if e.code == 429 and attempt < retries - 1:
                          retry_after = e.headers.get("retry-after")
                          try:
                              wait = max(65, int(float(retry_after)) + 2)
                          except:
                              wait = 65

                          print(f"Rate limit reached. Waiting {wait}s...")
                          time.sleep(wait)
                          continue

                      raise

                  except Exception as e:
                      print(f"GROQ ERROR: {e}")

                      if attempt < retries - 1:
                          time.sleep(10)
                          continue

                      raise

          # ------------------------------------------------------------
          # STAGE 1 — EXPAND FIXED SEEDS
          # ------------------------------------------------------------

          seed_text = "\n\n".join(
              f"""SEED {s['id']}
          LOCATION: {s['location']}
          EXACT FIRST FRAME:
          {s['frame']}
          ENDING GOAL:
          {s['ending_goal']}
          """
              for s in SEEDS
          )

          generator_schema = {
              "name": "seed_expansions",
              "schema": {
                  "type": "object",
                  "properties": {
                      "concepts": {
                          "type": "array",
                          "items": {
                              "type": "object",
                              "properties": {
                                  "id": {"type": "integer"},
                                  "title": {"type": "string"},
                                  "premise": {"type": "string"},
                                  "ending": {"type": "string"}
                              },
                              "required": [
                                  "id",
                                  "title",
                                  "premise",
                                  "ending"
                              ],
                              "additionalProperties": False
                          }
                      }
                  },
                  "required": ["concepts"],
                  "additionalProperties": False
              }
          }

          generator_prompt = f"""
          You create concepts for a realistic cinematic horror Shorts channel.

          IMPORTANT:
          The visual first frames below are FIXED.

          You are NOT allowed to:
          - replace the people
          - replace the location
          - remove the visible stranger
          - turn the stranger into a ghost/monster
          - introduce a child
          - introduce a mirror
          - introduce a reflection
          - introduce a duplicate/twin/doppelganger
          - introduce CCTV or surveillance footage
          - introduce an elevator
          - introduce a car
          - introduce a hotel
          - introduce a train
          - introduce a disappearing/reappearing person
          - turn the story into mythology
          - use gore

          Your only job is to build a SIMPLE 9–12 second horror premise around
          the fixed visual.

          The horror must be understandable from the image BEFORE narration.

          The visible adult stranger is the threat.

          The ending should create one clean contradiction or disturbing reveal.

          Do NOT explain the entire backstory.

          Avoid generic "someone broke in" endings.

          Each concept must feel different.

          Seeds:

          {seed_text}
          """

          print("Generating concepts from fixed visual seeds...")

          generated = groq_call(
              [
                  {
                      "role": "system",
                      "content": "You are a cinematic horror concept writer. Follow the fixed visual seeds exactly."
                  },
                  {
                      "role": "user",
                      "content": generator_prompt
                  }
              ],
              generator_schema,
              max_tokens=2800
          )

          concepts = generated["concepts"]

          # ------------------------------------------------------------
          # PYTHON RE-ATTACHES THE EXACT FIXED FRAME
          # ------------------------------------------------------------

          seed_map = {s["id"]: s for s in SEEDS}

          candidates = []

          for c in concepts:
              sid = c["id"]

              if sid not in seed_map:
                  continue

              candidates.append({
                  "id": sid,
                  "title": c["title"].strip(),
                  "premise": c["premise"].strip(),
                  "static_frame_1": seed_map[sid]["frame"],
                  "ending": c["ending"].strip()
              })

          print(f"Generated {len(candidates)} seed-based candidates.")

          # ------------------------------------------------------------
          # HARD FILTER
          # ------------------------------------------------------------

          banned = [
              "child",
              "children",
              "kid",
              "baby",
              "boy",
              "girl",
              "nursery",
              "babysitter",
              "mirror",
              "reflection",
              "reflected",
              "twin",
              "doppelganger",
              "double",
              "cctv",
              "surveillance",
              "security camera",
              "elevator",
              "car",
              "vehicle",
              "hotel",
              "train",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "shadow figure",
              "silhouette",
              "gore",
              "blood",
              "disappears",
              "disappeared",
              "vanishes",
              "vanished",
              "teleports",
              "supernatural"
          ]

          def has_banned(text):
              text = text.lower()

              for phrase in banned:
                  pattern = r"(?<![a-z])" + re.escape(phrase) + r"(?![a-z])"
                  if re.search(pattern, text):
                      return True

              return False

          clean_candidates = []

          for c in candidates:
              combined = " ".join([
                  c["title"],
                  c["premise"],
                  c["static_frame_1"],
                  c["ending"]
              ])

              if has_banned(combined):
                  print(f"HARD REJECT: {c['id']} - {c['title']}")
                  continue

              clean_candidates.append(c)

          print(f"After hard filter: {len(clean_candidates)}")

          if len(clean_candidates) < 3:
              raise RuntimeError("Fewer than 3 clean candidates remained.")

          # ------------------------------------------------------------
          # STAGE 2 — STRICT CREATIVE GATE
          # ------------------------------------------------------------

          gate_schema = {
              "name": "creative_gate",
              "schema": {
                  "type": "object",
                  "properties": {
                      "evaluations": {
                          "type": "array",
                          "items": {
                              "type": "object",
                              "properties": {
                                  "id": {"type": "integer"},
                                  "first_frame_hook": {"type": "boolean"},
                                  "visible_threat": {"type": "boolean"},
                                  "flow_feasible": {"type": "boolean"},
                                  "clear_horror": {"type": "boolean"},
                                  "original_angle": {"type": "boolean"},
                                  "rule_compliant": {"type": "boolean"},
                                  "approve": {"type": "boolean"},
                                  "reason": {"type": "string"}
                              },
                              "required": [
                                  "id",
                                  "first_frame_hook",
                                  "visible_threat",
                                  "flow_feasible",
                                  "clear_horror",
                                  "original_angle",
                                  "rule_compliant",
                                  "approve",
                                  "reason"
                              ],
                              "additionalProperties": False
                          }
                      }
                  },
                  "required": ["evaluations"],
                  "additionalProperties": False
              }
          }

          candidate_text = json.dumps(clean_candidates, indent=2)

          gate_prompt = f"""
          You are the FINAL QUALITY GATE for a realistic horror Shorts channel.

          Evaluate each candidate independently.

          APPROVE only if ALL six requirements are TRUE:

          1. FIRST-FRAME HOOK
             The exact supplied first frame already looks wrong/scary
             before narration.

          2. VISIBLE THREAT
             A clearly visible ADULT HUMAN creates the danger.
             Do not approve sound-only, implication-only or empty-room horror.

          3. FLOW FEASIBILITY
             Google Flow can realistically generate the scene in one short clip.
             Avoid complicated choreography or tiny-object precision.

          4. CLEAR HORROR
             A viewer can understand the basic danger almost immediately.

          5. ORIGINAL ANGLE
             It must not feel like a generic "someone broke into my house"
             story with no additional contradiction.

          6. RULE COMPLIANCE
             No children, mirrors, reflections, twins, doppelgangers,
             CCTV, elevators, cars, hotels, trains, ghosts, demons,
             monsters, gore, disappearing people or supernatural mythology.

          Be extremely strict.

          If even ONE requirement fails, approve=false.

          CANDIDATES:

          {candidate_text}
          """

          print("Running strict creative gate...")

          gate = groq_call(
              [
                  {
                      "role": "system",
                      "content": "You are an extremely strict horror-content quality-control editor."
                  },
                  {
                      "role": "user",
                      "content": gate_prompt
                  }
              ],
              gate_schema,
              max_tokens=2500
          )

          approved_ids = []

          for e in gate["evaluations"]:
              print(
                  f"GATE {e['id']}: "
                  f"hook={e['first_frame_hook']} "
                  f"threat={e['visible_threat']} "
                  f"flow={e['flow_feasible']} "
                  f"horror={e['clear_horror']} "
                  f"original={e['original_angle']} "
                  f"rules={e['rule_compliant']} "
                  f"APPROVE={e['approve']} "
                  f"| {e['reason']}"
              )

              if e["approve"]:
                  approved_ids.append(e["id"])

          approved = [
              c for c in clean_candidates
              if c["id"] in approved_ids
          ]

          if len(approved) < 3:
              raise RuntimeError(
                  f"Creative gate approved only {len(approved)} candidates. "
                  "Workflow stopped instead of filling with weak concepts."
              )

          approved = approved[:3]

          print(f"Approved {len(approved)} concepts.")

          # ------------------------------------------------------------
          # RATE-LIMIT BUFFER
          # ------------------------------------------------------------

          print("Waiting 65 seconds before finalization...")
          time.sleep(65)

          # ------------------------------------------------------------
          # STAGE 3 — FINAL SHORT PACKAGE
          # ------------------------------------------------------------

          final_schema = {
              "name": "final_short",
              "schema": {
                  "type": "object",
                  "properties": {
                      "id": {"type": "integer"},
                      "title": {"type": "string"},
                      "short_script": {"type": "string"},
                      "flow_prompt": {"type": "string"},
                      "final_twist": {"type": "string"},
                      "description": {"type": "string"},
                      "keywords": {"type": "string"},
                      "hashtags": {"type": "string"},
                      "thumbnail_frame": {"type": "string"},
                      "thumbnail_text": {"type": "string"},
                      "sound_design": {"type": "string"},
                      "pinned_comment": {"type": "string"}
                  },
                  "required": [
                      "id",
                      "title",
                      "short_script",
                      "flow_prompt",
                      "final_twist",
                      "description",
                      "keywords",
                      "hashtags",
                      "thumbnail_frame",
                      "thumbnail_text",
                      "sound_design",
                      "pinned_comment"
                  ],
                  "additionalProperties": False
              }
          }

          final_outputs = []

          for index, candidate in enumerate(approved):

              print(f"Finalizing {index + 1}/3: {candidate['title']}")

              prompt = f"""
          Turn this APPROVED horror concept into a complete YouTube Short package.

          CRITICAL:
          The first visual frame is FIXED.

          Do not change the visual situation described below.

          CANDIDATE:
          {json.dumps(candidate, indent=2)}

          Requirements:

          SCRIPT
          - 9–12 seconds
          - very short
          - natural spoken narration
          - no exposition dump
          - immediate hook
          - visible threat first
          - simple escalation
          - final disturbing reveal
          - hard cut ending

          FLOW PROMPT
          - Google Flow ready
          - vertical 9:16
          - photorealistic live-action
          - fictional adults only
          - no celebrity or real-person likeness
          - preserve the exact first-frame composition
          - realistic human movement
          - realistic lighting
          - cinematic but believable
          - no monsters
          - no gore
          - no mirror/reflection
          - no CCTV
          - no children
          - no duplicate people

          THUMBNAIL
          Select the exact strongest visual moment from the generated sequence.
          Thumbnail text should be 2–4 words maximum.
          Do not explain the twist in the thumbnail.

          DESCRIPTION
          Natural YouTube description.

          KEYWORDS
          Comma-separated.

          HASHTAGS
          Compact.

          SOUND DESIGN
          Simple practical sound cues.

          PINNED COMMENT
          Encourage comments without revealing the twist.
          """

              result = groq_call(
                  [
                      {
                          "role": "system",
                          "content": "You are the final script and production editor for The Quiet Vault, a realistic cinematic horror Shorts channel."
                      },
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  final_schema,
                  max_tokens=1800
              )

              final_outputs.append(result)

              if index < len(approved) - 1:
                  print("Waiting 12 seconds before next final package...")
                  time.sleep(12)

          # ------------------------------------------------------------
          # SAVE OUTPUT
          # ------------------------------------------------------------

          os.makedirs("output", exist_ok=True)

          with open("output/quiet-vault-shorts.json", "w", encoding="utf-8") as f:
              json.dump(
                  {
                      "generated_at": time.strftime("%Y-%m-%d %H:%M:%S UTC"),
                      "shorts": final_outputs
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # Human-readable report
          with open("output/quiet-vault-shorts.txt", "w", encoding="utf-8") as f:

              for i, s in enumerate(final_outputs, 1):

                  f.write("=" * 70 + "\n")
                  f.write(f"SHORT {i}\n")
                  f.write("=" * 70 + "\n\n")

                  f.write(f"TITLE:\n{s['title']}\n\n")

                  f.write("SCRIPT:\n")
                  f.write(s["short_script"] + "\n\n")

                  f.write("GOOGLE FLOW PROMPT:\n")
                  f.write(s["flow_prompt"] + "\n\n")

                  f.write("FINAL TWIST:\n")
                  f.write(s["final_twist"] + "\n\n")

                  f.write("DESCRIPTION:\n")
                  f.write(s["description"] + "\n\n")

                  f.write("KEYWORDS:\n")
                  f.write(s["keywords"] + "\n\n")

                  f.write("HASHTAGS:\n")
                  f.write(s["hashtags"] + "\n\n")

                  f.write("THUMBNAIL FRAME:\n")
                  f.write(s["thumbnail_frame"] + "\n\n")

                  f.write("THUMBNAIL TEXT:\n")
                  f.write(s["thumbnail_text"] + "\n\n")

                  f.write("SOUND DESIGN:\n")
                  f.write(s["sound_design"] + "\n\n")

                  f.write("PINNED COMMENT:\n")
                  f.write(s["pinned_comment"] + "\n\n")

          print("")
          print("==============================================")
          print("QUIET VAULT AI GENERATION SUCCESS")
          print("==============================================")
          print(f"Generated {len(final_outputs)} Shorts.")
          print("Files:")
          print(" - output/quiet-vault-shorts.json")
          print(" - output/quiet-vault-shorts.txt")
          print("==============================================")
          PY

      - name: Upload generated Shorts package
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts
          path: output/
          if-no-files-found: error
