name: Generate Quiet Vault Shorts V6

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RUN_NUMBER: ${{ github.run_number }}

    steps:
      - name: Generate Quiet Vault Shorts V6
        shell: bash
        run: |
          cat > generate.py <<'PY'
          import os
          import json
          import re
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path

          API_KEY = os.environ["GROQ_API_KEY"]
          RUN_NUMBER = int(os.environ.get("RUN_NUMBER", "1"))

          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          OUT = Path("quiet-vault-output")
          OUT.mkdir(exist_ok=True)

          print("=" * 64)
          print("QUIET VAULT CREATIVE ENGINE V6")
          print("=" * 64)
          print(f"GitHub run: {RUN_NUMBER}")

          # ============================================================
          # CREATIVE DNA
          # ============================================================

          DNA = """
          THE QUIET VAULT

          FORMAT:
          - 9-12 second YouTube horror Short.
          - Photorealistic cinematic live action.
          - Vertical 9:16.
          - Fictional adult characters only.
          - Recognizable everyday location.
          - Horror must be visually understandable without sound.
          - The disturbing situation must already be visible in frame 1.
          - One simple central contradiction.
          - One escalation.
          - One concrete final reveal.
          - Hard cut immediately after the reveal.

          CORE FORMULA:

          VISUAL IMPOSSIBILITY
          +
          SIMPLE HUMAN REACTION
          +
          ONE ESCALATION
          +
          NEW CONCRETE FACT
          +
          CUT

          The first frame is more important than the explanation.

          BAD:
          "A stranger is sitting in a room."

          GOOD:
          "A stranger is already wearing the husband's clothes,
          lying in the husband's exact place in bed."

          BAD:
          "A man has a mysterious key."

          GOOD:
          "A stranger is physically leaving the apartment with
          the woman's packed suitcase."

          The viewer should immediately think:
          "Why is THAT person doing THAT?"

          Then the ending should make the viewer think:
          "Wait... then how is the opening possible?"
          """

          # ============================================================
          # VISUAL MECHANISM LIBRARY
          # ============================================================

          MECHANISMS = [
              {
                  "name": "BEDROOM OCCUPANT",
                  "visual": """
          An unfamiliar adult is already lying in the homeowner's
          bed wearing clothing associated with the homeowner's spouse.
          The homeowner is visibly standing in the doorway.
                  """
              },

              {
                  "name": "SUITCASE INTRUDER",
                  "visual": """
          An unfamiliar adult is already inside an apartment and is
          physically carrying the homeowner's packed suitcase toward
          the front door.
          """
              },

              {
                  "name": "WRONG PERSON AT DINNER",
                  "visual": """
          An unfamiliar adult is already sitting at a married couple's
          dinner table and is actively eating from one spouse's plate.
          Both spouses are visibly present.
          """
              },

              {
                  "name": "LOCKED OFFICE OCCUPANT",
                  "visual": """
          An unfamiliar adult is visibly sitting at an employee's desk
          inside the employee's private office while the employee stands
          at the doorway.
          """
              },

              {
                  "name": "HOSPITAL BED VISITOR",
                  "visual": """
          An unfamiliar adult is physically sitting beside an unconscious
          adult patient in a hospital room and is wearing or holding
          something unmistakably personal to the patient.
          """
              },

              {
                  "name": "WRONG PERSON USING THE KITCHEN",
                  "visual": """
          An unfamiliar adult is calmly performing a very specific
          household routine in the protagonist's kitchen using the
          protagonist's personal kitchen items.
          """
              },

              {
                  "name": "STRANGER LEAVING THE BEDROOM",
                  "visual": """
          An unfamiliar adult is physically walking out of the protagonist's
          bedroom carrying an item that belongs specifically to the
          protagonist's spouse.
          """
              },

              {
                  "name": "UNINVITED HOUSEGUEST",
                  "visual": """
          An unfamiliar adult is already inside a normal apartment,
          calmly removing a coat and behaving as though they live there.
          The homeowner is visibly confronting them.
          """
              },

              {
                  "name": "WRONG PERSON IN THE GARAGE",
                  "visual": """
          An unfamiliar adult is physically sitting inside the homeowner's
          parked car in the homeowner's private garage while the homeowner
          is standing beside the open driver's door.
          """
              },

              {
                  "name": "WRONG PERSON AT THE DESK",
                  "visual": """
          An unfamiliar adult is physically using the protagonist's
          workstation in a private room while the protagonist watches
          from only a few feet away.
          """
              }
          ]

          # Pick five mechanisms and rotate them between runs.
          start = ((RUN_NUMBER - 1) * 3) % len(MECHANISMS)

          selected_mechanisms = (
              MECHANISMS[start:start + 5]
          )

          if len(selected_mechanisms) < 5:
              selected_mechanisms += MECHANISMS[
                  :5 - len(selected_mechanisms)
              ]

          print("\nMechanisms selected:")
          for i, mechanism in enumerate(selected_mechanisms, 1):
              print(
                  f"{i}. {mechanism['name']}"
              )

          # ============================================================
          # BANNED CREATIVE CONTENT
          # ============================================================

          BANNED = [
              "child",
              "children",
              "kid",
              "kids",
              "baby",
              "infant",
              "toddler",
              "boy",
              "girl",
              "teen",
              "teenager",
              "minor",

              "mirror",
              "reflection",
              "reflective",

              "twin",
              "doppelganger",
              "doppelgänger",
              "clone",
              "cloning",

              "ghost",
              "demon",
              "monster",
              "zombie",
              "spirit",
              "possessed",
              "possession",

              "cctv",
              "surveillance",
              "security footage",
              "security camera",

              "elevator",
              "hotel",
              "train",
              "printer",

              "video call",
              "facetime",
              "zoom call",

              "blood",
              "gore",
              "corpse",

              "disappear",
              "disappeared",
              "disappears",
              "vanish",
              "vanished",
              "teleport",

              "face distortion",
              "face changed",
              "body transformation",

              "celebrity",
              "real person",
              "famous person"
          ]

          def banned_term(text):
              text = text.lower()

              for term in BANNED:
                  if re.search(
                      r"\b" + re.escape(term) + r"\b",
                      text
                  ):
                      return term

              return None

          # ============================================================
          # GROQ API
          # ============================================================

          def groq_call(
              messages,
              schema,
              max_tokens
          ):

              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": 0.55,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden",
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "quiet_vault",
                          "strict": True,
                          "schema": schema
                      }
                  }
              }

              body = json.dumps(
                  payload
              ).encode("utf-8")

              for attempt in range(4):

                  request = urllib.request.Request(
                      ENDPOINT,
                      data=body,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Authorization":
                              f"Bearer {API_KEY}",
                          "User-Agent":
                              "QuietVaultAI/6.0"
                      }
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=120
                      ) as response:

                          raw = response.read().decode(
                              "utf-8"
                          )

                      data = json.loads(raw)

                      content = data[
                          "choices"
                      ][0]["message"]["content"]

                      return json.loads(content)

                  except urllib.error.HTTPError as error:

                      raw = error.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      if error.code == 429:

                          wait = 15

                          try:

                              parsed = json.loads(raw)

                              message = parsed.get(
                                  "error",
                                  {}
                              ).get(
                                  "message",
                                  ""
                              )

                              match = re.search(
                                  r"try again in ([0-9.]+)s",
                                  message,
                                  re.I
                              )

                              if match:
                                  wait = max(
                                      12,
                                      min(
                                          60,
                                          float(
                                              match.group(1)
                                          ) + 1
                                      )
                                  )

                          except Exception:
                              pass

                          print(
                              f"RATE LIMITED. "
                              f"Waiting {wait:.1f}s..."
                          )

                          time.sleep(wait)
                          continue

                      print(
                          f"GROQ HTTP ERROR: {error.code}"
                      )
                      print(raw[:3000])

                      raise

                  except Exception as error:

                      print(
                          f"GROQ ERROR: {error}"
                      )

                      if attempt < 3:
                          time.sleep(3)
                          continue

                      raise

              raise RuntimeError(
                  "Groq request failed after retries."
              )

          # ============================================================
          # GENERATION SCHEMA
          # ============================================================

          generation_schema = {
              "type": "object",
              "additionalProperties": False,
              "required": ["shorts"],
              "properties": {
                  "shorts": {
                      "type": "array",
                      "minItems": 5,
                      "maxItems": 5,
                      "items": {
                          "type": "object",
                          "additionalProperties": False,
                          "required": [
                              "title",
                              "short_script",
                              "visual_hook",
                              "ending"
                          ],
                          "properties": {
                              "title": {
                                  "type": "string"
                              },
                              "short_script": {
                                  "type": "string"
                              },
                              "visual_hook": {
                                  "type": "string"
                              },
                              "ending": {
                                  "type": "string"
                              }
                          }
                      }
                  }
              }
          }

          # ============================================================
          # ONE GENERATION CALL
          # ============================================================

          mechanism_block = ""

          for i, mechanism in enumerate(
              selected_mechanisms,
              1
          ):

              mechanism_block += f"""

          CANDIDATE {i}
          MECHANISM: {mechanism['name']}

          REQUIRED FRAME-1 VISUAL:
          {mechanism['visual']}
          """

          generation_prompt = f"""
          Create exactly five different realistic horror Shorts.

          {DNA}

          {mechanism_block}

          IMPORTANT:

          Each candidate corresponds to the mechanism with the same number.

          DO NOT change the mechanism.

          HARD CREATIVE RULES:

          - Adult characters only.
          - No children.
          - No supernatural creatures.
          - No mirrors.
          - No reflections.
          - No surveillance.
          - No phone/video-call horror.
          - No gore.
          - No disappearing people.
          - No cloning.
          - No doppelgängers.
          - No dreams.
          - No mythology.

          DO NOT use these as the main twist:

          - dates
          - calendars
          - names
          - passwords
          - fingerprints
          - mysterious notes
          - generic keys
          - mysterious objects
          - "he knows something"
          - "she knows something"
          - unexplained noises

          THE VISUAL HOOK:

          The first frame must itself look wrong.

          The viewer should be able to pause frame 1 and immediately
          understand why the situation is strange.

          THE ESCALATION:

          The dialogue should make the visible situation more disturbing.

          THE ENDING:

          The final beat must introduce a NEW CONCRETE FACT.

          It must not merely repeat something already said.

          It must not be:
          "I froze."
          "She smiled."
          "He stared."
          "Then I realized..."
          "Everything went dark."

          The ending should force a question such as:

          "Then how was that possible?"

          LENGTH:

          Maximum 40 spoken words per Short.

          Keep the dialogue natural and extremely concise.

          Do not write narration unless absolutely necessary.

          Every candidate must feel materially different from the others.

          Return only the requested JSON.
          """

          print()
          print("=" * 64)
          print("GENERATING FIVE STORIES")
          print("=" * 64)

          generated = groq_call(
              [
                  {
                      "role": "system",
                      "content":
                          "You are a concise cinematic horror writer. "
                          "Follow the schema exactly."
                  },
                  {
                      "role": "user",
                      "content":
                          generation_prompt
                  }
              ],
              generation_schema,
              max_tokens=2600
          )

          candidates = generated[
              "shorts"
          ]

          print(
              f"Generated candidates: "
              f"{len(candidates)}"
          )

          # ============================================================
          # HARD FILTER
          # ============================================================

          clean = []

          print()
          print("=" * 64)
          print("PYTHON HARD FILTER")
          print("=" * 64)

          for i, candidate in enumerate(
              candidates,
              1
          ):

              creative = " ".join([
                  candidate.get(
                      "title",
                      ""
                  ),
                  candidate.get(
                      "short_script",
                      ""
                  ),
                  candidate.get(
                      "visual_hook",
                      ""
                  ),
                  candidate.get(
                      "ending",
                      ""
                  )
              ])

              bad = banned_term(
                  creative
              )

              if bad:

                  print(
                      f"{i}. REJECTED — "
                      f"banned term: {bad}"
                  )

                  continue

              words = len(
                  candidate[
                      "short_script"
                  ].split()
              )

              if words > 45:

                  print(
                      f"{i}. REJECTED — "
                      f"{words} words"
                  )

                  continue

              if words < 12:

                  print(
                      f"{i}. REJECTED — "
                      f"too short"
                  )

                  continue

              if len(
                  candidate[
                      "visual_hook"
                  ].strip()
              ) < 25:

                  print(
                      f"{i}. REJECTED — "
                      f"weak visual hook"
                  )

                  continue

              if len(
                  candidate[
                      "ending"
                  ].strip()
              ) < 20:

                  print(
                      f"{i}. REJECTED — "
                      f"weak ending"
                  )

                  continue

              clean.append(
                  candidate
              )

              print(
                  f"{i}. HARD PASS — "
                  f"{candidate['title']}"
              )

          if len(clean) < 3:

              raise RuntimeError(
                  "Fewer than three candidates "
                  "survived hard validation."
              )

          # ============================================================
          # COMPARATIVE JUDGE SCHEMA
          # ============================================================

          judge_schema = {
              "type": "object",
              "additionalProperties": False,
              "required": ["evaluations"],
              "properties": {
                  "evaluations": {
                      "type": "array",
                      "minItems": 3,
                      "maxItems": 5,
                      "items": {
                          "type": "object",
                          "additionalProperties": False,
                          "required": [
                              "index",
                              "hook",
                              "visible_horror",
                              "clarity",
                              "escalation",
                              "ending",
                              "rewatch",
                              "flow",
                              "originality",
                              "pass"
                          ],
                          "properties": {
                              "index": {
                                  "type": "integer"
                              },
                              "hook": {
                                  "type": "integer"
                              },
                              "visible_horror": {
                                  "type": "integer"
                              },
                              "clarity": {
                                  "type": "integer"
                              },
                              "escalation": {
                                  "type": "integer"
                              },
                              "ending": {
                                  "type": "integer"
                              },
                              "rewatch": {
                                  "type": "integer"
                              },
                              "flow": {
                                  "type": "integer"
                              },
                              "originality": {
                                  "type": "integer"
                              },
                              "pass": {
                                  "type": "boolean"
                              }
                          }
                      }
                  }
              }
          }

          # ============================================================
          # ONE JUDGE CALL
          # ============================================================

          judge_candidates = ""

          for i, candidate in enumerate(
              clean,
              1
          ):

              judge_candidates += f"""

          CANDIDATE {i}

          TITLE:
          {candidate['title']}

          SCRIPT:
          {candidate['short_script']}

          FRAME-1 VISUAL:
          {candidate['visual_hook']}

          ENDING:
          {candidate['ending']}
          """

          judge_prompt = f"""
          You are the final creative editor for The Quiet Vault.

          Judge these candidates strictly.

          {DNA}

          {judge_candidates}

          Score each candidate 0-10.

          HOOK:
          Would the first frame stop a scrolling viewer?

          VISIBLE_HORROR:
          Is the disturbing situation physically visible?
          A normal person simply standing somewhere scores low.

          CLARITY:
          Can the premise be understood immediately?

          ESCALATION:
          Does the situation become more disturbing?

          ENDING:
          Does the final beat introduce a genuinely NEW concrete fact?

          REWATCH:
          Does the ending make the viewer want to replay frame 1?

          FLOW:
          Could Google Flow create this realistically in 9-12 seconds?

          ORIGINALITY:
          Does this avoid feeling like generic AI horror?

          STRICT REJECTION:

          Reject if:
          - the first frame is basically normal
          - the horror is mostly implied
          - the story relies on an object/date/name as the twist
          - the ending merely repeats the setup
          - the ending is just a reaction
          - there is no new concrete fact
          - the situation has an obvious normal explanation
          - it needs too much dialogue
          - it needs detailed text to be read
          - it resembles a generic "stranger appears" story
          - the visual and dialogue are confusing
          - the ending does not make frame 1 more disturbing

          PASS requires:

          hook >= 8
          visible_horror >= 8
          clarity >= 8
          escalation >= 7
          ending >= 8
          rewatch >= 7
          flow >= 8
          originality >= 7

          Be strict.

          Return only JSON.
          """

          print()
          print("=" * 64)
          print("COMPARATIVE CREATIVE JUDGE")
          print("=" * 64)

          judged = groq_call(
              [
                  {
                      "role": "system",
                      "content":
                          "You are a strict horror editor. "
                          "Return only valid JSON."
                  },
                  {
                      "role": "user",
                      "content":
                          judge_prompt
                  }
              ],
              judge_schema,
              max_tokens=900
          )

          evaluations = judged[
              "evaluations"
          ]

          # ============================================================
          # SELECT PASSING STORIES
          # ============================================================

          passing = []

          for evaluation in evaluations:

              index = evaluation.get(
                  "index"
              )

              if not isinstance(
                  index,
                  int
              ):
                  continue

              if index < 1 or index > len(clean):
                  continue

              print(
                  f"Candidate {index}: "
                  f"hook={evaluation['hook']} "
                  f"visible={evaluation['visible_horror']} "
                  f"clarity={evaluation['clarity']} "
                  f"escalation={evaluation['escalation']} "
                  f"ending={evaluation['ending']} "
                  f"rewatch={evaluation['rewatch']} "
                  f"flow={evaluation['flow']} "
                  f"originality={evaluation['originality']} "
                  f"PASS={evaluation['pass']}"
              )

              if evaluation["pass"]:

                  total = sum([
                      evaluation["hook"],
                      evaluation["visible_horror"],
                      evaluation["clarity"],
                      evaluation["escalation"],
                      evaluation["ending"],
                      evaluation["rewatch"],
                      evaluation["flow"],
                      evaluation["originality"]
                  ])

                  passing.append(
                      (
                          total,
                          index,
                          evaluation
                      )
                  )

          passing.sort(
              reverse=True
          )

          if len(passing) < 3:

              print()
              print(
                  "Fewer than three candidates "
                  "passed the creative gate."
              )

              raise RuntimeError(
                  "V6 refused to create weak filler."
              )

          winners = passing[:3]

          # ============================================================
          # PYTHON-BUILT FLOW PROMPT
          # ============================================================

          def make_flow_prompt(
              candidate
          ):

              return f"""
          Create a 9-12 second vertical 9:16 photorealistic
          live-action horror Short.

          IMPORTANT:
          All characters are fictional adults.
          No celebrity or real-person likeness.

          FRAME 1 — CRITICAL:
          {candidate['visual_hook']}

          ACTION:
          {candidate['short_script']}

          FINAL BEAT:
          {candidate['ending']}

          VISUAL STYLE:
          Photorealistic live action.
          Realistic everyday location.
          Natural human proportions.
          Natural facial expressions.
          Realistic clothing.
          Realistic lighting.
          Cinematic shallow depth of field.
          Subtle handheld camera movement.

          PERFORMANCE:
          Adults behave naturally.
          No exaggerated acting.
          No comedy.
          No cartoon appearance.

          TIMING:
          0.0-3.0 seconds:
          Immediately show the frame-1 situation.

          3.0-7.0 seconds:
          Short natural interaction that establishes the contradiction.

          7.0-10.5 seconds:
          Reveal the final concrete fact.

          10.5-12.0 seconds:
          Hold the disturbing visual briefly,
          then hard cut to black.

          DO NOT include:
          children,
          minors,
          monsters,
          demons,
          ghosts,
          gore,
          blood,
          mirrors,
          reflections,
          surveillance footage,
          subtitles,
          text overlays,
          phone screens,
          face distortion,
          body transformation,
          celebrity likeness.
          """

          # ============================================================
          # BUILD FINAL OUTPUT
          # ============================================================

          final_shorts = []

          fixed_keywords = (
              "horror, horror shorts, scary stories, scary shorts, "
              "horror stories, psychological horror, realistic horror, "
              "creepy stories, suspense horror, thriller horror, "
              "relationship horror, scary encounters, horror twists, "
              "scary endings, short horror stories, horror storytelling, "
              "The Quiet Vault"
          )

          fixed_hashtags = (
              "#Horror #HorrorShorts #ScaryStories "
              "#PsychologicalHorror #CreepyStories "
              "#TheQuietVault"
          )

          for number, (
              total,
              index,
              evaluation
          ) in enumerate(
              winners,
              1
          ):

              candidate = clean[
                  index - 1
              ]

              flow_prompt = make_flow_prompt(
                  candidate
              )

              package = {
                  "number": number,

                  "title":
                      candidate[
                          "title"
                      ].strip(),

                  "short_script":
                      candidate[
                          "short_script"
                      ].strip(),

                  "visual_hook":
                      candidate[
                          "visual_hook"
                      ].strip(),

                  "flow_prompt":
                      flow_prompt.strip(),

                  "final_twist":
                      candidate[
                          "ending"
                      ].strip(),

                  "description": (
                      "A short realistic psychological horror story "
                      "from The Quiet Vault. "
                      "Watch closely—the first frame matters."
                  ),

                  "keywords":
                      fixed_keywords,

                  "hashtags":
                      fixed_hashtags,

                  "thumbnail_frame":
                      "0.0 seconds — use the exact opening frame.",

                  "thumbnail_text":
                      "",

                  "sound_design": (
                      "Low natural room ambience. "
                      "Very subtle tension underneath the dialogue. "
                      "A short low-frequency impact on the final reveal."
                  ),

                  "pinned_comment": (
                      "What would you do if this happened to you?"
                  ),

                  "judge": evaluation
              }

              final_shorts.append(
                  package
              )

          # ============================================================
          # WRITE FILES
          # ============================================================

          batch = {
              "engine":
                  "Quiet Vault V6",

              "run":
                  RUN_NUMBER,

              "shorts":
                  final_shorts
          }

          (OUT / "batch.json").write_text(
              json.dumps(
                  batch,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          for short in final_shorts:

              number = short["number"]

              markdown = f"""# {number}. {short['title']}

          ## Script

          {short['short_script']}

          ## Visual Hook

          {short['visual_hook']}

          ## Google Flow Prompt

          {short['flow_prompt']}

          ## Final Twist

          {short['final_twist']}

          ## Description

          {short['description']}

          ## Keywords

          {short['keywords']}

          ## Hashtags

          {short['hashtags']}

          ## Thumbnail

          **Frame:** {short['thumbnail_frame']}

          **Text:** {short['thumbnail_text'] or 'No text recommended'}

          ## Sound Design

          {short['sound_design']}

          ## Pinned Comment

          {short['pinned_comment']}

          ## Judge

          {json.dumps(
              short['judge'],
              indent=2
          )}
          """

              (
                  OUT /
                  f"short_{number:02d}.md"
              ).write_text(
                  markdown,
                  encoding="utf-8"
              )

          # ============================================================
          # FINAL LOG
          # ============================================================

          print()
          print("=" * 64)
          print("FINAL RESULT")
          print("=" * 64)
          print(
              f"Approved Shorts: "
              f"{len(final_shorts)}"
          )

