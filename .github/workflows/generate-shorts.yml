name: Quiet Vault AI - V12 Fixed Horror Engine

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate 3 fixed-mechanism horror shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import re
          import urllib.request
          import urllib.error
          from pathlib import Path

          KEY = os.environ["GROQ_API_KEY"]
          RUN = int(os.environ.get("RUN_NUMBER", "1"))

          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          OUT = Path("quiet-vault-output")
          OUT.mkdir(exist_ok=True)

          # ============================================================
          # V12
          #
          # PYTHON OWNS THE HORROR.
          # GROQ ONLY NATURALIZES THE DIALOGUE.
          #
          # Each mechanism contains:
          #   - exact visual scene
          #   - exact evidence
          #   - exact reveal
          #
          # Groq is NOT allowed to change any of those.
          # ============================================================

          MECHANISMS = [

              {
                  "id": "future_note",

                  "title_seed": "The Note",

                  "location": (
                      "realistic apartment home office at night"
                  ),

                  "visual_scene": (
                      "An adult woman opens her home office door. "
                      "An unfamiliar adult man is already sitting at her desk, "
                      "actively writing in her private notebook."
                  ),

                  "visible_evidence": (
                      "The open notebook clearly shows the woman's name, "
                      "tomorrow's date, and the beginning of a sentence. "
                      "The stranger is holding the pen and writing."
                  ),

                  "reveal": (
                      "The stranger says the woman asked him to finish "
                      "the sentence after she came home tomorrow."
                  ),

                  "flow_action": (
                      "The unfamiliar man must already be writing when "
                      "the woman enters. The notebook must remain visible."
                  )
              },

              {
                  "id": "fresh_photo",

                  "title_seed": "The Photograph",

                  "location": (
                      "realistic apartment living room at night"
                  ),

                  "visual_scene": (
                      "An adult man enters his apartment and finds an "
                      "unfamiliar adult woman holding a printed photograph."
                  ),

                  "visible_evidence": (
                      "The photograph visibly shows the same man standing "
                      "in the same doorway he is standing in now, photographed "
                      "from inside the apartment."
                  ),

                  "reveal": (
                      "The woman calmly says she took the photograph "
                      "after he opened the door."
                  ),

                  "flow_action": (
                      "The photograph must be large enough to recognize. "
                      "The protagonist and the photograph must both remain visible."
                  )
              },

              {
                  "id": "dead_watch",

                  "title_seed": "Keep It Running",

                  "location": (
                      "realistic apartment bedroom at night"
                  ),

                  "visual_scene": (
                      "An adult woman enters her bedroom and finds an "
                      "unfamiliar adult man beside the bed."
                  ),

                  "visible_evidence": (
                      "The stranger is actively winding a distinctive "
                      "mechanical wristwatch that belonged to the woman's "
                      "late husband. The watch is visibly running."
                  ),

                  "reveal": (
                      "The stranger says her husband asked him to keep "
                      "the watch running until tonight."
                  ),

                  "flow_action": (
                      "The stranger must visibly wind the watch in frame one. "
                      "Keep the watch and both adults visible."
                  )
              },

              {
                  "id": "private_routine",

                  "title_seed": "He Knew How",

                  "location": (
                      "realistic apartment kitchen at night"
                  ),

                  "visual_scene": (
                      "An adult woman enters her kitchen and finds an "
                      "unfamiliar adult man preparing coffee."
                  ),

                  "visible_evidence": (
                      "He is following the woman's late husband's extremely "
                      "specific coffee routine: the same distinctive mug, "
                      "same coffee jar, and same measured spoonful."
                  ),

                  "reveal": (
                      "The stranger says her husband taught him the routine "
                      "yesterday."
                  ),

                  "flow_action": (
                      "The stranger must already be performing the coffee "
                      "routine in frame one. Keep the distinctive mug and "
                      "coffee preparation visible."
                  )
              },

              {
                  "id": "private_notebook",

                  "title_seed": "He Was Writing",

                  "location": (
                      "realistic apartment home office"
                  ),

                  "visual_scene": (
                      "An adult woman enters her locked home office and "
                      "finds an unfamiliar adult man writing in her private notebook."
                  ),

                  "visible_evidence": (
                      "The stranger is actively writing a private sentence "
                      "that the woman has never told anyone."
                  ),

                  "reveal": (
                      "The stranger says her husband told him exactly "
                      "what to write."
                  ),

                  "flow_action": (
                      "The writing action must already be happening in frame one. "
                      "Keep the notebook open and visible."
                  )
              },

              {
                  "id": "prepared_bed",

                  "title_seed": "Someone Prepared My Bed",

                  "location": (
                      "realistic apartment bedroom at night"
                  ),

                  "visual_scene": (
                      "An adult man enters his bedroom and finds an "
                      "unfamiliar adult woman calmly making his bed."
                  ),

                  "visible_evidence": (
                      "She has arranged the pillow, blanket and bedside glass "
                      "exactly according to his late wife's unusual bedtime routine."
                  ),

                  "reveal": (
                      "She says his wife showed her how to prepare the room "
                      "yesterday."
                  ),

                  "flow_action": (
                      "The woman must already be making the bed in frame one. "
                      "The unusual arrangement must be visible."
                  )
              },

              {
                  "id": "private_drawer",

                  "title_seed": "She Put It Back",

                  "location": (
                      "realistic apartment bedroom"
                  ),

                  "visual_scene": (
                      "An adult woman enters her bedroom and finds an "
                      "unfamiliar adult man opening her bedside drawer."
                  ),

                  "visible_evidence": (
                      "He is actively placing her sentimental locket back "
                      "into the exact hidden compartment where she keeps it."
                  ),

                  "reveal": (
                      "He says he was putting it back where she told him "
                      "it belonged."
                  ),

                  "flow_action": (
                      "The drawer, locket, stranger's hand and protagonist "
                      "must be visible. The stranger must be actively "
                      "placing the locket inside."
                  )
              },

              {
                  "id": "future_arrival",

                  "title_seed": "He Knew I Was Coming",

                  "location": (
                      "realistic apartment entryway at night"
                  ),

                  "visual_scene": (
                      "An adult man opens his apartment door and finds an "
                      "unfamiliar adult woman inside, calmly finishing his "
                      "usual arrival routine."
                  ),

                  "visible_evidence": (
                      "She has already removed her shoes, placed his keys "
                      "in his private key bowl, and switched on the exact "
                      "light he always turns on when he comes home."
                  ),

                  "reveal": (
                      "She says he showed her the routine yesterday."
                  ),

                  "flow_action": (
                      "The stranger must already be completing the routine "
                      "when the protagonist enters. Show the keys and bowl clearly."
                  )
              }

          ]

          # ============================================================
          # BANNED CONTENT
          # ============================================================

          BANNED = [
              "child",
              "children",
              "kid",
              "baby",
              "boy",
              "girl",
              "teen",
              "teenager",
              "minor",
              "mirror",
              "reflection",
              "doppelganger",
              "doppelgäng",
              "twin",
              "clone",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "gore",
              "blood",
              "corpse",
              "cctv",
              "surveillance",
              "elevator",
              "hotel",
              "train",
              "printer",
              "video call",
              "facetime",
              "phone screen",
              "shadow figure",
              "silhouette",
              "teleport",
              "magical",
              "magic",
              "body transformation"
          ]

          # ============================================================
          # GROQ
          # ============================================================

          def groq(prompt, retries=3):

              payload = {

                  "model": MODEL,

                  "temperature": 0.5,

                  "max_completion_tokens": 500,

                  "reasoning_effort": "low",

                  "response_format": {
                      "type": "json_schema",

                      "json_schema": {

                          "name": "quiet_vault_v12",

                          "strict": True,

                          "schema": {

                              "type": "object",

                              "properties": {

                                  "title": {
                                      "type": "string"
                                  },

                                  "script": {
                                      "type": "string"
                                  },

                                  "description": {
                                      "type": "string"
                                  },

                                  "keywords": {
                                      "type": "string"
                                  },

                                  "hashtags": {
                                      "type": "string"
                                  }

                              },

                              "required": [
                                  "title",
                                  "script",
                                  "description",
                                  "keywords",
                                  "hashtags"
                              ],

                              "additionalProperties": False
                          }
                      }
                  },

                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ]
              }

              body = json.dumps(payload).encode()

              for attempt in range(retries):

                  req = urllib.request.Request(

                      ENDPOINT,

                      data=body,

                      headers={
                          "Content-Type": "application/json",
                          "Authorization": "Bearer " + KEY,
                          "User-Agent": "QuietVaultAI/12.0"
                      },

                      method="POST"
                  )

                  try:

                      with urllib.request.urlopen(
                          req,
                          timeout=90
                      ) as response:

                          data = json.loads(
                              response.read().decode()
                          )

                      content = (
                          data["choices"][0]
                          ["message"]["content"]
                      )

                      if not content:

                          raise RuntimeError(
                              "Empty Groq response"
                          )

                      return json.loads(content)

                  except urllib.error.HTTPError as e:

                      text = e.read().decode(
                          errors="ignore"
                      )

                      if e.code == 429:

                          wait = float(
                              e.headers.get(
                                  "retry-after",
                                  "20"
                              )
                          )

                          print(
                              f"RATE LIMITED - waiting {wait:.1f}s"
                          )

                          time.sleep(wait + 2)

                      else:

                          print(
                              "GROQ ERROR:",
                              e.code,
                              text[:1000]
                          )

                          time.sleep(5)

                  except Exception as e:

                      print(
                          "ERROR:",
                          repr(e)
                      )

                      time.sleep(5)

              return None

          # ============================================================
          # LIGHT VALIDATION ONLY
          #
          # We deliberately do NOT validate mechanism keywords.
          # Python already owns the mechanism.
          # ============================================================

          def validate(result):

              if not result:

                  return False, "No response"

              for field in [
                  "title",
                  "script",
                  "description",
                  "keywords",
                  "hashtags"
              ]:

                  if not isinstance(
                      result.get(field),
                      str
                  ):

                      return False, (
                          "Missing " + field
                      )

              script = result["script"].strip()

              words = script.split()

              if len(words) < 22:

                  return False, (
                      f"Too short: {len(words)} words"
                  )

              if len(words) > 70:

                  return False, (
                      f"Too long: {len(words)} words"
                  )

              lower = script.lower()

              for banned in BANNED:

                  if re.search(
                      r"\b" + re.escape(banned) + r"\b",
                      lower
                  ):

                      return False, (
                          "Banned content: " + banned
                      )

              return True, "PASS"

          # ============================================================
          # FLOW PROMPT
          # ============================================================

          def make_flow(
              mechanism,
              script
          ):

              return f"""
          Create a 9–12 second vertical 9:16
          photorealistic live-action psychological
          horror short.

          FICTIONAL ADULT ACTORS ONLY.

          No children, teenagers, celebrities,
          or resemblance to real people.

          ============================================================
          LOCATION
          ============================================================

          {mechanism["location"]}

          ============================================================
          FIRST FRAME — ABSOLUTELY CRITICAL
          ============================================================

          {mechanism["visual_scene"]}

          The important action must ALREADY be happening
          in the very first frame.

          ============================================================
          VISIBLE EVIDENCE
          ============================================================

          {mechanism["visible_evidence"]}

          The evidence must be clearly visible.

          Do not hide it.

          Do not replace it with a vague reaction.

          The viewer should understand something is wrong
          before hearing the dialogue.

          ============================================================
          ACTION
          ============================================================

          {mechanism["flow_action"]}

          The protagonist enters/notices the situation
          and freezes.

          The unfamiliar adult remains completely calm.

          ============================================================
          DIALOGUE
          ============================================================

          Use exactly this dialogue:

          {script}

          No additional dialogue.

          ============================================================
          FINAL REVEAL
          ============================================================

          {mechanism["reveal"]}

          Hard cut immediately after the final line.

          NO fade to black.

          ============================================================
          CAMERA
          ============================================================

          Medium-wide cinematic framing.

          Keep both adults and the important evidence
          visible together.

          Minimal natural camera movement.

          Realistic handheld feel.

          ============================================================
          PERFORMANCE
          ============================================================

          Protagonist:
          quiet genuine fear and disbelief.

          Unfamiliar adult:
          completely calm and matter-of-fact.

          ============================================================
          STYLE
          ============================================================

          Photorealistic live-action.

          Realistic adult humans.

          Natural lighting.

          Realistic skin and movement.

          Psychological horror.

          No fantasy aesthetic.

          ============================================================
          STRICTLY DO NOT INCLUDE
          ============================================================

          children,
          teenagers,
          mirrors,
          reflections,
          twins,
          doppelgängers,
          clones,
          ghosts,
          demons,
          monsters,
          zombies,
          gore,
          blood,
          corpse,
          CCTV,
          surveillance footage,
          phone screens,
          video calls,
          magical effects,
          extra characters,
          subtitles,
          text overlays,
          extra dialogue,
          exaggerated acting,
          face distortion,
          body distortion.

          Do not add another twist.

          Do not change the visual evidence.

          Do not change the action.

          Do not replace the unfamiliar adult
          with anything supernatural.

          HARD CUT.
          """

          # ============================================================
          # ROTATION
          # ============================================================

          start = (
              ((RUN - 1) * 3)
              % len(MECHANISMS)
          )

          mechanisms = (
              MECHANISMS[start:]
              +
              MECHANISMS[:start]
          )

          approved = []
          attempts = 0

          print("")
          print("==========================================")
          print(" QUIET VAULT V12")
          print(" FIXED HORROR ENGINE")
          print("==========================================")
          print("RUN:", RUN)
          print("MODEL:", MODEL)
          print("")

          # ============================================================
          # GENERATE
          # ============================================================

          for mechanism in mechanisms:

              if len(approved) >= 3:
                  break

              if attempts >= 7:
                  break

              attempts += 1

              print("")
              print("------------------------------------------")
              print(
                  "MECHANISM:",
                  mechanism["title_seed"]
              )
              print("------------------------------------------")

              prompt = f"""
          Write ONE extremely short realistic
          psychological horror Short for The Quiet Vault.

          The visual horror is already fixed.
          You are NOT allowed to invent a new premise.

          ============================================================
          FIXED VISUAL SCENE
          ============================================================

          {mechanism["visual_scene"]}

          ============================================================
          FIXED VISIBLE EVIDENCE
          ============================================================

          {mechanism["visible_evidence"]}

          ============================================================
          FIXED FINAL REVEAL
          ============================================================

          {mechanism["reveal"]}

          ============================================================
          YOUR ONLY JOB
          ============================================================

          Turn this into natural spoken dialogue.

          Write approximately 22–55 words.

          Start immediately with the protagonist
          noticing what is happening.

          Do NOT write like a narrator.

          Do NOT say:
          "an adult woman"
          "an adult man"
          "the camera"
          "the viewer"

          The protagonist may ask ONE short question.

          The stranger gets ONE short final line.

          The final line must communicate
          the fixed reveal.

          Do not add a second twist.

          Do not invent another explanation.

          Do not change the visual scene.

          Do not change the evidence.

          Do not change the final reveal.

          No children.
          No mirrors.
          No reflections.
          No twins.
          No doppelgängers.
          No ghosts.
          No monsters.
          No gore.
          No CCTV.
          No phones.

          Make it sound like something
          a real frightened person would say.

          Return JSON only.
          """

              result = groq(prompt)

              ok, reason = validate(result)

              print(
                  "VALIDATION:",
                  reason
              )

              if not ok:
                  continue

              package = {

                  "slot": len(approved) + 1,

                  "mechanism": mechanism["title_seed"],

                  "title": result["title"],

                  "short_script": result["script"],

                  "visual_hook": mechanism["visual_scene"],

                  "visible_evidence": mechanism["visible_evidence"],

                  "flow_prompt": make_flow(
                      mechanism,
                      result["script"]
                  ),

                  "final_twist": mechanism["reveal"],

                  "description": result["description"],

                  "keywords": result["keywords"],

                  "hashtags": result["hashtags"],

                  "thumbnail_frame": (
                      "Use approximately 0.5–1.5 seconds. "
                      "Show the protagonist, unfamiliar adult, "
                      "and the visible evidence/action together."
                  ),

                  "thumbnail_text": "",

                  "sound_design": (
                      "Natural room tone, realistic footsteps "
                      "and object sounds, subtle tension bed, "
                      "clear dialogue. Hard cut immediately "
                      "after the final line."
                  ),

                  "pinned_comment": (
                      "What would you do if you saw this?"
                  )
              }

              approved.append(package)

              print(
                  "APPROVED:",
                  result["title"]
              )

              time.sleep(8)

          # ============================================================
          # SAVE
          # ============================================================

          batch = {

              "run": RUN,

              "provider": "groq",

              "model": MODEL,

              "engine": (
                  "V12 Fixed Horror Engine"
              ),

              "generated": attempts,

              "approved": len(approved),

              "shorts": approved
          }

          with open(
              OUT / "batch.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  batch,
                  file,
                  indent=2,
                  ensure_ascii=False
              )

          # ============================================================
          # MARKDOWN PACKAGES
          # ============================================================

          for index, short in enumerate(
              approved,
              start=1
          ):

              text = f"""# {short["title"]}

          ## Script

          {short["short_script"]}

          ## Visual Hook

          {short["visual_hook"]}

          ## Visible Evidence

          {short["visible_evidence"]}

          ## Google Flow Prompt

          ```text
          {short["flow_prompt"]}
          ```

          ## Final Twist

          {short["final_twist"]}

          ## Description

          ```text
          {short["description"]}
          ```

          ## Keywords

          ```text
          {short["keywords"]}
          ```

          ## Hashtags

          ```text
          {short["hashtags"]}
          ```

          ## Thumbnail

          {short["thumbnail_frame"]}

          {short["thumbnail_text"]}

          ## Sound Design

          {short["sound_design"]}

          ## Pinned Comment

          {short["pinned_comment"]}
          """

              with open(
                  OUT / f"short_{index:02d}.md",
                  "w",
                  encoding="utf-8"
              ) as file:

                  file.write(text)

          print("")
          print("==========================================")
          print("FINAL RESULT")
          print("==========================================")
          print(
              "Approved:",
              len(approved),
              "/ 3"
          )

          if len(approved) < 3:

              print(
                  "No filler Shorts created."
              )

          else:

              print(
                  "SUCCESS - 3 Shorts ready."
              )

          PY

      - name: Upload V12 package
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-v12-shorts
          path: quiet-vault-output/
