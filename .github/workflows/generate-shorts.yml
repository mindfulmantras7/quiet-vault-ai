name: Quiet Vault AI V8.1 - Human Horror

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 <<'PY'
          import os
          import json
          import re
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path

          API_KEY = os.environ["GROQ_API_KEY"]
          RUN_NUMBER = int(os.environ.get("RUN_NUMBER", "1"))

          URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          # ============================================================
          # V8.1
          # HAND-WRITTEN HUMAN HORROR SKELETONS
          #
          # Groq ONLY makes these natural.
          # It does not invent the horror mechanism.
          # ============================================================

          SKELETONS = [

              {
                  "id": 1,
                  "title": "Someone Let Him In",
                  "location": "apartment living room",
                  "visual": (
                      "A woman opens her apartment door and immediately "
                      "sees an unfamiliar adult man already sitting inside."
                  ),
                  "script_core": (
                      "She asks how he got inside. He says she let him in "
                      "ten minutes ago. She says she has been standing "
                      "outside the locked door for ten minutes."
                  ),
                  "final": (
                      "He looks toward the hallway and says, "
                      "\"Then who opened it?\""
                  )
              },

              {
                  "id": 2,
                  "title": "The Man in My Bedroom",
                  "location": "home bedroom doorway",
                  "visual": (
                      "An adult man stands in his bedroom doorway while an "
                      "unfamiliar adult woman calmly sits on his bed."
                  ),
                  "script_core": (
                      "He asks who she is. She says his wife invited her "
                      "inside. He says his wife is currently downstairs."
                  ),
                  "final": (
                      "The woman whispers, \"No. She told me to wait "
                      "for you upstairs.\""
                  )
              },

              {
                  "id": 3,
                  "title": "The Dead Man's Key",
                  "location": "front doorway of a house",
                  "visual": (
                      "An unfamiliar adult man stands inside the doorway "
                      "holding a house key that belonged to the protagonist's "
                      "father."
                  ),
                  "script_core": (
                      "The protagonist asks where he got it. The stranger "
                      "says the father gave it to him yesterday."
                  ),
                  "final": (
                      "The protagonist says, \"My father died four years ago.\" "
                      "The stranger quietly replies, \"I know.\""
                  )
              },

              {
                  "id": 4,
                  "title": "The Dinner Guest",
                  "location": "family dining room",
                  "visual": (
                      "An adult woman walks into her dining room and sees "
                      "an unfamiliar adult man sitting in her husband's "
                      "usual chair."
                  ),
                  "script_core": (
                      "She asks who invited him. He says her husband did. "
                      "Her husband is standing beside her and says he "
                      "has never seen the man."
                  ),
                  "final": (
                      "The stranger looks at the husband and says, "
                      "\"That's not the man who invited me.\""
                  )
              },

              {
                  "id": 5,
                  "title": "The Locked Office",
                  "location": "private home office",
                  "visual": (
                      "An adult woman opens her locked office and sees "
                      "an unfamiliar adult man sitting in her chair."
                  ),
                  "script_core": (
                      "He is reading a notebook she wrote that morning. "
                      "She asks how he got inside. He says she gave him "
                      "the notebook before leaving."
                  ),
                  "final": (
                      "She looks at the notebook and sees the last sentence "
                      "has not been written yet."
                  )
              },

              {
                  "id": 6,
                  "title": "The Neighbor's Copy",
                  "location": "front doorway",
                  "visual": (
                      "An adult man opens his front door and sees his "
                      "neighbor holding a working copy of his house key."
                  ),
                  "script_core": (
                      "He asks where the neighbor got it. The neighbor "
                      "says his wife gave him the copy yesterday."
                  ),
                  "final": (
                      "The man says, \"My wife died six months ago.\" "
                      "The neighbor answers, \"Yes. Yesterday.\""
                  )
              },

              {
                  "id": 7,
                  "title": "The Photograph",
                  "location": "apartment hallway",
                  "visual": (
                      "An unfamiliar adult woman stands inside an apartment "
                      "holding a printed photograph of the protagonist asleep."
                  ),
                  "script_core": (
                      "The protagonist asks where she got it. She says "
                      "he gave it to her last night."
                  ),
                  "final": (
                      "He says, \"I was alone last night.\" "
                      "She answers, \"You weren't.\""
                  )
              },

              {
                  "id": 8,
                  "title": "The Spare Room",
                  "location": "home spare bedroom",
                  "visual": (
                      "An adult man opens a locked spare bedroom and sees "
                      "an unfamiliar adult woman calmly making the bed."
                  ),
                  "script_core": (
                      "He asks who let her in. She says his wife did. "
                      "His wife has been away for three days."
                  ),
                  "final": (
                      "She points to the pillow and says, "
                      "\"She slept here last night.\""
                  )
              },

              {
                  "id": 9,
                  "title": "The Garage",
                  "location": "private home garage",
                  "visual": (
                      "An adult man enters his locked garage and sees "
                      "an unfamiliar adult working on his father's motorcycle."
                  ),
                  "script_core": (
                      "He demands to know who sent him. The stranger says "
                      "his father did."
                  ),
                  "final": (
                      "The man says his father died before the motorcycle "
                      "was ever purchased. The stranger stops working."
                  )
              },

              {
                  "id": 10,
                  "title": "The Private Name",
                  "location": "apartment entryway",
                  "visual": (
                      "An unfamiliar adult man is standing inside a woman's "
                      "locked apartment."
                  ),
                  "script_core": (
                      "He greets her using a private childhood nickname "
                      "that only her late sister ever used."
                  ),
                  "final": (
                      "She asks who told him that name. "
                      "He says, \"Your sister. This morning.\""
                  )
              },

              {
                  "id": 11,
                  "title": "The Kitchen Visitor",
                  "location": "home kitchen",
                  "visual": (
                      "An adult woman enters her kitchen and sees an "
                      "unfamiliar adult man preparing the family's dinner."
                  ),
                  "script_core": (
                      "He says her husband asked him to cook. "
                      "Her husband is currently sitting in the next room."
                  ),
                  "final": (
                      "The husband looks at the stranger and says, "
                      "\"I have never seen you before.\""
                  )
              },

              {
                  "id": 12,
                  "title": "The Person at My Desk",
                  "location": "private office",
                  "visual": (
                      "An adult man enters his office and sees an unfamiliar "
                      "adult woman sitting at his desk reading his private notes."
                  ),
                  "script_core": (
                      "She says he asked her to read them. "
                      "He says he has never met her."
                  ),
                  "final": (
                      "She closes the notebook and says, "
                      "\"You will tomorrow.\""
                  )
              }
          ]

          # ============================================================
          # SELECT FIVE SKELETONS
          # ============================================================

          start = ((RUN_NUMBER - 1) * 5) % len(SKELETONS)

          selected = [
              SKELETONS[(start + i) % len(SKELETONS)]
              for i in range(5)
          ]

          print("==========================================")
          print("QUIET VAULT AI V8.1")
          print("HUMAN HORROR ENGINE")
          print("==========================================")
          print(f"RUN: {RUN_NUMBER}")
          print()

          for i, s in enumerate(selected, 1):
              print(
                  f"{i}. {s['title']} "
                  f"({s['location']})"
              )

          # ============================================================
          # GROQ API
          # ============================================================

          def groq_call(prompt, retries=3):

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "You are an editor for ultra-short realistic "
                              "horror videos. You must preserve the supplied "
                              "story events and final reveal exactly. "
                              "Do not invent a new twist."
                          )
                      },
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "temperature": 0.4,
                  "max_completion_tokens": 2200,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden",
                  "response_format": {
                      "type": "json_object"
                  }
              }

              body = json.dumps(payload).encode(
                  "utf-8"
              )

              for attempt in range(retries):

                  request = urllib.request.Request(
                      URL,
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      },
                      method="POST"
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=90
                      ) as response:

                          raw = response.read().decode(
                              "utf-8"
                          )

                          result = json.loads(
                              raw
                          )

                          content = (
                              result["choices"][0]["message"]
                              .get("content")
                          )

                          if not content:
                              raise RuntimeError(
                                  "Groq returned empty content"
                              )

                          return content

                  except urllib.error.HTTPError as e:

                      error_body = e.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

                      if e.code == 429:

                          retry_after = e.headers.get(
                              "retry-after"
                          )

                          try:
                              wait = max(
                                  15,
                                  float(retry_after)
                              )
                          except:
                              wait = 20

                          print(
                              f"RATE LIMITED. "
                              f"Waiting {wait:.1f}s..."
                          )

                          time.sleep(
                              wait
                          )

                          continue

                      print(
                          f"GROQ HTTP {e.code}"
                      )

                      print(
                          error_body[:1000]
                      )

                      raise

                  except Exception as e:

                      print(
                          f"Groq error: {e}"
                      )

                      if attempt < retries - 1:
                          time.sleep(5)
                      else:
                          raise

          # ============================================================
          # GENERATION PROMPT
          # ============================================================

          story_blocks = ""

          for i, s in enumerate(
              selected,
              1
          ):

              story_blocks += f"""

          STORY {i}

          TITLE IDEA:
          {s['title']}

          LOCATION:
          {s['location']}

          FRAME 1:
          {s['visual']}

          STORY CORE:
          {s['script_core']}

          FINAL REVEAL:
          {s['final']}

          """

          prompt = f"""
          Turn these five hand-written horror skeletons into five
          extremely short YouTube Shorts.

          {story_blocks}

          ============================================================
          ABSOLUTE RULES
          ============================================================

          The skeleton is already the story.

          DO NOT invent a different ending.

          DO NOT invent a supernatural explanation.

          DO NOT add a monster, ghost, demon, clone, twin,
          doppelganger or magical object.

          DO NOT change who is alive or dead.

          DO NOT add characters.

          DO NOT add another twist.

          DO NOT change the location.

          You may make the wording more natural and cinematic.

          Each script must be approximately 30-45 spoken words.

          Keep dialogue extremely short.

          The first sentence should immediately place the viewer
          inside the visual situation.

          The final beat must preserve the supplied FINAL REVEAL.

          No exposition.

          No "something felt wrong."

          No "I realized."

          No explanation after the final reveal.

          Hard cut immediately after the final line.

          ============================================================
          BANNED
          ============================================================

          children
          minors
          babies
          ghosts
          demons
          monsters
          zombies
          mirrors
          reflections
          twins
          doubles
          doppelgangers
          clones
          gore
          blood
          body transformation
          disappearing people
          magical objects
          object transformations
          CCTV
          surveillance
          phone-screen horror
          video call

          ============================================================
          OUTPUT
          ============================================================

          Return ONLY valid JSON:

          {{
            "stories": [
              {{
                "id": 1,
                "title": "short title",
                "script": "30-45 words",
                "visual_hook": "exact frame 1"
              }},
              {{
                "id": 2,
                "title": "short title",
                "script": "30-45 words",
                "visual_hook": "exact frame 1"
              }},
              {{
                "id": 3,
                "title": "short title",
                "script": "30-45 words",
                "visual_hook": "exact frame 1"
              }},
              {{
                "id": 4,
                "title": "short title",
                "script": "30-45 words",
                "visual_hook": "exact frame 1"
              }},
              {{
                "id": 5,
                "title": "short title",
                "script": "30-45 words",
                "visual_hook": "exact frame 1"
              }}
            ]
          }}
          """

          print()
          print(
              "GENERATING FIVE FIXED-SKELETON STORIES..."
          )
          print()

          raw = groq_call(
              prompt
          )

          try:

              data = json.loads(
                  raw
              )

          except Exception as e:

              print(
                  "INVALID JSON FROM GROQ"
              )

              print(
                  raw[:3000]
              )

              raise RuntimeError(
                  str(e)
              )

          stories = data.get(
              "stories",
              []
          )

          if not isinstance(
              stories,
              list
          ):

              raise RuntimeError(
                  "stories is not a list"
              )

          print(
              f"GENERATED: {len(stories)}"
          )

          # ============================================================
          # BASIC VALIDATION ONLY
          # ============================================================

          banned = [
              "child",
              "children",
              "kid",
              "baby",
              "minor",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "mirror",
              "reflection",
              "doppelganger",
              "doppelgänger",
              "twin",
              "clone",
              "cctv",
              "surveillance",
              "phone screen",
              "video call",
              "gore",
              "blood",
              "corpse",
              "disappear",
              "vanish",
              "teleport",
              "distorted face",
              "distorted body"
          ]

          def validate(
              story
          ):

              required = [
                  "id",
                  "title",
                  "script",
                  "visual_hook"
              ]

              if not all(
                  x in story
                  for x in required
              ):

                  return (
                      False,
                      "missing field"
                  )

              script = str(
                  story["script"]
              ).strip()

              hook = str(
                  story["visual_hook"]
              ).strip()

              count = len(
                  script.split()
              )

              if count < 25:

                  return (
                      False,
                      "too short"
                  )

              if count > 52:

                  return (
                      False,
                      "too long"
                  )

              combined = (
                  script +
                  " " +
                  hook
              ).lower()

              for word in banned:

                  if re.search(
                      r"\b" +
                      re.escape(word) +
                      r"\b",
                      combined
                  ):

                      return (
                          False,
                          f"banned: {word}"
                      )

              if not any(
                  word in hook.lower()
                  for word in [
                      "man",
                      "woman",
                      "stranger",
                      "adult",
                      "neighbor",
                      "visitor",
                      "person"
                  ]
              ):

                  return (
                      False,
                      "no visible human"
                  )

              return (
                  True,
                  "PASS"
              )

          approved = []

          print()
          print(
              "RUNNING BASIC VALIDATION..."
          )
          print()

          for story in stories:

              ok, reason = validate(
                  story
              )

              if ok:

                  print(
                      f"PASS: {story['title']}"
                  )

                  approved.append(
                      story
                  )

              else:

                  print(
                      f"REJECT: "
                      f"{story.get('title','UNTITLED')} "
                      f"-> {reason}"
                  )

          # ============================================================
          # REQUIRE AT LEAST THREE
          # ============================================================

          if len(approved) < 3:

              raise RuntimeError(
                  "V8.1 FAILED: fewer than 3 "
                  "stories passed basic validation. "
                  "No weak replacement stories will be created."
              )

          approved = approved[:3]

          print()
          print(
              f"APPROVED: {len(approved)}"
          )

          # ============================================================
          # IMPORTANT FIX:
          #
          # Groq IDs are 1-5 based on the generated story position.
          #
          # The original skeleton IDs can be 1-12.
          #
          # Therefore DO NOT map:
          #     story["id"] -> skeleton["id"]
          #
          # Instead:
          #     story id 1 -> selected[0]
          #     story id 2 -> selected[1]
          #     etc.
          # ============================================================

          if len(stories) < 5:

              raise RuntimeError(
                  f"Expected 5 generated stories, "
                  f"got {len(stories)}"
              )

          # ============================================================
          # FLOW PROMPT
          # ============================================================

          def make_flow(
              story,
              skeleton
          ):

              return f"""
          Create a 9-12 second vertical 9:16
          photorealistic live-action horror Short.

          Fictional adult characters only.
          No children.
          No celebrity or real-person likeness.

          CRITICAL FIRST FRAME:

          {skeleton['visual']}

          The threatening adult must be clearly visible
          in the first frame.

          LOCATION:

          {skeleton['location']}

          SCRIPT:

          {story['script']}

          FINAL REVEAL:

          {skeleton['final']}

          VISUAL STYLE:

          Photorealistic live action.
          Real adult actors.
          Natural facial expressions.
          Realistic home/apartment/office environment.
          Believable lighting.
          Restrained cinematic camera movement.

          IMPORTANT:

          Do not start with an establishing shot.

          Do not add another character.

          Do not add another plot point.

          Do not invent another twist.

          Keep the threatening adult physically visible.

          No ghosts.
          No demons.
          No monsters.
          No mirrors.
          No reflections.
          No twins.
          No doppelgangers.
          No clones.
          No children.
          No gore.
          No blood.
          No CCTV.
          No phone-screen horror.
          No disappearing people.
          No magical objects.
          No distorted bodies.

          Keep the horror grounded in the human situation.

          End immediately after the final reveal.
          """

          # ============================================================
          # CREATE OUTPUT DIRECTORY
          # ============================================================

          out = Path(
              "quiet-vault-output"
          )

          out.mkdir(
              exist_ok=True
          )

          final = []

          # ============================================================
          # CREATE THE THREE SHORTS
          # ============================================================

          for index, story in enumerate(
              approved,
              1
          ):

              story_position = int(
                  story["id"]
              )

              if (
                  story_position < 1
                  or
                  story_position > 5
              ):

                  raise RuntimeError(
                      f"Invalid story position: "
                      f"{story_position}"
                  )

              # FIX:
              # Map Groq's 1-5 response position to the
              # corresponding selected skeleton.
              skeleton = selected[
                  story_position - 1
              ]

              item = {
                  "title": story["title"],
                  "script": story["script"],
                  "visual_hook": story[
                      "visual_hook"
                  ],
                  "flow_prompt": make_flow(
                      story,
                      skeleton
                  ),
                  "final_twist": skeleton[
                      "final"
                  ],
                  "description": (
                      "A realistic human horror encounter "
                      "with one detail that should not be possible. "
                      "Watch until the final line."
                  ),
                  "keywords": (
                      "horror, horror shorts, scary stories, "
                      "scary shorts, horror stories, psychological "
                      "horror, realistic horror, creepy stories, "
                      "suspense horror, short horror stories, "
                      "horror storytelling, The Quiet Vault"
                  ),
                  "hashtags": (
                      "#horror #horrorshorts #scarystories "
                      "#psychologicalhorror #creepy #shorts"
                  ),
                  "thumbnail_frame": (
                      "Use the opening frame showing the "
                      "visible adult threat. "
                      f"Optional text: {story['title']}"
                  ),
                  "sound_design": (
                      "Natural room ambience, subtle footsteps "
                      "or movement, restrained tension, clear "
                      "dialogue, then hard cut to silence "
                      "after the final reveal."
                  ),
                  "pinned_comment": (
                      "Did you catch the contradiction before "
                      "the final line?"
                  )
              }

              final.append(
                  item
              )

              md = f"""# {item['title']}

          ## Script

          {item['script']}

          ## Google Flow Prompt

          {item['flow_prompt']}

          ## Final Twist

          {item['final_twist']}

          ## Description

          {item['description']}

          ## Keywords

          {item['keywords']}

          ## Hashtags

          {item['hashtags']}

          ## Thumbnail

          {item['thumbnail_frame']}

          ## Sound Design

          {item['sound_design']}

          ## Pinned Comment

          {item['pinned_comment']}
          """

              (
                  out /
                  f"short_{index:02d}.md"
              ).write_text(
                  md,
                  encoding="utf-8"
              )

          # ============================================================
          # BATCH JSON
          # ============================================================

          batch = {
              "run_number": RUN_NUMBER,
              "provider": "groq",
              "model": MODEL,
              "engine": (
                  "V8.1 Human Horror "
                  "Script Skeleton Engine"
              ),
              "generated": len(stories),
              "approved": len(final),
              "shorts": final
          }

          (
              out /
              "batch.json"
          ).write_text(
              json.dumps(
                  batch,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print()
          print("==========================================")
          print("QUIET VAULT V8.1 COMPLETE")
          print("==========================================")
          print(
              f"Generated: {len(stories)}"
          )
          print(
              f"Approved:  {len(final)}"
          )
          print()

          for i, item in enumerate(
              final,
              1
          ):

              print(
                  f"{i}. {item['title']}"
              )

              print(
                  f"   {item['script']}"
              )

              print()

          PY

      - name: Upload Shorts
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-v81-shorts
          path: quiet-vault-output/
