name: Quiet Vault AI V8.2 - Stronger Horror DNA

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 <<'PY'
          import os
          import json
          import re
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path

          API_KEY = os.environ["GROQ_API_KEY"]
          RUN_NUMBER = int(os.environ.get("RUN_NUMBER", "1"))

          URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          # ============================================================
          # QUIET VAULT V8.2
          #
          # The horror mechanisms are completely pre-written.
          # Groq is only responsible for natural wording.
          #
          # DESIGN:
          # visible threat
          # + concrete contradiction
          # + relationship/personal detail
          # + final line that creates a second question
          # ============================================================

          SKELETONS = [

              # --------------------------------------------------------
              # 1
              # --------------------------------------------------------

              {
                  "id": 1,
                  "title": "Someone Let Him In",
                  "location": "apartment entrance and living room",
                  "characters": "two fictional adults",
                  "visual": (
                      "An adult woman opens her apartment door and "
                      "immediately sees an unfamiliar adult man sitting "
                      "calmly on her sofa."
                  ),
                  "core": (
                      "She asks how he got inside. He says she opened "
                      "the door for him ten minutes ago. She says she "
                      "has been standing outside the locked door for "
                      "ten minutes."
                  ),
                  "final": (
                      "He looks past her into the hallway and asks, "
                      "\"Then who was standing behind you?\""
                  )
              },

              # --------------------------------------------------------
              # 2
              # --------------------------------------------------------

              {
                  "id": 2,
                  "title": "The Man at Dinner",
                  "location": "family dining room",
                  "characters": "three fictional adults",
                  "visual": (
                      "An adult woman walks into her dining room and "
                      "sees an unfamiliar adult man sitting in her "
                      "husband's usual chair."
                  ),
                  "core": (
                      "She asks who invited him. He says her husband did. "
                      "Her husband is standing directly beside her and "
                      "says he has never seen the man."
                  ),
                  "final": (
                      "The stranger studies the husband and says, "
                      "\"That's not the man who invited me.\""
                  )
              },

              # --------------------------------------------------------
              # 3
              # --------------------------------------------------------

              {
                  "id": 3,
                  "title": "The Dead Man's Key",
                  "location": "front doorway of a house",
                  "characters": "two fictional adults",
                  "visual": (
                      "An unfamiliar adult man stands inside the doorway "
                      "holding an old house key that the protagonist "
                      "recognizes as his dead father's."
                  ),
                  "core": (
                      "The protagonist asks where he got it. The stranger "
                      "says the father handed it to him yesterday."
                  ),
                  "final": (
                      "The protagonist says, \"My father died four years "
                      "ago.\" The stranger quietly says, \"I know. "
                      "He told me you'd ask that.\""
                  )
              },

              # --------------------------------------------------------
              # 4
              # --------------------------------------------------------

              {
                  "id": 4,
                  "title": "The Bedroom Guest",
                  "location": "home bedroom doorway",
                  "characters": "three fictional adults",
                  "visual": (
                      "An adult man enters his bedroom and finds an "
                      "unfamiliar adult woman sitting on the bed holding "
                      "his wife's handbag."
                  ),
                  "core": (
                      "He asks how she got inside. She says his wife "
                      "invited her. His wife is standing in the hallway "
                      "and says she has never seen the woman."
                  ),
                  "final": (
                      "The stranger looks at the wife and says, "
                      "\"You weren't wearing that dress when you called me.\""
                  )
              },

              # --------------------------------------------------------
              # 5
              # --------------------------------------------------------

              {
                  "id": 5,
                  "title": "The Locked Office",
                  "location": "private home office",
                  "characters": "two fictional adults",
                  "visual": (
                      "An adult woman opens her locked home office and "
                      "sees an unfamiliar adult man sitting at her desk "
                      "reading her private notebook."
                  ),
                  "core": (
                      "She asks how he got inside. He says she gave him "
                      "the notebook before leaving. She says she never "
                      "left the house."
                  ),
                  "final": (
                      "He turns the notebook toward her and says, "
                      "\"You haven't written the last page yet.\""
                  )
              },

              # --------------------------------------------------------
              # 6
              # --------------------------------------------------------

              {
                  "id": 6,
                  "title": "The Neighbor's Key",
                  "location": "front doorway",
                  "characters": "two fictional adults",
                  "visual": (
                      "An adult man opens his front door and finds his "
                      "neighbor standing there holding a working copy "
                      "of his house key."
                  ),
                  "core": (
                      "He asks where the neighbor got it. The neighbor "
                      "says his wife gave him the copy yesterday. "
                      "The wife died six months ago."
                  ),
                  "final": (
                      "The neighbor looks confused and says, "
                      "\"Yesterday? She gave it to me this morning.\""
                  )
              },

              # --------------------------------------------------------
              # 7
              # --------------------------------------------------------

              {
                  "id": 7,
                  "title": "The Photograph",
                  "location": "apartment hallway",
                  "characters": "two fictional adults",
                  "visual": (
                      "An unfamiliar adult woman is standing inside an "
                      "apartment holding a printed photograph of the "
                      "protagonist asleep in his own bed."
                  ),
                  "core": (
                      "He asks where she got the photograph. She says "
                      "he gave it to her last night. He says he spent "
                      "last night alone."
                  ),
                  "final": (
                      "She turns the photograph over and says, "
                      "\"You wrote the time on the back.\""
                  )
              },

              # --------------------------------------------------------
              # 8
              # --------------------------------------------------------

              {
                  "id": 8,
                  "title": "The Spare Room",
                  "location": "locked spare bedroom",
                  "characters": "two fictional adults",
                  "visual": (
                      "An adult man opens a locked spare bedroom and "
                      "finds an unfamiliar adult woman calmly making "
                      "the bed."
                  ),
                  "core": (
                      "He asks who let her in. She says his wife did. "
                      "His wife has been away for three days."
                  ),
                  "final": (
                      "The woman points to the pillow and says, "
                      "\"She slept here last night.\""
                  )
              },

              # --------------------------------------------------------
              # 9
              # --------------------------------------------------------

              {
                  "id": 9,
                  "title": "The Garage Visitor",
                  "location": "private home garage",
                  "characters": "two fictional adults",
                  "visual": (
                      "An adult man enters his locked garage and sees "
                      "an unfamiliar adult working on his father's "
                      "old motorcycle."
                  ),
                  "core": (
                      "He demands to know who sent him. The stranger "
                      "says his father did. The father died before the "
                      "motorcycle was purchased."
                  ),
                  "final": (
                      "The stranger stops working and asks, "
                      "\"Then why did he give me your address?\""
                  )
              },

              # --------------------------------------------------------
              # 10
              # --------------------------------------------------------

              {
                  "id": 10,
                  "title": "The Private Name",
                  "location": "apartment entrance",
                  "characters": "two fictional adults",
                  "visual": (
                      "An unfamiliar adult man is already standing inside "
                      "a woman's locked apartment."
                  ),
                  "core": (
                      "He greets her using a private childhood nickname "
                      "that only her late sister ever used."
                  ),
                  "final": (
                      "She asks who told him that name. He answers, "
                      "\"Your sister. She said you'd recognize it.\""
                  )
              },

              # --------------------------------------------------------
              # 11
              # --------------------------------------------------------

              {
                  "id": 11,
                  "title": "The Kitchen Visitor",
                  "location": "home kitchen",
                  "characters": "three fictional adults",
                  "visual": (
                      "An adult woman enters her kitchen and sees an "
                      "unfamiliar adult man preparing the family's dinner."
                  ),
                  "core": (
                      "He says her husband asked him to cook. Her husband "
                      "is sitting in the next room and says he has never "
                      "seen the man."
                  ),
                  "final": (
                      "The stranger looks toward the husband and says, "
                      "\"You were wearing a different face when you called me.\""
                  )
              },

              # --------------------------------------------------------
              # 12
              # --------------------------------------------------------

              {
                  "id": 12,
                  "title": "The Person at My Desk",
                  "location": "private office",
                  "characters": "two fictional adults",
                  "visual": (
                      "An adult man enters his office and sees an "
                      "unfamiliar adult woman sitting in his chair "
                      "reading his private notes."
                  ),
                  "core": (
                      "She says he asked her to read them. He says he "
                      "has never met her."
                  ),
                  "final": (
                      "She closes the notebook and says, "
                      "\"You will tomorrow. You already invited me.\""
                  )
              }
          ]

          # ============================================================
          # SELECT FIVE
          # ============================================================

          start = ((RUN_NUMBER - 1) * 5) % len(SKELETONS)

          selected = [
              SKELETONS[(start + i) % len(SKELETONS)]
              for i in range(5)
          ]

          print("==========================================")
          print("QUIET VAULT AI V8.2")
          print("STRONGER HORROR DNA")
          print("==========================================")
          print(f"RUN: {RUN_NUMBER}")
          print()

          for i, s in enumerate(selected, 1):
              print(
                  f"{i}. {s['title']} "
                  f"| {s['characters']}"
              )

          # ============================================================
          # GROQ
          # ============================================================

          def groq_call(prompt, retries=3):

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "You are a short-form horror script editor. "
                              "Preserve the supplied story exactly. "
                              "Do not invent a new horror mechanism, "
                              "new character, or new ending."
                          )
                      },
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "temperature": 0.35,
                  "max_completion_tokens": 2200,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden",
                  "response_format": {
                      "type": "json_object"
                  }
              }

              body = json.dumps(
                  payload
              ).encode(
                  "utf-8"
              )

              for attempt in range(retries):

                  request = urllib.request.Request(
                      URL,
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      },
                      method="POST"
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=90
                      ) as response:

                          raw = response.read().decode(
                              "utf-8"
                          )

                          result = json.loads(
                              raw
                          )

                          content = (
                              result["choices"][0]["message"]
                              .get("content")
                          )

                          if not content:
                              raise RuntimeError(
                                  "Groq returned empty content"
                              )

                          return content

                  except urllib.error.HTTPError as e:

                      error_body = e.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

                      if e.code == 429:

                          retry_after = e.headers.get(
                              "retry-after"
                          )

                          try:
                              wait = max(
                                  15,
                                  float(retry_after)
                              )
                          except:
                              wait = 20

                          print(
                              f"RATE LIMITED. "
                              f"Waiting {wait:.1f}s..."
                          )

                          time.sleep(
                              wait
                          )

                          continue

                      print(
                          f"GROQ HTTP {e.code}"
                      )

                      print(
                          error_body[:1000]
                      )

                      raise

                  except Exception as e:

                      print(
                          f"Groq error: {e}"
                      )

                      if attempt < retries - 1:
                          time.sleep(5)
                      else:
                          raise

          # ============================================================
          # GENERATION PROMPT
          # ============================================================

          blocks = ""

          for i, s in enumerate(
              selected,
              1
          ):

              blocks += f"""

          STORY {i}

          TITLE IDEA:
          {s['title']}

          LOCATION:
          {s['location']}

          CHARACTERS:
          {s['characters']}

          EXACT FIRST-FRAME VISUAL:
          {s['visual']}

          STORY CORE:
          {s['core']}

          REQUIRED FINAL BEAT:
          {s['final']}

          """

          prompt = f"""
          Convert these five hand-written horror skeletons into
          five extremely short YouTube Shorts.

          {blocks}

          ============================================================
          THE SKELETON IS THE STORY
          ============================================================

          Preserve the exact situation.

          Preserve the exact contradiction.

          Preserve the final reveal.

          You may shorten, rearrange or naturalize dialogue.

          You may NOT:

          - invent a new twist
          - invent a new character
          - change who is alive or dead
          - change the location
          - add supernatural creatures
          - add a second explanation
          - add a magical object
          - turn the story into a dream
          - turn the story into a simulation
          - introduce a double or clone

          ============================================================
          LENGTH
          ============================================================

          30-45 spoken words.

          Designed for approximately 9-12 seconds.

          Short sentences.

          Natural spoken English.

          No exposition.

          No long narration.

          No "something felt wrong."

          No "I realized."

          No generic descriptions such as:

          "It was creepy."

          "I felt scared."

          "Something wasn't right."

          The viewer should understand the situation
          from the first sentence.

          ============================================================
          FINAL LINE
          ============================================================

          The supplied REQUIRED FINAL BEAT must remain
          the final spoken idea.

          Do not explain what it means afterward.

          CUT immediately.

          ============================================================
          BANNED
          ============================================================

          children
          child
          kids
          baby
          minor
          ghost
          demon
          monster
          zombie
          vampire
          mirror
          reflection
          twin
          twins
          double
          doppelganger
          clone
          cloning
          gore
          blood
          corpse
          CCTV
          surveillance
          phone screen
          video call
          disappearing
          vanished
          teleport
          transformation
          distorted face
          distorted body

          ============================================================
          OUTPUT
          ============================================================

          Return ONLY valid JSON.

          {{
            "stories": [
              {{
                "id": 1,
                "title": "short curiosity-driven title",
                "script": "30-45 spoken words",
                "visual_hook": "exact first-frame visual"
              }},
              {{
                "id": 2,
                "title": "short curiosity-driven title",
                "script": "30-45 spoken words",
                "visual_hook": "exact first-frame visual"
              }},
              {{
                "id": 3,
                "title": "short curiosity-driven title",
                "script": "30-45 spoken words",
                "visual_hook": "exact first-frame visual"
              }},
              {{
                "id": 4,
                "title": "short curiosity-driven title",
                "script": "30-45 spoken words",
                "visual_hook": "exact first-frame visual"
              }},
              {{
                "id": 5,
                "title": "short curiosity-driven title",
                "script": "30-45 spoken words",
                "visual_hook": "exact first-frame visual"
              }}
            ]
          }}
          """

          print()
          print(
              "GENERATING FIVE FIXED-SKELETON STORIES..."
          )
          print()

          raw = groq_call(
              prompt
          )

          try:

              data = json.loads(
                  raw
              )

          except Exception as e:

              print(
                  "INVALID JSON FROM GROQ"
              )

              print(
                  raw[:3000]
              )

              raise RuntimeError(
                  str(e)
              )

          stories = data.get(
              "stories",
              []
          )

          if not isinstance(
              stories,
              list
          ):

              raise RuntimeError(
                  "stories is not a list"
              )

          print(
              f"GENERATED: {len(stories)}"
          )

          # ============================================================
          # BASIC VALIDATION
          # ============================================================

          banned_words = [
              "child",
              "children",
              "kid",
              "kids",
              "baby",
              "minor",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "vampire",
              "mirror",
              "reflection",
              "reflected",
              "twin",
              "twins",
              "double",
              "doppelganger",
              "doppelgänger",
              "clone",
              "cloning",
              "gore",
              "blood",
              "corpse",
              "cctv",
              "surveillance",
              "phone screen",
              "video call",
              "disappear",
              "disappeared",
              "disappearing",
              "vanish",
              "vanished",
              "teleport",
              "transformation",
              "distorted face",
              "distorted body"
          ]

          weak_phrases = [
              "something felt wrong",
              "something was wrong",
              "something wasn't right",
              "something was not right",
              "i felt watched",
              "he felt watched",
              "she felt watched",
              "creepy feeling",
              "strange feeling",
              "eerie feeling",
              "i realized",
              "he realized",
              "she realized",
              "i couldn't explain"
          ]

          def validate(
              story
          ):

              required = [
                  "id",
                  "title",
                  "script",
                  "visual_hook"
              ]

              if not all(
                  key in story
                  for key in required
              ):

                  return (
                      False,
                      "missing field"
                  )

              try:
                  story_id = int(
                      story["id"]
                  )
              except:
                  return (
                      False,
                      "invalid id"
                  )

              if story_id < 1 or story_id > 5:
                  return (
                      False,
                      "id must be 1-5"
                  )

              script = str(
                  story["script"]
              ).strip()

              hook = str(
                  story["visual_hook"]
              ).strip()

              word_count = len(
                  script.split()
              )

              if word_count < 25:
                  return (
                      False,
                      "too short"
                  )

              if word_count > 52:
                  return (
                      False,
                      "too long"
                  )

              combined = (
                  script +
                  " " +
                  hook
              ).lower()

              for word in banned_words:

                  if re.search(
                      r"\b" +
                      re.escape(word) +
                      r"\b",
                      combined
                  ):

                      return (
                          False,
                          f"banned: {word}"
                      )

              for phrase in weak_phrases:

                  if phrase in combined:

                      return (
                          False,
                          f"weak phrase: {phrase}"
                      )

              # First frame must visibly contain an adult.
              visible_adult = any(
                  word in hook.lower()
                  for word in [
                      "man",
                      "woman",
                      "stranger",
                      "adult",
                      "neighbor",
                      "visitor",
                      "person"
                  ]
              )

              if not visible_adult:

                  return (
                      False,
                      "no visible adult"
                  )

              return (
                  True,
                  "PASS"
              )

          approved = []

          print()
          print(
              "RUNNING BASIC VALIDATION..."
          )
          print()

          seen_ids = set()

          for story in stories:

              story_id = story.get(
                  "id"
              )

              try:
                  story_id = int(
                      story_id
                  )
              except:
                  story_id = None

              if story_id in seen_ids:

                  print(
                      f"REJECT: duplicate id "
                      f"{story_id}"
                  )

                  continue

              seen_ids.add(
                  story_id
              )

              ok, reason = validate(
                  story
              )

              if ok:

                  print(
                      f"PASS: {story['title']}"
                  )

                  approved.append(
                      story
                  )

              else:

                  print(
                      f"REJECT: "
                      f"{story.get('title','UNTITLED')} "
                      f"-> {reason}"
                  )

          # ============================================================
          # REQUIRE THREE
          # ============================================================

          if len(approved) < 3:

              raise RuntimeError(
                  "V8.2 FAILED: fewer than 3 stories "
                  "passed basic validation. "
                  "No weak replacement stories will be created."
              )

          approved = approved[:3]

          print()
          print(
              f"APPROVED: {len(approved)}"
          )

          # ============================================================
          # MAP STORY POSITION TO SELECTED SKELETON
          #
          # Groq returns 1-5 based on response position.
          # selected[] also contains exactly those five skeletons.
          #
          # This avoids the previous 1-12 ID mapping bug.
          # ============================================================

          if len(stories) < 5:

              raise RuntimeError(
                  f"Expected 5 stories, "
                  f"received {len(stories)}"
              )

          # ============================================================
          # FLOW PROMPT
          # ============================================================

          def make_flow(
              story,
              skeleton
          ):

              return f"""
          Create a 9-12 second vertical 9:16
          photorealistic live-action horror Short.

          IMPORTANT:
          This is a fictional scene with fictional adult actors.
          Do not resemble any real person or celebrity.

          ============================================================
          CHARACTERS
          ============================================================

          {skeleton['characters']}

          Adults only.

          ============================================================
          LOCATION
          ============================================================

          {skeleton['location']}

          ============================================================
          FRAME 1 — MOST IMPORTANT
          ============================================================

          {skeleton['visual']}

          Start on this situation immediately.

          No establishing shot.

          The unfamiliar/ threatening adult must be clearly visible
          in the FIRST FRAME.

          The viewer should instantly understand:

          "That person should not be there."

          ============================================================
          ACTION
          ============================================================

          {story['script']}

          Use natural adult movement.

          Keep the camera close enough to clearly see faces,
          body language and the important object/action.

          ============================================================
          FINAL REVEAL
          ============================================================

          {skeleton['final']}

          End immediately after the final line.

          Hard cut.

          ============================================================
          STYLE
          ============================================================

          Photorealistic live action.

          Realistic adult actors.

          Natural skin and facial expressions.

          Real home/apartment/office environment.

          Believable lighting.

          Subtle cinematic camera movement.

          Realistic room ambience.

          No exaggerated acting.

          No cartoon appearance.

          No CGI-looking characters.

          ============================================================
          DO NOT ADD
          ============================================================

          No children.

          No ghosts.

          No demons.

          No monsters.

          No zombies.

          No mirrors.

          No reflections.

          No twins.

          No doppelgangers.

          No clones.

          No gore.

          No blood.

          No CCTV.

          No surveillance.

          No phone-screen horror.

          No disappearing people.

          No body transformation.

          No distorted faces.

          No magical objects.

          No extra character.

          No extra twist.

          No extra plot.

          Do not change the supplied story.
          """

          # ============================================================
          # OUTPUT DIRECTORY
          # ============================================================

          out = Path(
              "quiet-vault-output"
          )

          out.mkdir(
              exist_ok=True
          )

          final = []

          # ============================================================
          # BUILD THREE SHORTS
          # ============================================================

          for index, story in enumerate(
              approved,
              1
          ):

              story_position = int(
                  story["id"]
              )

              if (
                  story_position < 1
                  or
                  story_position > 5
              ):

                  raise RuntimeError(
                      f"Invalid story position: "
                      f"{story_position}"
                  )

              skeleton = selected[
                  story_position - 1
              ]

              item = {
                  "title": story["title"],
                  "script": story["script"],
                  "visual_hook": story[
                      "visual_hook"
                  ],
                  "flow_prompt": make_flow(
                      story,
                      skeleton
                  ),
                  "final_twist": skeleton[
                      "final"
                  ],
                  "description": (
                      "A realistic human horror encounter "
                      "where one impossible detail changes "
                      "everything. Watch until the final line."
                  ),
                  "keywords": (
                      "horror, horror shorts, scary stories, "
                      "scary shorts, horror stories, psychological "
                      "horror, realistic horror, creepy stories, "
                      "suspense horror, short horror stories, "
                      "horror storytelling, scary encounters, "
                      "The Quiet Vault"
                  ),
                  "hashtags": (
                      "#horror #horrorshorts #scarystories "
                      "#psychologicalhorror #creepy #shorts"
                  ),
                  "thumbnail_frame": (
                      "Use the exact opening frame where "
                      "the unfamiliar adult is already visible. "
                      f"Optional text: {story['title']}"
                  ),
                  "sound_design": (
                      "Natural room ambience. "
                      "Quiet realistic movement sounds. "
                      "Clear dialogue. "
                      "Very restrained tension underneath. "
                      "Hard cut to silence immediately after "
                      "the final line."
                  ),
                  "pinned_comment": (
                      "Did you catch what was wrong before "
                      "the final line?"
                  )
              }

              final.append(
                  item
              )

              md = f"""# {item['title']}

          ## Script

          {item['script']}

          ## Google Flow Prompt

          {item['flow_prompt']}

          ## Final Twist

          {item['final_twist']}

          ## Description

          {item['description']}

          ## Keywords

          {item['keywords']}

          ## Hashtags

          {item['hashtags']}

          ## Thumbnail

          {item['thumbnail_frame']}

          ## Sound Design

          {item['sound_design']}

          ## Pinned Comment

          {item['pinned_comment']}
          """

              (
                  out /
                  f"short_{index:02d}.md"
              ).write_text(
                  md,
                  encoding="utf-8"
              )

          # ============================================================
          # BATCH JSON
          # ============================================================

          batch = {
              "run_number": RUN_NUMBER,
              "provider": "groq",
              "model": MODEL,
              "engine": (
                  "V8.2 Stronger Horror DNA"
              ),
              "generated": len(stories),
              "approved": len(final),
              "shorts": final
          }

          (
              out /
              "batch.json"
          ).write_text(
              json.dumps(
                  batch,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # ============================================================
          # FINAL LOG
          # ============================================================

          print()
          print("==========================================")
          print("QUIET VAULT V8.2 COMPLETE")
          print("==========================================")
          print(
              f"Generated: {len(stories)}"
          )
          print(
              f"Approved:  {len(final)}"
          )
          print()

          for i, item in enumerate(
              final,
              1
          ):

              print(
                  f"{i}. {item['title']}"
              )

              print(
                  f"   {item['script']}"
              )

              print()

          PY

