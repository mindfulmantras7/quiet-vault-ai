name: Generate Quiet Vault Shorts V5

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RUN_NUMBER: ${{ github.run_number }}

    steps:
      - name: Generate Quiet Vault Shorts V5
        run: |
          cat > generate.py <<'PY'
          import os
          import json
          import time
          import re
          import urllib.request
          import urllib.error
          from pathlib import Path

          API_KEY = os.environ["GROQ_API_KEY"]
          RUN_NUMBER = int(os.environ.get("RUN_NUMBER", "1"))

          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          print("=" * 70)
          print("QUIET VAULT CREATIVE ENGINE V5")
          print("=" * 70)
          print(f"GitHub run: {RUN_NUMBER}")

          # ============================================================
          # CHANNEL DNA
          # ============================================================

          CHANNEL_DNA = """
          THE QUIET VAULT

          Format:
          - YouTube Shorts
          - 9-12 seconds
          - photorealistic cinematic horror
          - adult characters only
          - simple enough for Google Flow
          - viewer must understand the situation immediately

          Proven channel pattern:
          recognizable real location
          + visible human/impossible threat
          + relationship or personal context
          + simple escalation
          + concrete final contradiction
          + hard cut

          Most important weakness:
          swipe-away / weak first frame.

          Therefore:
          FRAME 1 MUST ALREADY SHOW SOMETHING WRONG.

          Do not spend the opening establishing the location.
          Do not begin with normal behavior.
          Do not hide the horror until the end.
          """

          # ============================================================
          # FIVE VISUAL MECHANISMS
          #
          # These are deliberately visual rather than object/puzzle
          # mechanisms.
          # ============================================================

          MECHANISMS = [
              {
                  "name": "THE BEDROOM OCCUPANT",
                  "location": "adult couple's bedroom",
                  "mechanism": """
          Frame 1 shows an unfamiliar adult already occupying the bed
          in a position that unmistakably belongs to the homeowner/spouse.
          The homeowner is visibly standing at the doorway.
          The stranger behaves as though he belongs there.
          The final fact must make the stranger's presence physically
          impossible or contradict what the homeowner knows.
                  """
              },

              {
                  "name": "THE WRONG PERSON AT THE TABLE",
                  "location": "adult couple's dining room",
                  "mechanism": """
          Frame 1 shows an unfamiliar adult actively eating from the
          homeowner's plate or sitting in the spouse's normal seat.
          The couple clearly did not invite this person.
          The person behaves with disturbing familiarity.
          The final fact must contradict who should physically be there.
                  """
              },

              {
                  "name": "THE LOCKED OFFICE",
                  "location": "adult man's locked office",
                  "mechanism": """
          Frame 1 shows an unfamiliar adult physically inside a locked
          office using the employee's workstation or wearing something
          unmistakably belonging to the employee.
          The employee is visibly present at the doorway.
          The final fact must make the person's access impossible.
                  """
              },

              {
                  "name": "THE APARTMENT INTRUDER",
                  "location": "adult woman's apartment",
                  "mechanism": """
          Frame 1 shows an unfamiliar adult already inside the apartment,
          actively carrying or using something that belongs to the woman.
          She has just entered and visibly sees him.
          The stranger acts as though he was expected.
          The final fact must contradict how he entered or why he is there.
                  """
              },

              {
                  "name": "THE HOSPITAL ROOM VISITOR",
                  "location": "adult patient's hospital room",
                  "mechanism": """
          Frame 1 shows an unfamiliar adult sitting beside an adult patient,
          physically holding or wearing something unmistakably personal to
          the patient or spouse.
          The visitor acts as though he has an established relationship
          with the patient.
          The final fact must contradict the visitor's presence or identity
          without using ghosts, monsters, reflections, or supernatural CGI.
                  """
              }
          ]

          # Rotate the five mechanisms between runs.
          # We deliberately keep each run's set visually diverse.
          rotation = (RUN_NUMBER - 1) % len(MECHANISMS)
          ordered = MECHANISMS[rotation:] + MECHANISMS[:rotation]

          print("\nMechanisms for this run:")
          for i, m in enumerate(ordered, 1):
              print(f"{i}. {m['name']}")

          # ============================================================
          # HARD BANS
          # ============================================================

          BANNED_TERMS = [
              "child",
              "children",
              "kid",
              "kids",
              "boy",
              "girl",
              "baby",
              "infant",
              "teen",
              "teenager",
              "minor",

              "mirror",
              "reflection",
              "reflective",

              "twin",
              "doppelganger",
              "double",
              "clone",

              "ghost",
              "demon",
              "monster",
              "zombie",
              "spirit",
              "entity",
              "possessed",
              "possession",

              "cctv",
              "surveillance camera",
              "security footage",
              "found footage",

              "elevator",
              "hotel",
              "train",
              "printer",

              "video call",
              "facetime",
              "zoom call",
              "phone call",

              "blood",
              "gore",
              "guts",
              "corpse",
              "decapitated",

              "disappeared",
              "disappears",
              "vanished",
              "vanishes",
              "teleport",

              "face distortion",
              "melting face",
              "deformed face",

              "celebrity",
              "famous person",
              "real person"
          ]

          def contains_banned(text):
              t = text.lower()
              for term in BANNED_TERMS:
                  if re.search(r"\b" + re.escape(term) + r"\b", t):
                      return term
              return None

          # ============================================================
          # GROQ REQUEST
          # ============================================================

          def groq_request(messages, schema, max_tokens=4500):
              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": 0.65,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "quiet_vault_output",
                          "strict": True,
                          "schema": schema
                      }
                  }
              }

              body = json.dumps(payload).encode("utf-8")

              for attempt in range(5):
                  req = urllib.request.Request(
                      ENDPOINT,
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/5.0"
                      },
                      method="POST"
                  )

                  try:
                      with urllib.request.urlopen(req, timeout=180) as response:
                          raw = response.read().decode("utf-8")
                          data = json.loads(raw)

                      content = data["choices"][0]["message"]["content"]
                      return json.loads(content)

                  except urllib.error.HTTPError as e:
                      raw = e.read().decode("utf-8", errors="replace")

                      if e.code == 429:
                          retry = 15

                          try:
                              err = json.loads(raw)
                              msg = err.get("error", {}).get("message", "")
                              m = re.search(r"try again in ([0-9.]+)s", msg)
                              if m:
                                  retry = max(12, min(65, float(m.group(1)) + 1))
                          except Exception:
                              pass

                          print(f"RATE LIMITED. Waiting {retry:.1f}s...")
                          time.sleep(retry)
                          continue

                      print(f"GROQ HTTP ERROR: {e.code}")
                      print(raw[:3000])
                      time.sleep(3)
                      continue

                  except Exception as e:
                      print(f"GROQ REQUEST ERROR: {e}")
                      time.sleep(3)
                      continue

              raise RuntimeError("Groq request failed after retries.")

          # ============================================================
          # GENERATION SCHEMA
          # ============================================================

          generation_schema = {
              "type": "object",
              "additionalProperties": False,
              "required": ["shorts"],
              "properties": {
                  "shorts": {
                      "type": "array",
                      "minItems": 5,
                      "maxItems": 5,
                      "items": {
                          "type": "object",
                          "additionalProperties": False,
                          "required": [
                              "mechanism",
                              "title",
                              "short_script",
                              "visual_hook",
                              "flow_prompt",
                              "ending",
                              "thumbnail_text",
                              "sound_design"
                          ],
                          "properties": {
                              "mechanism": {"type": "string"},
                              "title": {"type": "string"},
                              "short_script": {"type": "string"},
                              "visual_hook": {"type": "string"},
                              "flow_prompt": {"type": "string"},
                              "ending": {"type": "string"},
                              "thumbnail_text": {"type": "string"},
                              "sound_design": {"type": "string"}
                          }
                      }
                  }
              }
          }

          # ============================================================
          # GENERATE FIVE STORIES IN ONE REQUEST
          # ============================================================

          mechanism_text = "\n\n".join(
              f"MECHANISM {i+1}: {m['name']}\n"
              f"LOCATION: {m['location']}\n"
              f"REQUIRED VISUAL: {m['mechanism']}"
              for i, m in enumerate(ordered)
          )

          generation_prompt = f"""
          Create exactly ONE horror Short for EACH of the five mechanisms below.

          {CHANNEL_DNA}

          {mechanism_text}

          CRITICAL CREATIVE RULES:

          1. The FIRST FRAME is the hook.
             It must visibly show the disturbing situation.
             A normal person standing somewhere is NOT enough.

          2. The threat must be physically visible.
             An unfamiliar adult must be doing something clearly wrong,
             or an impossible physical situation must be visible.

          3. Do NOT rely on:
             - dates
             - calendars
             - names
             - passwords
             - fingerprints
             - mysterious notes
             - generic keys
             - "he knows something"
             - unexplained sounds
             - phone calls
             - reflections
             - mirrors

          4. The ending must introduce a NEW CONCRETE FACT.
             It must change the meaning of what the viewer saw in frame 1.

          5. Do not simply repeat the dialogue in the ending.

          6. Use adult characters only.

          7. No supernatural creature.
             Keep it grounded, realistic and cinematic.

          8. The complete spoken script should fit roughly 9-12 seconds.
             Maximum 42 spoken words.

          9. Keep the visual situation simple enough for Google Flow.

          10. The five stories must feel materially different.
              Do not merely change names or objects.

          11. No gore.

          12. No real people or celebrity likenesses.

          FLOW PROMPT REQUIREMENTS:

          - vertical 9:16
          - photorealistic live-action
          - cinematic but realistic lighting
          - fictional adult characters
          - no celebrity likeness
          - describe the exact frame-1 composition
          - preserve character appearance
          - natural human movement
          - no text overlays
          - no subtitles
          - no mirror/reflection
          - no supernatural creature

          THUMBNAIL TEXT:
          Maximum 4 words.
          It should create curiosity about the visible contradiction.

          Return exactly five stories.
          """

          print("\n" + "=" * 70)
          print("GENERATING FIVE VISUAL-FIRST STORIES")
          print("=" * 70)

          generated = groq_request(
              [
                  {
                      "role": "system",
                      "content": "You write concise, realistic psychological horror Shorts. Follow the requested JSON schema exactly."
                  },
                  {
                      "role": "user",
                      "content": generation_prompt
                  }
              ],
              generation_schema,
              max_tokens=4500
          )

          candidates = generated.get("shorts", [])

          if len(candidates) != 5:
              raise RuntimeError(
                  f"Expected 5 generated Shorts, received {len(candidates)}."
              )

          # ============================================================
          # PYTHON HARD FILTER
          # ============================================================

          clean_candidates = []

          print("\n" + "=" * 70)
          print("HARD VALIDATION")
          print("=" * 70)

          for i, short in enumerate(candidates, 1):

              combined = " ".join(
                  str(short.get(k, ""))
                  for k in [
                      "mechanism",
                      "title",
                      "short_script",
                      "visual_hook",
                      "flow_prompt",
                      "ending",
                      "thumbnail_text",
                      "sound_design"
                  ]
              )

              banned = contains_banned(combined)

              if banned:
                  print(f"{i}. REJECTED — banned term: {banned}")
                  continue

              script = short.get("short_script", "").strip()

              word_count = len(script.split())

              if word_count > 48:
                  print(f"{i}. REJECTED — script too long: {word_count} words")
                  continue

              if len(short.get("flow_prompt", "").strip()) < 120:
                  print(f"{i}. REJECTED — Flow prompt too short")
                  continue

              if len(short.get("ending", "").strip()) < 20:
                  print(f"{i}. REJECTED — ending too vague")
                  continue

              clean_candidates.append(short)
              print(f"{i}. HARD PASS — {short.get('title', 'Untitled')}")

          if len(clean_candidates) < 3:
              raise RuntimeError(
                  f"Only {len(clean_candidates)} candidates survived hard validation."
              )

          # ============================================================
          # COMPARATIVE JUDGE
          # ============================================================

          judge_schema = {
              "type": "object",
              "additionalProperties": False,
              "required": ["evaluations"],
              "properties": {
                  "evaluations": {
                      "type": "array",
                      "minItems": 3,
                      "maxItems": 5,
                      "items": {
                          "type": "object",
                          "additionalProperties": False,
                          "required": [
                              "index",
                              "hook",
                              "visible_horror",
                              "clarity",
                              "escalation",
                              "ending",
                              "rewatch",
                              "flow",
                              "originality",
                              "pass"
                          ],
                          "properties": {
                              "index": {
                                  "type": "integer"
                              },
                              "hook": {
                                  "type": "integer"
                              },
                              "visible_horror": {
                                  "type": "integer"
                              },
                              "clarity": {
                                  "type": "integer"
                              },
                              "escalation": {
                                  "type": "integer"
                              },
                              "ending": {
                                  "type": "integer"
                              },
                              "rewatch": {
                                  "type": "integer"
                              },
                              "flow": {
                                  "type": "integer"
                              },
                              "originality": {
                                  "type": "integer"
                              },
                              "pass": {
                                  "type": "boolean"
                              }
                          }
                      }
                  }
              }
          }

          judge_items = []

          for i, short in enumerate(clean_candidates, 1):
              judge_items.append(
                  f"""
          CANDIDATE {i}
          TITLE: {short.get('title')}
          SCRIPT: {short.get('short_script')}
          VISUAL HOOK: {short.get('visual_hook')}
          ENDING: {short.get('ending')}
          FLOW: {short.get('flow_prompt')}
                  """
              )

          judge_prompt = f"""
          You are the final creative editor for The Quiet Vault.

          Evaluate these horror Shorts against the channel's actual goal:
          stop the scroll immediately with a visible disturbing situation,
          then deliver a concrete contradiction within 9-12 seconds.

          {CHANNEL_DNA}

          {''.join(judge_items)}

          Score every candidate from 0-10 on:

          hook
          visible_horror
          clarity
          escalation
          ending
          rewatch
          flow
          originality

          PASS requires:

          hook >= 8
          visible_horror >= 8
          clarity >= 8
          escalation >= 7
          ending >= 8
          rewatch >= 7
          flow >= 8
          originality >= 7

          IMPORTANT:

          A stranger merely standing/sitting somewhere is NOT visible horror.

          An ordinary object with a strange date/name/message is NOT enough.

          The ending must introduce a NEW CONCRETE FACT that changes the
          interpretation of the initial visual.

          Do not pass something merely because it is technically coherent.

          Judge harshly.
          """

          print("\n" + "=" * 70)
          print("COMPARATIVE CREATIVE JUDGE")
          print("=" * 70)

          judged = groq_request(
              [
                  {
                      "role": "system",
                      "content": "You are a strict creative editor. Return only the requested JSON."
                  },
                  {
                      "role": "user",
                      "content": judge_prompt
                  }
              ],
              judge_schema,
              max_tokens=1800
          )

          evaluations = judged.get("evaluations", [])

          approved = []

          for ev in evaluations:
              idx = ev.get("index", 0)

              if not isinstance(idx, int):
                  continue

              if idx < 1 or idx > len(clean_candidates):
                  continue

              print(
                  f"Candidate {idx}: "
                  f"hook={ev.get('hook')} "
                  f"visible={ev.get('visible_horror')} "
                  f"clarity={ev.get('clarity')} "
                  f"escalation={ev.get('escalation')} "
                  f"ending={ev.get('ending')} "
                  f"rewatch={ev.get('rewatch')} "
                  f"flow={ev.get('flow')} "
                  f"originality={ev.get('originality')} "
                  f"PASS={ev.get('pass')}"
              )

              if ev.get("pass") is True:
                  score = (
                      ev.get("hook", 0)
                      + ev.get("visible_horror", 0)
                      + ev.get("clarity", 0)
                      + ev.get("escalation", 0)
                      + ev.get("ending", 0)
                      + ev.get("rewatch", 0)
                      + ev.get("flow", 0)
                      + ev.get("originality", 0)
                  )

                  approved.append(
                      (score, idx, ev)
                  )

          # ============================================================
          # SELECT THREE
          # ============================================================

          approved.sort(reverse=True, key=lambda x: x[0])

          selected = []

          for score, idx, ev in approved:
              candidate = clean_candidates[idx - 1]

              # Avoid near-duplicate mechanisms.
              mechanism = candidate.get("mechanism", "").lower()

              if any(
                  mechanism == x.get("mechanism", "").lower()
                  for x in selected
              ):
                  continue

              selected.append(candidate)

              if len(selected) == 3:
                  break

          print("\n" + "=" * 70)
          print("CREATIVE SELECTION COMPLETE")
          print("=" * 70)

          print(f"Approved Shorts: {len(selected)}")

          if len(selected) < 3:
              print("\nNo weak filler will be created.")
              print("The creative gate did not find three sufficiently strong Shorts.")
              raise RuntimeError(
                  "Fewer than 3 Shorts passed the V5 creative gate."
              )

          # ============================================================
          # BUILD FINAL PACKAGES WITHOUT ANOTHER GROQ CALL
          # ============================================================

          output_dir = Path("quiet-vault-output")
          output_dir.mkdir(exist_ok=True)

          final_output = []

          fixed_keywords = (
              "horror, horror shorts, scary stories, scary shorts, "
              "horror stories, psychological horror, realistic horror, "
              "creepy stories, suspense horror, thriller horror, "
              "family horror, relationship horror, scary encounters, "
              "horror twists, scary endings, short horror stories, "
              "horror storytelling, The Quiet Vault"
          )

          hashtags = (
              "#horror #horrorshorts #scarystories "
              "#psychologicalhorror #creepystories #TheQuietVault"
          )

          for number, short in enumerate(selected, 1):

              title = short["title"].strip()

              description = (
                  f"{short['short_script'].strip()}\n\n"
                  "A short psychological horror story from The Quiet Vault.\n"
                  "New realistic horror stories and unsettling encounters."
              )

              package = {
                  "number": number,
                  "title": title,
                  "short_script": short["short_script"].strip(),
                  "visual_hook": short["visual_hook"].strip(),
                  "flow_prompt": short["flow_prompt"].strip(),
                  "final_twist": short["ending"].strip(),
                  "description": description,
                  "keywords": fixed_keywords,
                  "hashtags": hashtags,
                  "thumbnail_frame": "0.0 seconds — use the opening frame.",
                  "thumbnail_text": short["thumbnail_text"].strip(),
                  "sound_design": short["sound_design"].strip(),
                  "pinned_comment": (
                      "Would you have opened that door?"
                      if number == 1
                      else "What would you do if you saw this?"
                  )
              }

              final_output.append(package)

              md = f"""# {number}. {package['title']}

          ## Script
          {package['short_script']}

          ## Google Flow Prompt
          {package['flow_prompt']}

          ## Final Twist
          {package['final_twist']}

          ## Description
          {package['description']}

          ## Keywords
          {package['keywords']}

          ## Hashtags
          {package['hashtags']}

          ## Thumbnail
          Frame: {package['thumbnail_frame']}
          Text: {package['thumbnail_text']}

          ## Sound Design
          {package['sound_design']}

          ## Pinned Comment
          {package['pinned_comment']}
          """

              (output_dir / f"short_{number:02d}.md").write_text(
                  md,
                  encoding="utf-8"
              )

          (output_dir / "batch.json").write_text(
              json.dumps(
                  {
                      "engine": "Quiet Vault V5",
                      "run": RUN_NUMBER,
                      "shorts": final_output
                  },
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print("\n" + "=" * 70)
          print("FINAL THREE")
          print("=" * 70)

          for short in final_output:
              print(f"\nSHORT {short['number']}: {short['title']}")
              print(f"Script: {short['short_script']}")
              print(f"Thumbnail: {short['thumbnail_text']}")

          print("\nV5 COMPLETE.")
          PY

          python generate.py

      - name: Upload Quiet Vault Shorts
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts-v5
          path: quiet-vault-output/
