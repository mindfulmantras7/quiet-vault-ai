name: Generate 3 Quiet Vault Shorts

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate and quality-filter 3 horror Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          from pathlib import Path

          api_key = os.environ.get("GROQ_API_KEY")

          if not api_key:
              print("ERROR: GROQ_API_KEY secret was not found.")
              raise SystemExit(1)

          prompt = r"""
          You are the senior writer and ruthless creative director for
          "The Quiet Vault", a realistic cinematic horror YouTube Shorts channel.

          Your job is NOT to generate generic horror ideas.

          Your job is to find 3 highly visual, original, believable horror
          concepts that have a strong chance of stopping a viewer from swiping.

          ============================================================
          CREATIVE TARGET
          ============================================================

          Each Short should feel like:

          "This could almost happen in real life... but one thing is
          completely wrong."

          The viewer must be able to understand the disturbing visual
          WITHOUT relying on narration.

          Target duration: 9-15 seconds.

          Use fictional ADULT characters only.
          No children or minors.
          No celebrities.
          No real-person likenesses.
          No gore.

          ============================================================
          THE 6-STEP STORY STRUCTURE
          ============================================================

          Every selected concept MUST contain:

          1. IMMEDIATE VISUAL HOOK
             The first frame already contains something visibly wrong.

          2. NORMAL CONTEXT
             The viewer immediately understands where the character is
             and what they are doing.

          3. SIMPLE ESCALATION
             Something physically changes within a few seconds.

          4. REVELATION
             The viewer realizes the situation is stranger than initially
             understood.

          5. FINAL VISUAL TWIST
             One strong final image or action.

          6. HARD ENDING
             End immediately after the reveal.
             No explanation.
             No long dialogue.

          ============================================================
          WHAT WE WANT
          ============================================================

          Prefer:

          - realistic human behavior
          - apartments
          - offices
          - bathrooms
          - kitchens
          - staircases
          - supermarkets
          - parking areas
          - hospitals
          - restaurants
          - workplaces
          - public places
          - building lobbies
          - pharmacies
          - laundromats
          - rooftops
          - balconies
          - convenience stores
          - ordinary streets

          Strong mechanisms include:

          - someone being somewhere they should not be
          - an ordinary action happening in an impossible way
          - a person reacting to something the viewer can clearly see
          - an object behaving in a physically understandable but disturbing way
          - a locked/open contradiction
          - a time/order contradiction
          - a person knowing something they could not know
          - an ordinary physical event revealing a disturbing truth
          - an apparently safe situation becoming unsafe through one visible change

          ============================================================
          HARD EXCLUSIONS
          ============================================================

          DO NOT USE:

          - elevator horror
          - car horror
          - hotel horror
          - CCTV footage
          - mirror/reflection tricks
          - doppelgängers
          - hidden person behind someone
          - printer horror
          - moving empty chair
          - train horror
          - 180-degree head/face distortion
          - disappearing/reappearing people
          - floating mugs
          - possessed household objects
          - cereal boxes with faces
          - random body parts appearing
          - objects growing human faces
          - generic demons
          - generic ghosts
          - monsters
          - zombies
          - excessive blood
          - gore
          - complicated mythology
          - complicated transformations
          - impossible anatomy
          - giant creatures
          - jump scares with no story
          - "it was actually me" twists unless the visual execution is
            extremely clear
          - twists that require complicated CGI
          - twists that cannot be understood visually
          - long conversations
          - exposition
          - stories depending entirely on narration

          ============================================================
          FLOW FEASIBILITY
          ============================================================

          Every concept MUST be easy for Google Flow to generate.

          Prefer:

          - one or two adult characters
          - one location
          - one camera
          - one continuous shot or two simple shots
          - simple human movement
          - simple physical actions
          - realistic lighting
          - realistic environments

          Avoid:

          - complex reflections
          - complex transformations
          - many characters
          - crowds
          - complicated camera choreography
          - impossible anatomy
          - detailed supernatural creatures

          ============================================================
          GENERATE A LARGE IDEA POOL FIRST
          ============================================================

          Internally generate at least 12 different concepts.

          They must use different:

          - locations
          - mechanisms
          - character situations
          - types of threat
          - endings

          Do NOT select the first 3 acceptable ideas.

          ============================================================
          RUTHLESS QUALITY FILTER
          ============================================================

          Internally evaluate every idea.

          Reject any idea if:

          - the horror is not visible in frame 1
          - narration is required to understand what is wrong
          - it feels like a generic AI horror video
          - the twist is predictable
          - the twist requires complicated CGI
          - it resembles the excluded mechanisms
          - it is more funny than frightening
          - the ending is merely "the object disappears"
          - the ending is merely "the character screams"
          - the viewer would need an explanation
          - the visual would probably look fake
          - the concept feels copied from common horror Shorts
          - the first frame is ordinary
          - nothing meaningful changes during the Short

          ============================================================
          IMPORTANT STOP-SCROLL TEST
          ============================================================

          For every surviving idea, ask:

          "If I show only the first frame to someone for one second,
          would they immediately notice something is wrong?"

          If NO: reject it.

          Then ask:

          "If the viewer watches without sound, will they understand
          the horror?"

          If NO: reject it.

          Then ask:

          "Can Google Flow realistically create the required action?"

          If NO: reject it.

          Then ask:

          "Does the ending create a genuine 'wait... what?' moment?"

          If NO: reject it.

          ============================================================
          FINAL SELECTION
          ============================================================

          Select EXACTLY 3 concepts.

          The three concepts must NOT share the same core mechanism.

          Do not select three versions of the same idea.

          ============================================================
          OUTPUT PACKAGE
          ============================================================

          For each selected Short provide:

          1. TITLE

          Title should create curiosity without explaining the twist.

          2. SHORT_SCRIPT

          Maximum approximately 35 spoken words.

          Narration should be minimal.
          Dialogue only when it adds value.

          3. VISUAL_HOOK

          Describe exactly what is visible in frame 1.

          4. FLOW_PROMPT

          Write ONE complete Google Flow prompt ready to paste.

          It must specify:

          - vertical 9:16
          - 9-15 seconds
          - photorealistic live-action
          - fictional adult characters
          - no celebrity likeness
          - location
          - character appearance
          - camera position
          - camera movement
          - lighting
          - exact physical action
          - timing
          - final visual twist
          - hard ending
          - no text
          - no subtitles
          - no logos
          - no watermark
          - no gore
          - no monsters

          Do not rely on complex visual effects.

          5. FINAL_TWIST

          Explain the final visual revelation in one or two sentences.

          6. DESCRIPTION

          Natural YouTube description.
          Do not claim the story is real.
          Do not mention AI generation.
          Do not keyword stuff.

          7. KEYWORDS

          10-20 relevant comma-separated keywords.

          8. HASHTAGS

          4-8 relevant hashtags.

          9. THUMBNAIL_FRAME

          Identify the strongest exact moment/frame.

          10. THUMBNAIL_TEXT

          Maximum 4 words.
          It should create curiosity.
          Use "NONE" if text would weaken the thumbnail.

          ============================================================
          FINAL SELF-CRITIQUE
          ============================================================

          Before returning the final JSON, mentally inspect each selected
          concept as if the finished video were playing.

          Reject and replace any concept that would likely look:

          - silly
          - confusing
          - cartoonish
          - overly supernatural
          - visually weak
          - difficult for Flow to generate
          - boring after the first 2 seconds

          Quality is more important than variety.

          Return ONLY valid JSON.

          Use exactly this structure:

          {
            "shorts": [
              {
                "id": 1,
                "title": "...",
                "short_script": "...",
                "visual_hook": "...",
                "flow_prompt": "...",
                "final_twist": "...",
                "description": "...",
                "keywords": "...",
                "hashtags": "...",
                "thumbnail_frame": "...",
                "thumbnail_text": "..."
              },
              {
                "id": 2,
                "title": "...",
                "short_script": "...",
                "visual_hook": "...",
                "flow_prompt": "...",
                "final_twist": "...",
                "description": "...",
                "keywords": "...",
                "hashtags": "...",
                "thumbnail_frame": "...",
                "thumbnail_text": "..."
              },
              {
                "id": 3,
                "title": "...",
                "short_script": "...",
                "visual_hook": "...",
                "flow_prompt": "...",
                "final_twist": "...",
                "description": "...",
                "keywords": "...",
                "hashtags": "...",
                "thumbnail_frame": "...",
                "thumbnail_text": "..."
              }
            ]
          }
          """

          url = "https://api.groq.com/openai/v1/chat/completions"

          data = {
              "model": "openai/gpt-oss-20b",
              "messages": [
                  {
                      "role": "system",
                      "content": (
                          "You are a senior horror creative director. "
                          "Generate original, visually clear, realistic "
                          "horror Shorts. Return valid JSON only."
                      )
                  },
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "temperature": 0.95,
              "max_completion_tokens": 9000,
              "response_format": {
                  "type": "json_object"
              }
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + api_key,
                  "User-Agent": "QuietVaultAI/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  result = json.loads(response.read())

          except urllib.error.HTTPError as e:
              print("")
              print("===== GROQ API ERROR =====")
              print("HTTP STATUS:", e.code)
              print(e.read().decode("utf-8"))
              print("==========================")
              raise

          content = result["choices"][0]["message"]["content"]

          try:
              output = json.loads(content)
          except json.JSONDecodeError:
              print("ERROR: Groq returned invalid JSON.")
              print(content)
              raise

          shorts = output.get("shorts", [])

          if len(shorts) != 3:
              print("ERROR: Expected exactly 3 Shorts.")
              print("Received:", len(shorts))
              raise SystemExit(1)

          required_fields = [
              "id",
              "title",
              "short_script",
              "visual_hook",
              "flow_prompt",
              "final_twist",
              "description",
              "keywords",
              "hashtags",
              "thumbnail_frame",
              "thumbnail_text"
          ]

          for short in shorts:
              missing = [field for field in required_fields if field not in short]

              if missing:
                  print("ERROR: Missing fields in Short", short.get("id"))
                  print("Missing:", missing)
                  raise SystemExit(1)

          output_dir = Path("quiet-vault-output")
          output_dir.mkdir(exist_ok=True)

          with open(output_dir / "batch.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          for short in shorts:
              i = short["id"]

              markdown = f"""# THE QUIET VAULT — SHORT {i}

          ## TITLE

          {short["title"]}

          ## SHORT SCRIPT

          {short["short_script"]}

          ## VISUAL HOOK

          {short["visual_hook"]}

          ## GOOGLE FLOW PROMPT

          {short["flow_prompt"]}

          ## FINAL TWIST

          {short["final_twist"]}

          ## DESCRIPTION

          {short["description"]}

          ## KEYWORDS

          {short["keywords"]}

          ## HASHTAGS

          {short["hashtags"]}

          ## THUMBNAIL FRAME

          {short["thumbnail_frame"]}

          ## THUMBNAIL TEXT

          {short["thumbnail_text"]}
          """

              with open(
                  output_dir / f"short_{i:02d}.md",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(markdown)

          print("")
          print("========================================")
          print("   QUIET VAULT — 3 SHORTS GENERATED")
          print("========================================")
          print("")

          for short in shorts:
              print(f'{short["id"]}. {short["title"]}')

          print("")
          print("Files created:")
          print("  short_01.md")
          print("  short_02.md")
          print("  short_03.md")
          print("  batch.json")
          print("")
          print("========================================")

      - name: Upload generated Shorts package
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts
          path: quiet-vault-output/
          retention-days: 7
