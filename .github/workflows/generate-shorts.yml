name: Quiet Vault AI - V14 Contradiction Horror Engine

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate V14 Horror Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path

          API_KEY = os.environ["GROQ_API_KEY"]
          RUN_NUMBER = int(os.environ.get("RUN_NUMBER", "1"))

          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          OUT = Path("quiet-vault-output")
          OUT.mkdir(exist_ok=True)

          # ============================================================
          # QUIET VAULT V14
          #
          # NEW CREATIVE RULE:
          #
          # FRAME 1 = disturbing physical situation
          # EVIDENCE  = something the viewer can actually see
          # FACT      = an established reality
          # CONTRADICTION = fact that makes the scene impossible
          # FINAL LINE = exposes the contradiction
          #
          # The final line should CHANGE the meaning of frame 1.
          #
          # Groq does NOT invent the horror mechanism.
          # ============================================================

          MECHANISMS = [

              {
                  "name": "DEAD WIFE BED",
                  "title": "My Dead Wife Taught Her This",
                  "location": "realistic apartment bedroom at night",
                  "frame1": "An unfamiliar adult woman is already making the man's bed exactly the way his dead wife used to.",
                  "evidence": "She places the pillow, blanket and bedside glass in the dead wife's unmistakable bedtime arrangement.",
                  "fact": "His wife died two years ago.",
                  "contradiction": "The stranger claims the dead wife personally taught her the routine.",
                  "final_line": "I know. She taught me last night.",
                  "action": "The stranger calmly finishes arranging the bed while the man stands frozen in the doorway."
              },

              {
                  "name": "BURIED WATCH",
                  "title": "That Watch Was Buried With Him",
                  "location": "realistic apartment hallway at night",
                  "frame1": "An unfamiliar adult man is standing inside the apartment wearing the protagonist's deceased father's old wristwatch.",
                  "evidence": "The distinctive scratched watch is clearly visible on the stranger's wrist.",
                  "fact": "The protagonist buried the watch with his father two years ago.",
                  "contradiction": "The stranger claims the father gave him the watch.",
                  "final_line": "Your father gave it to me this morning.",
                  "action": "The stranger casually checks the watch while the protagonist stares at it."
              },

              {
                  "name": "BURNED PHOTOGRAPH",
                  "title": "I Burned That Photo",
                  "location": "realistic apartment kitchen at night",
                  "frame1": "An unfamiliar adult woman is holding a photograph of the protagonist that he destroyed the previous night.",
                  "evidence": "The photograph is visibly damaged exactly where he remembers tearing and burning it.",
                  "fact": "He burned the only copy in his kitchen sink last night.",
                  "contradiction": "The stranger says she found the photograph in his bedroom this morning.",
                  "final_line": "You left it on your bed this morning.",
                  "action": "The stranger calmly holds the damaged photograph toward him."
              },

              {
                  "name": "FUTURE PHOTO",
                  "title": "That Photo Was Taken Tomorrow",
                  "location": "realistic apartment entryway at night",
                  "frame1": "An unfamiliar adult man is holding a photograph showing the protagonist standing in the exact doorway wearing the exact clothes he is wearing now.",
                  "evidence": "The photograph clearly shows the same clothes, same doorway and same person.",
                  "fact": "The photograph is dated tomorrow.",
                  "contradiction": "The photograph supposedly shows an event that has not happened.",
                  "final_line": "Don't worry. You haven't opened the door yet.",
                  "action": "The stranger calmly studies the photograph while the protagonist stands in the doorway."
              },

              {
                  "name": "DEAD SISTER NICKNAME",
                  "title": "Only My Sister Called Me That",
                  "location": "realistic apartment kitchen at night",
                  "frame1": "An unfamiliar adult man is calmly making coffee in the protagonist's kitchen and calls him by a private childhood nickname.",
                  "evidence": "The stranger uses the exact nickname that only the protagonist's sister used.",
                  "fact": "His sister died three years ago.",
                  "contradiction": "The stranger says the sister told him the nickname.",
                  "final_line": "She said you'd still answer to it.",
                  "action": "The stranger calmly pours coffee while looking directly at the protagonist."
              },

              {
                  "name": "LOCKED DRAWER",
                  "title": "Nobody Knows That Compartment",
                  "location": "realistic apartment bedroom at night",
                  "frame1": "An unfamiliar adult man is already removing a sentimental item from a hidden compartment inside the protagonist's locked bedside drawer.",
                  "evidence": "The hidden compartment is visible and the stranger has the exact item in his hand.",
                  "fact": "The protagonist has never told anyone the compartment exists.",
                  "contradiction": "The stranger claims the protagonist showed him the hiding place.",
                  "final_line": "You showed me this place before you went to sleep.",
                  "action": "The stranger calmly closes his fingers around the hidden item."
              },

              {
                  "name": "EMPTY HOUSE DINNER",
                  "title": "I Live Alone",
                  "location": "realistic apartment dining room at night",
                  "frame1": "An unfamiliar adult woman is already sitting at the protagonist's dining table eating a freshly prepared dinner.",
                  "evidence": "Two plates are set, and the stranger has prepared the protagonist's exact favorite meal.",
                  "fact": "The protagonist lives alone and did not invite anyone.",
                  "contradiction": "The stranger says the protagonist asked her to prepare dinner.",
                  "final_line": "You asked me to make your favorite before you came home.",
                  "action": "The stranger calmly takes another bite while the protagonist stands at the doorway."
              },

              {
                  "name": "PRIVATE ROUTINE",
                  "title": "Nobody Taught Her My Routine",
                  "location": "realistic apartment entryway at night",
                  "frame1": "An unfamiliar adult woman is already inside the protagonist's locked apartment, barefoot, placing his keys into their exact private bowl.",
                  "evidence": "She has removed her shoes and completed the exact sequence the protagonist follows every night.",
                  "fact": "He was away all day and has never shown the routine to anyone.",
                  "contradiction": "She says he taught her the routine.",
                  "final_line": "You taught me this before you left.",
                  "action": "The stranger calmly places the keys into the bowl as the protagonist enters."
              },

              {
                  "name": "FRESH BED",
                  "title": "Someone Slept Here",
                  "location": "realistic apartment bedroom at night",
                  "frame1": "An unfamiliar adult man is already lying on the protagonist's bed in the exact position where the protagonist sleeps.",
                  "evidence": "His shoes are removed and the protagonist's blanket is pulled into its normal sleeping position.",
                  "fact": "The apartment was locked and empty when the protagonist left.",
                  "contradiction": "The stranger says he was waiting for the protagonist to come back.",
                  "final_line": "You told me to wait here.",
                  "action": "The stranger remains completely calm in the protagonist's bed."
              },

              {
                  "name": "UNOPENED LETTER",
                  "title": "I Hadn't Written It Yet",
                  "location": "realistic apartment desk at night",
                  "frame1": "An unfamiliar adult woman is sitting at the protagonist's desk holding a handwritten letter addressed to him.",
                  "evidence": "The letter is written in the protagonist's handwriting and contains a sentence he has not yet written.",
                  "fact": "The letter describes something that will happen later tonight.",
                  "contradiction": "The stranger says she was told to deliver it before he writes it.",
                  "final_line": "You haven't written it yet. I was told to bring it first.",
                  "action": "The stranger calmly holds the handwritten letter out to him."
              },

              {
                  "name": "PRIVATE SECRET",
                  "title": "Only One Person Knew",
                  "location": "realistic apartment living room at night",
                  "frame1": "An unfamiliar adult man is sitting calmly in the protagonist's living room holding an object connected to a secret from his childhood.",
                  "evidence": "The object is an unmistakable personal item nobody else has ever seen.",
                  "fact": "Only the protagonist's deceased brother knew where it was hidden.",
                  "contradiction": "The stranger says the brother told him where to find it.",
                  "final_line": "Your brother told me where you hid it.",
                  "action": "The stranger places the secret object on the table between them."
              },

              {
                  "name": "WRONG MORNING",
                  "title": "She Wasn't Here This Morning",
                  "location": "realistic apartment kitchen at night",
                  "frame1": "An unfamiliar adult woman is washing a coffee cup in the protagonist's kitchen.",
                  "evidence": "The cup is the one the protagonist used that morning and left in the sink before leaving.",
                  "fact": "The apartment was locked and empty after he left.",
                  "contradiction": "The stranger says she watched him leave that morning.",
                  "final_line": "I watched you leave this morning.",
                  "action": "The stranger calmly dries the cup while the protagonist watches."
              }
          ]

          # ============================================================
          # GROQ CALL
          # ============================================================

          def call_groq(prompt, max_tokens=650):

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "temperature": 0.45,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "quiet_vault_v14",
                          "strict": True,
                          "schema": {
                              "type": "object",
                              "properties": {
                                  "title": {"type": "string"},
                                  "script": {"type": "string"},
                                  "description": {"type": "string"},
                                  "keywords": {"type": "string"},
                                  "hashtags": {"type": "string"}
                              },
                              "required": [
                                  "title",
                                  "script",
                                  "description",
                                  "keywords",
                                  "hashtags"
                              ],
                              "additionalProperties": False
                          }
                      }
                  }
              }

              data = json.dumps(payload).encode("utf-8")

              req = urllib.request.Request(
                  ENDPOINT,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {API_KEY}",
                      "User-Agent": "QuietVaultAI/1.0"
                  },
                  method="POST"
              )

              for attempt in range(5):

                  try:
                      with urllib.request.urlopen(req, timeout=90) as response:
                          raw = response.read().decode("utf-8")

                      result = json.loads(raw)
                      content = result["choices"][0]["message"]["content"]

                      if not content:
                          raise RuntimeError("Groq returned empty content")

                      return json.loads(content)

                  except urllib.error.HTTPError as e:

                      body = e.read().decode("utf-8", errors="ignore")

                      if e.code == 429:

                          retry = e.headers.get("retry-after")

                          try:
                              wait = max(65, float(retry or 65))
                          except:
                              wait = 65

                          print(f"RATE LIMITED. Waiting {wait:.1f}s...")
                          time.sleep(wait)
                          continue

                      print("GROQ HTTP ERROR:", e.code)
                      print(body)
                      raise

                  except Exception as e:

                      if attempt < 4:
                          print("Groq request failed:", repr(e))
                          time.sleep(5)
                          continue

                      raise

          # ============================================================
          # NATURALIZATION PROMPT
          # ============================================================

          def make_prompt(m):

              return f"""
          Write ONE realistic 9–12 second horror Short for The Quiet Vault.

          You are NOT inventing the horror idea.

          The visual situation, evidence, fact, contradiction and final line
          are already fixed below.

          Your only job is to turn them into extremely natural, concise
          spoken dialogue.

          ============================================================
          FIXED STORY
          ============================================================

          MECHANISM:
          {m['name']}

          LOCATION:
          {m['location']}

          FRAME 1:
          {m['frame1']}

          VISIBLE EVIDENCE:
          {m['evidence']}

          ESTABLISHED FACT:
          {m['fact']}

          CONTRADICTION:
          {m['contradiction']}

          ACTION:
          {m['action']}

          REQUIRED FINAL LINE:
          {m['final_line']}

          ============================================================
          WRITING RULES
          ============================================================

          1. Start immediately inside the disturbing situation.

          2. Do NOT use:
          "I never expected..."
          "It was a normal night..."
          "One night..."
          "I couldn't believe..."
          "That's when..."
          or any generic setup.

          3. Maximum 50 spoken words.

          4. Prefer 3–5 short lines.

          5. The first line should identify what the protagonist sees.

          6. The viewer should understand the disturbing visual BEFORE
             the final reveal.

          7. Establish the necessary fact naturally and quickly.

          8. The final line MUST introduce the contradiction.

          9. Do not explain the contradiction after the final line.

          10. End immediately on the final line.

          11. The final line must be specific.

          12. Never use vague endings such as:
          "You'll find out."
          "You will understand."
          "Someone told me."
          "It's complicated."
          "He knows."
          "She knows."
          "You'll see."

          13. Do not add another twist.

          14. Do not introduce supernatural creatures.

          15. Fictional adults only.

          16. No children, teenagers or minors.

          17. No mirrors or reflections.

          18. No twins, doppelgängers or clones.

          19. No ghosts, demons, monsters or zombies.

          20. No gore, blood or corpses.

          21. No CCTV, surveillance or phone-screen horror.

          22. No celebrity or real-person likeness.

          ============================================================
          IMPORTANT
          ============================================================

          The final line must make the viewer rethink what they saw
          in FRAME 1.

          Return JSON only.
          """

          # ============================================================
          # VALIDATION
          # ============================================================

          BANNED = [
              "child",
              "children",
              "kid",
              "kids",
              "teenager",
              "teen",
              "minor",
              "mirror",
              "reflection",
              "doppelganger",
              "doppelgänger",
              "twin",
              "clone",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "cctv",
              "surveillance",
              "video call",
              "phone screen",
              "blood",
              "gore",
              "corpse",
              "celebrity"
          ]

          WEAK = [
              "you'll understand",
              "you will understand",
              "someone told me",
              "it's complicated",
              "he knows",
              "she knows",
              "you'll see",
              "you will see"
          ]

          def validate(short):

              for field in [
                  "title",
                  "script",
                  "description",
                  "keywords",
                  "hashtags"
              ]:
                  if not short.get(field):
                      return False, f"missing {field}"

              script = short["script"].strip()
              words = script.split()

              if len(words) < 15:
                  return False, "too short"

              if len(words) > 55:
                  return False, "too long"

              low = script.lower()

              for item in BANNED:
                  if item in low:
                      return False, f"banned: {item}"

              for item in WEAK:
                  if item in low[-100:]:
                      return False, f"weak ending: {item}"

              return True, "ok"

          # ============================================================
          # FLOW PROMPT
          # ============================================================

          def build_flow(m, script):

              return f"""
          Create a 9–12 second vertical 9:16 photorealistic live-action
          psychological horror short.

          FICTIONAL ADULT ACTORS ONLY.

          No children, teenagers, minors, celebrities or resemblance
          to real people.

          LOCATION:
          {m['location']}

          ============================================================
          FIRST FRAME — MOST IMPORTANT
          ============================================================

          {m['frame1']}

          This must already be visible in the FIRST FRAME.

          Do NOT begin with an empty room.
          Do NOT begin with walking toward the room.
          Do NOT spend the first seconds establishing the location.

          The viewer must immediately see the disturbing situation.

          ============================================================
          VISIBLE EVIDENCE
          ============================================================

          {m['evidence']}

          Keep this evidence clearly visible in the same shot whenever
          physically possible.

          Do not replace it with a character reaction.

          ============================================================
          ACTION
          ============================================================

          {m['action']}

          The unfamiliar adult remains calm and completely matter-of-fact.

          The protagonist reacts with restrained, realistic fear.

          No exaggerated screaming.

          ============================================================
          DIALOGUE
          ============================================================

          Use exactly this dialogue:

          {script}

          ============================================================
          ENDING
          ============================================================

          The final line is the contradiction.

          HARD CUT immediately after the final line.

          NO fade to black.

          Do not add another line.

          Do not add another twist.

          ============================================================
          CAMERA
          ============================================================

          Medium-wide cinematic composition.

          Keep protagonist, unfamiliar adult and key evidence visible.

          Minimal natural camera movement.

          Realistic handheld live-action feel.

          ============================================================
          STYLE
          ============================================================

          Photorealistic live action.

          Realistic adult humans.

          Natural lighting.

          Realistic skin texture.

          Natural body movement.

          Grounded psychological horror.

          No fantasy aesthetic.

          ============================================================
          STRICTLY DO NOT INCLUDE
          ============================================================

          children,
          teenagers,
          minors,
          mirrors,
          reflections,
          twins,
          doppelgängers,
          clones,
          ghosts,
          demons,
          monsters,
          zombies,
          gore,
          blood,
          corpses,
          CCTV,
          surveillance footage,
          phone screens,
          video calls,
          magical effects,
          extra characters,
          subtitles,
          text overlays,
          extra dialogue,
          exaggerated acting,
          face distortion,
          body distortion.

          Do not change the evidence.

          Do not change the action.

          Do not change the final contradiction.

          Do not make the unfamiliar adult supernatural.

          HARD CUT.
          """

          # ============================================================
          # ROTATION
          # ============================================================

          start = ((RUN_NUMBER - 1) * 3) % len(MECHANISMS)

          ordered = []

          for i in range(len(MECHANISMS)):
              ordered.append(
                  MECHANISMS[(start + i) % len(MECHANISMS)]
              )

          # ============================================================
          # RUN
          # ============================================================

          approved = []

          print("============================================================")
          print("QUIET VAULT V14 CONTRADICTION HORROR ENGINE")
          print("============================================================")
          print(f"RUN: {RUN_NUMBER}")
          print(f"MODEL: {MODEL}")
          print("TARGET: 3 Shorts")
          print("")

          for mechanism in ordered:

              if len(approved) >= 3:
                  break

              print("------------------------------------------------------------")
              print("MECHANISM:", mechanism["name"])
              print("TITLE:", mechanism["title"])
              print("GENERATING...")
              print("")

              try:

                  short = call_groq(
                      make_prompt(mechanism),
                      650
                  )

                  ok, reason = validate(short)

                  if not ok:
                      print("REJECTED:", reason)
                      continue

                  title = short.get("title", "").strip()

                  # Prevent another "The Quiet Vault" title.
                  if (
                      not title
                      or title.lower() == "the quiet vault"
                      or len(title.split()) < 3
                  ):
                      title = mechanism["title"]

                  package = {
                      "slot": len(approved) + 1,
                      "mechanism": mechanism["name"],
                      "title": title,
                      "short_script": short["script"].strip(),
                      "visual_hook": mechanism["frame1"],
                      "visible_evidence": mechanism["evidence"],
                      "fixed_fact": mechanism["fact"],
                      "flow_prompt": build_flow(
                          mechanism,
                          short["script"].strip()
                      ),
                      "final_twist": mechanism["contradiction"],
                      "description": short["description"].strip(),
                      "keywords": short["keywords"].strip(),
                      "hashtags": short["hashtags"].strip(),
                      "thumbnail_frame": (
                          "Use approximately 0.5–1.5 seconds. "
                          "Choose the strongest frame where the "
                          "unfamiliar adult, protagonist and disturbing "
                          "evidence are clearly visible together."
                      ),
                      "thumbnail_text": "",
                      "sound_design": (
                          "Natural room tone, realistic footsteps and "
                          "object sounds, restrained tension bed, clear "
                          "adult dialogue. Hard cut immediately after "
                          "the final line."
                      ),
                      "pinned_comment": "What would you do if you saw this?"
                  }

                  approved.append(package)

                  print("APPROVED:", title)
                  print("")

              except Exception as e:

                  print("FAILED:", repr(e))
                  print("Moving to next mechanism...")
                  print("")

          # ============================================================
          # SAVE
          # ============================================================

          batch = {
              "run": RUN_NUMBER,
              "provider": "groq",
              "model": MODEL,
              "engine": "V14 Contradiction Horror Engine",
              "generated": len(ordered),
              "approved": len(approved),
              "shorts": approved
          }

          (OUT / "batch.json").write_text(
              json.dumps(batch, indent=2),
              encoding="utf-8"
          )

          for i, short in enumerate(approved, 1):

              content = f"""# {short['title']}

          ## Mechanism

          {short['mechanism']}

          ## Script

          {short['short_script']}

          ## Visual Hook

          {short['visual_hook']}

          ## Visible Evidence

          {short['visible_evidence']}

          ## Fixed Fact

          {short['fixed_fact']}

          ## Google Flow Prompt

          ```text
          {short['flow_prompt']}
          ```

          ## Final Twist

          {short['final_twist']}

          ## Description

          ```text
          {short['description']}
          ```

          ## Keywords

          ```text
          {short['keywords']}
          ```

          ## Hashtags

          ```text
          {short['hashtags']}
          ```

          ## Thumbnail

          {short['thumbnail_frame']}

          Thumbnail text:
          {short['thumbnail_text']}

          ## Sound Design

          {short['sound_design']}

          ## Pinned Comment

          {short['pinned_comment']}
          """

              (OUT / f"short_{i:02d}.md").write_text(
                  content,
                  encoding="utf-8"
              )

          print("============================================================")
          print("V14 COMPLETE")
          print("GENERATED:", len(ordered))
          print("APPROVED:", len(approved))
          print("============================================================")

          if len(approved) < 3:
              raise RuntimeError(
                  f"Only {len(approved)} Shorts approved. "
                  "No weak filler was added."
              )

          PY

      - name: Upload V14 Shorts
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-v14-shorts
          path: quiet-vault-output/
