name: Generate Quiet Vault Shorts

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RUN_NUMBER: ${{ github.run_number }}

    steps:
      - name: Generate Quiet Vault Shorts
        shell: bash
        run: |
          cat > generate.py <<'PY'
          import os
          import json
          import time
          import re
          import urllib.request
          import urllib.error
          from pathlib import Path

          API_KEY = os.environ["GROQ_API_KEY"]
          RUN_NUMBER = int(os.environ.get("RUN_NUMBER", "1"))

          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          OUTPUT_DIR = Path("quiet-vault-output")
          OUTPUT_DIR.mkdir(exist_ok=True)

          # ============================================================
          # QUIET VAULT CREATIVE DNA
          # ============================================================

          CHANNEL_DNA = """
          CHANNEL: The Quiet Vault
          FORMAT: 9-12 second realistic cinematic horror Shorts.
          AUDIENCE: Adults, mainly 25-44.
          
          WINNING CHARACTERISTICS:
          - The scary thing is visible immediately.
          - A recognizable real location.
          - Prefer two adult characters with a relationship or clear social context.
          - One simple impossible fact.
          - The viewer understands the situation without needing lore.
          - The ending creates a second thought or contradiction.
          - Realistic human behavior.
          - No monsters required.
          - The visual should work as a screenshot before dialogue is understood.
          
          AVOID:
          - slow establishing shots
          - vague atmosphere
          - empty rooms as the main scare
          - unexplained objects
          - complicated mythology
          - long exposition
          - dream explanations
          - generic paranormal activity
          - twists that depend on reading tiny text
          """

          # ============================================================
          # FIXED VISUAL MECHANISMS
          #
          # Python selects the mechanism.
          # Groq is NOT asked to invent the mechanism.
          # ============================================================

          SEEDS = [
              {
                  "name": "THE DINNER GUEST",
                  "visual": "Two fictional adult people are already sitting at a normal dinner table. A third unfamiliar adult is physically present in the empty place setting.",
                  "mechanism": "An adult stranger is physically inside a private dinner and claims someone at the table invited them.",
                  "must_have": "The stranger must be clearly visible in frame 1 and the relationship contradiction must be immediately understandable."
              },
              {
                  "name": "STRANGER ON THE BED",
                  "visual": "An unfamiliar adult man or woman is visibly sitting on the protagonist's bed inside a normal bedroom.",
                  "mechanism": "The stranger possesses specific knowledge or an object that only someone intimately connected to the protagonist should have.",
                  "must_have": "The stranger must be visible immediately. The final line must create a concrete contradiction."
              },
              {
                  "name": "LOCKED OFFICE INTRUDER",
                  "visual": "An adult office worker stands at a locked office doorway while another unfamiliar adult is visibly inside the locked room.",
                  "mechanism": "The stranger claims the protagonist personally let them into a room that was locked.",
                  "must_have": "The intruder must be visibly present from the beginning. No security camera or surveillance footage."
              },
              {
                  "name": "THE NEIGHBOR'S KEY",
                  "visual": "An unfamiliar adult stands inside the protagonist's apartment holding a normal house key.",
                  "mechanism": "The stranger has a key that should not exist and gives a disturbing reason for having it.",
                  "must_have": "The stranger and key must be visible immediately. The explanation must be one short contradiction."
              },
              {
                  "name": "THE DELIVERY",
                  "visual": "An adult delivery worker stands at an apartment doorway holding a package addressed to someone who is physically present inside.",
                  "mechanism": "The delivery worker reveals information about the recipient that they could not normally know.",
                  "must_have": "The delivery worker and package must be visible immediately. The twist must not depend on package writing being readable."
              },
              {
                  "name": "THE BATHROOM VISITOR",
                  "visual": "An adult protagonist enters a normal bathroom and an unfamiliar adult is visibly standing inside near the sink.",
                  "mechanism": "The stranger calmly behaves as though they belong there and knows a private fact about the protagonist.",
                  "must_have": "The stranger is visible immediately. No mirrors or reflections."
              },
              {
                  "name": "THE DEAD HUSBAND'S WATCH",
                  "visual": "An adult woman sees an unfamiliar adult man holding a distinctive wristwatch associated with her deceased husband.",
                  "mechanism": "The stranger says the deceased husband personally gave him the watch recently.",
                  "must_have": "The watch and stranger must be visually clear. The contradiction must be explicit."
              },
              {
                  "name": "THE PRIVATE NICKNAME",
                  "visual": "An unfamiliar adult is physically inside a normal home speaking casually to the protagonist.",
                  "mechanism": "The stranger uses an intimate nickname that only one specific adult partner or family member uses.",
                  "must_have": "The stranger must be visible. The nickname cannot be the only scare; pair it with a physical contradiction."
              },
              {
                  "name": "THE FAMILY PHOTOGRAPH",
                  "visual": "Two fictional adults look at a normal printed family photograph while an unfamiliar adult is visibly standing beside them.",
                  "mechanism": "The stranger points to themselves in the photograph even though the protagonist has never met them.",
                  "must_have": "The stranger must be physically visible in the opening frame. Do not use reflections, mirrors, or disappearing people."
              },
              {
                  "name": "THE LOCKED BEDROOM",
                  "visual": "An adult protagonist stands at the doorway of a bedroom that was locked, while an unfamiliar adult is visibly inside.",
                  "mechanism": "The stranger claims the protagonist opened the door for them moments earlier.",
                  "must_have": "The stranger must be visible immediately. No supernatural transformation."
              },
              {
                  "name": "THE BROKEN GLASS",
                  "visual": "An adult protagonist stands in a kitchen beside recently broken glass while another unfamiliar adult is already inside.",
                  "mechanism": "The stranger knows exactly what the protagonist was about to say or do before it happened.",
                  "must_have": "The stranger must be visible. The broken glass is supporting evidence, not the entire horror."
              },
              {
                  "name": "THE PRIVATE BEDROOM ROUTINE",
                  "visual": "An adult enters their bedroom and finds an unfamiliar adult calmly performing a highly personal household routine.",
                  "mechanism": "The stranger behaves as if they have lived in the home for years and knows a private routine.",
                  "must_have": "The stranger must be visible immediately. There must be a concrete relationship contradiction."
              }
          ]

          # ============================================================
          # BANNED TERMS
          #
          # IMPORTANT:
          # These are checked ONLY against:
          # title + script + visual_hook + ending.
          #
          # We intentionally DO NOT scan flow_prompt or metadata.
          # ============================================================

          BANNED_TERMS = [
              "child",
              "children",
              "kid",
              "kids",
              "baby",
              "infant",
              "toddler",
              "boy",
              "girl",
              "teen",
              "teenager",
              "minor",
              "schoolchild",
              "school kid",
              "schoolgirl",
              "schoolboy",
              "mirror",
              "reflection",
              "doppelganger",
              "doppelgänger",
              "twin",
              "cctv",
              "surveillance",
              "security camera",
              "elevator",
              "hotel",
              "train",
              "printer",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "gore",
              "blood",
              "corpse",
              "decapitated",
              "disembodied",
              "face distorted",
              "face distortion",
              "body transformation",
              "video call",
              "facetime",
              "zoom call",
              "phone screen",
              "disappear",
              "disappeared",
              "disappears",
              "vanish",
              "vanished",
              "shadow figure",
              "silhouette"
          ]

          # ============================================================
          # GROQ REQUEST
          # ============================================================

          def groq_call(messages, max_tokens=900, temperature=0.55, retries=4):

              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden",
                  "response_format": {
                      "type": "json_object"
                  }
              }

              body = json.dumps(payload).encode("utf-8")

              for attempt in range(retries):
                  request = urllib.request.Request(
                      ENDPOINT,
                      data=body,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/2.0"
                      }
                  )

                  try:
                      with urllib.request.urlopen(request, timeout=120) as response:
                          raw = response.read().decode("utf-8")
                          data = json.loads(raw)
                          content = data["choices"][0]["message"]["content"]

                          try:
                              return json.loads(content)
                          except json.JSONDecodeError:
                              # Try extracting the outermost JSON object.
                              match = re.search(r"\{.*\}", content, re.S)
                              if match:
                                  return json.loads(match.group(0))
                              raise

                  except urllib.error.HTTPError as e:
                      raw = e.read().decode("utf-8", errors="replace")

                      if e.code == 429:
                          wait_seconds = 12

                          try:
                              error_data = json.loads(raw)
                              message = error_data.get("error", {}).get("message", "")
                              match = re.search(
                                  r"try again in ([0-9.]+)s",
                                  message,
                                  re.I
                              )
                              if match:
                                  wait_seconds = max(
                                      12,
                                      min(75, float(match.group(1)) + 2)
                                  )
                          except Exception:
                              pass

                          print(f"RATE LIMITED. Waiting {wait_seconds:.1f}s...")
                          time.sleep(wait_seconds)
                          continue

                      print(f"GROQ HTTP ERROR: {e.code}")
                      print(raw[:3000])

                      if attempt < retries - 1:
                          time.sleep(5)
                          continue

                      raise

                  except Exception as e:
                      print(f"GROQ REQUEST ERROR: {e}")

                      if attempt < retries - 1:
                          time.sleep(5)
                          continue

                      raise

              raise RuntimeError("Groq request failed after retries.")

          # ============================================================
          # GENERATE ONE STORY
          # ============================================================

          def generate_story(seed, previous=None, repair_reason=None):

              repair_instruction = ""

              if previous and repair_reason:
                  repair_instruction = f"""
          THIS IS A REPAIR OF AN EXISTING STORY.

          ORIGINAL STORY:
          {json.dumps(previous, ensure_ascii=False)}

          JUDGE FEEDBACK:
          {repair_reason}

          Keep the same basic visual mechanism, but repair the exact weakness.
          Do not replace it with a different mechanism.
          """

              prompt = f"""
          Write ONE 9-12 second horror Short for The Quiet Vault.

          {CHANNEL_DNA}

          FIXED VISUAL SEED:
          {seed["name"]}

          VISUAL SETUP:
          {seed["visual"]}

          HORROR MECHANISM:
          {seed["mechanism"]}

          REQUIRED:
          {seed["must_have"]}

          {repair_instruction}

          HARD CREATIVE RULES:
          - All characters are fictional adults.
          - The threat/person must be physically visible in the first frame.
          - No slow setup.
          - No explanation longer than one short sentence.
          - No mythology.
          - No dream.
          - No mirror or reflection.
          - No child/minor.
          - No monster, ghost, demon, zombie or creature.
          - No CCTV or surveillance.
          - No phone/video-call horror.
          - No disappearing/reappearing person.
          - No body or face transformation.
          - No gore or blood.
          - No celebrity or real-person likeness.
          - The ending must be a concrete contradiction, not just "that's when I realized..."
          - The story must make sense even if watched without sound.

          OUTPUT VALID JSON ONLY:

          {{
            "title": "short title",
            "short_script": "complete spoken script, maximum about 45 words",
            "visual_hook": "what is visibly scary in frame 1",
            "ending": "the exact final visual/dialogue beat",
            "flow_prompt": "Google Flow prompt for the complete 9-12 second video"
          }}

          FLOW PROMPT REQUIREMENTS:
          - vertical 9:16
          - photorealistic live-action
          - fictional adults only
          - no celebrity or real-person likeness
          - clearly visible threat in first frame
          - consistent characters
          - realistic lighting and movement
          - specify the action in simple chronological beats
          - no mirror/reflection
          - no children
          - no gore
          - no monsters
          """

              return groq_call(
                  [
                      {
                          "role": "system",
                          "content": "Return only valid JSON. Be concise and concrete."
                      },
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  max_tokens=950,
                  temperature=0.55
              )

          # ============================================================
          # HARD VALIDATION
          # ============================================================

          def hard_validate(short):

              required = [
                  "title",
                  "short_script",
                  "visual_hook",
                  "ending",
                  "flow_prompt"
              ]

              for field in required:
                  if not isinstance(short.get(field), str):
                      return False, f"Missing field: {field}"

              # ONLY STORY/CREATIVE FIELDS ARE SCANNED.
              #
              # This is the important fix.
              #
              # flow_prompt is NOT included because it naturally contains
              # production instructions such as "no children".
              creative_text = " ".join([
                  short["title"],
                  short["short_script"],
                  short["visual_hook"],
                  short["ending"]
              ]).lower()

              for banned in BANNED_TERMS:
                  if banned.lower() in creative_text:
                      return False, f"Banned creative term: {banned}"

              words = short["short_script"].split()

              if len(words) > 55:
                  return False, "Script is too long."

              if len(short["short_script"].strip()) < 20:
                  return False, "Script is too short."

              return True, "PASS"

          # ============================================================
          # AI CREATIVE JUDGE
          # ============================================================

          def judge_story(short, seed):

              prompt = f"""
          Judge this proposed 9-12 second horror Short for The Quiet Vault.

          CHANNEL DNA:
          {CHANNEL_DNA}

          FIXED SEED:
          {seed["name"]}

          PROPOSAL:
          {json.dumps(short, ensure_ascii=False)}

          Score each from 0-10:

          hook:
          Is the scary/impossible visual obvious in frame 1?

          visible_horror:
          Is an actual human threat or disturbing person visibly present?

          clarity:
          Can the viewer understand the premise immediately?

          ending:
          Does the final beat create a strong concrete contradiction?

          flow:
          Could Google Flow realistically generate this without confusing action?

          rewatch:
          Does the ending make the viewer want to replay the opening?

          originality:
          Does this avoid feeling like a generic AI horror template?

          PASS RULE:
          hook >= 8
          visible_horror >= 8
          clarity >= 8
          ending >= 8
          flow >= 8
          rewatch >= 7
          originality >= 7

          Return JSON only:

          {{
            "hook": 0,
            "visible_horror": 0,
            "clarity": 0,
            "ending": 0,
            "flow": 0,
            "rewatch": 0,
            "originality": 0,
            "pass": false,
            "reason": "one concise explanation of the main weakness"
          }}
          """

              return groq_call(
                  [
                      {
                          "role": "system",
                          "content": "Return only valid JSON."
                      },
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  max_tokens=450,
                  temperature=0.2
              )

          # ============================================================
          # FINAL METADATA
          # Only called AFTER a Short passes.
          # ============================================================

          def create_metadata(short):

              prompt = f"""
          Create the publishing metadata for this approved Quiet Vault horror Short.

          SHORT:
          {json.dumps(short, ensure_ascii=False)}

          Return JSON only:

          {{
            "description": "2-3 natural sentences describing the horror premise. Do not reveal the twist.",
            "keywords": "comma-separated YouTube keywords",
            "hashtags": "#Horror #HorrorShorts plus 3-5 relevant hashtags",
            "thumbnail_frame": "exact visual frame/time recommendation",
            "thumbnail_text": "2-5 word thumbnail text, or empty string if unnecessary",
            "sound_design": "brief sound design recommendation",
            "pinned_comment": "short comment designed to encourage viewers to respond"
          }}

          Keep everything concise.
          """

              return groq_call(
                  [
                      {
                          "role": "system",
                          "content": "Return only valid JSON."
                      },
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  max_tokens=600,
                  temperature=0.35
              )

          # ============================================================
          # RUN
          # ============================================================

          print()
          print("=" * 60)
          print("QUIET VAULT DETERMINISTIC ENGINE V2")
          print("=" * 60)
          print(f"GitHub run: {RUN_NUMBER}")

          # Rotate through the seed library.
          start_index = ((RUN_NUMBER - 1) * 3) % len(SEEDS)

          ordered_seeds = (
              SEEDS[start_index:] +
              SEEDS[:start_index]
          )

          print(f"Starting seed: {ordered_seeds[0]['name']}")

          approved = []

          # We need 3 approved Shorts.
          # Each seed gets at most:
          # 1 generation + 1 repair + 1 judge per attempt.
          #
          # We deliberately do NOT generate metadata until approval.

          for seed in ordered_seeds:

              if len(approved) >= 3:
                  break

              print()
              print("=" * 60)
              print(f"TRYING SEED: {seed['name']}")
              print("=" * 60)

              previous = None
              repair_reason = None

              for attempt in range(1, 3):

                  print(f"Generation attempt {attempt}")

                  try:
                      short = generate_story(
                          seed,
                          previous=previous,
                          repair_reason=repair_reason
                      )
                  except Exception as e:
                      print(f"Generation failed: {e}")
                      break

                  valid, reason = hard_validate(short)

                  if not valid:
                      print(f"REJECTED BY HARD FILTER: {reason}")

                      previous = short
                      repair_reason = reason

                      if attempt == 1:
                          print("Will repair the same story.")
                          time.sleep(3)
                          continue

                      print("Seed discarded.")
                      break

                  print("Hard filter: PASS")

                  try:
                      judge = judge_story(short, seed)
                  except Exception as e:
                      print(f"Judge failed: {e}")
                      break

                  print(
                      "JUDGE:",
                      f"hook={judge.get('hook')}",
                      f"visible={judge.get('visible_horror')}",
                      f"clarity={judge.get('clarity')}",
                      f"ending={judge.get('ending')}",
                      f"flow={judge.get('flow')}",
                      f"rewatch={judge.get('rewatch')}",
                      f"originality={judge.get('originality')}",
                      f"pass={judge.get('pass')}"
                  )

                  if judge.get("pass") is True:
                      print("APPROVED.")

                      approved.append({
                          "seed": seed["name"],
                          "short": short,
                          "judge": judge
                      })

                      break

                  repair_reason = judge.get(
                      "reason",
                      "The concept did not meet the required quality threshold."
                  )

                  previous = short

                  if attempt == 1:
                      print("CREATIVE GATE FAILED.")
                      print("Repairing the same story...")
                      time.sleep(3)
                      continue

                  print("Creative gate failed twice. Seed discarded.")

              # Small gap between seeds to reduce TPM spikes.
              time.sleep(3)

          # ============================================================
          # FINAL RESULT
          # ============================================================

          print()
          print("=" * 60)
          print("CREATIVE SELECTION COMPLETE")
          print("=" * 60)
          print(f"Approved Shorts: {len(approved)}")

          if len(approved) < 3:
              raise RuntimeError(
                  f"Only {len(approved)} Shorts passed. "
                  "No weak filler was created."
              )

          # ============================================================
          # METADATA FOR APPROVED SHORTS ONLY
          # ============================================================

          final_shorts = []

          for index, item in enumerate(approved[:3], start=1):

              print()
              print(f"Creating metadata for Short {index}...")

              short = item["short"]

              try:
                  metadata = create_metadata(short)
              except Exception as e:
                  print(f"Metadata generation failed: {e}")
                  metadata = {
                      "description": "",
                      "keywords": "horror, horror shorts, scary stories, scary shorts, psychological horror, realistic horror, The Quiet Vault",
                      "hashtags": "#Horror #HorrorShorts #ScaryStories #PsychologicalHorror #TheQuietVault",
                      "thumbnail_frame": "Use the opening frame showing the visible threat.",
                      "thumbnail_text": "",
                      "sound_design": "Low room tone followed by a sharp final impact.",
                      "pinned_comment": "Did you notice the detail in the first frame?"
                  }

              final_item = {
                  "title": short["title"],
                  "short_script": short["short_script"],
                  "visual_hook": short["visual_hook"],
                  "flow_prompt": short["flow_prompt"],
                  "final_twist": short["ending"],
                  "description": metadata.get("description", ""),
                  "keywords": metadata.get("keywords", ""),
                  "hashtags": metadata.get("hashtags", ""),
                  "thumbnail_frame": metadata.get("thumbnail_frame", ""),
                  "thumbnail_text": metadata.get("thumbnail_text", ""),
                  "sound_design": metadata.get("sound_design", ""),
                  "pinned_comment": metadata.get("pinned_comment", ""),
                  "judge": item["judge"],
                  "seed": item["seed"]
              }

              final_shorts.append(final_item)

              # Small pause between metadata calls.
              time.sleep(3)

          # ============================================================
          # SAVE OUTPUT
          # ============================================================

          output = {
              "run_number": RUN_NUMBER,
              "approved_count": len(final_shorts),
              "shorts": final_shorts
          }

          with open(
              OUTPUT_DIR / "batch.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          for index, short in enumerate(final_shorts, start=1):

              md = f"""# {short['title']}

          ## Script

          {short['short_script']}

          ## Visual Hook

          {short['visual_hook']}

          ## Google Flow Prompt

          {short['flow_prompt']}

          ## Final Twist

          {short['final_twist']}

          ## Description

          {short['description']}

          ## Keywords

          {short['keywords']}

          ## Hashtags

          {short['hashtags']}

          ## Thumbnail

          {short['thumbnail_frame']}

          **Thumbnail text:** {short['thumbnail_text']}

          ## Sound Design

          {short['sound_design']}

          ## Pinned Comment

          {short['pinned_comment']}

          ## Judge

          {json.dumps(short['judge'], indent=2)}
          """

              with open(
                  OUTPUT_DIR / f"short_{index:02d}.md",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(md)

          print()
          print("=" * 60)
          print("FINAL RESULT")
          print("=" * 60)
          print(f"Approved Shorts: {len(final_shorts)}")

          for index, short in enumerate(final_shorts, start=1):
              print()
              print(f"{index}. {short['title']}")
              print(f"   Seed: {short['seed']}")
              print(f"   Hook: {short['judge']['hook']}/10")
              print(f"   Visible horror: {short['judge']['visible_horror']}/10")
              print(f"   Ending: {short['judge']['ending']}/10")
              print(f"   Rewatch: {short['judge']['rewatch']}/10")

          print()
          print("OUTPUT READY.")
          PY

          python generate.py

      - name: Upload Shorts Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts
          path: quiet-vault-output/
          retention-days: 14
