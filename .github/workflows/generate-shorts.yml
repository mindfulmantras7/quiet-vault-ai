name: Quiet Vault AI - V10 Action Horror Engine

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate 3 action-based horror shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import re
          import urllib.request
          import urllib.error
          from pathlib import Path

          KEY = os.environ["GROQ_API_KEY"]
          RUN = int(os.environ.get("RUN_NUMBER", "1"))

          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          OUT = Path("quiet-vault-output")
          OUT.mkdir(exist_ok=True)

          # ============================================================
          # V10 ACTION-BASED HORROR MECHANISMS
          #
          # The horror comes from WHAT the stranger is visibly DOING.
          # Groq writes the story, but DOES NOT invent the mechanism.
          # ============================================================

          MECHANISMS = [

              {
                  "id": "private_routine",
                  "name": "STRANGER PERFORMING A PRIVATE ROUTINE",
                  "location": "realistic apartment kitchen at night",
                  "visual": (
                      "An adult woman enters her kitchen and sees an unfamiliar "
                      "adult man calmly performing her husband's very specific "
                      "morning coffee routine exactly as he used to: same mug, "
                      "same coffee jar, same measured spoonful. The man is visibly "
                      "doing the routine in the first frame."
                  ),
                  "ending": (
                      "The stranger says the husband showed him how to make it yesterday."
                  )
              },

              {
                  "id": "keys_in_bowl",
                  "name": "STRANGER PUTTING KEYS IN THE PRIVATE KEY BOWL",
                  "location": "realistic apartment entryway at night",
                  "visual": (
                      "An adult man opens his apartment door and sees an unfamiliar "
                      "adult woman calmly placing his house keys into the exact small "
                      "bowl where he always leaves them. She is visibly doing this "
                      "in the first frame."
                  ),
                  "ending": (
                      "She says he showed her where they belong yesterday."
                  )
              },

              {
                  "id": "dead_watch",
                  "name": "STRANGER WINDING THE DEAD HUSBAND'S WATCH",
                  "location": "realistic apartment bedroom at night",
                  "visual": (
                      "An adult woman enters her bedroom and sees an unfamiliar adult "
                      "man calmly winding her late husband's distinctive mechanical "
                      "wristwatch beside the bed. The watch is clearly visible in his "
                      "hands and he is actively winding it in the first frame."
                  ),
                  "ending": (
                      "He says her husband asked him to keep it running."
                  )
              },

              {
                  "id": "bed_made_wrong",
                  "name": "STRANGER MAKING THE BED WITH A PRIVATE ROUTINE",
                  "location": "realistic apartment bedroom",
                  "visual": (
                      "An adult man enters his bedroom and sees an unfamiliar adult "
                      "woman calmly making the bed using the exact unusual arrangement "
                      "his late wife always used, including the same folded blanket "
                      "and pillow position. She is visibly making the bed in the "
                      "first frame."
                  ),
                  "ending": (
                      "She says his wife corrected her yesterday."
                  )
              },

              {
                  "id": "private_notebook",
                  "name": "STRANGER WRITING IN THE PRIVATE NOTEBOOK",
                  "location": "realistic home office",
                  "visual": (
                      "An adult woman unlocks her home office and sees an unfamiliar "
                      "adult man calmly writing in her private notebook at her desk. "
                      "His hand is visibly writing in the notebook in the first frame."
                  ),
                  "ending": (
                      "He says she told him exactly what to write."
                  )
              },

              {
                  "id": "photo_position",
                  "name": "STRANGER RECREATING A FAMILY PHOTOGRAPH",
                  "location": "realistic apartment living room",
                  "visual": (
                      "An adult man enters his living room and sees an unfamiliar "
                      "adult woman standing in exactly the same pose and position as "
                      "a person in a framed family photograph on the wall. Both the "
                      "woman and the photograph are visible together in the first frame."
                  ),
                  "ending": (
                      "She says the person in the photograph told her to stand there."
                  )
              },

              {
                  "id": "drawer_routine",
                  "name": "STRANGER RETURNING A PRIVATE OBJECT TO ITS EXACT DRAWER",
                  "location": "realistic apartment bedroom",
                  "visual": (
                      "An adult woman enters her bedroom and sees an unfamiliar adult "
                      "man calmly opening her private bedside drawer and placing a "
                      "small sentimental object into the exact compartment where she "
                      "keeps it. His hand, the drawer, and the object are visible in "
                      "the first frame."
                  ),
                  "ending": (
                      "He says he was putting it back where she told him it belonged."
                  )
              },

              {
                  "id": "dinner_preparation",
                  "name": "STRANGER PREPARING THE ABSENT PERSON'S MEAL",
                  "location": "realistic apartment kitchen",
                  "visual": (
                      "An adult man enters his kitchen and sees an unfamiliar adult "
                      "woman calmly preparing a meal using a distinctive recipe card "
                      "and ingredients arranged exactly as his late wife used to "
                      "prepare them. She is actively preparing the food in the first frame."
                  ),
                  "ending": (
                      "She says his wife was standing beside her when she learned it."
                  )
              },

              {
                  "id": "lamp_routine",
                  "name": "STRANGER PERFORMING THE PRIVATE BEDTIME ROUTINE",
                  "location": "realistic apartment bedroom at night",
                  "visual": (
                      "An adult woman enters her bedroom and sees an unfamiliar adult "
                      "man calmly switching the bedside lamp on and off in the exact "
                      "unusual sequence her late husband always used before sleeping. "
                      "He is visibly performing the sequence in the first frame."
                  ),
                  "ending": (
                      "He says her husband told him she would notice."
                  )
              },

              {
                  "id": "chair_preparation",
                  "name": "STRANGER PREPARING THE ABSENT PERSON'S PLACE",
                  "location": "realistic apartment dining room",
                  "visual": (
                      "An adult man enters his dining room and sees an unfamiliar adult "
                      "woman calmly setting a place at the table exactly as his late "
                      "wife's place was always arranged, including her distinctive "
                      "glass and folded napkin. She is visibly arranging the place "
                      "setting in the first frame."
                  ),
                  "ending": (
                      "She says his wife asked her to keep the place ready."
                  )
              }
          ]

          # ============================================================
          # HARD BANS
          # ============================================================

          BANNED = [
              "child",
              "children",
              "kid",
              "baby",
              "boy",
              "girl",
              "teen",
              "teenager",
              "minor",
              "mirror",
              "reflection",
              "reflect",
              "doppelganger",
              "double",
              "twin",
              "clone",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "gore",
              "blood",
              "corpse",
              "cctv",
              "surveillance",
              "security camera",
              "elevator",
              "hotel",
              "train",
              "printer",
              "video call",
              "facetime",
              "phone screen",
              "shadow figure",
              "silhouette",
              "disappear",
              "vanish",
              "teleport",
              "body distortion",
              "face distortion",
              "supernatural creature",
              "magic"
          ]

          # ============================================================
          # GROQ REQUEST
          # ============================================================

          def call_groq(prompt, retries=3):

              payload = {
                  "model": MODEL,
                  "temperature": 0.55,
                  "max_completion_tokens": 650,
                  "reasoning_effort": "low",

                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "quiet_vault_v10",

                          "strict": True,

                          "schema": {
                              "type": "object",

                              "properties": {
                                  "title": {
                                      "type": "string"
                                  },

                                  "script": {
                                      "type": "string"
                                  },

                                  "description": {
                                      "type": "string"
                                  },

                                  "keywords": {
                                      "type": "string"
                                  },

                                  "hashtags": {
                                      "type": "string"
                                  }
                              },

                              "required": [
                                  "title",
                                  "script",
                                  "description",
                                  "keywords",
                                  "hashtags"
                              ],

                              "additionalProperties": False
                          }
                      }
                  },

                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ]
              }

              body = json.dumps(payload).encode("utf-8")

              for attempt in range(retries):

                  request = urllib.request.Request(
                      ENDPOINT,
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": "Bearer " + KEY,
                          "User-Agent": "QuietVaultAI/10.0"
                      },
                      method="POST"
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=90
                      ) as response:

                          data = json.loads(
                              response.read().decode("utf-8")
                          )

                      content = data["choices"][0]["message"]["content"]

                      if not content:
                          raise RuntimeError(
                              "Groq returned empty content"
                          )

                      return json.loads(content)

                  except urllib.error.HTTPError as error:

                      error_text = error.read().decode(
                          errors="ignore"
                      )

                      if error.code == 429:

                          retry_after = (
                              error.headers.get("retry-after")
                              or "20"
                          )

                          try:
                              wait = float(retry_after)
                          except:
                              wait = 20.0

                          print(
                              f"RATE LIMITED - waiting {wait:.1f}s"
                          )

                          time.sleep(wait + 2)

                      else:

                          print(
                              "GROQ ERROR:",
                              error.code,
                              error_text[:1000]
                          )

                          time.sleep(5)

                  except Exception as error:

                      print(
                          "GENERATION ERROR:",
                          repr(error)
                      )

                      time.sleep(5)

              return None

          # ============================================================
          # VALIDATION
          # ============================================================

          def validate(short, mechanism):

              if not short:
                  return False, "Empty response"

              required_fields = [
                  "title",
                  "script",
                  "description",
                  "keywords",
                  "hashtags"
              ]

              for field in required_fields:

                  if not isinstance(
                      short.get(field),
                      str
                  ):
                      return False, f"Missing {field}"

                  if not short[field].strip():
                      return False, f"Empty {field}"

              script = short["script"].strip()

              word_count = len(script.split())

              if word_count < 28:
                  return False, f"Too short: {word_count} words"

              if word_count > 65:
                  return False, f"Too long: {word_count} words"

              lower = script.lower()

              # Check banned concepts.

              for banned in BANNED:

                  pattern = (
                      r"\b"
                      + re.escape(banned)
                      + r"\b"
                  )

                  if re.search(pattern, lower):

                      return False, (
                          "Banned concept: "
                          + banned
                      )

              # Mechanism-specific cues.

              cues = {

                  "private_routine": [
                      "routine",
                      "coffee",
                      "mug",
                      "kitchen",
                      "make"
                  ],

                  "keys_in_bowl": [
                      "keys",
                      "bowl",
                      "key"
                  ],

                  "dead_watch": [
                      "watch",
                      "wind",
                      "winding"
                  ],

                  "bed_made_wrong": [
                      "bed",
                      "blanket",
                      "pillow"
                  ],

                  "private_notebook": [
                      "notebook",
                      "write",
                      "writing"
                  ],

                  "photo_position": [
                      "photograph",
                      "photo",
                      "picture",
                      "pose"
                  ],

                  "drawer_routine": [
                      "drawer",
                      "object",
                      "put",
                      "placing"
                  ],

                  "dinner_preparation": [
                      "meal",
                      "recipe",
                      "cook",
                      "cooking"
                  ],

                  "lamp_routine": [
                      "lamp",
                      "light",
                      "switch"
                  ],

                  "chair_preparation": [
                      "table",
                      "chair",
                      "place",
                      "napkin"
                  ]
              }

              if not any(
                  cue in lower
                  for cue in cues[mechanism["id"]]
              ):

                  return False, "Mechanism disappeared"

              # Must contain an unfamiliar adult.

              stranger_terms = [
                  "stranger",
                  "unfamiliar man",
                  "unfamiliar woman",
                  "unknown man",
                  "unknown woman"
              ]

              if not any(
                  term in lower
                  for term in stranger_terms
              ):

                  return False, "No unfamiliar adult"

              # Must contain relationship/time contradiction.

              contradiction_terms = [
                  "said",
                  "told",
                  "yesterday",
                  "husband",
                  "wife",
                  "father",
                  "late",
                  "died",
                  "dead"
              ]

              if not any(
                  term in lower
                  for term in contradiction_terms
              ):

                  return False, (
                      "No relationship contradiction"
                  )

              return True, "PASS"

          # ============================================================
          # GOOGLE FLOW PROMPT
          # ============================================================

          def build_flow_prompt(
              mechanism,
              script
          ):

              return f"""
          Create a 9–12 second vertical 9:16
          photorealistic live-action psychological horror short.

          FICTIONAL ADULT ACTORS ONLY.

          No children, teenagers, celebrities,
          or resemblance to real people.

          LOCATION:
          {mechanism["location"]}

          ============================================================
          FIRST FRAME — MOST IMPORTANT
          ============================================================

          {mechanism["visual"]}

          The disturbing ACTION must already be happening
          in frame 1.

          Do NOT show an ordinary person simply standing
          or sitting.

          Do NOT use an establishing shot.

          The protagonist, unfamiliar adult, and important
          visual action must be visible together.

          The viewer should understand that something is
          wrong BEFORE hearing the dialogue.

          ============================================================
          CENTRAL HORROR
          ============================================================

          The unfamiliar adult is performing a deeply private
          action that should only be known by someone close
          to the protagonist.

          ============================================================
          DIALOGUE
          ============================================================

          Use this exact script and no additional dialogue:

          {script}

          ============================================================
          ENDING
          ============================================================

          {mechanism["ending"]}

          Hard cut immediately after the final line.

          DO NOT fade to black.

          ============================================================
          CAMERA
          ============================================================

          Medium-wide cinematic shot.

          Keep the protagonist, unfamiliar adult,
          and key visual action clearly visible.

          Natural handheld realism.

          No unnecessary camera movement.

          ============================================================
          PERFORMANCE
          ============================================================

          Protagonist:
          restrained genuine fear and disbelief.

          Unfamiliar adult:
          completely calm, as if the situation is normal.

          ============================================================
          STYLE
          ============================================================

          Photorealistic live action.

          Realistic adult humans.

          Natural lighting.

          Believable movement.

          Psychological horror.

          No fantasy aesthetic.

          ============================================================
          STRICTLY DO NOT INCLUDE
          ============================================================

          children,
          teenagers,
          mirrors,
          reflections,
          twins,
          doppelgängers,
          clones,
          ghosts,
          demons,
          monsters,
          zombies,
          gore,
          blood,
          corpse,
          body transformation,
          CCTV,
          surveillance,
          phone screens,
          video calls,
          magical effects,
          extra characters,
          subtitles,
          text overlays,
          extra dialogue,
          exaggerated acting.

          Do not add another twist.

          Do not change the central action.

          Do not replace the unfamiliar adult
          with anything supernatural.

          HARD CUT.
          No fade to black.
          """

          # ============================================================
          # ROTATE THROUGH MECHANISMS
          # ============================================================

          start_index = (
              (RUN - 1) * 3
          ) % len(MECHANISMS)

          ordered_mechanisms = (
              MECHANISMS[start_index:]
              +
              MECHANISMS[:start_index]
          )

          approved = []
          tried = 0

          print("")
          print("==========================================")
          print(" QUIET VAULT V10")
          print(" ACTION HORROR ENGINE")
          print("==========================================")
          print("RUN:", RUN)
          print("MODEL:", MODEL)
          print("TARGET: 3 SHORTS")
          print("")

          # ============================================================
          # GENERATE
          # ============================================================

          for mechanism in ordered_mechanisms:

              if len(approved) >= 3:
                  break

              if tried >= 8:
                  break

              tried += 1

              print("")
              print("------------------------------------------")
              print("MECHANISM:", mechanism["name"])
              print("------------------------------------------")

              prompt = f"""
          You write ONE realistic horror YouTube Short
          for The Quiet Vault.

          CHANNEL DNA:

          - 9–12 seconds
          - realistic psychological horror
          - adult characters only
          - recognizable real-world location
          - visible human threat or disturbing contradiction
          - minimal dialogue
          - final line must make the visible action more disturbing
          - hard cut ending

          ============================================================
          FIXED VISUAL MECHANISM
          ============================================================

          {mechanism["name"]}

          LOCATION:

          {mechanism["location"]}

          ============================================================
          WHAT MUST ALREADY BE HAPPENING IN FRAME 1
          ============================================================

          {mechanism["visual"]}

          ============================================================
          REQUIRED ENDING DIRECTION
          ============================================================

          {mechanism["ending"]}

          ============================================================
          WRITING RULES
          ============================================================

          Write a natural spoken script of 28–65 words.

          The first sentence must sound like a real person
          noticing the scene.

          Do NOT write like a narrator.

          Do NOT say:
          "an adult woman"
          "an adult man"
          "the camera"
          "the viewer"

          Do NOT waste words explaining the setting.

          The unfamiliar person must be visibly DOING
          the fixed action.

          The protagonist may ask ONE short question.

          The unfamiliar person gets ONE short final line.

          The final line must directly worsen the existing
          visual situation.

          Do not add another twist.

          Do not explain everything.

          Do not use supernatural terminology.

          Do not use:
          mirrors,
          reflections,
          twins,
          doppelgängers,
          children,
          ghosts,
          monsters,
          gore,
          CCTV,
          phones,
          video calls.

          The story must feel like something that could
          actually happen for the first several seconds.

          Then the final line should make the viewer
          reinterpret what they just saw.

          Return JSON only.
          """

              result = call_groq(prompt)

              valid_result, reason = validate(
                  result,
                  mechanism
              )

              print("VALIDATION:", reason)

              if not valid_result:
                  continue

              package = {

                  "slot": len(approved) + 1,

                  "mechanism": mechanism["name"],

                  "title": result["title"],

                  "short_script": result["script"],

                  "visual_hook": mechanism["visual"],

                  "flow_prompt": build_flow_prompt(
                      mechanism,
                      result["script"]
                  ),

                  "final_twist": mechanism["ending"],

                  "description": result["description"],

                  "keywords": result["keywords"],

                  "hashtags": result["hashtags"],

                  "thumbnail_frame": (
                      "Use approximately 0.5–1.5 seconds, "
                      "with the protagonist, unfamiliar adult, "
                      "and disturbing action clearly visible."
                  ),

                  "thumbnail_text": "",

                  "sound_design": (
                      "Realistic room tone, natural door and "
                      "footstep sounds, subtle tension bed, "
                      "clear dialogue. Hard cut immediately "
                      "after the final line."
                  ),

                  "pinned_comment": (
                      "What would you do if you saw this in your home?"
                  )
              }

              approved.append(package)

              print(
                  "APPROVED:",
                  result["title"]
              )

              # Avoid unnecessary rate limiting.

              time.sleep(8)

          # ============================================================
          # SAVE JSON
          # ============================================================

          output = {

              "run": RUN,

              "provider": "groq",

              "model": MODEL,

              "engine": "V10 Action Horror Engine",

              "generated": tried,

              "approved": len(approved),

              "shorts": approved
          }

          with open(
              OUT / "batch.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2,
                  ensure_ascii=False
              )

          # ============================================================
          # SAVE MARKDOWN PACKAGES
          # ============================================================

          for index, short in enumerate(
              approved,
              start=1
          ):

              markdown = f"""# {short["title"]}

          ## Script

          {short["short_script"]}

          ## Visual Hook

          {short["visual_hook"]}

          ## Google Flow Prompt

          ```text
          {short["flow_prompt"]}
          ```

          ## Final Twist

          {short["final_twist"]}

          ## Description

          ```text
          {short["description"]}
          ```

          ## Keywords

          ```text
          {short["keywords"]}
          ```

          ## Hashtags

          ```text
          {short["hashtags"]}
          ```

          ## Thumbnail

          {short["thumbnail_frame"]}

          {short["thumbnail_text"]}

          ## Sound Design

          {short["sound_design"]}

          ## Pinned Comment

          {short["pinned_comment"]}
          """

              with open(
                  OUT / f"short_{index:02d}.md",
                  "w",
                  encoding="utf-8"
              ) as file:

                  file.write(markdown)

          print("")
          print("==========================================")
          print("FINAL RESULT")
          print("==========================================")
          print(
              "Approved:",
              len(approved),
              "/ 3"
          )

          if len(approved) < 3:

              print(
                  "No weak filler Shorts were created."
              )

          else:

              print(
                  "SUCCESS - 3 Shorts ready."
              )

          PY

      - name: Upload V10 package
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-v10-shorts
          path: quiet-vault-output/
