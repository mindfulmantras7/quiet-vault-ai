name: Quiet Vault AI - Candidate Judge Finalize

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate, filter, judge and finalize
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat > generate.py <<'PY'
          import os
          import json
          import re
          import urllib.request
          import urllib.error

          API_KEY = os.environ["GROQ_API_KEY"]
          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"


          # ============================================================
          # GROQ API
          # ============================================================

          def call_groq(
              messages,
              schema_name,
              schema,
              temperature=0.7,
              max_tokens=8000
          ):

              base_payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden"
              }

              # --------------------------------------------------------
              # STRICT JSON SCHEMA
              # --------------------------------------------------------

              strict_payload = dict(base_payload)

              strict_payload["response_format"] = {
                  "type": "json_schema",
                  "json_schema": {
                      "name": schema_name,
                      "strict": True,
                      "schema": schema
                  }
              }

              try:

                  print("")
                  print("Trying Groq strict JSON Schema...")

                  data = json.dumps(
                      strict_payload
                  ).encode("utf-8")

                  request = urllib.request.Request(
                      ENDPOINT,
                      data=data,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=180
                  ) as response:

                      body = response.read().decode("utf-8")

                      result = json.loads(body)

                      content = result[
                          "choices"
                      ][0][
                          "message"
                      ][
                          "content"
                      ]

                      print("Strict JSON Schema succeeded.")

                      return json.loads(content)

              except urllib.error.HTTPError as e:

                  error_body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("")
                  print("STRICT JSON SCHEMA FAILED")
                  print("HTTP STATUS:", e.code)
                  print("GROQ RESPONSE:")
                  print(error_body)
                  print("")

              except Exception as e:

                  print("")
                  print("STRICT JSON SCHEMA ERROR:")
                  print(str(e))
                  print("")


              # --------------------------------------------------------
              # JSON OBJECT FALLBACK
              # --------------------------------------------------------

              print("Trying Groq JSON Object Mode fallback...")

              fallback_payload = dict(base_payload)

              fallback_payload["response_format"] = {
                  "type": "json_object"
              }

              fallback_data = json.dumps(
                  fallback_payload
              ).encode("utf-8")

              fallback_request = urllib.request.Request(
                  ENDPOINT,
                  data=fallback_data,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {API_KEY}",
                      "User-Agent": "QuietVaultAI/1.0"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      fallback_request,
                      timeout=180
                  ) as response:

                      body = response.read().decode("utf-8")

                      result = json.loads(body)

                      content = result[
                          "choices"
                      ][0][
                          "message"
                      ][
                          "content"
                      ]

                      parsed = json.loads(content)

                      print("JSON Object Mode succeeded.")

                      return parsed

              except urllib.error.HTTPError as e:

                  error_body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("")
                  print("JSON OBJECT MODE ALSO FAILED")
                  print("HTTP STATUS:", e.code)
                  print("GROQ RESPONSE:")
                  print(error_body)
                  print("")

                  raise RuntimeError(
                      "Both Groq output modes failed."
                  )

              except Exception as e:

                  print("")
                  print("JSON OBJECT MODE ERROR:")
                  print(str(e))
                  print("")

                  raise


          # ============================================================
          # STAGE 1
          # GENERATE 12 CANDIDATES
          # ============================================================

          candidate_schema = {

              "type": "object",

              "properties": {

                  "candidates": {

                      "type": "array",

                      "items": {

                          "type": "object",

                          "properties": {

                              "id": {
                                  "type": "integer"
                              },

                              "title": {
                                  "type": "string"
                              },

                              "premise": {
                                  "type": "string"
                              },

                              "static_frame_1": {
                                  "type": "string"
                              },

                              "visual_anomaly": {
                                  "type": "string"
                              },

                              "escalation": {
                                  "type": "string"
                              },

                              "ending": {
                                  "type": "string"
                              },

                              "relationship_context": {
                                  "type": "string"
                              },

                              "flow_feasibility": {
                                  "type": "string"
                              }

                          },

                          "required": [
                              "id",
                              "title",
                              "premise",
                              "static_frame_1",
                              "visual_anomaly",
                              "escalation",
                              "ending",
                              "relationship_context",
                              "flow_feasibility"
                          ],

                          "additionalProperties": False
                      }
                  }
              },

              "required": [
                  "candidates"
              ],

              "additionalProperties": False
          }


          generator_prompt = """

          You are the horror concept generator for The Quiet Vault.

          Return ONLY valid JSON matching the requested structure.

          Generate exactly 12 genuinely different horror concepts.

          TARGET:

          Each concept must work as a 9-12 second YouTube Short.

          STYLE:

          - photorealistic live action
          - realistic human situations
          - fictional adults only
          - recognizable everyday locations
          - cinematic but believable
          - minimal dialogue
          - visible threat or contradiction
          - simple visual storytelling

          ============================================================
          MOST IMPORTANT RULE
          ============================================================

          THE FIRST FRAME MUST ALREADY CONTAIN THE HORROR.

          Imagine the video is paused at frame 1.

          The viewer should immediately see a specific visual detail
          that is wrong, threatening or impossible.

          DO NOT write a normal scene and then introduce the horror later.

          BAD:

          "A woman enters her apartment."

          GOOD:

          "A woman stands inside her apartment while the locked front
          door is visibly being opened from the hallway by an adult hand."

          BAD:

          "A man works late in an office."

          GOOD:

          "A man sits at his desk while the closed office door directly
          beside him is visibly being pushed inward from the other side."

          STATIC_FRAME_1 must describe exactly what a paused screenshot
          would show.

          ============================================================
          PREFERRED HORROR
          ============================================================

          Prefer realistic human-centered horror:

          - someone being somewhere they should not be
          - a locked/open contradiction
          - an ordinary action happening incorrectly
          - someone interacting with something that should be impossible
          - a familiar person behaving subtly wrong
          - an adult relationship creating emotional stakes
          - a visible threat that requires no explanation

          Useful relationships:

          - husband and wife
          - adult siblings
          - adult parent and adult child
          - coworkers
          - friends
          - roommates

          Useful locations:

          - apartment
          - house
          - bedroom
          - kitchen
          - bathroom
          - office
          - hospital
          - workplace
          - stairwell
          - hallway
          - shop
          - classroom
          - warehouse
          - basement
          - public building

          ============================================================
          HARD EXCLUSIONS
          ============================================================

          Do NOT use:

          - elevators
          - cars
          - hotels
          - CCTV
          - security camera footage
          - mirrors
          - reflections
          - doppelgangers
          - clones
          - people secretly hiding directly behind another person
          - printers
          - trains
          - floating objects
          - objects with faces
          - possessed household objects
          - ghosts
          - demons
          - monsters
          - zombies
          - giant creatures
          - gore
          - disappearing people
          - reappearing people
          - teleportation
          - impossible anatomy
          - head distortion
          - random body parts
          - complicated transformations
          - elaborate mythology
          - children
          - babies
          - minors

          Do not repeat the same horror mechanism across candidates.

          The ending must create a second realization.

          "The character screams" is NOT a sufficient ending.

          All characters are fictional adults.
          """


          generator_user = """

          Generate exactly 12 candidates.

          Make them visually simple enough for Google Flow.

          Every STATIC_FRAME_1 must be at least 15 words and must describe
          a concrete paused image.

          Do not use vague phrases such as:

          "something scary is happening"
          "something feels wrong"
          "the scene is creepy"

          Explain exactly what the camera sees.
          """


          candidates_data = call_groq(
              [
                  {
                      "role": "user",
                      "content":
                          generator_prompt
                          + "\n\n"
                          + generator_user
                  }
              ],
              "quiet_vault_candidates",
              candidate_schema,
              temperature=0.85,
              max_tokens=9000
          )


          candidates = candidates_data.get(
              "candidates",
              []
          )


          print("")
          print("==========================================")
          print("CANDIDATE GENERATION")
          print("==========================================")
          print(
              "Generated:",
              len(candidates)
          )


          if len(candidates) < 8:

              raise RuntimeError(
                  "Groq generated fewer than 8 candidates."
              )


          # ============================================================
          # STAGE 2
          # SMART HARD FILTER
          # ============================================================

          # IMPORTANT:
          # These are checked as WORDS/PHRASES, not loose substrings.
          # This prevents "car" from matching "cart".

          banned_phrases = [

              # Locations / mechanisms
              "elevator",
              "elevators",
              "cctv",
              "security camera",
              "security-camera",
              "hotel room",
              "hotel hallway",

              # Reflection mechanisms
              "mirror",
              "mirrors",
              "reflection",
              "reflections",

              # Doppelganger mechanisms
              "doppelganger",
              "doppelgängers",
              "doppelgänger",
              "clone",
              "cloned",

              # Specific hidden-person mechanism
              "hiding directly behind her",
              "hiding directly behind him",
              "hiding behind her",
              "hiding behind him",
              "person hidden behind her",
              "person hidden behind him",

              # Common failed concepts
              "printer",
              "empty chair",
              "train carriage",
              "floating mug",
              "floating cup",
              "cereal box with a face",
              "object with a face",
              "face on the object",
              "possessed object",

              # Supernatural creature concepts
              "ghost",
              "ghosts",
              "demon",
              "demons",
              "monster",
              "monsters",
              "zombie",
              "zombies",
              "giant creature",

              # Transformation mechanisms
              "teleport",
              "teleportation",
              "teleports",
              "disappear and reappear",
              "disappears and reappears",
              "disappearing and reappearing",
              "head spins",
              "head turns 180",
              "180-degree head",
              "random body part",
              "floating hand",
              "floating head",

              # Gore
              "gore",
              "decapitation",
              "decapitated",

              # Minors
              "child",
              "children",
              "kid",
              "kids",
              "baby",
              "babies",
              "minor",
              "minors",
              "teenager",
              "teenagers"
          ]


          weak_frame_phrases = [

              "everything looks normal",
              "nothing seems wrong",
              "nothing looks wrong",
              "at first everything",
              "at first the scene",
              "the scene looks normal",
              "ordinary scene",
              "normal scene",
              "later something",
              "eventually something",
              "then something strange happens",
              "something strange happens later",
              "something scary happens later"
          ]


          def normalize(text):

              return re.sub(
                  r"\s+",
                  " ",
                  str(text).lower()
              ).strip()


          def contains_banned_phrase(text):

              text = normalize(text)

              for phrase in banned_phrases:

                  # Word-boundary matching for normal phrases.
                  pattern = (
                      r"(?<![a-z0-9])"
                      + re.escape(phrase)
                      + r"(?![a-z0-9])"
                  )

                  if re.search(
                      pattern,
                      text
                  ):

                      return phrase

              return None


          def hard_reject(candidate):

              title = normalize(
                  candidate.get(
                      "title",
                      ""
                  )
              )

              premise = normalize(
                  candidate.get(
                      "premise",
                      ""
                  )
              )

              frame = normalize(
                  candidate.get(
                      "static_frame_1",
                      ""
                  )
              )

              anomaly = normalize(
                  candidate.get(
                      "visual_anomaly",
                      ""
                  )
              )

              escalation = normalize(
                  candidate.get(
                      "escalation",
                      ""
                  )
              )

              ending = normalize(
                  candidate.get(
                      "ending",
                      ""
                  )
              )

              combined = " ".join(
                  [
                      title,
                      premise,
                      frame,
                      anomaly,
                      escalation,
                      ending
                  ]
              )


              # --------------------------------------------------------
              # BANNED MECHANISM CHECK
              # --------------------------------------------------------

              banned = contains_banned_phrase(
                  combined
              )

              if banned:

                  return True, (
                      "banned mechanism: "
                      + banned
                  )


              # --------------------------------------------------------
              # FIRST FRAME CHECK
              # --------------------------------------------------------

              if len(frame.split()) < 15:

                  return True, (
                      "first frame description too short"
                  )


              for phrase in weak_frame_phrases:

                  if phrase in frame:

                      return True, (
                          "first frame defers horror"
                      )


              # --------------------------------------------------------
              # FRAME MUST CONTAIN CONCRETE VISUAL LANGUAGE
              # --------------------------------------------------------

              # We intentionally do NOT use a tiny whitelist such as
              # "door/man/woman/room".
              #
              # Instead, we check that the frame contains enough words
              # describing physical things/actions.

              concrete_visual_words = [

                  "door",
                  "doorway",
                  "wall",
                  "window",
                  "bed",
                  "desk",
                  "table",
                  "chair",
                  "floor",
                  "ceiling",
                  "hallway",
                  "corridor",
                  "stairs",
                  "stairwell",
                  "bathroom",
                  "kitchen",
                  "office",
                  "bedroom",
                  "room",
                  "apartment",
                  "house",
                  "hospital",
                  "store",
                  "counter",
                  "sink",
                  "shower",
                  "closet",
                  "locker",
                  "bag",
                  "coat",
                  "phone",
                  "laptop",
                  "cup",
                  "plate",
                  "window",
                  "handle",
                  "lock",
                  "key",
                  "person",
                  "man",
                  "woman",
                  "adult",
                  "hand",
                  "standing",
                  "sitting",
                  "kneeling",
                  "opening",
                  "closed",
                  "locked",
                  "holding",
                  "gripping",
                  "touching",
                  "pushing",
                  "pulling"
              ]


              visual_count = sum(
                  1
                  for word in concrete_visual_words
                  if re.search(
                      r"(?<![a-z0-9])"
                      + re.escape(word)
                      + r"(?![a-z0-9])",
                      frame
                  )
              )


              if visual_count < 2:

                  return True, (
                      "first frame lacks concrete visual detail"
                  )


              return False, "passed"


          survivors = []
          rejected = []


          for candidate in candidates:

              reject, reason = hard_reject(
                  candidate
              )

              if reject:

                  rejected.append(
                      {
                          "id":
                              candidate.get("id"),
                          "title":
                              candidate.get("title"),
                          "reason":
                              reason
                      }
                  )

              else:

                  survivors.append(
                      candidate
                  )


          print("")
          print("==========================================")
          print("HARD FILTER")
          print("==========================================")

          print(
              "Survivors:",
              len(survivors)
          )

          print(
              "Rejected:",
              len(rejected)
          )


          for item in rejected:

              print(
                  "REJECTED:",
                  item["id"],
                  item["title"],
                  "->",
                  item["reason"]
              )


          # We expect most candidates to survive here.
          # The AI judge is supposed to do the difficult creative filtering.

          if len(survivors) < 3:

              print("")
              print(
                  "WARNING: fewer than 3 survivors."
              )

              print(
                  "The hard filter will NOT automatically"
                  " invent replacement concepts."
              )

              raise RuntimeError(
                  "Fewer than 3 concepts survived."
              )


          # ============================================================
          # STAGE 3
          # AI CREATIVE JUDGE
          # ============================================================

          judge_schema = {

              "type": "object",

              "properties": {

                  "ranked_candidates": {

                      "type": "array",

                      "items": {

                          "type": "object",

                          "properties": {

                              "id": {
                                  "type": "integer"
                              },

                              "frame_hook_score": {
                                  "type": "integer"
                              },

                              "visual_clarity_score": {
                                  "type": "integer"
                              },

                              "ending_score": {
                                  "type": "integer"
                              },

                              "flow_feasibility_score": {
                                  "type": "integer"
                              },

                              "originality_score": {
                                  "type": "integer"
                              },

                              "rewatch_score": {
                                  "type": "integer"
                              },

                              "overall_score": {
                                  "type": "integer"
                              },

                              "pass": {
                                  "type": "boolean"
                              },

                              "reason": {
                                  "type": "string"
                              }

                          },

                          "required": [

                              "id",
                              "frame_hook_score",
                              "visual_clarity_score",
                              "ending_score",
                              "flow_feasibility_score",
                              "originality_score",
                              "rewatch_score",
                              "overall_score",
                              "pass",
                              "reason"

                          ],

                          "additionalProperties": False
                      }
                  }
              },

              "required": [
                  "ranked_candidates"
              ],

              "additionalProperties": False
          }


          judge_prompt = """

          You are the STRICT creative director for The Quiet Vault.

          Return ONLY valid JSON.

          Judge every supplied horror concept.

          ============================================================
          SCORE 1-10
          ============================================================

          FRAME HOOK

          Does the actual first frame already contain a visible anomaly,
          threat or disturbing contradiction?

          A normal-looking first frame followed by horror later scores LOW.

          VISUAL CLARITY

          Can a viewer understand what is wrong visually without
          narration or reading text?

          ENDING

          Does the ending create a second realization or disturbing
          payoff?

          FLOW FEASIBILITY

          Can Google Flow realistically generate the scene coherently
          in a 9-12 second photorealistic video?

          ORIGINALITY

          Does the mechanism feel different from common short-form
          horror?

          REWATCH

          Does the viewer have a reason to replay the Short?

          ============================================================
          PASS RULE
          ============================================================

          Pass only if:

          frame_hook >= 7
          visual_clarity >= 7
          ending >= 7
          flow_feasibility >= 7
          originality >= 6
          rewatch >= 6
          overall >= 7

          Be harsh.

          Do not reward a concept merely because the written premise
          sounds creepy.

          The first frame must work as a paused screenshot.

          Sort strongest to weakest.

          Do not invent candidates.
          """


          judge_user = (
              judge_prompt
              + "\n\nCANDIDATES:\n"
              + json.dumps(
                  survivors,
                  ensure_ascii=False
              )
          )


          judged_data = call_groq(
              [
                  {
                      "role": "user",
                      "content": judge_user
                  }
              ],
              "quiet_vault_judgement",
              judge_schema,
              temperature=0.3,
              max_tokens=7000
          )


          ranked = judged_data.get(
              "ranked_candidates",
              []
          )


          if not ranked:

              raise RuntimeError(
                  "AI judge returned no candidates."
              )


          ranked = sorted(
              ranked,
              key=lambda item:
                  item.get(
                      "overall_score",
                      0
                  ),
              reverse=True
          )


          passed = [

              item
              for item in ranked
              if item.get("pass") is True

          ]


          print("")
          print("==========================================")
          print("AI JUDGE RESULTS")
          print("==========================================")


          for item in ranked:

              print(

                  "ID:",
                  item["id"],

                  "| Hook:",
                  item["frame_hook_score"],

                  "| Clarity:",
                  item["visual_clarity_score"],

                  "| Ending:",
                  item["ending_score"],

                  "| Flow:",
                  item["flow_feasibility_score"],

                  "| Originality:",
                  item["originality_score"],

                  "| Rewatch:",
                  item["rewatch_score"],

                  "| Overall:",
                  item["overall_score"],

                  "| PASS:",
                  item["pass"]

              )


          # If fewer than 3 explicitly pass, use the strongest
          # judge-ranked candidates rather than failing the pipeline.

          if len(passed) < 3:

              print("")
              print(
                  "Fewer than 3 explicit passes."
              )

              print(
                  "Using strongest judge-ranked survivors."
              )

              selected_ranked = ranked[:3]

          else:

              selected_ranked = passed[:5]


          candidate_map = {

              candidate["id"]:
                  candidate

              for candidate in survivors

          }


          finalists = [

              candidate_map[item["id"]]

              for item in selected_ranked

              if item["id"] in candidate_map

          ]


          if len(finalists) < 3:

              raise RuntimeError(
                  "Could not create 3 finalists."
              )


          print("")
          print("==========================================")
          print("FINALISTS")
          print("==========================================")


          for finalist in finalists:

              print(
                  finalist["id"],
                  finalist["title"]
              )


          # ============================================================
          # STAGE 4
          # FINAL PACKAGE WRITER
          # ============================================================

          final_schema = {

              "type": "object",

              "properties": {

                  "shorts": {

                      "type": "array",

                      "items": {

                          "type": "object",

                          "properties": {

                              "id": {
                                  "type": "integer"
                              },

                              "title": {
                                  "type": "string"
                              },

                              "short_script": {
                                  "type": "string"
                              },

                              "visual_hook": {
                                  "type": "string"
                              },

                              "flow_prompt": {
                                  "type": "string"
                              },

                              "final_twist": {
                                  "type": "string"
                              },

                              "description": {
                                  "type": "string"
                              },

                              "keywords": {
                                  "type": "string"
                              },

                              "hashtags": {
                                  "type": "string"
                              },

                              "thumbnail_frame": {
                                  "type": "string"
                              },

                              "thumbnail_text": {
                                  "type": "string"
                              }

                          },

                          "required": [

                              "id",
                              "title",
                              "short_script",
                              "visual_hook",
                              "flow_prompt",
                              "final_twist",
                              "description",
                              "keywords",
                              "hashtags",
                              "thumbnail_frame",
                              "thumbnail_text"

                          ],

                          "additionalProperties": False
                      }
                  }
              },

              "required": [
                  "shorts"
              ],

              "additionalProperties": False
          }


          final_prompt = """

          You are the final writer for The Quiet Vault.

          Return ONLY valid JSON.

          Turn the selected finalists into exactly 3 complete YouTube
          Shorts packages.

          DO NOT change the underlying concept.

          ============================================================
          SHORT FORMAT
          ============================================================

          9-12 seconds.

          Vertical 9:16.

          Photorealistic live action.

          Fictional adults only.

          Realistic cinematic lighting.

          Natural human movement.

          No celebrity likeness.

          No real-person likeness.

          No children.

          No gore.

          No monsters.

          No ghosts.

          No mirrors.

          No reflections.

          No doppelgangers.

          ============================================================
          FIRST FRAME
          ============================================================

          The first frame must immediately show the anomaly from the
          selected finalist.

          Do NOT start with:

          - establishing shots
          - empty rooms
          - normal scenes
          - characters entering a location
          - slow reveals

          ============================================================
          GOOGLE FLOW PROMPT
          ============================================================

          Write ONE complete prompt ready to paste into Google Flow.

          Include:

          - vertical 9:16
          - photorealistic live action
          - fictional adult characters
          - consistent character appearance
          - location
          - camera framing
          - exact first frame
          - 0-3 second action
          - 3-6 second escalation
          - 6-9/12 second reveal
          - hard cut or loop-friendly ending
          - no text overlays
          - no subtitles unless essential

          The FIRST FRAME must match the finalist's
          static_frame_1 description.

          ============================================================
          SCRIPT
          ============================================================

          Keep dialogue extremely short.

          Let the visuals tell the story.

          ============================================================
          DESCRIPTION
          ============================================================

          Natural YouTube description.

