name: Generate, filter, judge and finalize

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate, filter, judge and finalize
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat > generate.py <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path

          API_KEY = os.environ["GROQ_API_KEY"]
          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          OUTPUT_DIR = Path("quiet-vault-output")
          OUTPUT_DIR.mkdir(exist_ok=True)


          # ============================================================
          # GROQ REQUEST
          # ============================================================

          def groq_request(
              prompt,
              schema_name,
              schema,
              max_tokens=4000,
              max_attempts=5
          ):

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "temperature": 0.85,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden",
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": schema_name,
                          "strict": True,
                          "schema": schema
                      }
                  }
              }

              data = json.dumps(payload).encode("utf-8")

              for attempt in range(1, max_attempts + 1):

                  request = urllib.request.Request(
                      ENDPOINT,
                      data=data,
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      },
                      method="POST"
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          body = response.read().decode("utf-8")
                          result = json.loads(body)

                      content = result["choices"][0]["message"]["content"]

                      try:
                          return json.loads(content)

                      except json.JSONDecodeError:

                          print("")
                          print("=" * 60)
                          print("INVALID JSON FROM GROQ")
                          print(content)
                          print("=" * 60)
                          print("")

                          raise RuntimeError(
                              "Groq returned invalid JSON"
                          )

                  except urllib.error.HTTPError as e:

                      error_body = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print("")
                      print("=" * 60)
                      print("GROQ ERROR")
                      print(f"HTTP: {e.code}")
                      print(error_body)
                      print("=" * 60)
                      print("")

                      if e.code == 429:

                          if attempt >= max_attempts:
                              raise RuntimeError(
                                  "Groq rate limit persisted."
                              )

                          retry_after = None

                          try:
                              retry_after = e.headers.get(
                                  "retry-after"
                              )
                          except Exception:
                              pass

                          if retry_after:

                              try:
                                  wait_time = float(
                                      retry_after
                                  ) + 2

                              except ValueError:
                                  wait_time = 10

                          else:

                              wait_time = min(
                                  6 * (2 ** (attempt - 1)),
                                  65
                              )

                          print(
                              f"RATE LIMIT. "
                              f"Waiting {wait_time:.1f}s..."
                          )

                          time.sleep(wait_time)
                          continue

                      raise RuntimeError(
                          f"Groq returned HTTP {e.code}"
                      )

                  except Exception as e:

                      print("")
                      print("=" * 60)
                      print("REQUEST ERROR")
                      print(str(e))
                      print("=" * 60)
                      print("")

                      raise


          # ============================================================
          # CANDIDATE SCHEMA
          # ============================================================

          candidate_schema = {
              "type": "object",
              "properties": {
                  "candidates": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id": {
                                  "type": "integer"
                              },
                              "title": {
                                  "type": "string"
                              },
                              "premise": {
                                  "type": "string"
                              },
                              "static_frame_1": {
                                  "type": "string"
                              },
                              "ending": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "id",
                              "title",
                              "premise",
                              "static_frame_1",
                              "ending"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "candidates"
              ],
              "additionalProperties": False
          }


          # ============================================================
          # CANDIDATE GENERATOR
          # ============================================================

          def generate_candidates(count=12, starting_id=1):

              prompt = f"""
          You are the horror concept generator for The Quiet Vault.

          Generate EXACTLY {count} completely different concepts for
          9–12 second YouTube Shorts.

          The channel uses:
          - realistic cinematic horror
          - photorealistic live action
          - fictional ADULT characters
          - recognizable real-world locations
          - simple physical situations
          - visible human threats
          - immediate visual contradictions
          - strong endings
          - replay-worthy final beats

          MOST IMPORTANT RULE:

          The FIRST FRAME must already contain the horror.

          static_frame_1 describes a SINGLE FROZEN SCREENSHOT.

          If someone sees ONLY that screenshot for one second, they should
          immediately notice something wrong, threatening or impossible.

          GOOD EXAMPLE:

          "A woman stands at her apartment door holding grocery bags while
          the chain lock is visibly fastened from the inside, yet an adult
          hand is opening the door toward her."

          GOOD EXAMPLE:

          "A man sits alone in a conference room while the glass meeting-room
          door is visibly locked, but an unfamiliar adult is standing outside
          holding the man's own office keys."

          BAD EXAMPLE:

          "A woman walks into a room and becomes scared."

          BAD EXAMPLE:

          "A man discovers something strange."

          BAD EXAMPLE:

          "An empty chair looks creepy."

          BAD EXAMPLE:

          "A phone call becomes scary."

          The visual contradiction must be visible immediately.

          PRIORITIZE:
          - adult couples
          - adult family members
          - siblings who are adults
          - coworkers
          - roommates
          - ordinary domestic situations
          - apartment corridors
          - offices
          - kitchens
          - bathrooms
          - bedrooms
          - parking areas
          - shops
          - hospitals
          - stairwells
          - public buildings

          Prefer a HUMAN threat or human behavior that is visibly wrong.

          EXAMPLES OF GOOD MECHANISMS:
          - a locked door being opened from the wrong side
          - someone holding an object they could not physically have
          - a person appearing in a location they should not be able to access
          - two adults simultaneously claiming ownership of the same place
          - an ordinary action happening in an impossible direction
          - someone reacting to a person who should not be there
          - a familiar person behaving in a physically contradictory way
          - a security/access situation that is visibly impossible WITHOUT CCTV

          ABSOLUTELY DO NOT USE:

          children
          babies
          infants
          minors
          teenagers
          nursery
          crib
          schoolchildren
          babysitters
          child portraits
          baby monitors

          elevators
          cars
          hotels
          CCTV
          security-camera footage
          surveillance footage
          mirrors
          reflections
          reflective surfaces
          doppelgangers
          twins
          hidden people behind characters
          people appearing behind characters
          printers
          trains
          buses
          floating objects
          floating mugs
          floating cups
          possessed household objects
          objects growing faces
          random body parts
          disappearing people
          reappearing people
          teleportation
          ghosts
          demons
          monsters
          zombies
          giant creatures
          gore
          blood
          severed limbs
          impossible anatomy
          head distortion
          180-degree head turns
          faces morphing
          faces melting
          complicated CGI
          giant supernatural effects
          mythology
          long conversations
          exposition-heavy stories

          Do not use a supernatural object as the primary horror mechanism.

          Do not depend on sound alone.

          Do not make the first frame normal and put the horror later.

          Do not reuse the same mechanism across concepts.

          Every concept must be realistic enough for Google Flow to generate
          reliably.

          Every concept must feature fictional ADULTS.

          IDs should start at {starting_id}.

          Return EXACTLY {count} concepts.
          """

              data = groq_request(
                  prompt,
                  "quiet_vault_candidates",
                  candidate_schema,
                  max_tokens=4000
              )

              return data["candidates"]


          # ============================================================
          # BASIC HARD FILTER
          # ============================================================

          banned_phrases = [

              # MINORS
              "child",
              "children",
              "baby",
              "infant",
              "kid",
              "kids",
              "minor",
              "teenager",
              "teen",
              "nursery",
              "crib",
              "schoolchild",
              "babysitter",
              "baby monitor",
              "child portrait",

              # REPEATED / BANNED MECHANISMS
              "elevator",
              "hotel",
              "cctv",
              "security camera",
              "surveillance footage",
              "mirror",
              "reflection",
              "reflective surface",
              "doppelganger",
              "doppelgänger",
              "twin",
              "printer",
              "train",
              "bus",
              "ghost",
              "demon",
              "zombie",
              "monster",
              "giant creature",
              "floating mug",
              "floating cup",
              "floating object",
              "possessed object",
              "growing face",
              "body part",
              "severed limb",
              "disappears",
              "disappearing",
              "reappears",
              "reappearing",
              "teleport",
              "teleportation",
              "head spins",
              "head turns 180",
              "head rotates",
              "face melts",
              "face morphs",
              "gore",
              "blood"
          ]


          def contains_phrase(text, phrase):

              text = text.lower()
              phrase = phrase.lower()

              if " " in phrase:
                  return phrase in text

              return re.search(
                  rf"(?<![a-z]){re.escape(phrase)}(?![a-z])",
                  text
              ) is not None


          def basic_filter(candidates):

              survivors = []

              print("")
              print("=" * 60)
              print("BASIC HARD FILTER")
              print("=" * 60)

              for candidate in candidates:

                  title = candidate.get(
                      "title",
                      ""
                  )

                  premise = candidate.get(
                      "premise",
                      ""
                  )

                  frame = candidate.get(
                      "static_frame_1",
                      ""
                  )

                  ending = candidate.get(
                      "ending",
                      ""
                  )

                  combined = " ".join([
                      title,
                      premise,
                      frame,
                      ending
                  ]).lower()

                  reason = None

                  if not title.strip():
                      reason = "missing title"

                  elif len(premise.strip()) < 30:
                      reason = "premise too short"

                  elif len(frame.strip()) < 60:
                      reason = "static frame too short"

                  elif len(ending.strip()) < 30:
                      reason = "ending too short"

                  else:

                      for phrase in banned_phrases:

                          if contains_phrase(
                              combined,
                              phrase
                          ):

                              reason = (
                                  f"banned: {phrase}"
                              )

                              break

                  if reason:

                      print(
                          f"REJECTED: "
                          f"{candidate.get('id')} "
                          f"{title} -> {reason}"
                      )

                  else:

                      survivors.append(
                          candidate
                      )

              print("")
              print(
                  f"Basic survivors: "
                  f"{len(survivors)}"
              )

              return survivors


          # ============================================================
          # GENERATE FIRST BATCH
          # ============================================================

          print("")
          print("=" * 60)
          print("CANDIDATE GENERATION")
          print("=" * 60)

          candidates = generate_candidates(
              count=12,
              starting_id=1
          )

          print(
              f"Generated: "
              f"{len(candidates)}"
          )

          survivors = basic_filter(
              candidates
          )


          # ============================================================
          # STRICT CREATIVE GATE
          # ============================================================

          gate_schema = {
              "type": "object",
              "properties": {
                  "evaluations": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {

                              "id": {
                                  "type": "integer"
                              },

                              "hook_pass": {
                                  "type": "boolean"
                              },

                              "visible_threat_pass": {
                                  "type": "boolean"
                              },

                              "flow_pass": {
                                  "type": "boolean"
                              },

                              "originality_pass": {
                                  "type": "boolean"
                              },

                              "rule_pass": {
                                  "type": "boolean"
                              },

                              "eligible": {
                                  "type": "boolean"
                              },

                              "reason": {
                                  "type": "string"
                              }
                          },

                          "required": [
                              "id",
                              "hook_pass",
                              "visible_threat_pass",
                              "flow_pass",
                              "originality_pass",
                              "rule_pass",
                              "eligible",
                              "reason"
                          ],

                          "additionalProperties": False
                      }
                  }
              },

              "required": [
                  "evaluations"
              ],

              "additionalProperties": False
          }


          def run_creative_gate(
              candidates
          ):

              if not candidates:
                  return []

              judge_input = json.dumps(
                  candidates,
                  ensure_ascii=False
              )

              prompt = f"""
          You are the FINAL CREATIVE GATEKEEPER for The Quiet Vault.

          Your job is NOT to be generous.

          Your job is to reject concepts that would produce mediocre
          YouTube Shorts.

          Examine each concept below.

          A concept can become a finalist ONLY if ALL five tests pass.

          TEST 1 — FIRST FRAME HOOK

          Look ONLY at static_frame_1.

          Ask:

          "If I saw this frozen image for one second with NO audio,
          NO captions and NO context, would I immediately notice a
          disturbing contradiction or visible threat?"

          PASS only if YES.

          A normal person sitting, standing, walking or looking worried
          is NOT enough.

          A generic creepy room is NOT enough.

          An empty chair, empty room or ordinary object is NOT enough.

          TEST 2 — VISIBLE THREAT

          The danger must be physically visible.

          A heartbeat, sound, unexplained feeling, narration or implication
          alone does NOT count.

          PASS only if the viewer can SEE the thing that is wrong.

          TEST 3 — FLOW FEASIBILITY

          Could Google Flow realistically create the scene in 9–12 seconds
          with simple physical movement?

          PASS only if YES.

          Reject complicated transformations, precise text, tiny visual
          details, complicated supernatural effects, difficult reflections,
          or unreliable CGI.

          TEST 4 — ORIGINALITY

          Does the concept avoid tired mechanisms and the banned mechanisms
          from the concept-generation rules?

          PASS only if the central horror idea feels meaningfully different.

          TEST 5 — RULE COMPLIANCE

          Must use fictional adults only.

          No children, babies, minors or child-centered scenarios.

          No mirrors.

          No reflections.

          No doppelgangers.

          No elevators.

          No cars.

          No hotels.

          No CCTV.

          No ghosts, demons or monsters.

          No gore.

          No disappearing/reappearing mechanism.

          No hidden person simply standing behind someone.

          No possessed household object.

          ELIGIBLE:

          eligible MUST be TRUE only when:

          hook_pass = true
          AND visible_threat_pass = true
          AND flow_pass = true
          AND originality_pass = true
          AND rule_pass = true

          If even ONE fails, eligible MUST be false.

          Be extremely strict.

          We would rather generate another batch than publish a weak idea.

          CONCEPTS:

          {judge_input}

          Return one evaluation for every concept.
          """

              data = groq_request(
                  prompt,
                  "quiet_vault_creative_gate",
                  gate_schema,
                  max_tokens=3000
              )

              return data["evaluations"]


          print("")
          print("=" * 60)
          print("STRICT CREATIVE GATE")
          print("=" * 60)

          evaluations = run_creative_gate(
              survivors
          )

          evaluation_map = {
              item["id"]: item
              for item in evaluations
          }

          eligible_candidates = []

          for candidate in survivors:

              cid = candidate["id"]

              if cid not in evaluation_map:
                  continue

              result = evaluation_map[cid]

              eligible = (
                  result["hook_pass"]
                  and result["visible_threat_pass"]
                  and result["flow_pass"]
                  and result["originality_pass"]
                  and result["rule_pass"]
                  and result["eligible"]
              )

              print(
                  f"ID {cid} | "
                  f"Hook={result['hook_pass']} | "
                  f"Threat={result['visible_threat_pass']} | "
                  f"Flow={result['flow_pass']} | "
                  f"Originality={result['originality_pass']} | "
                  f"Rules={result['rule_pass']} | "
                  f"ELIGIBLE={eligible}"
              )

              if eligible:

                  eligible_candidates.append(
                      candidate
                  )

              else:

                  print(
                      f"  REASON: "
                      f"{result['reason']}"
                  )


          # ============================================================
          # SECOND BATCH IF NECESSARY
          # ============================================================

          if len(eligible_candidates) < 3:

              print("")
              print("=" * 60)
              print("NOT ENOUGH STRONG CONCEPTS")
              print("=" * 60)

              print(
                  f"Only "
                  f"{len(eligible_candidates)} "
                  f"concept(s) passed."
              )

              print(
                  "Generating 8 additional concepts "
                  "instead of filling slots with weak ideas."
              )

              print(
                  "Waiting 65 seconds for TPM window..."
              )

              time.sleep(65)

              second_batch = generate_candidates(
                  count=8,
                  starting_id=100
              )

              second_survivors = basic_filter(
                  second_batch
              )

              second_evaluations = run_creative_gate(
                  second_survivors
              )

              second_map = {
                  item["id"]: item
                  for item in second_evaluations
              }

              for candidate in second_survivors:

                  cid = candidate["id"]

                  if cid not in second_map:
                      continue

                  result = second_map[cid]

                  eligible = (
                      result["hook_pass"]
                      and result["visible_threat_pass"]
                      and result["flow_pass"]
                      and result["originality_pass"]
                      and result["rule_pass"]
                      and result["eligible"]
                  )

                  print(
                      f"SECOND BATCH ID {cid} | "
                      f"Eligible={eligible}"
                  )

                  if eligible:

                      eligible_candidates.append(
                          candidate
                      )


          # ============================================================
          # FINAL SAFETY CHECK
          # ============================================================

          if len(eligible_candidates) < 3:

              raise RuntimeError(
                  "Fewer than 3 concepts passed the strict creative gate. "
                  "The workflow intentionally refused to manufacture weak "
                  "finalists."
              )


          # ============================================================
          # SELECT THREE
          # ============================================================

          finalists = eligible_candidates[:3]

          print("")
          print("=" * 60)
          print("APPROVED FINALISTS")
          print("=" * 60)

          for index, candidate in enumerate(
              finalists,
              1
          ):

              print(
                  f"{index}. "
                  f"{candidate['title']}"
              )


          # ============================================================
          # WAIT BEFORE FINALIZATION
          # ============================================================

          print("")
          print(
              "Waiting 65 seconds before finalization..."
          )

          time.sleep(65)


          # ============================================================
          # FINAL PACKAGE SCHEMA
          # ============================================================

          final_schema = {
              "type": "object",

              "properties": {

                  "id": {
                      "type": "integer"
                  },

                  "title": {
                      "type": "string"
                  },

                  "short_script": {
                      "type": "string"
                  },

                  "visual_hook": {
                      "type": "string"
                  },

                  "flow_prompt": {
                      "type": "string"
                  },

                  "final_twist": {
                      "type": "string"
                  },

                  "description": {
                      "type": "string"
                  },

                  "keywords": {
                      "type": "string"
                  },

                  "hashtags": {
                      "type": "string"
                  },

                  "thumbnail_frame": {
                      "type": "string"
                  },

                  "thumbnail_text": {
                      "type": "string"
                  }
              },

              "required": [

                  "id",
                  "title",
                  "short_script",
                  "visual_hook",
                  "flow_prompt",
                  "final_twist",
                  "description",
                  "keywords",
                  "hashtags",
                  "thumbnail_frame",
                  "thumbnail_text"

              ],

              "additionalProperties": False
          }


          # ============================================================
          # FINAL PACKAGE VALIDATION
          # ============================================================

          def validate_final_package(
              package
          ):

              required = [

                  "id",
                  "title",
                  "short_script",
                  "visual_hook",
                  "flow_prompt",
                  "final_twist",
                  "description",
                  "keywords",
                  "hashtags",
                  "thumbnail_frame",
                  "thumbnail_text"

              ]

              missing = [
                  field
                  for field in required
                  if field not in package
              ]

              if missing:

                  raise RuntimeError(
                      "Missing final fields: "
                      + ", ".join(missing)
                  )

              for field in required:

                  if field == "id":
                      continue

                  if not isinstance(
                      package[field],
                      str
                  ):

                      raise RuntimeError(
                          f"Invalid field type: {field}"
                      )

                  if (
                      not package[field].strip()
                      and field != "thumbnail_text"
                  ):

                      raise RuntimeError(
                          f"Empty field: {field}"
                      )


          # ============================================================
          # FINALIZE ONE SHORT AT A TIME
          # ============================================================

          final_packages = []

          for index, finalist in enumerate(
              finalists,
              1
          ):

              print("")
              print("=" * 60)
              print(
                  f"FINALIZING SHORT "
                  f"{index}/3"
              )
              print("=" * 60)

              finalist_json = json.dumps(
                  finalist,
                  ensure_ascii=False
              )

              final_prompt = f"""
          You are the final scriptwriter for The Quiet Vault.

          Turn this APPROVED concept into ONE complete YouTube Shorts package.

          APPROVED CONCEPT:

          {finalist_json}

          The concept has already passed a strict creative gate.

          Preserve its core visual idea.

          Do NOT replace the central mechanism with a different horror
          mechanism.

          FORMAT:

          9–12 second YouTube Short.

          The first frame must immediately show the exact disturbing
          situation described in static_frame_1.

          No normal establishing shot.

          The viewer must be able to understand the visual hook without
          narration.

          Use fictional ADULT characters only.

          Realistic cinematic live action.

          Vertical 9:16.

          Photorealistic.

          Simple physical movement.

          Strong visible ending.

          No minors.

          No children.

          No babies.

          No nursery.

          No crib.

          No mirrors.

          No reflections.

          No doppelgangers.

          No elevators.

          No cars.

          No hotels.

          No CCTV.

          No ghosts.

          No demons.

          No monsters.

          No gore.

          No complicated CGI.

          No impossible anatomy.

          No subtitles.

          No on-screen text.

          No logos.

          No celebrity likeness.

          REQUIRED OUTPUT:

          id
          title
          short_script
          visual_hook
          flow_prompt
          final_twist
          description
          keywords
          hashtags
          thumbnail_frame
          thumbnail_text

          short_script:
          Write the complete 9–12 second timed action.

          visual_hook:
          Describe the exact first frame as a frozen screenshot.

          flow_prompt:
          Write ONE Google Flow-ready prompt.

          It must specify:
          - vertical 9:16
          - photorealistic live action
          - fictional adult characters
          - consistent character appearance
          - recognizable location
          - exact first-frame composition
          - camera framing
          - lighting
          - simple realistic movements
          - timing
          - final visual beat
          - no text
          - no subtitles
          - no logos
          - no real-person likenesses

          final_twist:
          Explain exactly what the viewer discovers at the end.

          description:
          Write a natural YouTube Shorts description.

          keywords:
          Give useful comma-separated keywords.

          hashtags:
          Give useful hashtags.

          thumbnail_frame:
          Specify the strongest frame and approximate timing.

          thumbnail_text:
          Give optional 2–5 word thumbnail text.
          Empty string is acceptable if text is unnecessary.

          CRITICAL:

          Return ALL 11 fields.

          Never omit a field.

          Return ONLY JSON.
          """

              package = None

              for attempt in range(
                  1,
                  4
              ):

                  try:

                      package = groq_request(
                          final_prompt,
                          "quiet_vault_final_package",
                          final_schema,
                          max_tokens=3000
                      )

                      validate_final_package(
                          package
                      )

                      break

                  except Exception as error:

                      print(
                          f"Finalization attempt "
                          f"{attempt} failed: "
                          f"{error}"
                      )

                      if attempt >= 3:

                          raise RuntimeError(
                              f"Could not finalize "
                              f"Short {index}"
                          )

                      print(
                          "Waiting 10 seconds before retry..."
                      )

                      time.sleep(10)

              final_packages.append(
                  package
              )

              print(
                  f"FINALIZED: "
                  f"{package['title']}"
              )

              if index < len(finalists):

                  print(
                      "Waiting 10 seconds before "
                      "next final package..."
                  )

                  time.sleep(10)


          # ============================================================
          # SAVE JSON
          # ============================================================

          batch = {
              "shorts": final_packages
          }

          with open(
              OUTPUT_DIR / "batch.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  batch,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # ============================================================
          # SAVE MARKDOWN FILES
          # ============================================================

          for index, package in enumerate(
              final_packages,
              1
          ):

              markdown = f"""# {package['title']}

          ## Script

          {package['short_script']}

          ## Visual Hook

          {package['visual_hook']}

          ## Google Flow Prompt

          {package['flow_prompt']}

          ## Final Twist

          {package['final_twist']}

          ## Description

          {package['description']}

          ## Keywords

          {package['keywords']}

          ## Hashtags

          {package['hashtags']}

          ## Thumbnail Frame

          {package['thumbnail_frame']}

          ## Thumbnail Text

          {package['thumbnail_text']}
          """

              with open(
                  OUTPUT_DIR
                  / f"short_{index:02d}.md",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(markdown)


          # ============================================================
          # COMPLETE
          # ============================================================

          print("")
          print("=" * 60)
          print("SUCCESS")
          print("=" * 60)

          print(
              f"Generated "
              f"{len(final_packages)} "
              f"approved Shorts."
          )

          print(
              "These concepts passed the strict "
              "creative gate before finalization."
          )

          print(
              f"Output: "
              f"{OUTPUT_DIR}"
          )

          PY

          python generate.py

      - name: Upload generated Shorts package
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts
          path: quiet-vault-output/
          if-no-files-found: error
