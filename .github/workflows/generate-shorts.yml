name: Quiet Vault AI V7.3 - Contradiction Engine

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Horror Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 <<'PY'
          import os
          import json
          import re
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path

          API_KEY = os.environ["GROQ_API_KEY"]
          RUN_NUMBER = int(os.environ.get("RUN_NUMBER", "1"))

          URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          # ============================================================
          # QUIET VAULT DNA
          # ============================================================

          DNA = """
          THE QUIET VAULT

          Create ultra-short realistic human horror.

          FORMAT:
          - 9-12 seconds
          - approximately 30-42 spoken words
          - fictional adults only
          - photorealistic live action
          - recognizable real-world location
          - threat visible immediately
          - one simple contradiction
          - hard cut after the reveal

          THE FORMULA:

          VISIBLE HUMAN THREAT
          +
          NORMAL SITUATION
          +
          ONE IMPOSSIBLE PERSONAL FACT
          +
          SHORT REVEAL
          +
          CUT

          The viewer should understand what they are seeing
          without needing narration or backstory.

          The horror must come from a person and a concrete fact.

          DO NOT use:
          - ghosts
          - demons
          - monsters
          - zombies
          - mirrors
          - reflections
          - twins
          - doubles
          - doppelgangers
          - clones
          - children
          - minors
          - gore
          - blood
          - body transformation
          - disappearing people
          - magical objects
          - object transformations
          - clocks or countdowns
          - CCTV
          - phone-screen horror
          - dream explanations
          - simulation explanations
          - complicated mythology

          Never explain the supernatural.

          The final line must create a concrete contradiction,
          not merely say that something feels strange.
          """

          # ============================================================
          # PRE-WRITTEN CONTRADICTION PAIRS
          #
          # Groq does NOT invent the horror mechanism.
          # The contradiction is already defined here.
          # ============================================================

          SCENARIOS = [

              {
                  "name": "THE HOUSE KEY",
                  "location": "front doorway of a normal home",
                  "visual": "An unfamiliar adult man stands outside holding a key that visibly fits the protagonist's front-door lock.",
                  "fact_a": "The protagonist never gave this man a key.",
                  "fact_b": "The man calmly claims the protagonist gave him the copy yesterday.",
                  "required_reveal": "The protagonist knows they were not home yesterday."
              },

              {
                  "name": "THE BEDROOM VISITOR",
                  "location": "private bedroom",
                  "visual": "An unfamiliar adult woman is calmly walking out of the protagonist's bedroom.",
                  "fact_a": "The bedroom was locked.",
                  "fact_b": "The woman says she was told to wait there by the protagonist's husband.",
                  "required_reveal": "The husband is currently away on a business trip."
              },

              {
                  "name": "THE DEAD MAN'S WATCH",
                  "location": "apartment kitchen",
                  "visual": "An unfamiliar adult man stands in the kitchen holding the protagonist's deceased father's wristwatch.",
                  "fact_a": "The watch was buried with the father.",
                  "fact_b": "The stranger says the father asked him to return it.",
                  "required_reveal": "The father died years ago."
              },

              {
                  "name": "THE OFFICE INTRUDER",
                  "location": "locked private office",
                  "visual": "An unfamiliar adult is sitting at the protagonist's desk using their personal notebook.",
                  "fact_a": "The office was locked.",
                  "fact_b": "The stranger says the protagonist left the notebook for him this morning.",
                  "required_reveal": "The protagonist has been working from home all morning."
              },

              {
                  "name": "THE DINNER GUEST",
                  "location": "family dining room",
                  "visual": "An unfamiliar adult man is calmly sitting in the protagonist's wife's usual chair at dinner.",
                  "fact_a": "The protagonist has never seen him before.",
                  "fact_b": "The man says the wife invited him.",
                  "required_reveal": "The wife quietly says she has never met him."
              },

              {
                  "name": "THE KITCHEN STRANGER",
                  "location": "home kitchen",
                  "visual": "An unfamiliar adult woman is calmly cooking the family's usual dinner.",
                  "fact_a": "The protagonist never told her the recipe.",
                  "fact_b": "She says the protagonist's wife taught it to her last night.",
                  "required_reveal": "The wife slept beside the protagonist all night."
              },

              {
                  "name": "THE GARAGE VISITOR",
                  "location": "private home garage",
                  "visual": "An unfamiliar adult man is working on the protagonist's father's old motorcycle.",
                  "fact_a": "Nobody else has access to the garage.",
                  "fact_b": "The man says the father asked him to repair it this morning.",
                  "required_reveal": "The father died before the motorcycle was ever bought."
              },

              {
                  "name": "THE FAMILY NAME",
                  "location": "apartment hallway",
                  "visual": "An unfamiliar adult woman is standing inside the protagonist's locked apartment.",
                  "fact_a": "The protagonist has never met her.",
                  "fact_b": "She casually uses the private childhood nickname only the protagonist's late sister used.",
                  "required_reveal": "The sister died before this woman could have known her."
              },

              {
                  "name": "THE WRONG HOUSE",
                  "location": "living room",
                  "visual": "An unfamiliar adult man is sitting comfortably on the protagonist's sofa as if he lives there.",
                  "fact_a": "The protagonist has never seen him.",
                  "fact_b": "He says the protagonist invited him over last night.",
                  "required_reveal": "The protagonist spent last night alone in a hotel in another city."
              },

              {
                  "name": "THE LOCKED APARTMENT",
                  "location": "apartment entryway",
                  "visual": "An unfamiliar adult is already inside the protagonist's locked apartment.",
                  "fact_a": "The protagonist locked the apartment before leaving.",
                  "fact_b": "The stranger says the protagonist let him in ten minutes ago.",
                  "required_reveal": "The protagonist has been standing outside the building for ten minutes."
              },

              {
                  "name": "THE PRIVATE PHOTO",
                  "location": "home hallway",
                  "visual": "An unfamiliar adult holds a printed family photograph that should be stored inside the protagonist's locked drawer.",
                  "fact_a": "The drawer has never been opened by anyone else.",
                  "fact_b": "The stranger says the protagonist gave him the photograph yesterday.",
                  "required_reveal": "The protagonist has never met this person."
              },

              {
                  "name": "THE NEIGHBOR",
                  "location": "front doorway",
                  "visual": "A familiar-looking adult neighbor stands inside the protagonist's doorway holding the house keys.",
                  "fact_a": "The protagonist has never given the neighbor a key.",
                  "fact_b": "The neighbor says the protagonist's wife gave it to him.",
                  "required_reveal": "The wife died months ago."
              }
          ]

          # Rotate scenarios between runs.
          start = ((RUN_NUMBER - 1) * 5) % len(SCENARIOS)
          selected = [
              SCENARIOS[(start + i) % len(SCENARIOS)]
              for i in range(5)
          ]

          print("==========================================")
          print("QUIET VAULT AI V7.3")
          print("CONTRADICTION ENGINE")
          print("==========================================")
          print(f"RUN: {RUN_NUMBER}")
          print()
          print("SELECTED CONTRADICTIONS:")
          for i, s in enumerate(selected, 1):
              print(f"{i}. {s['name']}")

          # ============================================================
          # GROQ
          # ============================================================

          def groq_call(prompt, retries=3):

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "Write short realistic human horror. "
                              "Do not invent the underlying contradiction. "
                              "Use the supplied facts exactly."
                          )
                      },
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "temperature": 0.55,
                  "max_completion_tokens": 2600,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden",
                  "response_format": {
                      "type": "json_object"
                  }
              }

              body = json.dumps(payload).encode("utf-8")

              for attempt in range(retries):

                  req = urllib.request.Request(
                      URL,
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      },
                      method="POST"
                  )

                  try:
                      with urllib.request.urlopen(req, timeout=90) as response:
                          raw = response.read().decode("utf-8")
                          result = json.loads(raw)

                          content = result["choices"][0]["message"].get("content")

                          if not content:
                              raise RuntimeError("Groq returned empty content")

                          return content

                  except urllib.error.HTTPError as e:

                      body_text = e.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

                      if e.code == 429:

                          retry_after = e.headers.get("retry-after")

                          try:
                              wait = max(15, float(retry_after))
                          except:
                              wait = 20

                          print(
                              f"RATE LIMITED. Waiting {wait:.1f}s..."
                          )

                          time.sleep(wait)
                          continue

                      print(f"GROQ HTTP {e.code}")
                      print(body_text[:1000])
                      raise

                  except Exception as e:

                      print(f"Groq error: {e}")

                      if attempt < retries - 1:
                          time.sleep(5)
                      else:
                          raise

          # ============================================================
          # PROMPT
          # ============================================================

          scenario_text = ""

          for i, s in enumerate(selected, 1):

              scenario_text += f"""

          STORY {i}

          NAME:
          {s['name']}

          LOCATION:
          {s['location']}

          OPENING VISUAL:
          {s['visual']}

          FACT A:
          {s['fact_a']}

          FACT B:
          {s['fact_b']}

          REQUIRED FINAL REVEAL:
          {s['required_reveal']}

          """

          prompt = f"""
          {DNA}

          Turn the five supplied scenarios into five Shorts.

          Do not invent new horror mechanisms.

          Do not change the facts.

          The supplied contradiction is the entire point of the story.

          {scenario_text}

          ============================================================
          WRITING RULES
          ============================================================

          Each script:

          - 30-42 spoken words
          - 9-12 seconds
          - first-person narration OR very short dialogue
          - short sentences
          - natural human speech
          - no exposition
          - no unnecessary names
          - no explanation
          - no "I realized..."
          - no "something felt wrong..."
          - no generic scary language

          Structure:

          FRAME 1:
          Show the threatening adult immediately.

          SETUP:
          One short sentence establishing why the person should
          NOT be there.

          CONTRADICTION:
          One short exchange or statement.

          FINAL:
          Deliver the required reveal.

          CUT.

          The final line should make the viewer mentally replay
          the previous few seconds.

          ============================================================
          IMPORTANT
          ============================================================

          Do NOT turn the supplied facts into supernatural
          transformations.

          Do NOT make objects magical.

          Do NOT add ghosts or monsters.

          Do NOT add hidden clones or doubles.

          Do NOT introduce a second twist.

          Do NOT explain who the stranger really is.

          ============================================================
          OUTPUT
          ============================================================

          Return ONLY valid JSON:

          {{
            "stories": [
              {{
                "id": 1,
                "seed": "exact scenario name",
                "title": "short curiosity-driven title",
                "script": "30-42 spoken words",
                "visual_hook": "exact first-frame composition",
                "ending": "exact final reveal"
              }},
              {{
                "id": 2,
                "seed": "exact scenario name",
                "title": "...",
                "script": "...",
                "visual_hook": "...",
                "ending": "..."
              }},
              {{
                "id": 3,
                "seed": "exact scenario name",
                "title": "...",
                "script": "...",
                "visual_hook": "...",
                "ending": "..."
              }},
              {{
                "id": 4,
                "seed": "exact scenario name",
                "title": "...",
                "script": "...",
                "visual_hook": "...",
                "ending": "..."
              }},
              {{
                "id": 5,
                "seed": "exact scenario name",
                "title": "...",
                "script": "...",
                "visual_hook": "...",
                "ending": "..."
              }}
            ]
          }}
          """

          print()
          print("GENERATING FIVE CONTRADICTION STORIES...")
          print()

          raw = groq_call(prompt)

          try:
              data = json.loads(raw)
          except Exception as e:
              print("INVALID JSON")
              print(raw[:3000])
              raise RuntimeError(str(e))

          stories = data.get("stories", [])

          if not isinstance(stories, list):
              raise RuntimeError("stories is not a list")

          print(f"GENERATED: {len(stories)}")

          # ============================================================
          # HARD VALIDATION
          # ============================================================

          banned = [
              "child",
              "children",
              "kid",
              "baby",
              "minor",
              "mirror",
              "reflection",
              "reflected",
              "doppelganger",
              "double",
              "clone",
              "twin",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "vampire",
              "cctv",
              "surveillance",
              "phone screen",
              "video call",
              "blood",
              "gore",
              "corpse",
              "disappear",
              "vanish",
              "teleport",
              "shape-shift",
              "distorted face",
              "distorted body"
          ]

          weak = [
              "something felt wrong",
              "something was wrong",
              "i felt watched",
              "she felt watched",
              "he felt watched",
              "eerie",
              "creepy feeling",
              "strange feeling",
              "darkness"
          ]

          def validate(story):

              required = [
                  "id",
                  "seed",
                  "title",
                  "script",
                  "visual_hook",
                  "ending"
              ]

              if not all(k in story for k in required):
                  return False, "missing field"

              script = str(story["script"]).strip()
              hook = str(story["visual_hook"]).strip()
              ending = str(story["ending"]).strip()

              word_count = len(script.split())

              if word_count < 25:
                  return False, "too short"

              if word_count > 50:
                  return False, "too long"

              combined = (
                  script + " " +
                  hook + " " +
                  ending
              ).lower()

              for word in banned:
                  if re.search(
                      r"\b" + re.escape(word) + r"\b",
                      combined
                  ):
                      return False, f"banned: {word}"

              for phrase in weak:
                  if phrase in combined:
                      return False, f"weak phrase: {phrase}"

              hook_lower = hook.lower()

              if not any(
                  x in hook_lower
                  for x in [
                      "man",
                      "woman",
                      "stranger",
                      "adult",
                      "person",
                      "visitor",
                      "neighbor",
                      "guest"
                  ]
              ):
                  return False, "no visible human threat"

              return True, "PASS"

          # ============================================================
          # VERIFY STORY AGAINST ITS ASSIGNED CONTRADICTION
          # ============================================================

          scenario_by_name = {
              s["name"]: s
              for s in selected
          }

          approved = []

          print()
          print("VALIDATING CONTRADICTIONS...")
          print()

          for story in stories:

              seed = str(story.get("seed", ""))

              if seed not in scenario_by_name:
                  print(
                      f"REJECT: {story.get('title','UNTITLED')} "
                      f"-> unknown seed"
                  )
                  continue

              ok, reason = validate(story)

              if not ok:
                  print(
                      f"REJECT: {story.get('title','UNTITLED')} "
                      f"-> {reason}"
                  )
                  continue

              scenario = scenario_by_name[seed]

              combined = (
                  story["script"] + " " +
                  story["ending"]
              ).lower()

              # Require at least one concrete relationship/fact clue.
              clue_words = [
                  "wife",
                  "husband",
                  "father",
                  "mother",
                  "brother",
                  "sister",
                  "partner",
                  "died",
                  "dead",
                  "yesterday",
                  "today",
                  "morning",
                  "locked",
                  "key",
                  "home",
                  "house",
                  "office"
              ]

              if not any(x in combined for x in clue_words):
                  print(
                      f"REJECT: {story['title']} "
                      f"-> missing concrete contradiction clue"
                  )
                  continue

              print(f"PASS: {story['title']}")
              approved.append(story)

          # ============================================================
          # SCORE
          # ============================================================

          def score(story):

              text = (
                  story["script"] + " " +
                  story["visual_hook"] + " " +
                  story["ending"]
              ).lower()

              score = 0

              if any(
                  x in story["visual_hook"].lower()
                  for x in [
                      "stranger",
                      "man",
                      "woman",
                      "adult",
                      "neighbor",
                      "visitor",
                      "guest"
                  ]
              ):
                  score += 3

              if any(
                  x in text
                  for x in [
                      "home",
                      "house",
                      "kitchen",
                      "bedroom",
                      "office",
                      "garage",
                      "door",
                      "dinner"
                  ]
              ):
                  score += 2

              if any(
                  x in text
                  for x in [
                      "wife",
                      "husband",
                      "father",
                      "mother",
                      "brother",
                      "sister",
                      "partner",
                      "dead",
                      "died"
                  ]
              ):
                  score += 3

              if len(story["ending"].split()) >= 5:
                  score += 2

              return score

          approved.sort(
              key=score,
              reverse=True
          )

          approved = approved[:3]

          # ============================================================
          # BUILD FLOW PROMPTS
          # ============================================================

          def flow_prompt(story):

              return f"""
          Create a 9-12 second vertical 9:16 photorealistic
          live-action horror Short.

          Fictional adult characters only.
          No children.
          No celebrity or real-person likeness.

          FRAME 1 IS CRITICAL.

          Start immediately with this exact visual situation:

          {story['visual_hook']}

          Story:

          {story['script']}

          Final reveal:

          {story['ending']}

          Use realistic adult actors, natural facial expressions,
          realistic human behavior, believable lighting and a
          recognizable real-world location.

          The threatening adult must be physically visible
          immediately and remain visible.

          No slow establishing shot.

          No monsters.
          No ghosts.
          No demons.
          No mirrors.
          No reflections.
          No twins.
          No doppelgangers.
          No clones.
          No children.
          No gore.
          No blood.
          No CCTV.
          No phone-screen horror.
          No disappearing people.
          No body distortion.
          No magical objects.

          Keep the horror grounded in the human situation.

          Do not add extra plot.

          End immediately after the final disturbing line.
          """

          # ============================================================
          # OUTPUT FILES
          # ============================================================

          out = Path("quiet-vault-output")
          out.mkdir(exist_ok=True)

          final = []

          for i, story in enumerate(approved, 1):

              item = {
                  "title": story["title"],
                  "script": story["script"],
                  "visual_hook": story["visual_hook"],
                  "flow_prompt": flow_prompt(story),
                  "final_twist": story["ending"],
                  "description": (
                      "A realistic horror encounter with one detail "
                      "that should not be possible. Watch until the end."
                  ),
                  "keywords": (
                      "horror, horror shorts, scary stories, "
                      "scary shorts, horror stories, psychological "
                      "horror, realistic horror, creepy stories, "
                      "suspense horror, short horror stories, "
                      "horror storytelling, The Quiet Vault"
                  ),
                  "hashtags": (
                      "#horror #horrorshorts #scarystories "
                      "#psychologicalhorror #creepy #shorts"
                  ),
                  "thumbnail_frame": (
                      "Use the opening frame showing the "
                      "visible adult threat. Optional text: "
                      + story["title"]
                  ),
                  "sound_design": (
                      "Natural room ambience, subtle realistic "
                      "movement sounds, restrained tension, "
                      "one sharp sound on the final contradiction, "
                      "then hard cut to silence."
                  ),
                  "pinned_comment": (
                      "Did you catch the contradiction before the ending?"
                  )
              }

              final.append(item)

              md = f"""# {item['title']}

          ## Script

          {item['script']}

          ## Google Flow Prompt

          {item['flow_prompt']}

          ## Final Twist

          {item['final_twist']}

          ## Description

          {item['description']}

          ## Keywords

          {item['keywords']}

          ## Hashtags

          {item['hashtags']}

          ## Thumbnail

          {item['thumbnail_frame']}

          ## Sound Design

          {item['sound_design']}

          ## Pinned Comment

          {item['pinned_comment']}
          """

              (out / f"short_{i:02d}.md").write_text(
                  md,
                  encoding="utf-8"
              )

          batch = {
              "run_number": RUN_NUMBER,
              "provider": "groq",
              "model": MODEL,
              "generated": len(stories),
              "approved": len(final),
              "shorts": final
          }

          (out / "batch.json").write_text(
              json.dumps(
                  batch,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print()
          print("==========================================")
          print("QUIET VAULT V7.3 COMPLETE")
          print("==========================================")
          print(f"Generated: {len(stories)}")
          print(f"Approved:  {len(final)}")
          print()

          for i, item in enumerate(final, 1):
              print(f"{i}. {item['title']}")
              print(f"   {item['script']}")
              print()

          PY

      - name: Upload Shorts
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-v73-shorts
          path: quiet-vault-output/
