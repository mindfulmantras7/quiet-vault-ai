name: Quiet Vault AI - Evidence Based Generator

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # GENERATE QUIET VAULT SHORTS
      # ============================================================

      - name: Generate evidence-based Quiet Vault Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |

          cat > generate.py <<'PY'

          import os
          import json
          import re
          import time
          import urllib.request
          import urllib.error


          # ============================================================
          # CONFIG
          # ============================================================

          API_KEY = os.environ["GROQ_API_KEY"]

          ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"

          MODEL = "openai/gpt-oss-20b"


          # ============================================================
          # GROQ REQUEST
          #
          # IMPORTANT:
          # Candidate generation uses normal JSON mode.
          # Final generation uses strict JSON schema.
          # ============================================================

          def groq_request(
              messages,
              schema_name,
              schema=None,
              temperature=0.7,
              max_tokens=4000,
              strict=False,
              retries=4
          ):

              if strict:

                  response_format = {
                      "type": "json_schema",
                      "json_schema": {
                          "name": schema_name,
                          "strict": True,
                          "schema": schema
                      }
                  }

              else:

                  response_format = {
                      "type": "json_object"
                  }


              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden",
                  "response_format": response_format
              }


              data = json.dumps(payload).encode("utf-8")


              for attempt in range(retries):

                  request = urllib.request.Request(
                      ENDPOINT,
                      data=data,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      }
                  )


                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          body = response.read().decode("utf-8")

                          result = json.loads(body)

                          content = result["choices"][0]["message"]["content"]

                          # Remove accidental markdown fences
                          content = content.strip()

                          if content.startswith("```"):

                              content = re.sub(
                                  r"^```(?:json)?\s*",
                                  "",
                                  content,
                                  flags=re.I
                              )

                              content = re.sub(
                                  r"\s*```$",
                                  "",
                                  content
                              )

                          return json.loads(content)


                  except urllib.error.HTTPError as e:

                      error_body = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )


                      print("")
                      print("==========================================")
                      print("GROQ ERROR")
                      print("HTTP:", e.code)
                      print(error_body)
                      print("==========================================")


                      if e.code == 429 and attempt < retries - 1:

                          retry_seconds = 65

                          match = re.search(
                              r"retry-after[^0-9]*([0-9]+)",
                              error_body,
                              re.I
                          )

                          if match:

                              retry_seconds = max(
                                  65,
                                  int(match.group(1)) + 5
                              )


                          print(
                              f"Rate limited. Waiting {retry_seconds} seconds..."
                          )

                          time.sleep(retry_seconds)

                          continue


                      raise RuntimeError(
                          f"Groq returned HTTP {e.code}"
                      )


                  except json.JSONDecodeError as e:

                      print("")
                      print("==========================================")
                      print("INVALID JSON FROM GROQ")
                      print("==========================================")
                      print(str(e))
                      print("")
                      raise RuntimeError(
                          "Groq returned invalid JSON."
                      )


          # ============================================================
          # QUIET VAULT CREATIVE DNA
          # ============================================================

          CREATIVE_DNA = """

          THE QUIET VAULT — CREATIVE DNA

          The channel creates short, realistic, cinematic horror videos.

          TARGET LENGTH:
          9-12 seconds.

          TARGET AUDIENCE:
          Adults.

          CHARACTERS:
          Fictional adults only.

          ============================================================
          WHAT OUR PREVIOUS RESULTS TAUGHT US
          ============================================================

          Stronger Shorts had:

          - an immediate visual problem
          - a visible human threat or disturbing human situation
          - a simple contradiction
          - very little explanation
          - a second realization near the end
          - strong replay potential

          Some previous Shorts had good replay/APV but weak
          Stayed-to-Watch because the first visual was not compelling.

          Therefore:

          FIRST FRAME IS THE PRIMARY PRIORITY.

          Do not sacrifice the opening visual for a clever story.

          ============================================================
          THE FIRST FRAME TEST
          ============================================================

          Imagine the video is paused on FRAME 1.

          Remove:

          - audio
          - narration
          - subtitles
          - context
          - title

          Ask:

          "Can I immediately see why this situation is wrong?"

          If not, the concept is weak.

          ============================================================
          GOOD FIRST FRAMES
          ============================================================

          An unfamiliar adult is already inside a private home.

          A stranger is visibly holding something deeply personal.

          A stranger is visibly occupying a locked/private space.

          Two adults are confronting a third adult who should not be there.

          A stranger is performing an intimate household action that proves
          impossible familiarity.

          A stranger is calmly behaving as though an impossible situation
          is completely normal.

          ============================================================
          BAD FIRST FRAMES
          ============================================================

          Person walking into a room.

          Person opening a door.

          Person looking scared.

          Empty room.

          Dark hallway.

          Normal dinner.

          Person looking at a phone.

          Phone screen.

          Text message.

          Mysterious object sitting somewhere.

          Person simply standing alone.

          ============================================================
          HORROR STRUCTURE
          ============================================================

          Use:

          VISIBLE PROBLEM
          +
          SIMPLE CONTRADICTION
          +
          SECOND REALIZATION

          Example structure:

          A stranger is already inside.

          The protagonist asks how he entered.

          The stranger gives one answer that proves something much worse.

          CUT.

          ============================================================
          THREAT
          ============================================================

          Prefer a visible adult human threat.

          The threat does not need to attack anyone.

          Presence + impossible knowledge + wrong location
          can be enough.

          ============================================================
          RELATIONSHIPS
          ============================================================

          Useful adult relationships:

          husband / wife
          brother / sister
          adult siblings
          close friends
          roommates
          neighbors
          colleagues
          ex-partners

          ============================================================
          FLOW FEASIBILITY
          ============================================================

          Google Flow should be able to create the scene.

          Prefer:

          - one recognizable location
          - 2 or 3 adults maximum
          - simple movement
          - normal human faces
          - realistic lighting
          - one continuous shot
          - or two very simple shots

          Avoid:

          complicated visual effects
          tiny readable text
          complicated transformations
          elaborate supernatural creatures
          multiple locations

          ============================================================
          HARD BANS
          ============================================================

          No children.

          No minors.

          No babies.

          No teenagers.

          No mirrors.

          No reflections.

          No doppelgängers.

          No twins.

          No CCTV.

          No elevators.

          No hotels.

          No trains.

          No printer horror.

          No empty-chair horror.

          No phone-screen horror.

          No video-call horror.

          No disappearing people.

          No reappearing people.

          No monsters.

          No demons.

          No zombies.

          No ghosts as the explanation.

          No face distortion.

          No body transformation.

          No gore.

          No blood.

          No elaborate supernatural mythology.

          No celebrity likenesses.

          No real-person likenesses.

          ============================================================
          """



          # ============================================================
          # CONTROLLED HORROR MECHANISMS
          # ============================================================

          MECHANISMS = [

              {
                  "id": 1,
                  "name": "WRONG ACCESS",
                  "rule":
                  "An unfamiliar adult is already inside a private locked "
                  "space using something that should belong only to the "
                  "protagonist."
              },

              {
                  "id": 2,
                  "name": "DEAD PERSON'S OBJECT",
                  "rule":
                  "A stranger visibly possesses an ordinary personal object "
                  "belonging to someone the protagonist knows is dead."
              },

              {
                  "id": 3,
                  "name": "IMPOSSIBLE VISIT",
                  "rule":
                  "A stranger is already inside a familiar place and calmly "
                  "claims they visited recently when access was impossible."
              },

              {
                  "id": 4,
                  "name": "PRIVATE MEMORY",
                  "rule":
                  "An unfamiliar adult knows one extremely specific private "
                  "event that only someone present could know."
              },

              {
                  "id": 5,
                  "name": "WRONG OWNER",
                  "rule":
                  "A stranger confidently treats a deeply personal possession "
                  "as theirs and reveals knowledge proving unusual familiarity."
              },

              {
                  "id": 6,
                  "name": "WRONG ROOM",
                  "rule":
                  "An adult is visibly occupying a private room or workplace "
                  "where they should have no reason or permission to be."
              },

              {
                  "id": 7,
                  "name": "IMPOSSIBLE INSTRUCTION",
                  "rule":
                  "An adult performs a very specific ordinary action because "
                  "someone who could not communicate with them supposedly "
                  "instructed them."
              },

              {
                  "id": 8,
                  "name": "UNWELCOME GUEST",
                  "rule":
                  "A stranger is already comfortably inside a familiar home "
                  "and behaves as though the household expected them."
              },

              {
                  "id": 9,
                  "name": "IMPOSSIBLE RELATIONSHIP",
                  "rule":
                  "A stranger claims a close personal relationship that the "
                  "protagonist knows cannot exist."
              },

              {
                  "id": 10,
                  "name": "CONTRADICTORY CONVERSATION",
                  "rule":
                  "One adult refers to a private conversation that supposedly "
                  "happened while the other adult was physically elsewhere."
              },

              {
                  "id": 11,
                  "name": "IMPOSSIBLE DELIVERY",
                  "rule":
                  "A delivery person hands over something supposedly ordered "
                  "by someone who could not have ordered it."
              },

              {
                  "id": 12,
                  "name": "WRONG TIME",
                  "rule":
                  "A stranger knows they were physically present at a location "
                  "at a time when access was impossible."
              },

              {
                  "id": 13,
                  "name": "FUTURE WARNING",
                  "rule":
                  "A stranger visibly warns the protagonist about a very "
                  "specific private event that has not happened yet."
              },

              {
                  "id": 14,
                  "name": "PRIVATE NAME",
                  "rule":
                  "A stranger addresses the protagonist using an extremely "
                  "private nickname almost nobody knows."
              },

              {
                  "id": 15,
                  "name": "FAMILIAR ROUTINE",
                  "rule":
                  "A stranger performs a highly personal household routine "
                  "belonging to someone close to the protagonist."
              },

              {
                  "id": 16,
                  "name": "OTHER WITNESS",
                  "rule":
                  "A stranger describes an event that supposedly happened "
                  "while the protagonist was alone with another adult."
              },

              {
                  "id": 17,
                  "name": "WRONG DESTINATION",
                  "rule":
                  "A stranger arrives at a normal location and says the "
                  "protagonist personally sent them there."
              },

              {
                  "id": 18,
                  "name": "IMPOSSIBLE FAMILIARITY",
                  "rule":
                  "A stranger behaves inside a home as if they have lived "
                  "there before, knowing exactly where ordinary things are."
              },

              {
                  "id": 19,
                  "name": "PRIVATE PHYSICAL DETAIL",
                  "rule":
                  "A stranger knows a concealed physical detail about the "
                  "home or workplace that nobody should know."
              },

              {
                  "id": 20,
                  "name": "CALM INTRUDER",
                  "rule":
                  "A clearly misplaced adult intruder behaves calmly and "
                  "treats the frightened homeowner as though the homeowner "
                  "is the one behaving strangely."
              }

          ]


          # ============================================================
          # STAGE 1
          # GENERATE 10 CANDIDATES
          # ============================================================

          candidate_prompt = f"""

          You are the concept architect for The Quiet Vault.

          {CREATIVE_DNA}

          Generate EXACTLY 10 horror concepts.

          Every concept must use a DIFFERENT mechanism from the supplied
          mechanism library.

          Do not invent additional mechanisms.

          ============================================================
          MECHANISM LIBRARY
          ============================================================

          {json.dumps(MECHANISMS, indent=2)}

          ============================================================
          CRITICAL
          ============================================================

          These are concepts, NOT finished scripts.

          Think visually first.

          Every concept must answer:

          1. What does the viewer see in frame 1?

          2. What adult human threat or disturbing adult situation is
             visible?

          3. What is the one contradiction?

          4. What second piece of information appears at the end?

          ============================================================
          FRAME 1
          ============================================================

          static_frame_1 must describe an actual frozen video frame.

          It must contain:

          - location
          - protagonist
          - visible adult threat or anomaly
          - important physical detail

          Do not describe an action that happens later.

          BAD:

          "A woman opens the door and sees a man."

          GOOD:

          "A woman stands frozen in her bedroom doorway while an unfamiliar "
          "adult man is already sitting on her bed holding her house keys."

          ============================================================
          IMPORTANT
          ============================================================

          The concept must still make visual sense without narration.

          Do not rely on:

          dates
          tiny labels
          phone screens
          text messages
          reflections
          complicated backstory

          ============================================================
          RETURN EXACTLY THIS JSON STRUCTURE
          ============================================================

          {{
            "candidates": [
              {{
                "id": 1,
                "mechanism_id": 1,
                "title": "...",
                "premise": "...",
                "static_frame_1": "...",
                "visible_threat": "...",
                "contradiction": "...",
                "ending": "..."
              }}
            ]
          }}

          Return ONLY valid JSON.
          """


          generated = groq_request(

              [
                  {
                      "role": "system",
                      "content":
                      "You are a strict visual horror concept architect. "
                      "Return JSON only."
                  },

                  {
                      "role": "user",
                      "content":
                      candidate_prompt
                  }
              ],

              "quiet_vault_candidates",

              None,

              0.80,

              5000,

              False
          )


          if not isinstance(
              generated,
              dict
          ):

              raise RuntimeError(
                  "Candidate response was not a JSON object."
              )


          candidates = generated.get(
              "candidates",
              []
          )


          if not isinstance(
              candidates,
              list
          ):

              raise RuntimeError(
                  "Candidate response did not contain a valid candidates array."
              )


          print("")
          print("==========================================")
          print("CANDIDATE GENERATION")
          print("==========================================")
          print(
              "Candidates returned:",
              len(candidates)
          )


          # ============================================================
          # PYTHON STRUCTURAL VALIDATION
          # ============================================================

          required_fields = [

              "id",
              "mechanism_id",
              "title",
              "premise",
              "static_frame_1",
              "visible_threat",
              "contradiction",
              "ending"

          ]


          valid_candidates = []


          for candidate in candidates:

              if not isinstance(
                  candidate,
                  dict
              ):

                  continue


              missing = [

                  field
                  for field in required_fields
                  if field not in candidate

              ]


              if missing:

                  print(
                      "Candidate",
                      candidate.get("id"),
                      "missing:",
                      missing
                  )

                  continue


              valid_candidates.append(
                  candidate
              )


          candidates = valid_candidates[:10]


          if len(candidates) < 8:

              raise RuntimeError(
                  f"Only {len(candidates)} valid candidates returned. "
                  "Need at least 8."
              )


          # ============================================================
          # HARD CREATIVE FILTER
          # ============================================================

          banned_terms = [

              "mirror",
              "reflection",
              "doppelganger",
              "doppelgänger",
              "twin",
              "cctv",
              "elevator",
              "hotel",
              "train",
              "printer",
              "empty chair",
              "video call",
              "video-call",
              "phone screen",
              "phone-screen",
              "ghost",
              "demon",
              "zombie",
              "monster",
              "gore",
              "blood",
              "face distortion",
              "head spins",
              "body transformation",
              "disappear",
              "disappears",
              "reappears",
              "child",
              "children",
              "kid",
              "baby",
              "teenager",
              "teen",
              "minor"
          ]


          def normalize(text):

              return re.sub(
                  r"\s+",
                  " ",
                  str(text).lower()
              ).strip()


          def contains_banned(text):

              text = normalize(text)

              for term in banned_terms:

                  if re.search(
                      r"\b" +
                      re.escape(term) +
                      r"\b",
                      text
                  ):

                      return term

              return None


          hard_survivors = []
          hard_rejected = []


          for candidate in candidates:

              combined = " ".join([

                  candidate["title"],
                  candidate["premise"],
                  candidate["static_frame_1"],
                  candidate["visible_threat"],
                  candidate["contradiction"],
                  candidate["ending"]

              ])


              banned = contains_banned(
                  combined
              )


              if banned:

                  hard_rejected.append({

                      "id":
                      candidate["id"],

                      "title":
                      candidate["title"],

                      "reason":
                      "banned term: " + banned

                  })

                  continue


              frame = normalize(
                  candidate["static_frame_1"]
              )


              weak_frame_phrases = [

                  "walks into",
                  "walk into",
                  "enters the",
                  "opens the door",
                  "opening the door",
                  "looks around",
                  "stands alone",
                  "empty room",
                  "dark hallway",
                  "dim hallway",
                  "normal room",
                  "ordinary room",
                  "camera shows"
              ]


              weak = None


              for phrase in weak_frame_phrases:

                  if phrase in frame:

                      weak = phrase
                      break


              if weak:

                  hard_rejected.append({

                      "id":
                      candidate["id"],

                      "title":
                      candidate["title"],

                      "reason":
                      "weak first frame: " + weak

                  })

                  continue


              if len(frame.split()) < 18:

                  hard_rejected.append({

                      "id":
                      candidate["id"],

                      "title":
                      candidate["title"],

                      "reason":
                      "first frame too vague"

                  })

                  continue


              threat = normalize(
                  candidate["visible_threat"]
              )


              if len(threat.split()) < 9:

                  hard_rejected.append({

                      "id":
                      candidate["id"],

                      "title":
                      candidate["title"],

                      "reason":
                      "visible threat too vague"

                  })

                  continue


              contradiction = normalize(
                  candidate["contradiction"]
              )


              if len(contradiction.split()) < 8:

                  hard_rejected.append({

                      "id":
                      candidate["id"],

                      "title":
                      candidate["title"],

                      "reason":
                      "contradiction too weak"

                  })

                  continue


              hard_survivors.append(
                  candidate
              )


          print("")
          print("==========================================")
          print("HARD FILTER")
          print("==========================================")

          print(
              "Survivors:",
              len(hard_survivors)
          )

          print(
              "Rejected:",
              len(hard_rejected)
          )


          for item in hard_rejected:

              print(
                  "REJECTED:",
                  item["id"],
                  item["title"],
                  "->",
                  item["reason"]
              )


          if len(hard_survivors) < 5:

              raise RuntimeError(
                  "Fewer than 5 concepts survived the hard visual filter."
              )


          # ============================================================
          # PROTECT GROQ TPM
          # ============================================================

          print("")
          print(
              "Waiting 65 seconds before creative judging..."
          )

          time.sleep(65)


          # ============================================================
          # STAGE 2
          # CREATIVE JUDGE
          # ============================================================

          judge_schema = {

              "type": "object",

              "properties": {

                  "judgements": {

                      "type": "array",

                      "items": {

                          "type": "object",

                          "properties": {

                              "id": {
                                  "type": "integer"
                              },

                              "hook": {
                                  "type": "integer"
                              },

                              "visible_threat": {
                                  "type": "integer"
                              },

                              "clarity": {
                                  "type": "integer"
                              },

                              "contradiction": {
                                  "type": "integer"
                              },

                              "ending": {
                                  "type": "integer"
                              },

                              "flow": {
                                  "type": "integer"
                              },

                              "rewatch": {
                                  "type": "integer"
                              },

                              "originality": {
                                  "type": "integer"
                              },

                              "pass": {
                                  "type": "boolean"
                              },

                              "reason": {
                                  "type": "string"
                              }

                          },

                          "required": [

                              "id",
                              "hook",
                              "visible_threat",
                              "clarity",
                              "contradiction",
                              "ending",
                              "flow",
                              "rewatch",
                              "originality",
                              "pass",
                              "reason"

                          ],

                          "additionalProperties": False
                      }
                  }
              },

              "required": [
                  "judgements"
              ],

              "additionalProperties": False
          }


          judge_prompt = f"""

          You are the ruthless final creative gate for The Quiet Vault.

          {CREATIVE_DNA}

          Judge EVERY candidate.

          Do not reward clever writing.

          Judge the actual visual concept.

          ============================================================
          HOOK — 1 TO 10
          ============================================================

          Judge static_frame_1 only.

          10 = immediately disturbing screenshot.

          8 = clearly wrong and compelling.

          6 = unusual but requires explanation.

          4 = mostly normal.

          1 = no visible hook.

          Minimum PASS = 8.

          ============================================================
          VISIBLE THREAT — 1 TO 10
          ============================================================

          Is the disturbing adult situation physically visible?

          10 = unmistakable.

          8 = clearly visible.

          Below 8 = FAIL.

          ============================================================
          CLARITY — 1 TO 10
          ============================================================

          Does the viewer immediately understand the basic problem?

          Below 8 = FAIL.

          ============================================================
          CONTRADICTION — 1 TO 10
          ============================================================

          Is there one simple impossible contradiction?

          Below 8 = FAIL.

          ============================================================
          ENDING — 1 TO 10
          ============================================================

          Does the final beat add a second realization?

          Below 8 = FAIL.

          ============================================================
          FLOW — 1 TO 10
          ============================================================

          Can Google Flow realistically create this?

          Below 8 = FAIL.

          ============================================================
          REWATCH — 1 TO 10
          ============================================================

          Does replay make the viewer notice something else?

          Minimum 7.

          ============================================================
          ORIGINALITY — 1 TO 10
          ============================================================

          Does it avoid our recently rejected mechanisms?

          Minimum 7.

          ============================================================
          PASS REQUIREMENT
          ============================================================

          A candidate passes ONLY if:

          hook >= 8
          visible_threat >= 8
          clarity >= 8
          contradiction >= 8
          ending >= 8
          flow >= 8
          rewatch >= 7
          originality >= 7

          AND

          it feels like actual horror rather than a mystery puzzle.

          Return ONLY JSON.

          CANDIDATES:

          {json.dumps(hard_survivors, indent=2, ensure_ascii=False)}
          """


          judged = groq_request(

              [
                  {
                      "role": "system",
                      "content":
                      "You are a ruthless horror Shorts creative director."
                  },

                  {
                      "role": "user",
                      "content":
                      judge_prompt
                  }
              ],

              "quiet_vault_judge",

              judge_schema,

              0.25,

              5000,

              True
          )


          judgements = judged.get(
              "judgements",
              []
          )


          judgement_map = {

              item["id"]:
              item

              for item in judgements

          }


          finalists = []


          for candidate in hard_survivors:

              judgment = judgement_map.get(
                  candidate["id"]
              )


              if judgment and judgment["pass"]:

                  finalists.append(
                      candidate
                  )


          # ============================================================
          # RANK FINALISTS
          # ============================================================

          def score(candidate):

              j = judgement_map[
                  candidate["id"]
              ]

              return (

                  j["hook"] * 4
                  + j["visible_threat"] * 3
                  + j["clarity"] * 2
                  + j["contradiction"] * 2
                  + j["ending"] * 3
                  + j["flow"]
                  + j["rewatch"] * 2
                  + j["originality"]

              )


          finalists.sort(
              key=score,
              reverse=True
          )


          print("")
          print("==========================================")
          print("CREATIVE JUDGE")
          print("==========================================")


          for item in judgements:

              print(

                  "ID:",
                  item["id"],

                  "| PASS:",
                  item["pass"],

                  "| Hook:",
                  item["hook"],

                  "| Threat:",
                  item["visible_threat"],

                  "| Clarity:",
                  item["clarity"],

                  "| Ending:",
                  item["ending"],

                  "| Rewatch:",
                  item["rewatch"],

                  "| Reason:",
                  item["reason"]

              )


          if len(finalists) < 3:

              raise RuntimeError(

                  "Fewer than 3 concepts passed the creative gate. "
                  "Workflow intentionally stopped instead of using weak ideas."

              )


          finalists = finalists[:3]


          print("")
          print("==========================================")
          print("APPROVED FINALISTS")
          print("==========================================")


          for item in finalists:

              print(
                  item["id"],
                  item["title"]
              )


          # ============================================================
