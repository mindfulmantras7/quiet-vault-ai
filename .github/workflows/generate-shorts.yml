name: Quiet Vault AI V8 - Script Skeleton Engine

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 <<'PY'
          import os
          import json
          import re
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path

          API_KEY = os.environ["GROQ_API_KEY"]
          RUN_NUMBER = int(os.environ.get("RUN_NUMBER", "1"))

          URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          # ============================================================
          # QUIET VAULT V8
          #
          # IMPORTANT:
          # These are COMPLETE HORROR SKELETONS.
          #
          # Groq is NOT allowed to invent the horror.
          # It only turns the skeleton into natural dialogue/narration.
          # ============================================================

          SKELETONS = [

              {
                  "id": 1,
                  "title_seed": "The Woman in My Kitchen",
                  "location": "modern apartment kitchen",
                  "frame_1": (
                      "An adult man opens his kitchen door and immediately "
                      "sees an unfamiliar adult woman calmly cooking at his stove."
                  ),
                  "setup": (
                      "The woman is using the protagonist's wife's favorite recipe."
                  ),
                  "line_1": "Who are you?",
                  "line_2": "Your wife asked me to finish dinner.",
                  "fact": (
                      "The protagonist's wife is currently sitting beside him "
                      "in the living room."
                  ),
                  "final_line": (
                      "She told me to come in through the back door."
                  )
              },

              {
                  "id": 2,
                  "title_seed": "The Bedroom Door",
                  "location": "apartment bedroom doorway",
                  "frame_1": (
                      "An adult woman arrives home and sees an unfamiliar adult "
                      "man calmly walking out of her locked bedroom."
                  ),
                  "setup": (
                      "The protagonist locked the bedroom before leaving."
                  ),
                  "line_1": "How did you get in there?",
                  "line_2": "Your husband let me in.",
                  "fact": (
                      "The protagonist's husband is currently away on a "
                      "business trip and has been gone since yesterday."
                  ),
                  "final_line": (
                      "He was waiting for me when I arrived this morning."
                  )
              },

              {
                  "id": 3,
                  "title_seed": "The Dead Man's Watch",
                  "location": "quiet apartment kitchen",
                  "frame_1": (
                      "An adult man finds an unfamiliar adult sitting at his "
                      "kitchen table wearing his deceased father's watch."
                  ),
                  "setup": (
                      "The watch was buried with his father."
                  ),
                  "line_1": "Where did you get that watch?",
                  "line_2": "Your father gave it to me last night.",
                  "fact": (
                      "His father died three years ago."
                  ),
                  "final_line": (
                      "He said you'd know where to find me."
                  )
              },

              {
                  "id": 4,
                  "title_seed": "The Locked Office",
                  "location": "private home office",
                  "frame_1": (
                      "An adult woman opens her locked home office and finds "
                      "an unfamiliar adult man sitting at her desk."
                  ),
                  "setup": (
                      "Her personal notebook is open in front of him."
                  ),
                  "line_1": "Who are you?",
                  "line_2": "You asked me to come over this morning.",
                  "fact": (
                      "She has been working alone from home all morning and "
                      "never invited anyone."
                  ),
                  "final_line": (
                      "You even left the door unlocked for me."
                  )
              },

              {
                  "id": 5,
                  "title_seed": "The Dinner Guest",
                  "location": "family dining room",
                  "frame_1": (
                      "An adult man walks into his dining room and sees an "
                      "unfamiliar adult woman sitting in his wife's usual chair."
                  ),
                  "setup": (
                      "She is eating the exact meal his wife always orders."
                  ),
                  "line_1": "Who invited you?",
                  "line_2": "Your wife did.",
                  "fact": (
                      "His wife is standing in the doorway and visibly "
                      "does not recognize the woman."
                  ),
                  "final_line": (
                      "She called me from this room ten minutes ago."
                  )
              },

              {
                  "id": 6,
                  "title_seed": "The Neighbor's Key",
                  "location": "front doorway of a suburban home",
                  "frame_1": (
                      "An adult woman opens her front door and sees her neighbor "
                      "standing there holding a working copy of her house key."
                  ),
                  "setup": (
                      "She has never given him a key."
                  ),
                  "line_1": "Where did you get that?",
                  "line_2": "Your wife gave me the copy yesterday.",
                  "fact": (
                      "Her wife died six months ago."
                  ),
                  "final_line": (
                      "She told me to keep it until you came home."
                  )
              },

              {
                  "id": 7,
                  "title_seed": "The Photograph",
                  "location": "apartment hallway",
                  "frame_1": (
                      "An adult man opens his apartment door and finds an "
                      "unfamiliar adult holding a printed photograph of him asleep."
                  ),
                  "setup": (
                      "The photograph was taken inside his locked bedroom."
                  ),
                  "line_1": "Where did you get that?",
                  "line_2": "You gave it to me yesterday.",
                  "fact": (
                      "He has never met the stranger."
                  ),
                  "final_line": (
                      "You were asleep when you handed it to me."
                  )
              },

              {
                  "id": 8,
                  "title_seed": "Someone in My Garage",
                  "location": "private home garage",
                  "frame_1": (
                      "An adult man enters his locked garage and sees an "
                      "unfamiliar adult working on his father's old motorcycle."
                  ),
                  "setup": (
                      "Nobody else has access to the garage."
                  ),
                  "line_1": "Get away from that.",
                  "line_2": "Your father asked me to repair it.",
                  "fact": (
                      "His father died before the motorcycle was purchased."
                  ),
                  "final_line": (
                      "He said you'd understand when you saw the bike."
                  )
              },

              {
                  "id": 9,
                  "title_seed": "The Wrong Apartment",
                  "location": "apartment living room",
                  "frame_1": (
                      "An adult woman walks into her apartment and finds an "
                      "unfamiliar adult man sitting comfortably on her sofa."
                  ),
                  "setup": (
                      "He is holding a cup from her kitchen."
                  ),
                  "line_1": "How did you get inside?",
                  "line_2": "You let me in last night.",
                  "fact": (
                      "She spent last night alone in a hotel in another city."
                  ),
                  "final_line": (
                      "You were wearing the same clothes."
                  )
              },

              {
                  "id": 10,
                  "title_seed": "The Private Name",
                  "location": "apartment hallway",
                  "frame_1": (
                      "An adult woman finds an unfamiliar adult man standing "
                      "inside her locked apartment."
                  ),
                  "setup": (
                      "He greets her using a private childhood nickname."
                  ),
                  "line_1": "Who told you that name?",
                  "line_2": "Your sister did.",
                  "fact": (
                      "Her sister died before the stranger could ever have met her."
                  ),
                  "final_line": (
                      "She told me last night."
                  )
              },

              {
                  "id": 11,
                  "title_seed": "The Spare Room",
                  "location": "home spare bedroom",
                  "frame_1": (
                      "An adult man opens his spare bedroom and finds an "
                      "unfamiliar adult woman neatly making the bed."
                  ),
                  "setup": (
                      "The room has been locked and unused for months."
                  ),
                  "line_1": "What are you doing here?",
                  "line_2": "Your wife said I could stay.",
                  "fact": (
                      "His wife is away visiting her mother and has not been "
                      "home for three days."
                  ),
                  "final_line": (
                      "She made the bed for me before she left."
                  )
              },

              {
                  "id": 12,
                  "title_seed": "The Man at My Desk",
                  "location": "private office",
                  "frame_1": (
                      "An adult woman enters her office and sees an unfamiliar "
                      "adult man sitting in her chair reading her private notebook."
                  ),
                  "setup": (
                      "The notebook contains a private sentence she wrote that morning."
                  ),
                  "line_1": "Put that down.",
                  "line_2": "You wanted me to read it.",
                  "fact": (
                      "She wrote the sentence less than ten minutes ago "
                      "and has not shown it to anyone."
                  ),
                  "final_line": (
                      "You wrote the next sentence too."
                  )
              }
          ]

          # Rotate five skeletons per run.
          start = ((RUN_NUMBER - 1) * 5) % len(SKELETONS)
          selected = [
              SKELETONS[(start + i) % len(SKELETONS)]
              for i in range(5)
          ]

          print("==========================================")
          print("QUIET VAULT AI V8")
          print("SCRIPT SKELETON ENGINE")
          print("==========================================")
          print(f"RUN: {RUN_NUMBER}")
          print()

          for i, s in enumerate(selected, 1):
              print(f"{i}. {s['title_seed']}")

          # ============================================================
          # GROQ
          # ============================================================

          def groq_call(prompt, retries=3):

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "You are a short-form horror script editor. "
                              "You must preserve the supplied events and "
                              "contradiction exactly. You are NOT allowed "
                              "to invent a new twist."
                          )
                      },
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "temperature": 0.45,
                  "max_completion_tokens": 2300,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden",
                  "response_format": {
                      "type": "json_object"
                  }
              }

              body = json.dumps(payload).encode("utf-8")

              for attempt in range(retries):

                  req = urllib.request.Request(
                      URL,
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}",
                          "User-Agent": "QuietVaultAI/1.0"
                      },
                      method="POST"
                  )

                  try:

                      with urllib.request.urlopen(
                          req,
                          timeout=90
                      ) as response:

                          raw = response.read().decode("utf-8")
                          result = json.loads(raw)

                          content = (
                              result["choices"][0]["message"]
                              .get("content")
                          )

                          if not content:
                              raise RuntimeError(
                                  "Groq returned empty content"
                              )

                          return content

                  except urllib.error.HTTPError as e:

                      error_body = e.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

                      if e.code == 429:

                          retry_after = e.headers.get("retry-after")

                          try:
                              wait = max(
                                  15,
                                  float(retry_after)
                              )
                          except:
                              wait = 20

                          print(
                              f"RATE LIMITED. Waiting "
                              f"{wait:.1f}s..."
                          )

                          time.sleep(wait)
                          continue

                      print(f"GROQ HTTP {e.code}")
                      print(error_body[:1000])
                      raise

                  except Exception as e:

                      print(f"Groq error: {e}")

                      if attempt < retries - 1:
                          time.sleep(5)
                      else:
                          raise

          # ============================================================
          # ONE SMALL GENERATION CALL
          # ============================================================

          scenario_text = ""

          for i, s in enumerate(selected, 1):

              scenario_text += f"""

          STORY {i}

          TITLE IDEA:
          {s['title_seed']}

          LOCATION:
          {s['location']}

          FRAME 1:
          {s['frame_1']}

          SETUP:
          {s['setup']}

          FIRST LINE:
          {s['line_1']}

          SECOND LINE:
          {s['line_2']}

          IMPORTANT FACT:
          {s['fact']}

          REQUIRED FINAL LINE:
          {s['final_line']}

          """

          prompt = f"""
          Turn these five COMPLETE horror skeletons into five
          natural 9-12 second YouTube Shorts.

          {scenario_text}

          ============================================================
          NON-NEGOTIABLE
          ============================================================

          DO NOT change the underlying story.

          DO NOT invent a different twist.

          DO NOT introduce supernatural creatures.

          DO NOT add another character.

          DO NOT add another reveal.

          DO NOT turn any object magical.

          Preserve the supplied contradiction.

          You may rearrange words slightly so the dialogue sounds
          natural, but the meaning must remain the same.

          Each script must be approximately 30-42 spoken words.

          The threat must be visible in frame 1.

          The final line must be the supplied REQUIRED FINAL LINE
          or a very small natural grammatical variation of it.

          ============================================================
          BANNED
          ============================================================

          children
          minors
          babies
          ghosts
          demons
          monsters
          zombies
          mirrors
          reflections
          twins
          doubles
          doppelgangers
          clones
          gore
          blood
          body distortion
          disappearing people
          magical objects
          object transformations
          CCTV
          surveillance
          phone-screen horror
          dream explanation
          simulation explanation

          ============================================================
          OUTPUT
          ============================================================

          Return ONLY valid JSON:

          {{
            "stories": [
              {{
                "id": 1,
                "title": "final title",
                "script": "30-42 word script",
                "visual_hook": "exact first-frame visual"
              }},
              {{
                "id": 2,
                "title": "final title",
                "script": "30-42 word script",
                "visual_hook": "exact first-frame visual"
              }},
              {{
                "id": 3,
                "title": "final title",
                "script": "30-42 word script",
                "visual_hook": "exact first-frame visual"
              }},
              {{
                "id": 4,
                "title": "final title",
                "script": "30-42 word script",
                "visual_hook": "exact first-frame visual"
              }},
              {{
                "id": 5,
                "title": "final title",
                "script": "30-42 word script",
                "visual_hook": "exact first-frame visual"
              }}
            ]
          }}
          """

          print()
          print("GENERATING FIVE FIXED-SKELETON STORIES...")
          print()

          raw = groq_call(prompt)

          try:
              data = json.loads(raw)
          except Exception as e:
              print("INVALID JSON")
              print(raw[:3000])
              raise RuntimeError(str(e))

          stories = data.get("stories", [])

          if not isinstance(stories, list):
              raise RuntimeError("stories is not a list")

          print(f"GENERATED: {len(stories)}")

          # ============================================================
          # VALIDATION
          # ============================================================

          banned_words = [
              "child",
              "children",
              "kid",
              "baby",
              "minor",
              "ghost",
              "demon",
              "monster",
              "zombie",
              "mirror",
              "reflection",
              "doppelganger",
              "twin",
              "clone",
              "double",
              "gore",
              "blood",
              "corpse",
              "disappear",
              "vanish",
              "teleport",
              "cctv",
              "surveillance",
              "phone screen",
              "video call"
          ]

          weak_phrases = [
              "something felt wrong",
              "something was wrong",
              "i felt watched",
              "she felt watched",
              "he felt watched",
              "eerie feeling",
              "strange feeling",
              "darkness",
              "i realized",
              "she realized",
              "he realized"
          ]

          def validate(story, skeleton):

              required = [
                  "id",
                  "title",
                  "script",
                  "visual_hook"
              ]

              if not all(
                  field in story
                  for field in required
              ):
                  return False, "missing field"

              script = str(
                  story["script"]
              ).strip()

              hook = str(
                  story["visual_hook"]
              ).strip()

              words = script.split()

              if len(words) < 25:
                  return False, "script too short"

              if len(words) > 48:
                  return False, "script too long"

              combined = (
                  script + " " + hook
              ).lower()

              for banned in banned_words:

                  if re.search(
                      r"\b" + re.escape(banned) + r"\b",
                      combined
                  ):
                      return False, (
                          f"banned word: {banned}"
                      )

              for weak in weak_phrases:

                  if weak in combined:
                      return False, (
                          f"weak phrase: {weak}"
                      )

              # The hook must show a person.
              if not any(
                  x in hook.lower()
                  for x in [
                      "man",
                      "woman",
                      "stranger",
                      "adult",
                      "neighbor",
                      "person",
                      "visitor"
                  ]
              ):
                  return False, "no visible adult"

              # Require important words from the skeleton
              # to survive the rewrite.
              important = []

              for source in [
                  skeleton["fact"],
                  skeleton["final_line"]
              ]:

                  source_words = re.findall(
                      r"\b[a-zA-Z]{5,}\b",
                      source.lower()
                  )

                  important.extend(
                      source_words[:4]
                  )

              matches = 0

              for word in important:

                  if word in combined:
                      matches += 1

              if matches < 2:
                  return False, (
                      "contradiction changed too much"
                  )

              return True, "PASS"

          approved = []

          print()
          print("VALIDATING FIXED SKELETONS...")
          print()

          for story in stories:

              story_id = story.get("id")

              if not isinstance(
                  story_id,
                  int
              ):
                  print(
                      "REJECT: invalid story id"
                  )
                  continue

              matching = [
                  s for s in selected
                  if s["id"] == story_id
              ]

              if not matching:
                  print(
                      f"REJECT: {story.get('title','UNTITLED')} "
                      "-> invalid skeleton"
                  )
                  continue

              skeleton = matching[0]

              ok, reason = validate(
                  story,
                  skeleton
              )

              if ok:

                  print(
                      f"PASS: {story['title']}"
                  )

                  approved.append(
                      (story, skeleton)
                  )

              else:

                  print(
                      f"REJECT: {story.get('title','UNTITLED')} "
                      f"-> {reason}"
                  )

          # ============================================================
          # MAXIMUM THREE
          # ============================================================

          approved = approved[:3]

          print()
          print("==========================================")
          print(
              f"APPROVED: {len(approved)}"
          )
          print("==========================================")

          # ============================================================
          # FLOW PROMPTS
          # ============================================================

          def build_flow(story, skeleton):

              return f"""
          Create a 9-12 second vertical 9:16
          photorealistic live-action horror Short.

          Fictional adult characters only.
          No children.
          No celebrity or real-person likeness.

          CRITICAL FIRST FRAME:

          {skeleton['frame_1']}

          The threatening adult must be clearly visible
          in the first frame.

          LOCATION:

          {skeleton['location']}

          STORY:

          {story['script']}

          FINAL BEAT:

          {skeleton['final_line']}

          Use realistic adult actors, natural movement,
          realistic facial expressions and believable
          cinematic lighting.

          Keep the camera simple.

          No slow establishing shot.

          Do not add extra characters.

          Do not add extra plot.

          Do not invent another twist.

          No ghosts.
          No demons.
          No monsters.
          No mirrors.
          No reflections.
          No twins.
          No doppelgangers.
          No clones.
          No children.
          No gore.
          No blood.
          No CCTV.
          No phone-screen horror.
          No disappearing people.
          No magical objects.

          Keep the horror completely grounded in the
          human situation.

          End immediately after the final line.
          """

          # ============================================================
          # WRITE OUTPUT
          # ============================================================

          out = Path(
              "quiet-vault-output"
          )

          out.mkdir(
              exist_ok=True
          )

          final = []

          for index, pair in enumerate(
              approved,
              1
          ):

              story, skeleton = pair

              item = {
                  "title": story["title"],
                  "script": story["script"],
                  "visual_hook": story["visual_hook"],
                  "flow_prompt": build_flow(
                      story,
                      skeleton
                  ),
                  "final_twist": skeleton[
                      "final_line"
                  ],
                  "description": (
                      "A realistic human horror encounter "
                      "with one impossible detail. "
                      "Watch until the final line."
                  ),
                  "keywords": (
                      "horror, horror shorts, scary stories, "
                      "scary shorts, horror stories, "
                      "psychological horror, realistic horror, "
                      "creepy stories, suspense horror, "
                      "short horror stories, horror storytelling, "
                      "The Quiet Vault"
                  ),
                  "hashtags": (
                      "#horror #horrorshorts #scarystories "
                      "#psychologicalhorror #creepy #shorts"
                  ),
                  "thumbnail_frame": (
                      "Use the first frame showing the "
                      "visible adult threat. "
                      f"Optional text: {story['title']}"
                  ),
                  "sound_design": (
                      "Natural room ambience, subtle realistic "
                      "movement sounds, restrained tension, "
                      "quiet dialogue, then a sharp sound or "
                      "hard silence immediately after the final line."
                  ),
                  "pinned_comment": (
                      "At what second did you realize something "
                      "was seriously wrong?"
                  )
              }

              final.append(item)

              md = f"""# {item['title']}

          ## Script

          {item['script']}

          ## Google Flow Prompt

          {item['flow_prompt']}

          ## Final Twist

          {item['final_twist']}

          ## Description

          {item['description']}

          ## Keywords

          {item['keywords']}

          ## Hashtags

          {item['hashtags']}

          ## Thumbnail

          {item['thumbnail_frame']}

          ## Sound Design

          {item['sound_design']}

          ## Pinned Comment

          {item['pinned_comment']}
          """

              (out / f"short_{index:02d}.md").write_text(
                  md,
                  encoding="utf-8"
              )

          batch = {
              "run_number": RUN_NUMBER,
              "provider": "groq",
              "model": MODEL,
              "engine": "V8 Script Skeleton Engine",
              "generated": len(stories),
              "approved": len(final),
              "shorts": final
          }

          (out / "batch.json").write_text(
              json.dumps(
                  batch,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print()
          print("==========================================")
          print("QUIET VAULT V8 COMPLETE")
          print("==========================================")
          print(
              f"Generated: {len(stories)}"
          )
          print(
              f"Approved:  {len(final)}"
          )
          print()

          for i, item in enumerate(
              final,
              1
          ):
              print(
                  f"{i}. {item['title']}"
              )
              print(
                  f"   {item['script']}"
              )
              print()

          PY

      - name: Upload Shorts
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-v8-shorts
          path: quiet-vault-output/
