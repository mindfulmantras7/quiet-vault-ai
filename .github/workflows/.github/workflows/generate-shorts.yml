name: Generate 3 Quiet Vault Shorts

on:
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate 3 horror Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          from pathlib import Path

          api_key = os.environ.get("GROQ_API_KEY")

          if not api_key:
              print("ERROR: GROQ_API_KEY secret was not found.")
              raise SystemExit(1)

          prompt = r"""
          You are the head writer and creative director for "The Quiet Vault",
          a YouTube Shorts horror channel.

          Generate EXACTLY 3 completely different original horror Shorts.

          IMPORTANT CHANNEL STYLE:

          - Each Short must be 10-15 seconds when produced.
          - Realistic, cinematic, believable horror.
          - Fictional ADULT characters only.
          - No children or minors.
          - No celebrities or real-person likenesses.
          - Recognizable everyday locations.
          - The disturbing visual must be understandable immediately.
          - The threat/anomaly must be VISIBLE, not merely implied.
          - One simple physical contradiction is better than complicated mythology.
          - No gore.
          - No generic demons or monsters.
          - No complicated supernatural explanations.
          - The ending must create an immediate "wait... what?" reaction.
          - The concept must be easy for an AI video generator to visualize.
          - Prefer one strong continuous shot or two simple shots.
          - Avoid long dialogue.
          - Avoid slow introductions.
          - The first frame must already contain something wrong.

          DO NOT reuse these overused mechanisms:
          - elevator horror
          - car horror
          - hotel horror
          - CCTV footage
          - mirror/reflection tricks
          - doppelgängers
          - hidden person behind someone
          - printer horror
          - moving empty chair
          - train horror
          - 180-degree head/face distortion
          - disappearing/reappearing people

          Create THREE different mechanisms and locations.

          Examples of acceptable locations:
          apartment hallway, bathroom, supermarket, office, parking area,
          staircase, laundromat, restaurant, hospital corridor, rooftop,
          pharmacy, ATM area, public restroom, kitchen, balcony, workplace,
          convenience store, bus stop, building lobby.

          IMPORTANT:
          Do not make all three stories use the same relationship or type of threat.

          Each Short must include:

          1. TITLE
          2. SHORT_SCRIPT
             - narration/dialogue if any
             - maximum approximately 35 spoken words
          3. VISUAL_HOOK
             - describe exactly what is visible in the first frame
          4. FLOW_PROMPT
             - one complete Google Flow prompt ready to paste
             - vertical 9:16
             - photorealistic live-action
             - fictional adult characters
             - no celebrity likeness
             - exact visual action
             - camera movement
             - lighting
             - environment
             - timing
             - ending
             - no text rendered inside the video
          5. FINAL_TWIST
          6. DESCRIPTION
          7. KEYWORDS
             - comma-separated
          8. HASHTAGS
          9. THUMBNAIL_FRAME
             - specify the exact moment/frame to use
          10. THUMBNAIL_TEXT
              - maximum 4 words, or "NONE"

          DESCRIPTION RULES:
          - Write a natural YouTube description.
          - Do not stuff keywords.
          - Do not claim the story is real if it is fictional.
          - Do not mention AI generation.

          KEYWORD RULES:
          - 10-20 relevant keywords.
          - comma-separated.
          - No keyword stuffing.

          FLOW PROMPT RULES:
          - Must be directly usable without additional explanation.
          - Do not ask Flow to create complex reflections.
          - Do not use impossible anatomy.
          - Do not require many characters.
          - Avoid complicated transformations.
          - Make the horror visible through a simple physical event.
          - Maintain consistent adult character appearance throughout.
          - Use natural human movement.
          - Photorealistic live-action cinematic horror.
          - 9:16 vertical.
          - 10-15 second duration.
          - No gore.
          - No monsters.
          - No text, subtitles, logos or watermarks.
          - No real person or celebrity likeness.

          QUALITY RULE:
          Before finalizing each concept, mentally ask:
          "If someone watches the generated video without hearing the narration,
          will they immediately understand that something is wrong?"

          If the answer is no, replace the concept.

          Return ONLY valid JSON using exactly this structure:

          {
            "shorts": [
              {
                "id": 1,
                "title": "...",
                "short_script": "...",
                "visual_hook": "...",
                "flow_prompt": "...",
                "final_twist": "...",
                "description": "...",
                "keywords": "...",
                "hashtags": "...",
                "thumbnail_frame": "...",
                "thumbnail_text": "..."
              },
              {
                "id": 2,
                "title": "...",
                "short_script": "...",
                "visual_hook": "...",
                "flow_prompt": "...",
                "final_twist": "...",
                "description": "...",
                "keywords": "...",
                "hashtags": "...",
                "thumbnail_frame": "...",
                "thumbnail_text": "..."
              },
              {
                "id": 3,
                "title": "...",
                "short_script": "...",
                "visual_hook": "...",
                "flow_prompt": "...",
                "final_twist": "...",
                "description": "...",
                "keywords": "...",
                "hashtags": "...",
                "thumbnail_frame": "...",
                "thumbnail_text": "..."
              }
            ]
          }
          """

          url = "https://api.groq.com/openai/v1/chat/completions"

          data = {
              "model": "openai/gpt-oss-20b",
              "messages": [
                  {
                      "role": "system",
                      "content": "You are an expert horror Shorts writer and must return valid JSON only."
                  },
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "temperature": 0.9,
              "max_completion_tokens": 6000,
              "response_format": {
                  "type": "json_object"
              }
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + api_key,
                  "User-Agent": "QuietVaultAI/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  result = json.loads(response.read())

          except urllib.error.HTTPError as e:
              print("")
              print("===== GROQ API ERROR =====")
              print("HTTP STATUS:", e.code)
              print(e.read().decode("utf-8"))
              print("==========================")
              raise

          content = result["choices"][0]["message"]["content"]

          try:
              output = json.loads(content)
          except json.JSONDecodeError:
              print("ERROR: Groq returned invalid JSON.")
              print(content)
              raise

          shorts = output.get("shorts", [])

          if len(shorts) != 3:
              print("ERROR: Expected exactly 3 Shorts.")
              print("Received:", len(shorts))
              raise SystemExit(1)

          output_dir = Path("quiet-vault-output")
          output_dir.mkdir(exist_ok=True)

          # Save complete JSON
          with open(output_dir / "batch.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          # Create an easy-to-read Markdown file for each Short
          for short in shorts:
              i = short["id"]

              markdown = f"""# THE QUIET VAULT — SHORT {i}

          ## TITLE

          {short["title"]}

          ## SHORT SCRIPT

          {short["short_script"]}

          ## VISUAL HOOK

          {short["visual_hook"]}

          ## GOOGLE FLOW PROMPT

          {short["flow_prompt"]}

          ## FINAL TWIST

          {short["final_twist"]}

          ## DESCRIPTION

          {short["description"]}

          ## KEYWORDS

          {short["keywords"]}

          ## HASHTAGS

          {short["hashtags"]}

          ## THUMBNAIL FRAME

          {short["thumbnail_frame"]}

          ## THUMBNAIL TEXT

          {short["thumbnail_text"]}
          """

              with open(
                  output_dir / f"short_{i:02d}.md",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(markdown)

          print("")
          print("========================================")
          print("   QUIET VAULT — 3 SHORTS GENERATED")
          print("========================================")
          print("")

          for short in shorts:
              print(f'{short["id"]}. {short["title"]}')

          print("")
          print("Files created:")
          print("  short_01.md")
          print("  short_02.md")
          print("  short_03.md")
          print("  batch.json")
          print("")
          print("========================================")

      - name: Upload generated Shorts package
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vault-3-shorts
          path: quiet-vault-output/
          retention-days: 7
