name: Provider Diagnostic Test

on:
  workflow_dispatch:

jobs:
  provider-test:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # TEST GROQ
      # ==========================================
      - name: Test Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "================================"
          echo "TESTING GROQ"
          echo "================================"

          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          api_key = os.environ["GROQ_API_KEY"]

          url = "https://api.groq.com/openai/v1/chat/completions"

          payload = {
              "model": "openai/gpt-oss-20b",
              "messages": [
                  {
                      "role": "user",
                      "content": "Reply with exactly: GROQ_OK"
                  }
              ],
              "max_tokens": 10
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {api_key}",
                  "User-Agent": "QuietVaultProviderTest/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read().decode("utf-8")
                  data = json.loads(body)

                  text = data["choices"][0]["message"]["content"].strip()

                  print("Groq HTTP:", response.status)
                  print("Groq response:", text)
                  print("GROQ_TEST_SUCCESS")

          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8")

              print("Groq HTTP ERROR:", error.code)
              print("Groq response:", body)

              # Do not stop the entire diagnostic.
              print("GROQ_TEST_FAILED")

          except Exception as error:
              print("Groq unexpected error:", repr(error))
              print("GROQ_TEST_FAILED")


      # ==========================================
      # TEST GEMINI
      # ==========================================
      - name: Test Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "================================"
          echo "TESTING GEMINI"
          echo "================================"

          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          api_key = os.environ["GEMINI_API_KEY"]

          # CURRENT GEMINI MODEL
          model = "gemini-3.5-flash-lite"

          url = (
              "https://generativelanguage.googleapis.com/"
              f"v1beta/models/{model}:generateContent"
          )

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": "Reply with exactly: GEMINI_OK"
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "maxOutputTokens": 10
              }
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key,
                  "User-Agent": "QuietVaultProviderTest/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read().decode("utf-8")
                  data = json.loads(body)

                  text = (
                      data["candidates"][0]
                      ["content"]
                      ["parts"][0]
                      ["text"]
                      .strip()
                  )

                  print("Gemini HTTP:", response.status)
                  print("Gemini response:", text)
                  print("GEMINI_TEST_SUCCESS")

          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8")

              print("Gemini HTTP ERROR:", error.code)
              print("Gemini response:", body)
              print("GEMINI_TEST_FAILED")

          except Exception as error:
              print("Gemini unexpected error:", repr(error))
              print("GEMINI_TEST_FAILED")


      # ==========================================
      # FINISH
      # ==========================================
      - name: Diagnostic Complete
        run: |
          echo ""
          echo "================================"
          echo "PROVIDER DIAGNOSTIC COMPLETE"
          echo "================================"
          echo "Both providers were tested."
          echo "Check the two sections above."
