name: Quiet Vault AI Test

on:
  workflow_dispatch:

jobs:
  test-groq:
    runs-on: ubuntu-latest

    steps:
      - name: Test Groq API
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          api_key = os.environ.get("GROQ_API_KEY")

          if not api_key:
              print("ERROR: GROQ_API_KEY secret was not found.")
              raise SystemExit(1)

          prompt = """
          Create ONE original 10-15 second horror Short concept for
          The Quiet Vault YouTube channel.

          Requirements:
          - Realistic cinematic horror
          - Fictional adult characters only
          - No celebrities or real-person likenesses
          - Recognizable everyday location
          - The disturbing visual must be obvious immediately
          - One simple physical contradiction
          - No gore
          - No monsters
          - Strong unexpected twist
          - Designed for vertical 9:16 video
          - The concept must be easy to visualize in a short AI video

          Return exactly:

          TITLE:
          STORY:
          VISUAL HOOK:
          FINAL TWIST:
          """

          url = "https://api.groq.com/openai/v1/chat/completions"

          data = {
              "model": "openai/gpt-oss-20b",
              "messages": [
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "temperature": 0.8,
              "max_completion_tokens": 500
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + api_key,
                  "User-Agent": "QuietVaultAI/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  response_body = response.read().decode("utf-8")
                  result = json.loads(response_body)

              print("")
              print("========================================")
              print("       QUIET VAULT AI TEST SUCCESS")
              print("========================================")
              print("")

              print(result["choices"][0]["message"]["content"])

              print("")
              print("========================================")
              print("             TEST COMPLETE")
              print("========================================")

          except urllib.error.HTTPError as e:
              print("")
              print("========================================")
              print("             GROQ API ERROR")
              print("========================================")
              print("")
              print("HTTP STATUS:", e.code)
              print("")
              print("RESPONSE:")
              print(e.read().decode("utf-8"))
              print("")
              print("========================================")
              raise

          except Exception as e:
              print("")
              print("UNEXPECTED ERROR:")
              print(str(e))
              raise
          PY
