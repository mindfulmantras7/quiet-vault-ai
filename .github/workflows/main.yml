name: Quiet Vault AI Test

on:
  workflow_dispatch:

jobs:
  test-groq:
    runs-on: ubuntu-latest

    steps:
      - name: Test Groq API
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          api_key = os.environ["GROQ_API_KEY"]

          prompt = """
          Create ONE original 10-15 second horror Short concept for
          The Quiet Vault YouTube channel.

          Requirements:
          - Realistic cinematic horror
          - Fictional adult characters only
          - No celebrities or real-person likenesses
          - Recognizable everyday location
          - Disturbing visual apparent immediately
          - One simple physical contradiction
          - No gore
          - No monsters
          - Strong twist ending
          - Designed for vertical 9:16 video

          Return exactly:

          TITLE:
          STORY:
          VISUAL HOOK:
          FINAL TWIST:
          """

          url = "https://api.groq.com/openai/v1/chat/completions"

          data = {
              "model": "openai/gpt-oss-20b",
              "messages": [
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "temperature": 0.8
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + api_key
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  result = json.loads(response.read())

              print("\n===== QUIET VAULT AI TEST =====\n")
              print(result["choices"][0]["message"]["content"])
              print("\n===== TEST COMPLETE =====")

          except urllib.error.HTTPError as e:
              print("HTTP ERROR:", e.code)
              print(e.read().decode("utf-8"))
              raise
          PY
